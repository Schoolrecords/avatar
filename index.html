/* tóm tắt lịch 1 lớp: "T3, T5, T7 · Ca 1 · P.3" */
function lichTomTat(lopId){
  const ls=lichOfLop(lopId); if(!ls.length)return '';
  const thus=[...new Set(ls.map(x=>THU_NGAN[x.thu]))].join(', ');
  const cas=[...new Set(ls.map(x=>x.caMa))].sort((a,b)=>a-b).map(m=>'Ca '+m).join(', ');
  const ph=[...new Set(ls.map(x=>x.phong).filter(Boolean))].join(', ');
  return thus+' · '+cas+(ph?' · '+ph:'');
}
/* lịch của 1 lớp đúng ngày đó (null = hôm đó lớp không có lịch → coi là dạy ngoài lịch/dạy bù) */
function lichLopNgay(lopId,iso){ const t=thuOf(iso); return OPS.lich.find(x=>x.lopId===lopId&&x.thu===t)||null; }
/* ===== MỖI BUỔI MỘT GIÁO VIÊN (Giai đoạn 9) =====
   Một lớp có thể học 2 buổi với 2 giáo viên khác nhau. Buổi nào để trống thì
   coi như do giáo viên PHỤ TRÁCH LỚP dạy. */
function gvIdBuoi(lich,lop){
  if(lich&&lich.gvId!=null)return lich.gvId;
  return (lop&&lop.gvId!=null)?lop.gvId:null;
}
function tenGvBuoi(lich,lop){
  const id=gvIdBuoi(lich,lop); const t=id!=null?gvTen(id):'';

/* Các giáo viên dạy lớp này (gộp GV phụ trách + GV của từng buổi) — hiện ở danh sách lớp */
function gvCuaLop(lopId){
  const lop=LOP.find(l=>l.id===lopId); if(!lop)return [];
  const ten=new Set(); if(lop.gv)ten.add(lop.gv);
  lichOfLop(lopId).forEach(x=>{ if(x.gvId!=null){const t=gvTen(x.gvId); if(t)ten.add(t);} });
  return [...ten];
}
/* danh sách CA có lịch trong ngày, thuộc phạm vi đang xem — sắp theo ca rồi tên lớp */
function caNgay(iso,ids){
  const t=thuOf(iso), out=[];
  OPS.lich.forEach(x=>{
    if(x.thu!==t)return;
    const lop=LOP.find(l=>l.id===x.lopId);

  });

}

/* ===== CHẨN ĐOÁN LỖI "KHÓA HÀNG" (RLS) KHI GHI SỔ QUỸ =====
   Máy chủ chỉ trả một câu tiếng Anh khó hiểu: "new row violates row-level
   security policy for table so_quy". Câu đó ĐÚNG cho 4 tình huống rất khác nhau:
     1) phiên đăng nhập đã hết hạn (số liệu trên màn hình vẫn là bản tải từ trước
        nên nhìn như bình thường, nhưng mọi lệnh GHI đều bị từ chối);
     2) tài khoản sai vai trò (không phải admin/owner/teacher);
     3) tài khoản là lễ tân cơ sở A nhưng phiếu lại thuộc cơ sở B;
     4) kỳ sổ quỹ vừa được chốt ở máy khác.
   Hàm dưới hỏi lại máy chủ để biết ĐÚNG nguyên nhân rồi nói bằng tiếng Việt
   kèm cách xử lý — thay vì bắt người dùng đoán. */
const laLoiQuyen=e=>{const m=(e&&(e.message||e))||''; return (e&&e.code==='42501')||/row-level security/i.test(String(m));};
async function chanDoanGhiSo(coSoId,ngay){

    if(!uid){ const r=await SB.auth.refreshSession(); uid=(r&&r.data&&r.data.session)?r.data.session.user.id:null; }
  }catch(e){}
  if(!uid) return {ly:'phien',lamMoi:false,

       +'\n\nHãy đăng nhập lại. Nếu vẫn lỗi, báo Quản trị kiểm tra tài khoản này trong Supabase → bảng profiles.'};
  if(prof.role==='teacher') return {ly:'gv',
    msg:'Tài khoản giáo viên không được phép thu tiền / ghi sổ quỹ.\n\nViệc thu học phí do lễ tân cơ sở hoặc Quản trị làm.'};
  if(prof.role!=='admin'&&prof.role!=='owner') return {ly:'vaitro',

  if(prof.role==='owner'&&Number(prof.coso_id)!==Number(coSoId)) return {ly:'coso',

       +'trong khi khoản đang ghi lại thuộc cơ sở '+(csName(coSoId)||'(không rõ)')+' (mã '+(coSoId==null?'trống':coSoId)+').\n\n'
       +'Cách xử lý: nếu em học ở '+(csName(prof.coso_id)||'cơ sở của tài khoản này')+' thì sửa lại cơ sở của em trong hồ sơ; '
       +'nếu đúng là cơ sở khác thì để lễ tân cơ sở đó (hoặc Quản trị) ghi nhận.'};
  // 3) Kỳ sổ quỹ vừa bị chốt ở máy khác?
  const ky=kyCua(ngay);

  }
  return {ly:'khac',
    msg:'Máy chủ từ chối ghi (khóa hàng RLS) trong khi tài khoản ('+(prof.role==='admin'?'Quản trị':'Lễ tân '+(csName(prof.coso_id)||('mã '+prof.coso_id)))+'), cơ sở và kỳ sổ đều hợp lệ.\n\nHãy tải lại trang rồi thử lại; nếu vẫn lỗi thì chụp màn hình này gửi bộ phận kỹ thuật.'};

const isoVN=s=>{if(!s)return'';const p=String(s).split('-');return `${p[2]}/${p[1]}/${p[0]}`;};
const vnToIso=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s||'').trim());return m?`${m[3]}-${m[2]}-${m[1]}`:'';};
/* Đọc ngày từ ô Excel hoặc ô nhập tay ở NHIỀU dạng → ISO yyyy-mm-dd. Trả '' nếu không đọc được.
   Nhận: Date, số serial Excel (45900), 1/9/2026, 01/09/2026, 01-09-2026, 01.09.2026, 2026-09-01, 1/9/26 */
function anyToIso(v){
  if(v==null)return'';
  const two=n=>String(n).padStart(2,'0');
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${two(v.getMonth()+1)}-${two(v.getDate())}`;
  let s=String(v).trim(); if(!s)return'';
  if(/^\d{5}(\.\d+)?$/.test(s)){                       // Excel lưu ngày dạng số → quy đổi (mốc 30/12/1899)
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(+s)*86400000);
    return `${d.getUTCFullYear()}-${two(d.getUTCMonth()+1)}-${two(d.getUTCDate())}`;}
  s=s.split(/[ T]/)[0].replace(/[.\-]/g,'/');
  let m=/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(s);      // yyyy/mm/dd
  if(m)return `${m[1]}-${two(+m[2])}-${two(+m[3])}`;
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s);        // d/m/yyyy · d/m/yy
  if(!m)return'';
  let d=+m[1],mo=+m[2],y=+m[3]; if(y<100)y+=2000;
  if(d<1||d>31||mo<1||mo>12||y<1900||y>2200)return'';
  return `${y}-${two(mo)}-${two(d)}`;
}

/* Tạo file mẫu .xlsx trang trọng: tiêu đề nền navy chữ trắng, kẻ viền, cố định dòng đầu, lọc, dòng ví dụ + sheet Hướng dẫn */
async function makeTemplate({sheet,columns,example,filename,title,guide,rows}){
  await ensureExcelJS();
  const wb=new ExcelJS.Workbook(); wb.creator='AVATAR';
  const ws=wb.addWorksheet(sheet,{views:[{state:'frozen',ySplit:2}]});
  // Dòng 1: tiêu đề gộp ô
  ws.mergeCells(1,1,1,columns.length);
  const tc=ws.getCell(1,1); tc.value=title; tc.font={bold:true,size:14,color:{argb:XL_NAVY},name:'Calibri'};
  tc.alignment={vertical:'middle',horizontal:'center'}; ws.getRow(1).height=28;
  // Dòng 2: tiêu đề cột
  ws.columns=columns.map(c=>({key:c.k,width:c.w||18}));
  const hr=ws.getRow(2); hr.height=24;
  columns.forEach((c,i)=>{const cell=hr.getCell(i+1); cell.value=c.h; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL_NAVY}};
    cell.font={bold:true,color:{argb:'FFFFFFFF'},size:12,name:'Calibri'}; cell.alignment={vertical:'middle',horizontal:'center',wrapText:true}; cell.border=xlBorder('FF2A5490');});
  // Danh mục cho cột có danh sách ĐỘNG (dvList, vd tên lớp) → dropdown tham chiếu, không giới hạn độ dài
  const dmRef={};
  const listCols=columns.filter(c=>c.dvList&&c.dvList.length);
  if(listCols.length){
    const dm=wb.addWorksheet('DanhMuc'); dm.state='veryHidden';
    listCols.forEach((c,ci)=>{ const col=ci+1;
      c.dvList.forEach((v,ri)=>{ dm.getCell(ri+1,col).value=v; });
      const L=dm.getColumn(col).letter; dmRef[c.k]=`DanhMuc!$${L}$1:$${L}$${c.dvList.length}`;
    });
  }
  // Danh sách xổ xuống (data validation): dvList (động, tham chiếu) hoặc dv (tĩnh) → chỉ chọn, không gõ sai
  const dvOf=c=> (c.dvList&&dmRef[c.k]) ? {type:'list',allowBlank:true,showErrorMessage:true,errorStyle:'stop',error:'Vui lòng chọn một giá trị trong danh sách.',formulae:[dmRef[c.k]]}
    : c.dv ? {type:'list',allowBlank:true,showErrorMessage:true,errorStyle:'stop',error:'Vui lòng chọn một giá trị trong danh sách.',formulae:['"'+c.dv.join(',')+'"']}
    : null;
  // Dòng 3 trở đi: hoặc các dòng TRỐNG kẻ viền sẵn để điền (mẫu nhập mới),
  // hoặc dữ liệu CÓ SẴN của hệ thống (file điền học phí: đã in sẵn tên & lớp, lễ tân chỉ điền tiền).
  // Cột đánh dấu ro:true là cột hệ thống in ra — tô xám nhạt để biết là không nên sửa.
  const dl=(rows&&rows.length)?rows:null, soDong=dl?dl.length:25;
  for(let r=0;r<soDong;r++){const row=ws.getRow(3+r); row.height=20;
    columns.forEach((c,i)=>{const cell=row.getCell(i+1); cell.border=xlBorder();
      if(dl){ const v=dl[r][c.k];
        if(v!=null&&v!=='')cell.value=v;
        if(c.a==='c'||c.k==='tt')cell.alignment={horizontal:'center'};
        // Cột ngày phải đặt sẵn định dạng Ngày: lễ tân gõ 15/07/2026, Excel lưu thành ô ngày thật,
        // đọc lại mới ra đúng ngày. Thiếu định dạng này ô có thể về dạng số lẻ và lệch 1 ngày.
        if(c.fmt)cell.numFmt=c.fmt;
        else if(typeof cell.value==='number'&&c.k!=='tt')cell.numFmt='#,##0';
        if(c.ro){cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF2F5FA'}};cell.font={color:{argb:'FF5A6B87'},size:11};}
        else cell.font={bold:true,size:11};
      }else if(c.k==='tt'){cell.value=r+1; cell.alignment={horizontal:'center'}; cell.font={color:{argb:'FF9AA6BC'},size:11};}
      const dv=dvOf(c); if(dv&&!c.ro)cell.dataValidation=dv;});}
  ws.autoFilter={from:{row:2,column:1},to:{row:2,column:columns.length}};
  // Sheet hướng dẫn
  if(guide&&guide.length){const g=wb.addWorksheet('Hướng dẫn'); g.getColumn(1).width=90;
    g.getCell(1,1).value='HƯỚNG DẪN NHẬP DỮ LIỆU — AVATAR'; g.getCell(1,1).font={bold:true,size:13,color:{argb:XL_NAVY}};
    guide.forEach((line,i)=>{const cell=g.getCell(3+i,1); cell.value=line; cell.alignment={wrapText:true,vertical:'top'}; cell.font={size:11};});}
  dlBlob(await wb.xlsx.writeBuffer(),filename);
}
/* Đọc file .xlsx người dùng tải lên → mảng object (khóa = tiêu đề cột đã bỏ dấu, chữ thường) */
function xlCellStr(v){if(v==null)return'';if(v instanceof Date){const d=v;return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}if(typeof v==='object'){if(v.text!=null)return String(v.text);if(v.result!=null)return String(v.result);if(v.richText)return v.richText.map(t=>t.text).join('');if(v.hyperlink)return String(v.hyperlink);return '';}return String(v);}
async function readSheet(file){
  await ensureExcelJS();
  const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
  // chỉ xét sheet hiển thị (bỏ qua sheet danh mục ẩn "DanhMuc"), chọn sheet nhiều dòng nhất
  const vis=wb.worksheets.filter(w=>w.state!=='hidden'&&w.state!=='veryHidden');
  const pool=vis.length?vis:wb.worksheets;
  let ws=pool[0]; pool.forEach(w=>{if((w.rowCount||0)>((ws&&ws.rowCount)||0))ws=w;});
  if(!ws)return [];
  // tìm dòng tiêu đề: dòng đầu tiên có >=2 ô chữ KHÁC NHAU
  // (dòng tiêu đề gộp ô như "DANH SÁCH HỌC SINH" trải cùng 1 giá trị ra nhiều cột → phải loại)
  let hRow=1; for(let r=1;r<=Math.min(6,ws.rowCount);r++){const set=new Set();ws.getRow(r).eachCell(c=>{const v=xlCellStr(c.value).trim();if(v)set.add(v.toLowerCase());});if(set.size>=2){hRow=r;break;}}
  const headers=[]; ws.getRow(hRow).eachCell((c,col)=>{headers[col]=fold(xlCellStr(c.value)).toLowerCase().trim();});
  const rows=[];
  for(let r=hRow+1;r<=ws.rowCount;r++){const row=ws.getRow(r);const obj={};let any=false;
    // cột "TT" chỉ là số thứ tự tự đánh sẵn — không tính là dữ liệu (tránh dòng trống có sẵn số bị coi là "thiếu họ tên")
    for(let col=1;col<headers.length;col++){const h=headers[col];if(!h)continue;const val=xlCellStr(row.getCell(col).value).trim();obj[h]=val;if(val&&h!=='tt')any=true;}
    if(any)rows.push(obj);}
  rows.firstRow=hRow+1;          // dòng Excel thật của phần tử [0] → báo lỗi đúng số dòng
  return rows;
}
const xlPick=(o,keys)=>{for(const k in o){if(keys.some(x=>k.includes(x)))return o[k];}return '';};
/* Nạp hàng loạt lên Supabase theo lô 500. Trả về mảng bản ghi DB đã nhập (theo đúng thứ tự), hoặc false nếu lỗi. */
async function importRows(table,dbRows,fromDb,targetArr){
  const inserted=[];
  for(let i=0;i<dbRows.length;i+=500){
    const {data,error}=await SB.from(table).insert(dbRows.slice(i,i+500)).select();
    if(error){avaAlert('Lỗi nhập dữ liệu: '+error.message);return false;}
    (data||[]).forEach(r=>{targetArr.push(fromDb(r));inserted.push(r);});
  }
  return inserted;
}
/* ===== GHI HÀNG LOẠT PHIẾU THU HỌC PHÍ (nhập tiền đã thu từ file Excel) =====

async function ghiPhieuHangLoat(recs,tienDo){
  let ok=0,loi='';
  for(let i=0;i<recs.length;i+=300){
    const lo=recs.slice(i,i+300);
    const raw=lo.map(r=>({ngay:r.ngay,loai:'thu',hangMuc:'Học phí',coSoId:r.hv.coSoId,soTien:r.soTien,
      noiDung:'Học phí: '+r.hv.ten+' — '+lopName(r.hv.lopId)+' (nhập từ file danh sách)',
      nguoiLap:USER.role==='admin'?'Quản trị':csName(USER.coSoId),
      nguoiNop:r.nguoiNop||r.hv.ph||'',hinhThuc:r.hinhThuc||'tien_mat',hvId:r.hv.id}));
    // Thử bản đầy đủ trước; thiếu cột (chưa chạy SQL) thì lùi dần, không im lặng bỏ tiền
    let res=await SB.from('so_quy').insert(raw.map(r=>({...gdToDb(r),...gdToDb5(r),hv_id:r.hvId}))).select();
    if(res.error&&thieuCot(res.error)) res=await SB.from('so_quy').insert(raw.map(r=>({...gdToDb(r),hv_id:r.hvId}))).select();
    if(res.error&&thieuCot(res.error)) res=await SB.from('so_quy').insert(raw.map(r=>gdToDb(r))).select();
    if(res.error){loi=res.error.message;break;}
    (res.data||[]).forEach(r=>OPS.gd.push(gdFromDb(r)));
    ok+=lo.length; if(tienDo)tienDo(ok,recs.length);
  }
  return {ok,loi};
}
/* Cập nhật lại "đã đóng · ngày đóng" ở hồ sơ cho HÀNG LOẠT em sau khi ghi phiếu.
   Gom các em cùng (tổng đã đóng, ngày đóng cuối) vào một lệnh update → 13.000 em
   thường chỉ còn vài chục lệnh thay vì 13.000 lệnh. */
async function capNhatTongDongHangLoat(hvList){
  const m={};
  OPS.gd.forEach(g=>{ if(g.loai!=='thu'||g.hvId==null)return;
    const o=m[g.hvId]=m[g.hvId]||{tong:0,ngay:''}; o.tong+=g.soTien||0; if(g.ngay>o.ngay)o.ngay=g.ngay; });
  const nhom={};
  hvList.forEach(h=>{ const o=m[h.id]||{tong:0,ngay:''};
    h.soTienDong=o.tong; h.daDong=o.tong>0; h.ngayDong=o.ngay||null;
    (nhom[o.tong+'|'+(o.ngay||'')]=nhom[o.tong+'|'+(o.ngay||'')]||{tong:o.tong,ngay:o.ngay||null,ids:[]}).ids.push(h.id); });
  let loi='';
  for(const k in nhom){ const g=nhom[k];
    for(let i=0;i<g.ids.length;i+=300){
      const r=await SB.from('hoc_vien').update({so_tien_dong:g.tong,ngay_dong:g.ngay,da_dong:g.tong>0}).in('id',g.ids.slice(i,i+300));
      if(r.error&&!loi)loi=r.error.message; } }
  return loi;
}
/* Cửa sổ xem trước trước khi nạp. rowHTML: tự vẽ dòng xem trước (mặc định là thẻ học sinh/giáo viên). */
function previewImport(label,recs,badLines,onConfirm,badText,extraHTML,afterRender,rowHTML){
  const list=recs.slice(0,60).map((r,i)=>rowHTML?rowHTML(r,i):`<div class="ddrow"><div class="idx">${i+1}</div><div class="nm"><b>${esc(r.ten)}</b><small>${esc([r.lopId?lopName(r.lopId):'',r.ns,r.sdt,r.hocPhi?fmtVND(r.hocPhi):(r.mon==='TA'?'Tiếng Anh':r.mon==='VH'?'Văn hóa':'')].filter(Boolean).join(' · ')||'—')}</small></div></div>`).join('');
  $('#mcard').innerHTML=`
    <div class="mhead" style="background:var(--dots),linear-gradient(150deg,#10264c,#2f6fd0);background-size:18px 18px,auto">
      <div class="mava">${svg('<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>')}</div>
      <div style="flex:1"><h3>Xem trước nhập ${esc(label)}</h3><p>Kiểm tra danh sách trước khi lưu</p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody">
      <div class="ddsum">
        <div class="p co"><b>${recs.length}</b><span>dòng hợp lệ</span></div>
        <div class="p muon"><b>${badLines.length}</b><span>dòng bỏ qua</span></div>
      </div>
      ${badLines.length?`<p class="muted" style="font-size:.8rem;margin:2px 2px 8px">${badText?esc(badText):`Bỏ qua ${badLines.length} dòng thiếu họ tên (dòng ${badLines.slice(0,20).join(', ')}${badLines.length>20?'…':''}).`}</p>`:''}
      ${recs.length?`<div class="ddgrid" style="max-height:38vh;overflow:auto">${list}${recs.length>60?`<div class="muted" style="padding:8px 2px">… và ${recs.length-60} dòng nữa</div>`:''}</div>`:'<div class="empty">Không có dòng mới nào để nhập.</div>'}
      ${extraHTML||''}
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-light" style="flex:1" onclick="closeModal()">Hủy</button><button class="btn btn-primary" style="flex:2" id="imp_ok" ${recs.length?'':'disabled'}>✓ Nhập ${recs.length} ${esc(label)}</button></div>
    </div>`;
  $('#modal').classList.add('on');
  const ok=$('#imp_ok');
  if(ok)ok.onclick=async()=>{const old=ok.textContent;ok.disabled=true;ok.textContent='Đang nhập…';
    const r=await onConfirm(); if(r===false){ok.disabled=false;ok.textContent=old;}};   // onConfirm trả false → cho bấm lại
  if(typeof afterRender==='function')afterRender();
}
const GV_COLS=[{h:'Họ và tên',k:'ten',w:26},{h:'Ngày sinh',k:'ns',w:14},{h:'Môn (VH/TA)',k:'mon',w:14},{h:'Trình độ',k:'td',w:16},{h:'Điện thoại',k:'sdt',w:16},{h:'Địa chỉ',k:'dc',w:32}];
function pickFile(cb){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';inp.onchange=()=>{if(inp.files&&inp.files[0])cb(inp.files[0]);};inp.click();}
async function hsDownloadTemplate(lop){
  const coSoId=lop.coSoId;
  const lops=LOP.filter(l=>l.coSoId===coSoId).slice().sort((a,b)=>String(a.lop).localeCompare(String(b.lop),'vi'));
  const lopNames=lops.map(lopNhan);        // kèm GV (và mã) để không lẫn các lớp trùng tên
  const cols=[{h:'TT',k:'tt',w:6},{h:'Họ và tên',k:'ten',w:24},{h:'Lớp',k:'lop',w:16,dvList:lopNames},{h:'Ngày sinh',k:'ns',w:13},{h:'Phụ huynh',k:'ph',w:20},{h:'Điện thoại',k:'sdt',w:15},{h:'Thời gian nhập học',k:'nhaphoc',w:17},{h:'Trạng thái',k:'trangthai',w:14,dv:['Đang học','Hết khóa','Thôi học']},{h:'Học phí (đ/khóa)',k:'hp',w:17},{h:'Đã đóng (đ)',k:'dadong',w:15},{h:'Ngày đóng',k:'ngaydong',w:13}];

    filename:'Mau-hoc-sinh-'+csName(coSoId).replace(/[\\/:*?"<>|\s]+/g,'-')+'.xlsx',
    title:'DANH SÁCH HỌC SINH — '+csName(coSoId),
    guide:['• Mẫu này dùng cho CẢ CƠ SỞ — nhập nhiều lớp trong một file.','• Điền mỗi học sinh 1 dòng, ngay dưới hàng tiêu đề màu xanh.','• Cột "TT" chỉ để đánh số cho dễ nhìn — không ảnh hưởng khi nhập.','• "Họ và tên" là bắt buộc; dòng để trống tên sẽ bị bỏ qua.','• Cột "Lớp": bấm vào ô sẽ hiện danh sách lớp của cơ sở — CHỌN lớp, KHÔNG gõ tay để tránh sai. Để trống thì hệ thống xếp vào lớp đang chọn trên web.','• Ngày sinh & Thời gian nhập học ghi dạng ngày/tháng/năm (VD: 01/09/2015). Chấp nhận cả 1/9/2015, 01-09-2015, 01.09.2015 hoặc ô đã định dạng Ngày trong Excel.','• QUAN TRỌNG — "Thời gian nhập học" là ngày các em ĐĂNG KÝ THẬT, không phải ngày up file. Lớp đăng ký từ tháng trước thì ghi đúng ngày tháng trước. Nếu để trống, khi nhập file web sẽ hỏi một ngày chung để áp cho các dòng trống — sửa lại đúng ngày rồi mới bấm Nhập.','• Cột "Trạng thái" chọn: Đang học / Hết khóa / Thôi học (để trống coi như Đang học).','• Học phí ghi cho CẢ KHÓA, dạng số không dấu chấm (VD: 600000).','• Cột "Đã đóng (đ)": em nào ĐÃ NỘP TIỀN TỪ TRƯỚC thì ghi số tiền thật đã thu (đóng một phần cũng được, VD 200000). Chưa nộp thì để trống. KHÔNG có cột "chưa thu" — hệ thống tự tính = Học phí trừ Đã đóng, khỏi lo cộng sai.','• Cột "Ngày đóng": ngày phụ huynh nộp tiền thật (VD: 15/07/2026). Để trống thì lấy theo ngày nhập học của dòng đó.','• Mỗi dòng có "Đã đóng" sẽ được hệ thống tạo MỘT PHIẾU THU trong Sổ quỹ, đúng ngày đã ghi — nên nhập TRƯỚC khi chốt sổ tháng đó.','• Học sinh đã có TRONG CÙNG LỚP (trùng họ tên) sẽ bị CHẶN, không bị nhập 2 lần — nên up lại file cũ cũng không sợ nhân đôi danh sách.','• Em nào HỌC 2 LỚP thì ghi 2 dòng, mỗi dòng một lớp, cùng họ tên và cùng ngày sinh — hệ thống hiểu là một em học 2 lớp, KHÔNG báo trùng.','• Lưu file rồi vào web bấm "Nhập Excel".']});
}
function hsImportExcel(lop){
  const coSoId=lop.coSoId;
  // Học sinh ĐÃ CÓ trong cơ sở, gom theo TÊN + LỚP → chặn nhập trùng.
  // Gom theo lớp chứ không gom theo tên suông: em học lớp thứ hai phải nhập được bình thường.
  const daCo={}; OPS.hv.filter(h=>h.coSoId===coSoId).forEach(h=>{const k=h.lopId+'|'+nameKey(h.ten);(daCo[k]=daCo[k]||[]).push(h);});
  pickFile(async file=>{
    let rows; try{rows=await readSheet(file);}catch(e){avaAlert('Không đọc được file. Hãy dùng file .xlsx theo mẫu tải về.');return;}
    const r0=rows.firstRow||2;
    const recs=[],bad=[],badLop=[],dups=[],inFile={},mapMo=[];   // mapMo: tên lớp khớp NHIỀU lớp → không đoán
    rows.forEach((r,i)=>{const dong=r0+i;
      const ten=String(xlPick(r,['ho va ten','ho ten','ten'])).trim(); if(!ten){bad.push(dong);return;}
      const lopCell=String(xlPick(r,['lop hoc','lop'])).trim();
      let lp=lop;                                 // trống → lớp đang chọn trên web
      if(lopCell){ const r2=lopTuNhan(lopCell,coSoId);
        if(r2.nhapNhang){ mapMo.push(dong+': "'+lopCell+'" ('+r2.soLop+' lớp cùng tên)'); return; }   // KHÔNG đoán bừa
        lp=r2.lop; if(!lp){badLop.push(dong);return;} }
      const nh=anyToIso(xlPick(r,['thoi gian nhap','ngay nhap','nhap hoc','dang ky']));
      const ns=String(xlPick(r,['ngay sinh','sinh'])).trim(), nsIso=anyToIso(ns);
      const tt=fold(String(xlPick(r,['trang thai']))).toLowerCase().trim();
      let thoi=false, lyDo='';                    // trống hoặc "đang học" => đang học
      if(tt.includes('het khoa')){thoi=true;lyDo='Hết khóa';}
      else if(tt.includes('thoi hoc')||tt==='thoi'){thoi=true;lyDo='Nghỉ hẳn';}
      // Tiền đã thu từ trước (2 cột thêm để khỏi phải ngồi nhập tay từng em)
      const tienDong=Number(String(xlPick(r,['da dong','da nop','da thu'])).replace(/\D/g,''))||0;
      const ngayDongF=anyToIso(xlPick(r,['ngay dong','ngay nop']));
      const rec={ten,ns,ph:String(xlPick(r,['phu huynh','huynh','cha me'])).trim(),sdt:String(xlPick(r,['dien thoai','sdt','so dt','phone'])).trim(),hocPhi:Number(String(xlPick(r,['hoc phi','phi'])).replace(/\D/g,''))||0,daDong:false,lopId:lp.id,coSoId:lp.coSoId,mau:false,ngayNhapHoc:nh,ngayThoiHoc:thoi?todayISO():null,lyDo,tienDong,ngayDongF};
      // Chặn trùng: cùng tên + CÙNG LỚP, và ngày sinh không mâu thuẫn (một bên trống cũng coi là trùng).
      // Cùng tên nhưng KHÁC LỚP = em học thêm lớp nữa → nhập bình thường, không chặn.
      const k=lp.id+'|'+nameKey(ten);
      const khop=o=>{const a=anyToIso(o.ns); return !a||!nsIso||a===nsIso;};
      const cu=(daCo[k]||[]).find(khop);
      if(cu){dups.push({dong,ten,rec,note:'đã có trong lớp '+lopName(lp.id)});return;}
      const tf=(inFile[k]||[]).find(khop);
      if(tf){dups.push({dong,ten,rec,note:'lặp lại trong file (cùng lớp '+lopName(lp.id)+')'});return;}
      (inFile[k]=inFile[k]||[]).push(rec);
      recs.push(rec);});
    const boQua=bad.length+badLop.length+mapMo.length;
    const badText=boQua?('Bỏ qua '+boQua+' dòng'
      +(bad.length?': '+bad.length+' thiếu họ tên':'')
      +(badLop.length?((bad.length?'; ':': ')+badLop.length+' sai/không khớp tên lớp (dòng '+badLop.slice(0,15).join(', ')+(badLop.length>15?'…':'')+')'):'')
      +(mapMo.length?((bad.length||badLop.length?'; ':': ')+mapMo.length+' dòng ghi tên lớp TRÙNG VỚI NHIỀU LỚP nên không biết xếp vào lớp nào — '
        +mapMo.slice(0,8).join('; ')+(mapMo.length>8?'…':'')
        +'. Hãy tải lại mẫu Excel mới và chọn lớp trong danh sách xổ xuống (có kèm tên giáo viên)'):'')
      +'.'):'';
    const extra=`
      <div class="form2" style="margin-top:12px">
        <div class="fld full">
          <label>Thời gian nhập học cho dòng để trống</label>
          <input id="imp_nhaphoc" placeholder="dd/mm/yyyy" value="${isoVN(todayISO())}"/>
        </div>
      </div>
      <p class="muted" style="font-size:.75rem;line-height:1.5;margin:6px 2px 0">Lớp đã đăng ký từ trước thì sửa lại đúng ngày (VD: 30/06/2026). Dòng nào trong file đã ghi ngày thì <b>giữ nguyên ngày trong file</b>.</p>
      ${(()=>{const t=recs.filter(r=>r.tienDong>0); return t.length?`<div style="margin-top:12px;padding:11px 12px;border:1.5px solid #b7e3cd;background:#eefaf3;border-radius:12px">
        <b style="font-size:.85rem;color:#137a4d">💰 ${t.length} em có ghi sẵn tiền đã đóng — tổng ${fmtVND(t.reduce((s,r)=>s+r.tienDong,0))}</b>
        <div class="muted" style="font-size:.76rem;line-height:1.6;margin-top:5px">Hệ thống sẽ tạo <b>${t.length} phiếu thu học phí</b> trong Sổ quỹ, đúng ngày đóng ghi trong file (dòng nào bỏ trống ngày thì lấy ngày nhập học). Em nào chưa đóng cứ để trống, không tạo phiếu.</div></div>`:'';})()}
      ${dups.length?`<div style="margin-top:12px;padding:11px 12px;border:1.5px solid #f2c14e;background:#fff9e8;border-radius:12px">
        <b style="font-size:.85rem;color:#8a5a00">⚠ ${dups.length} dòng bị chặn vì trùng học sinh đã có</b>
        <div class="muted" style="font-size:.76rem;line-height:1.6;margin-top:5px">${esc(dups.slice(0,15).map(d=>'dòng '+d.dong+': '+d.ten+' — '+d.note).join('; '))}${dups.length>15?' …':''}</div>
        <label style="display:flex;gap:8px;align-items:flex-start;margin-top:9px;font-size:.79rem;cursor:pointer"><input type="checkbox" id="imp_dup" style="margin-top:2px"/><span>Tôi đã kiểm tra, đây là các em <b>khác nhau</b> (trùng tên) — vẫn nhập ${dups.length} dòng này</span></label>
      </div>`:''}`;
    previewImport('học sinh vào '+csName(coSoId),recs,bad.concat(badLop),async()=>{
      const nhInp=$('#imp_nhaphoc'), nhTxt=(nhInp?nhInp.value:'').trim();
      if(nhTxt&&!vnToIso(nhTxt)){avaAlert('"Thời gian nhập học cho dòng để trống" chưa đúng dạng ngày/tháng/năm (VD: 30/06/2026).');return false;}
      const nhMac=vnToIso(nhTxt)||todayISO();
      const dupOK=$('#imp_dup')&&$('#imp_dup').checked;
      const list=dupOK?recs.concat(dups.map(d=>d.rec)):recs;
      if(!list.length){avaAlert('Không có dòng nào để nhập.');return false;}
      list.forEach(r=>{if(!r.ngayNhapHoc)r.ngayNhapHoc=nhMac;});
      const ins=await importRows('hoc_vien',list.map(hvToDb),hvFromDb,OPS.hv);
      if(!ins)return false;
      // Gán ngày nhập học / thôi học theo lô (gộp các dòng cùng giá trị) — bỏ qua êm nếu chưa chạy SQL
      const groups={};
      ins.forEach((db,i)=>{const r=list[i]; if(!r)return;
        const key=(r.ngayNhapHoc||'')+'|'+(r.ngayThoiHoc||'')+'|'+(r.lyDo||'');
        (groups[key]=groups[key]||{patch:{ngay_nhap_hoc:r.ngayNhapHoc||null,ngay_thoi_hoc:r.ngayThoiHoc||null,ly_do_thoi_hoc:r.lyDo||null},ids:[]}).ids.push(db.id);});
      let touched=false;
      for(const k in groups){const {patch,ids}=groups[k]; const {error}=await SB.from('hoc_vien').update(patch).in('id',ids); if(!error)touched=true;}
      // ---- Tiền đã thu từ trước: mỗi dòng có "Đã đóng" → một phiếu thu trong sổ quỹ ----
      let msgTien='',boChot=0;
      const thuRecs=[];
      ins.forEach((db,i)=>{ const r=list[i]; if(!r||!(r.tienDong>0))return;
        const hv=OPS.hv.find(x=>x.id===db.id); if(!hv)return;
        const ngay=r.ngayDongF||r.ngayNhapHoc||nhMac;
        if(daChotKy(hv.coSoId,ngay)){boChot++;return;}      // kỳ đã chốt sổ thì không ghi thêm phiếu
        thuRecs.push({hv,soTien:r.tienDong,ngay,nguoiNop:r.ph||'',hinhThuc:'tien_mat'});});
      if(thuRecs.length){
        const btnOK=$('#imp_ok'); if(btnOK)btnOK.textContent='Đang ghi phiếu thu…';
        const kq=await ghiPhieuHangLoat(thuRecs,(d,t)=>{if(btnOK)btnOK.textContent='Đang ghi phiếu thu '+d+'/'+t+'…';});
        const loiCn=kq.ok?await capNhatTongDongHangLoat(thuRecs.slice(0,kq.ok).map(x=>x.hv)):'';
        msgTien='\n\nĐã ghi '+kq.ok+' phiếu thu học phí vào sổ quỹ ('+fmtVND(thuRecs.slice(0,kq.ok).reduce((s,x)=>s+x.soTien,0))+').'
          +(kq.loi?'\n⚠ Còn '+(thuRecs.length-kq.ok)+' phiếu chưa ghi được: '+kq.loi:'')
          +(loiCn?'\n⚠ Chưa cập nhật được "đã đóng" ở hồ sơ: '+loiCn:'');
        touched=true;
      }
      if(boChot) msgTien+='\n⚠ Bỏ qua '+boChot+' dòng có ngày đóng nằm trong kỳ ĐÃ CHỐT SỔ — hãy ghi nhận đóng tiền thủ công sau khi mở lại kỳ.';
      if(touched) await loadCloud();
      closeModal();renderGhiDanh();
      avaAlert('Đã nhập '+list.length+' học sinh vào '+csName(coSoId)+'.'+(dups.length&&!dupOK?' Bỏ qua '+dups.length+' dòng trùng.':'')+msgTien,{title:'Nhập danh sách xong'});
    },badText,extra,()=>{
      attachDateFormat($('#imp_nhaphoc'));
      const cb=$('#imp_dup'), okB=$('#imp_ok');
      const upd=()=>{const n=recs.length+((cb&&cb.checked)?dups.length:0);
        okB.textContent='✓ Nhập '+n+' học sinh'; okB.disabled=(n===0);};
      if(cb)cb.onchange=upd;
      upd();
    });
  });
}
/* ==========================================================================
   NHẬP HỌC PHÍ ĐÃ THU BẰNG EXCEL
   Dùng cho lúc mới chuyển sang app: danh sách học sinh ĐÃ đẩy lên rồi, còn tiền
   thì đã thu từ trước — ngồi gõ tay từng em quá lâu. Cách làm:
     1) Bấm "Tải file điền học phí" → app xuất sẵn tên · lớp · học phí của các em

   Khớp học sinh theo cột "Mã HS" (app in sẵn) nên không sợ trùng tên; file tự làm
   không có mã thì khớp theo họ tên, tên nào trùng nhiều em sẽ bị chặn chứ không đoán.
   ========================================================================== */
const HP_COLS=[{h:'TT',k:'tt',w:5,ro:true,a:'c'},{h:'Mã HS',k:'ma',w:8,ro:true,a:'c'},
  {h:'Họ và tên',k:'ten',w:24,ro:true},{h:'Lớp',k:'lop',w:18,ro:true},{h:'Cơ sở',k:'cs',w:18,ro:true},
  {h:'Học phí (đ/khóa)',k:'hp',w:15,ro:true,a:'r'},{h:'Đã thu trên hệ thống',k:'dathu',w:16,ro:true,a:'r'},
  {h:'SỐ TIỀN THU ĐỢT NÀY',k:'thu',w:19,a:'r'},{h:'NGÀY THU',k:'ngaythu',w:13,a:'c',fmt:'dd/mm/yyyy'},
  {h:'Hình thức',k:'ht',w:14,dv:['Tiền mặt','Chuyển khoản']},{h:'Người nộp',k:'nguoinop',w:20}];
/* Bảng tra "đã thu" theo từng em, dựng một lần từ sổ quỹ (đừng quét lại trong vòng lặp) */
function daThuTheoEm(){
  const m={}; OPS.gd.forEach(g=>{ if(g.loai==='thu'&&g.hvId!=null)m[g.hvId]=(m[g.hvId]||0)+(g.soTien||0); });
  return {map:m, cua:h=>(m[h.id]!=null?m[h.id]:(Number(h.soTienDong)||0))};
}
async function hpDownloadTemplate(list){
  const ds=list.filter(hvActive).slice()
    .sort((a,b)=>csCmp(a.coSoId,b.coSoId)||String(lopName(a.lopId)).localeCompare(String(lopName(b.lopId)),'vi')
      ||String(a.ten).localeCompare(String(b.ten),'vi'));
  if(!ds.length){avaAlert('Không có học sinh đang học nào trong danh sách đang xem để tải file.');return;}
  if(ds.length>2000&&!await avaConfirm('Danh sách đang xem có '+ds.length+' học sinh.\n\nFile sẽ rất nặng và máy có thể chậm vài phút. Nên lọc theo từng cơ sở (hoặc từng lớp) rồi tải cho nhẹ.\n\nVẫn tải cả '+ds.length+' em?'))return;

  const rows=ds.map((h,i)=>({tt:i+1,ma:h.id,ten:h.ten,lop:lopName(h.lopId),cs:csName(h.coSoId),
    hp:h.hocPhi||0,dathu:da(h)||0,thu:'',ngaythu:'',ht:'',nguoinop:h.ph||''}));

  await makeTemplate({sheet:'HocPhi',columns:HP_COLS,rows,

    title:'NHẬP HỌC PHÍ ĐÃ THU — '+pv,
    guide:['• File này app xuất sẵn danh sách học sinh đang học. Lễ tân CHỈ điền 2 cột: "SỐ TIỀN THU ĐỢT NÀY" và "NGÀY THU".',
      '• Các cột nền xám (Mã HS, Họ và tên, Lớp, Cơ sở, Học phí, Đã thu trên hệ thống) là do hệ thống in ra — KHÔNG sửa, KHÔNG xóa, nhất là cột "Mã HS" vì đó là cái để khớp đúng em.',
      '• "SỐ TIỀN THU ĐỢT NÀY" là số tiền THẬT thu ở đợt này, ghi số không dấu chấm (VD: 600000). Thu một phần cũng được (VD: 200000).',
      '• Em nào chưa nộp thì để TRỐNG — dòng trống sẽ được bỏ qua, không tạo phiếu.',
      '• Cột "Đã thu trên hệ thống" cho biết em đó trên app đã có bao nhiêu tiền rồi. Nếu cột này khác 0 nghĩa là em đã có phiếu thu — cân nhắc kỹ trước khi ghi thêm đợt nữa.',
      '• "NGÀY THU" ghi dạng ngày/tháng/năm (VD: 15/07/2026), là ngày phụ huynh nộp tiền THẬT. Để trống thì web sẽ hỏi một ngày chung áp cho các dòng trống.',
      '• Mỗi dòng có tiền sẽ thành MỘT PHIẾU THU trong Sổ quỹ, đúng ngày đã ghi. Vì vậy hãy nhập TRƯỚC khi chốt sổ tháng đó.',

function hpImportExcel(list){
  if(!list.length){avaAlert('Danh sách đang xem không có học sinh đang học nào. Hãy chỉnh lại ô lọc cơ sở/lớp rồi thử lại.');return;}
  const trongPV=new Set(list.map(h=>h.id));
  const theoMa={}; OPS.hv.forEach(h=>{theoMa[h.id]=h;});
  // Khớp theo họ tên (dự phòng cho file tự làm không có cột Mã HS): chỉ nhận khi tên là DUY NHẤT
  const theoTen={}; list.forEach(h=>{const k=nameKey(h.ten);(theoTen[k]=theoTen[k]||[]).push(h);});
  const daThu=daThuTheoEm();
  pickFile(async file=>{
    let rows; try{rows=await readSheet(file);}catch(e){avaAlert('Không đọc được file. Hãy dùng file .xlsx tải về từ nút "Tải file điền học phí".');return;}
    const r0=rows.firstRow||2;
    const recs=[],daCo=[],bad=[],vuot=[];
    let trong=0;
    const inFile=new Set();
    rows.forEach((r,i)=>{const dong=r0+i;
      const soTien=Number(String(xlPick(r,['so tien thu','so tien','tien thu','so tien nop'])).replace(/\D/g,''))||0;
      if(soTien<=0){trong++;return;}                       // dòng chưa điền tiền → bỏ qua êm
      const maTxt=String(xlPick(r,['ma hs','ma hoc sinh'])).replace(/\D/g,'');
      const ten=String(xlPick(r,['ho va ten','ho ten','ten'])).trim();
      let hv=null;
      if(maTxt){ const c=theoMa[Number(maTxt)];
        if(!c){bad.push(dong+': mã '+maTxt+' không có trong hệ thống');return;}
        if(!trongPV.has(c.id)){bad.push(dong+': '+c.ten+' không thuộc phạm vi đang xem');return;}
        hv=c;
      }else if(ten){ const c=theoTen[nameKey(ten)]||[];
        if(!c.length){bad.push(dong+': không tìm thấy học sinh "'+ten+'"');return;}
        if(c.length>1){bad.push(dong+': "'+ten+'" trùng tên '+c.length+' em — hãy dùng file có cột Mã HS');return;}
        hv=c[0];
      }else{bad.push(dong+': thiếu cả Mã HS lẫn họ tên');return;}
      if(inFile.has(hv.id)){bad.push(dong+': '+hv.ten+' bị ghi 2 lần trong file');return;}
      inFile.add(hv.id);
      const ngay=anyToIso(xlPick(r,['ngay thu','ngay dong','ngay nop']));
      const htTxt=fold(String(xlPick(r,['hinh thuc']))).toLowerCase();
      const rec={dong,hv,soTien,ngay,nguoiNop:String(xlPick(r,['nguoi nop','nguoi dong'])).trim()||hv.ph||'',
        hinhThuc:htTxt.includes('chuyen')?'chuyen_khoan':'tien_mat'};
      const cu=daThu.cua(hv);
      if(hv.hocPhi>0&&cu+soTien>hv.hocPhi)vuot.push(hv.ten+' ('+fmtVND(cu+soTien)+'/'+fmtVND(hv.hocPhi)+')');
      if(cu>0){daCo.push(rec);return;}                     // em đã có tiền trên hệ thống → tách riêng, mặc định bỏ qua
      recs.push(rec);});

    const rowHTML=(r,i)=>`<div class="ddrow"><div class="idx">${i+1}</div>
      <div class="nm"><b>${esc(r.hv.ten)}</b><small>${esc(lopName(r.hv.lopId))} · thu <b>${fmtVND(r.soTien)}</b>${r.ngay?' · '+isoVN(r.ngay):' · (chưa ghi ngày)'}</small></div></div>`;
    const badText=bad.length?('Bỏ qua '+bad.length+' dòng không khớp học sinh: '+bad.slice(0,12).join('; ')+(bad.length>12?' …':'')+'.'):'';
    const extra=`
      <div class="form2" style="margin-top:12px">
        <div class="fld full"><label>Ngày thu cho dòng để trống ngày</label>
          <input id="hp_ngay" placeholder="dd/mm/yyyy" value="${isoVN(todayISO())}"/></div>
      </div>
      <p class="muted" style="font-size:.75rem;line-height:1.5;margin:6px 2px 0">Dòng nào đã ghi ngày trong file thì <b>giữ nguyên ngày trong file</b>. Phiếu thu sẽ nằm đúng tháng của ngày đó trong Sổ quỹ.</p>
      ${trong?`<p class="muted" style="font-size:.75rem;margin:6px 2px 0">${trong} dòng để trống tiền — bỏ qua, không tạo phiếu.</p>`:''}
      ${vuot.length?`<div style="margin-top:12px;padding:11px 12px;border:1.5px solid #f2c14e;background:#fff9e8;border-radius:12px">
        <b style="font-size:.85rem;color:#8a5a00">⚠ ${vuot.length} em có tổng đã đóng VƯỢT học phí cả khóa</b>
        <div class="muted" style="font-size:.76rem;line-height:1.6;margin-top:5px">${esc(vuot.slice(0,10).join('; '))}${vuot.length>10?' …':''}. Vẫn ghi nhận được, nhưng nên kiểm tra lại số học phí của các em này.</div></div>`:''}
      ${daCo.length?`<div style="margin-top:12px;padding:11px 12px;border:1.5px solid #b7c6e3;background:#f2f6fd;border-radius:12px">
        <b style="font-size:.85rem;color:#1f4276">ℹ ${daCo.length} em ĐÃ CÓ tiền trên hệ thống</b>
        <div class="muted" style="font-size:.76rem;line-height:1.6;margin-top:5px">${esc(daCo.slice(0,10).map(r=>r.hv.ten+' (đã có '+fmtVND(daThu.cua(r.hv))+', file ghi thêm '+fmtVND(r.soTien)+')').join('; '))}${daCo.length>10?' …':''}</div>
        <label style="display:flex;gap:8px;align-items:flex-start;margin-top:9px;font-size:.79rem;cursor:pointer"><input type="checkbox" id="hp_them" style="margin-top:2px"/><span>Đây là <b>đợt đóng mới</b> — vẫn ghi thêm ${daCo.length} phiếu cho các em này<br/><span class="muted" style="font-weight:600">Không tích thì bỏ qua (an toàn khi lỡ up lại đúng file cũ).</span></span></label>
      </div>`:''}`;

    previewImport('học phí đã thu',recs,bad.map(()=>0),async()=>{
      const nInp=$('#hp_ngay'), nTxt=(nInp?nInp.value:'').trim();
      if(nTxt&&!vnToIso(nTxt)){avaAlert('"Ngày thu cho dòng để trống ngày" chưa đúng dạng ngày/tháng/năm (VD: 15/07/2026).');return false;}
      const nMac=vnToIso(nTxt)||todayISO();
      const themOK=$('#hp_them')&&$('#hp_them').checked;
      const all=(themOK?recs.concat(daCo):recs).map(r=>({...r,ngay:r.ngay||nMac}));
      const boChot=all.filter(r=>daChotKy(r.hv.coSoId,r.ngay));
      const ghi=all.filter(r=>!daChotKy(r.hv.coSoId,r.ngay));
      if(!ghi.length){avaAlert(boChot.length?('Tất cả '+boChot.length+' dòng đều rơi vào kỳ ĐÃ CHỐT SỔ nên không ghi được. Hãy mở lại kỳ đó rồi nhập lại.'):'Không có dòng nào để ghi nhận.');return false;}
      const btn=$('#imp_ok');
      const kq=await ghiPhieuHangLoat(ghi,(d,t)=>{if(btn)btn.textContent='Đang ghi '+d+'/'+t+'…';});
      const daGhi=ghi.slice(0,kq.ok);
      const loiCn=kq.ok?await capNhatTongDongHangLoat(daGhi.map(r=>r.hv)):'';
      await loadCloud();
      closeModal(); renderHocVien();
      avaAlert('Đã ghi '+kq.ok+' phiếu thu học phí — tổng '+fmtVND(daGhi.reduce((s,r)=>s+r.soTien,0))+'.'
        +(boChot.length?'\n\n⚠ Bỏ qua '+boChot.length+' dòng rơi vào kỳ đã chốt sổ.':'')
        +(daCo.length&&!themOK?'\n\nBỏ qua '+daCo.length+' em đã có tiền trên hệ thống.':'')
        +(kq.loi?'\n\n⚠ Còn '+(ghi.length-kq.ok)+' phiếu chưa ghi được: '+kq.loi:'')
        +(loiCn?'\n\n⚠ Chưa cập nhật được "đã đóng" ở hồ sơ: '+loiCn:''),
        {title:'Nhập học phí xong'});
    },badText,extra,()=>{
      attachDateFormat($('#hp_ngay'));
      const cb=$('#hp_them'), okB=$('#imp_ok');
      const upd=()=>{const n=recs.length+((cb&&cb.checked)?daCo.length:0);
        okB.textContent='✓ Ghi nhận '+n+' đợt đóng'; okB.disabled=(n===0);};
      if(cb)cb.onchange=upd;
      upd();
    },rowHTML);
  });
}

const hvOfLop=id=>OPS.hv.filter(h=>h.lopId===id);
/* Dự thu của một lớp = Σ học phí phải thu. Em đã nghỉ tính theo số quyết toán
   (thường bằng số đã đóng) nên khoản đã thu của em ấy KHÔNG bị rơi khỏi bảng phí lớp. */
const lopHP=id=>OPS.hv.filter(h=>h.lopId===id).reduce((s,h)=>s+hpPhaiThu(h),0);
const inHV=()=>OPS.hv.filter(h=>scopeIds().includes(h.coSoId));
const lopName=id=>{const l=LOP.find(x=>x.id===id);return l?l.lop:'—';};
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const CC_LABEL={day:'Lên lớp',nghi:'Nghỉ',bu:'Dạy bù'};
/* ===== AI THỰC DẠY MỘT BUỔI (Giai đoạn 7) =====
   Trước đây chấm công chỉ lưu (lớp + ngày) nên lương tính theo GV ĐANG phụ trách lớp.
   Hậu quả: cô B dạy thay thì công vào túi cô A; đổi GV giữa kỳ thì công cả tháng nhảy sang
   người mới. Nay mỗi buổi lưu thêm gv_id = người THỰC DẠY. */
const gvTen=id=>{const g=GV.find(x=>x.id===id);return g?g.ten:'';};
/* GV thực dạy buổi (lop,ngay): ưu tiên gv_id đã chấm; chưa có thì lấy GV phụ trách lớp */
function gvDayBuoi(lopId,ngay){
  const id=OPS.ccGvId['cc|'+lopId+'|'+ngay];
  if(id!=null)return id;                                   // đã chấm công: tin người thực dạy
  const lop=LOP.find(l=>l.id===lopId);
  return gvIdBuoi(lichLopNgay(lopId,ngay),lop);            // chưa chấm: theo lịch buổi đó, rồi mới tới GV phụ trách
}
/* Tên GV thực dạy — dùng cho báo cáo & bản in. Không tra được thì trả tên GV phụ trách. */
function gvTenBuoi(lopId,ngay){
  const id=gvDayBuoi(lopId,ngay); const t=id!=null?gvTen(id):'';
  if(t)return t;
  const lop=LOP.find(l=>l.id===lopId);
  return (lop&&lop.gv)||'(chưa phân công)';
}
/* Có phải buổi DẠY THAY không (người dạy khác người phụ trách lớp) */
function laDayThay(lopId,ngay){
  const id=OPS.ccGvId['cc|'+lopId+'|'+ngay]; if(id==null)return false;
  const lop=LOP.find(l=>l.id===lopId);
  return !!(lop&&lop.gvId!=null&&lop.gvId!==id);
}
let ddDate=todayISO(), ddLopId=null, ghiLopId=null;
let gdNhapHoc='';   // ngày nhập học đang dùng ở form ghi danh — giữ lại giữa các lần thêm để nhập cả lớp cũ cho nhanh
/* ===== TÊN LỚP KHÔNG THỂ NHẦM =====
   Trong CÙNG một cơ sở có nhiều lớp TRÙNG TÊN (Diễn Hồng có 10 lớp cùng tên "L2",
   khác nhau ở giáo viên và sĩ số). Nếu chỉ dùng tên lớp thì:
   · ô chọn lớp hiện 10 dòng giống hệt nhau,
   · nhập Excel sẽ đổ hết học sinh vào MỘT lớp (lớp cuối cùng thắng) mà không báo gì.
   Nhãn dưới đây kèm giáo viên, và kèm [#mã] khi vẫn còn trùng. */
function lopNhan(l){
  if(!l)return '';
  const cung=LOP.filter(x=>x.coSoId===l.coSoId&&nameKey(x.lop)===nameKey(l.lop));
  if(cung.length<2) return l.lop;
  const cungCaGV=cung.filter(x=>nameKey(x.gv||'')===nameKey(l.gv||''));
  return l.lop+' — '+(l.gv||'chưa phân công')+(cungCaGV.length>1?' [#'+l.id+']':'');
}
/* Đọc ngược nhãn về đúng lớp: ưu tiên [#mã], rồi "tên — giáo viên", rồi tên trần */
function lopTuNhan(txt,coSoId){
  const s=String(txt||'').trim(); if(!s)return {lop:null,nhapNhang:false};
  const m=/\[#(\d+)\]/.exec(s);
  if(m){ const l=LOP.find(x=>x.id===Number(m[1])&&x.coSoId===coSoId); if(l)return {lop:l,nhapNhang:false}; }
  const dsCs=LOP.filter(x=>x.coSoId===coSoId);
  const hit=dsCs.filter(x=>nameKey(lopNhan(x))===nameKey(s));
  if(hit.length===1)return {lop:hit[0],nhapNhang:false};
  const theoTen=dsCs.filter(x=>nameKey(x.lop)===nameKey(s));
  if(theoTen.length===1)return {lop:theoTen[0],nhapNhang:false};
  if(theoTen.length>1) return {lop:null,nhapNhang:true,soLop:theoTen.length};   // trùng tên → KHÔNG đoán bừa
  return {lop:null,nhapNhang:false};
}
/* Lớp được phép điểm danh: có sĩ số, hoặc đã có học sinh, hoặc ĐÃ KHAI LỊCH
   (lớp mới khai lịch mà chưa ghi danh em nào vẫn phải bấm vào được từ danh sách ca). */
const lopDiemDanhDuoc=l=>l.siso>0||hvOfLop(l.id).length>0||lichOfLop(l.id).length>0;
function lopPickHTML(selId){
  return inLOP().filter(lopDiemDanhDuoc).slice().sort((a,b)=>csCmp(a.coSoId,b.coSoId))
    .map(l=>`<option value="${l.id}" ${l.id===selId?'selected':''}>${USER.role==='admin'?csAbbr(l.coSoId)+' · ':''}${esc(lopNhan(l))}${lopNhan(l)===l.lop?" — "+esc(l.gv||'?'):""}</option>`).join('');
}

function showLoginErr(m){const e=$('#loginErr');if(e){e.textContent=m||'';e.style.display=m?'block':'none';}}
const LOGIN_DOMAIN='@avatar.vn';   // tên đăng nhập ngắn sẽ tự thêm đuôi này
$('#loginBtn').onclick=async()=>{
  let email=$('#uname').value.trim(); const pass=$('#upass').value;
  if(email && !email.includes('@')) email=email.toLowerCase()+LOGIN_DOMAIN;   // "dienlien" → "dienlien@avatar.vn"
  if(!email||!pass){showLoginErr('Vui lòng nhập tên đăng nhập và mật khẩu.');return;}
  const btn=$('#loginBtn'); btn.disabled=true; btn.textContent='Đang đăng nhập…'; showLoginErr('');
  const {error}=await SB.auth.signInWithPassword({email,password:pass});
  btn.disabled=false; btn.textContent='Đăng nhập hệ thống';
  if(error){showLoginErr('Sai tên đăng nhập hoặc mật khẩu.');return;}
  await afterAuth();
};
async function afterAuth(preUser){
  let user=preUser;
  if(!user){const r=await SB.auth.getUser(); user=r.data&&r.data.user;}
  if(!user)return false;
  // Đọc hồ sơ phân quyền. Mạng chập chờn hoặc token vừa hết hạn thì THỬ LẠI —
  // trước đây chỉ cần một lần trả rỗng là app đăng xuất oan tài khoản đang dùng tốt.
  let prof=null,loi=null;
  for(let lan=1;lan<=3;lan++){
    const r=await SB.from('profiles').select('*').eq('id',user.id).maybeSingle();
    prof=r.data; loi=r.error;
    if(prof)break;
    if(lan===1&&!loi){ try{ await SB.auth.refreshSession(); }catch(e){} }   // rỗng có thể do token hết hạn → xin token mới rồi đọc lại
    if(lan<3) await new Promise(r2=>setTimeout(r2,700*lan));
  }
  if(!prof&&loi){showLoginErr('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');return false;}   // lỗi mạng/hết hạn tạm → GIỮ phiên, KHÔNG đăng xuất
  if(!prof||!prof.role){showLoginErr('Tài khoản chưa được phân quyền. Liên hệ quản trị viên.');await SB.auth.signOut();return false;}
  if(prof.role==='teacher' && !prof.gv_id){showLoginErr('Tài khoản giáo viên chưa được gắn lớp phụ trách. Liên hệ quản trị viên.');await SB.auth.signOut();return false;}
  USER = prof.role==='admin' ? {role:'admin',coSoId:null,email:user.email,hoTen:prof.ho_ten||''}
       : prof.role==='teacher' ? {role:'teacher',coSoId:prof.coso_id,gvId:prof.gv_id,email:user.email,hoTen:prof.ho_ten||''}
       : {role:'owner',coSoId:prof.coso_id,email:user.email,hoTen:prof.ho_ten||''};
  scope='all';
  const btn=$('#loginBtn'); if(btn){btn.disabled=true;btn.textContent='Đang tải dữ liệu…';}
  try{ await loadCloud(); }
  catch(e){ if(btn){btn.disabled=false;btn.textContent='Đăng nhập hệ thống';} showLoginErr('Không tải được dữ liệu. Kiểm tra kết nối mạng.'); return false; }
  if(btn){btn.disabled=false;btn.textContent='Đăng nhập hệ thống';}
  showLoginErr(''); startApp(); return true;
}

function subscribeRealtime(){
  if(rtChannel)return;
  let timer=null;
  // Đang thao tác thì KHÔNG vẽ lại (tránh mất chữ đang gõ / đóng phiếu) — chỉ cập nhật chuông.
  const busy=()=>$('#modal').classList.contains('on') || $('#voucher').classList.contains('on')
    || (document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName));
  // Gộp nhiều thay đổi dồn dập thành 1 lần tải (điểm danh cả lớp = mấy chục thay đổi liền nhau).
  // 1,8 giây thay vì 0,8 vì dữ liệu thật lớn hơn nhiều — tải lại quá dày sẽ làm app giật.
  const bump=()=>{ clearTimeout(timer); timer=setTimeout(async()=>{
    try{ await loadCloud(); if(busy()) renderBell(); else renderCurrent(); }catch(e){}
  },1800); };
  rtChannel=SB.channel('avatar-rt');
  ['hoc_vien','so_quy','diem_danh_hv','cham_cong_gv','gv_edits','giao_vien','lop_hoc','duyet_diem_danh','chot_so_quy','ca_hoc','lich_lop','co_so','thong_bao'].forEach(t=>
    rtChannel.on('postgres_changes',{event:'*',schema:'public',table:t},bump));
  rtChannel.subscribe();
}

/* ===== CHUÔNG THÔNG BÁO (bản nhanh: gom từ dữ liệu sẵn có, không cần bảng mới) ===== */
let NOTIF=[], notifLastCount=-1;
const notifSeenKey=()=>'avatar_notif_seen_'+((USER&&USER.email)||'x');
const getNotifSeen=()=>{const v=localStorage.getItem(notifSeenKey());return v?Date.parse(v):0;};
const setNotifSeen=ts=>{try{localStorage.setItem(notifSeenKey(),new Date(ts||Date.now()).toISOString());}catch(e){}};
/* Khoảng thời gian dạng "5 phút trước", "2 giờ trước", "hôm qua"… */
function relTime(iso){
  if(!iso)return'';
  const t=Date.parse(iso); if(isNaN(t))return'';
  const s=(Date.now()-t)/1000;
  if(s<45)return'vừa xong';
  if(s<3600)return Math.max(1,Math.floor(s/60))+' phút trước';
  if(s<86400)return Math.floor(s/3600)+' giờ trước';
  if(s<172800)return'hôm qua';
  if(s<604800)return Math.floor(s/86400)+' ngày trước';
  const d=new Date(t);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
}
/* Gom sự kiện cho chuông: học sinh mới ghi danh, phiếu thu, phiếu chi, ca cần xử lý.
   CHỈ dành cho Quản trị (toàn chuỗi) và Lễ tân (ĐÚNG cơ sở mình) — giáo viên không có chuông. */
function buildNotifs(){
  if(!coChuong())return [];
  const out=[];
  // Phạm vi tin: Quản trị theo ô Phạm vi đang chọn; Lễ tân LUÔN chỉ cơ sở mình.
  // Lọc lại ở đây thay vì chỉ tin vào RLS — hai lớp bảo vệ, tránh lọt tin cơ sở khác.
  const ids = USER.role==='owner' ? [USER.coSoId] : scopeIds();
  const trongPhamVi = id => id!=null && ids.includes(id);
  (OPS.hv||[]).forEach(h=>{ if(h.mau||!h.createdAt||!trongPhamVi(h.coSoId))return;
    out.push({ts:h.createdAt, ic:'🧑‍🎓', cls:'n-hs', title:'Học sinh mới: '+h.ten,
      sub:[lopName(h.lopId),csName(h.coSoId)].filter(Boolean).join(' · ')}); });
  (OPS.gd||[]).forEach(g=>{ if(!g.createdAt||!trongPhamVi(g.coSoId))return;
    const co=csName(g.coSoId);
    if(g.loai==='thu') out.push({ts:g.createdAt, ic:'💰', cls:'n-thu', title:'Thu '+fmtVND(g.soTien),
      sub:[g.hangMuc||'Khoản thu',co].filter(Boolean).join(' · ')});
    else out.push({ts:g.createdAt, ic:'🧾', cls:'n-chi', title:'Chi '+fmtVND(g.soTien),
      sub:[g.hangMuc||'Khoản chi',co].filter(Boolean).join(' · ')}); });
  // Thông báo của trung tâm: tin gửi riêng cơ sở mình, và tin gửi toàn chuỗi
  tbCuaToi().forEach(t=>{ if(!t.createdAt)return;
    if(t.coSoId!=null && !trongPhamVi(t.coSoId))return;
    out.push({ts:t.createdAt, ic:TB_IC[t.mucDo], cls:t.mucDo==='thuong'?'n-hs':'n-cc',
      title:t.tieuDe, sub:[TB_MUC[t.mucDo],t.coSoId==null?'Toàn chuỗi':csName(t.coSoId)].join(' · '), view:'thongbao'}); });
  // Ca dạy CẦN MÌNH XỬ LÝ — mỗi ca 1 dòng nên không nhiễu.
  // (Cố ý KHÔNG báo từng lượt điểm danh học sinh: mỗi em mỗi buổi một dòng thì loạn chuông.)
  for(const k in (OPS.duyet||{})){
    const c=OPS.duyet[k], p=k.split('|');
    const lop=LOP.find(l=>l.id===Number(p[0])); if(!lop||!trongPhamVi(lop.coSoId))continue;
    const noi=[lop.lop,isoVN(p[1]),USER.role==='admin'?csName(lop.coSoId):''].filter(Boolean).join(' · ');
    if(USER.role==='owner'&&c.st==='cho_duyet'&&c.gvAt)
      out.push({ts:c.gvAt, ic:'📋', cls:'n-cc', title:'Ca chờ đối soát: '+lop.lop, sub:noi});
    else if(USER.role==='admin'&&c.st==='da_doi_soat'&&c.letanAt)
      out.push({ts:c.letanAt, ic:'📋', cls:'n-cc', title:'Ca chờ chốt số liệu: '+lop.lop, sub:noi});
  }
  out.sort((a,b)=>Date.parse(b.ts)-Date.parse(a.ts));
  return out.slice(0,50);
}
/* Cập nhật badge + (nếu đang mở) nội dung panel — gọi sau mỗi lần dữ liệu đổi */
function renderBell(){
  if(!coChuong())return;                    // giáo viên không có chuông
  const badge=$('#bellBadge'); if(!badge)return;
  NOTIF=buildNotifs();
  const seen=getNotifSeen();
  const unread=NOTIF.filter(n=>Date.parse(n.ts)>seen).length;
  if(unread>0){badge.hidden=false;badge.textContent=unread>99?'99+':unread;}
  else badge.hidden=true;
  // rung chuông khi có thêm thông báo mới (không rung lần nạp đầu)
  if(notifLastCount>=0 && NOTIF.length>notifLastCount){
    const b=$('#bellBtn'); if(b){b.classList.remove('ring');void b.offsetWidth;b.classList.add('ring');}
  }
  notifLastCount=NOTIF.length;
  const panel=$('#bellPanel');
  if(panel && !panel.hidden){ fillBellList(seen); const rb=$('#bellRead'); if(rb)rb.disabled=!unread; }
}
/* Chỉ hiện tin CHƯA đọc (ts > mốc đã đọc). Đánh dấu đã đọc = danh sách trống. */
function fillBellList(seen){
  const box=$('#bellList'); if(!box)return;
  const items=NOTIF.filter(n=>Date.parse(n.ts)>seen);
  if(!items.length){ box.innerHTML=`<div class="bell-empty">✅ Không có thông báo mới.<br/>Khi các cơ sở ghi danh học sinh hoặc thu–chi, thông báo sẽ hiện ở đây.</div>`; return; }
  box.innerHTML=items.map(n=>
    `<div class="bell-item unread"><div class="bell-ic ${n.cls}">${n.ic}</div>

  // tin chưa đọc. Các con số chỉ là SỐ LƯỢNG (14 cơ sở, 340 lớp…) không được dùng chấm đỏ,
  // vì nhìn giống báo có tin mới trên chuông.

function syncNav(){
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===VIEW));
  $$('#botnav button').forEach(b=>b.classList.toggle('on',b.dataset.k===VIEW));
  const n=NAV.find(x=>x.k===VIEW);
  $('#nav .cnt')&&renderNavCounts();
}
function renderNavCounts(){
  NAV.forEach(n=>{if(!n.cnt)return;
    const b=$(`#nav button[data-k="${n.k}"] .cnt`); if(b)b.textContent=n.cnt();
    // chấm số trên thanh dưới (điện thoại) — CHỈ cho việc cần xử lý, có thì hiện, hết thì ẩn hẳn
    const w=n.viec?$(`#botnav button[data-k="${n.k}"] .bi`):null;
    if(w){ const c=n.cnt(); let d=w.querySelector('.bdot');
      if(c){ if(!d){d=document.createElement('i');d.className='bdot';w.appendChild(d);} d.textContent=c; }
      else if(d) d.remove(); }
  });
}

let tkList=null, tkCs='all';
async function callTK(action,payload){
  try{
    // Gắn RÕ token phiên đang đăng nhập (tránh 401 "Chưa đăng nhập" khi invoke chưa kịp đính token)
    const sres=await SB.auth.getSession();
    const token=sres&&sres.data&&sres.data.session&&sres.data.session.access_token;
    if(!token) return {error:'Phiên đăng nhập đã hết hạn. Hãy tải lại trang (Ctrl+F5) rồi đăng nhập lại.'};
    const {data,error}=await SB.functions.invoke('quan-ly-tk',{body:{action,...(payload||{})},headers:{Authorization:'Bearer '+token}});
    if(error){ let msg=error.message||'Không gọi được máy chủ';
      try{ if(error.context&&error.context.json){const j=await error.context.json(); if(j&&j.error)msg=j.error;} }catch(_){}
      return {error:msg}; }
    if(data&&data.error) return {error:data.error};
    return {data:data?data.data:null};
  }catch(e){ return {error:String(e&&e.message||e)}; }
}

/* Sinh mật khẩu ngẫu nhiên dễ đọc (bỏ ký tự gây nhầm: 0 O l 1 i) */
function genPass(len){
  len=len||8; const cs='abcdefghjkmnpqrstuvwxyz23456789';
  const a=new Uint32Array(len); (self.crypto||window.crypto).getRandomValues(a);
  let s=''; for(let i=0;i<len;i++) s+=cs[a[i]%cs.length]; return s;
}
async function tkBulkCreate(){
  const csId=Number(tkCs);
  const acctByGv={}; (tkList||[]).forEach(a=>{ if(a.gv_id!=null) acctByGv[a.gv_id]=a; });
  const targets=GV.filter(g=>g.coSoId===csId && !acctByGv[g.id]);
  if(!targets.length){avaAlert('Mọi giáo viên của cơ sở này đã có tài khoản rồi.');return;}
  if(!await avaConfirm('Tạo tài khoản cho '+targets.length+' giáo viên chưa có tài khoản?\nMỗi người một tên đăng nhập (gv+mã) và một mật khẩu riêng.'))return;
  $('#mcard').innerHTML=`
   <div class="mhead" style="background:var(--dots),linear-gradient(150deg,#10264c,#2f6fd0);background-size:18px 18px,auto">
     <div class="mava">👥</div><div style="flex:1"><h3>Tạo tài khoản hàng loạt</h3><p>${esc(csName(csId))} · ${targets.length} giáo viên</p></div></div>
   <div class="mbody"><div class="empty">Đang tạo… <b id="tkbp">0/${targets.length}</b><br/><small class="muted">Vui lòng chờ, đừng đóng cửa sổ.</small></div></div>`;
  $('#modal').classList.add('on');
  const results=[];
  for(let i=0;i<targets.length;i++){
    const g=targets[i], u='gv'+g.id, p=genPass();
    const r=await callTK('create',{email:u+'@avatar.vn',password:p,ho_ten:g.ten,coso_id:g.coSoId,gv_id:g.id});
    results.push({ten:g.ten,u,p,ok:!r.error,err:r.error||''});
    const el=$('#tkbp'); if(el)el.textContent=(i+1)+'/'+targets.length;
  }
  tkList=null;
  tkBulkSummary(results,csId);
}
function tkBulkSummary(results,csId){
  const ok=results.filter(r=>r.ok), fail=results.filter(r=>!r.ok);
  const rows=results.map((r,i)=>`<div class="ddrow"><div class="idx">${i+1}</div>
    <div class="nm"><b>${esc(r.ten)}</b><small>${r.ok?('ĐN: <b>'+esc(r.u)+'</b> · MK: <b>'+esc(r.p)+'</b>'):('<span style="color:#c0392b">Lỗi: '+esc(r.err)+'</span>')}</small></div></div>`).join('');
  $('#mcard').innerHTML=`
   <div class="mhead" style="background:var(--dots),linear-gradient(150deg,#10264c,#2f6fd0);background-size:18px 18px,auto">
     <div class="mava">✓</div><div style="flex:1"><h3>Đã tạo ${ok.length} tài khoản</h3><p>${esc(csName(csId))}${fail.length?(' · '+fail.length+' lỗi'):''}</p></div>
     <button class="mclose" onclick="closeModal();renderTaiKhoan()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div>
   <div class="mbody">
     <p class="muted" style="font-size:.8rem;margin:0 2px 8px">⚠ Hãy <b>lưu danh sách mật khẩu này ngay</b> (Sao chép hoặc Tải Excel) để phát cho giáo viên — đóng lại sẽ không xem lại được mật khẩu.</p>
     <div class="ddgrid" style="max-height:42vh;overflow:auto">${rows}</div>
     <div style="display:flex;gap:8px;margin-top:12px">
       <button class="btn btn-light" style="flex:1" id="tkCopy">📋 Sao chép</button>
       <button class="btn btn-light" style="flex:1" id="tkXls">⬇ Tải Excel</button>
       <button class="btn btn-primary" style="flex:1" onclick="closeModal();renderTaiKhoan()">Xong</button>
     </div></div>`;
  $('#tkCopy').onclick=()=>{
    const txt='Họ tên\tTên đăng nhập\tMật khẩu\n'+ok.map(r=>r.ten+'\t'+r.u+'\t'+r.p).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(
      ()=>avaAlert('Đã sao chép danh sách. Anh dán vào Excel/Word/Zalo để lưu và phát cho giáo viên.'),
      ()=>avaAlert('Không sao chép được tự động. Anh chụp màn hình danh sách để lưu nhé.'));
  };
  $('#tkXls').onclick=async()=>{
    const btn=$('#tkXls'), old=btn.textContent; btn.disabled=true; btn.textContent='Đang tạo…';
    try{ await ensureXLSX(); }catch(e){ btn.disabled=false; btn.textContent=old; avaAlert('Không tải được thư viện Excel (kiểm tra mạng). Anh có thể dùng nút "Sao chép" để lưu tạm.'); return; }
    const aoa=[['Họ tên','Tên đăng nhập','Mật khẩu','Ghi chú']].concat(ok.map(r=>[r.ten,r.u,r.p,'Đăng nhập: gõ tên trên (tự thêm @avatar.vn)']));
    const ws=XLSX.utils.aoa_to_sheet(aoa); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Tai khoan GV');
    XLSX.writeFile(wb,'Tai-khoan-GV-'+csName(csId).replace(/[\\/:*?"<>|\s]+/g,'-')+'.xlsx');
    btn.disabled=false; btn.textContent=old;
  };
}

    ${allowed.length>1?`<div class="g-tabs">${allowed.map(r=>`<button data-hr="${r}" class="${R===r?'on':''}">${HD_ROLE_ICON[r]} ${esc(HD_ROLE_LABEL[r])}</button>`).join('')}</div>`:''}
    <button class="btn btn-sm btn-ghost" id="hdPrint" style="white-space:nowrap;margin-left:auto">🖶 In / lưu PDF</button>
  </div>`;
  if(!mine) h+=`<div class="g-note"><span>👁</span><div>Đang xem hướng dẫn dành cho <b>${esc(HD_ROLE_LABEL[R])}</b> — không phải vai trò của bạn. Dùng để in phát cho nhân viên; bấm lại thẻ <b>${esc(HD_ROLE_LABEL[USER.role])}</b> để về hướng dẫn của mình.</div></div>`;

  // Mục lục
  const toc=[['hd-start','Bắt đầu'],['hd-flow','Quy trình một buổi'],['hd-menu','Menu có gì'],['hd-howto','Thao tác từng bước'],['hd-num','Cách tính số liệu'],['hd-faq','Hỏi đáp & sự cố'],['hd-tip','Mẹo dùng']];

  // 1) Bắt đầu
  h+=sec('hd-start','Bắt đầu — 3 việc đầu tiên',esc(HD_ROLE_LABEL[R]),
    HD_START[R].map((s,i)=>`<div class="step"><div class="sn">${i+1}</div><div class="sc"><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join(''));

  // 2) Quy trình
  h+=sec('hd-flow','Quy trình một buổi dạy','từ ghi danh đến chốt số liệu',
    `<div class="g-flow">${HD_FLOW.map((f,i)=>`<div class="g-fstep"><span class="n">${i+1}</span><b>${f[0]}</b><span>${f[1]}</span><span class="who">${f[2]}</span></div>`).join('')}</div>
     <div class="g-note ok" style="margin-top:12px"><span>🎨</span><div>Màu trạng thái ca dạy: <span class="castat ca-none">Chưa gửi đối soát</span> <span class="castat ca-cho">Chờ đối soát</span> <span class="castat ca-soat">Đã đối soát</span> <span class="castat ca-chot">Đã chốt</span> — ca <b>Đã chốt</b> là số liệu đã khóa, dùng để đối chiếu lương và học phí.</div></div>
     <div class="g-note"><span>💡</span><div>Cơ sở chưa có tài khoản giáo viên: lễ tân tự điểm danh rồi bấm <b>✓ Gửi đối soát</b> — ca chuyển thẳng sang <b>Đã đối soát</b>, bỏ qua bước của giáo viên.</div></div>`);

  // 3) Menu có gì
  h+=sec('hd-menu','Menu có gì',navs.length+' mục hiện với '+esc(HD_ROLE_LABEL[R]),
    navs.map(n=>`<div class="g-mrow"><div class="mi">${svg(n.i)}</div><div><b>${esc(n.t)}</b><span>${HD_MENU_DESC[n.k]||''}</span></div></div>`).join('')
    + (R==='admin'?`<div class="g-note ok" style="margin-top:12px"><span>📍</span><div>Riêng Giám đốc có ô <b>chọn phạm vi</b> ở đầu trang: “Toàn hệ thống” hoặc từng cơ sở — mọi số liệu, danh sách, báo cáo đều đổi theo lựa chọn này.</div></div>`
      :R==='owner'?`<div class="g-note ok" style="margin-top:12px"><span>🔒</span><div>Lễ tân được khóa cố định ở <b>một cơ sở</b>; mọi trang chỉ hiện dữ liệu của cơ sở mình.</div></div>`
      :`<div class="g-note ok" style="margin-top:12px"><span>🔒</span><div>Giáo viên chỉ thấy <b>lớp mình phụ trách</b>, không thấy học phí, sổ quỹ hay lớp của cơ sở khác.</div></div>`));

  // 4) Thao tác từng bước
  h+=sec('hd-howto','Thao tác từng bước','bấm vào từng mục để mở',
    HD_HOWTO[R].map((g,i)=>`<details class="g-acc" ${i===0?'open':''}><summary><span class="gi">${g[0]}</span>${g[1]}</summary><ol>${g[2].map(x=>`<li>${x}</li>`).join('')}</ol></details>`).join(''));

  // 5) Cách tính số liệu
  h+=sec('hd-num','Cách hệ thống tính số liệu','để mọi người đọc số giống nhau',
    `<div class="g-kv">${HD_NUMBERS.map(n=>`<div class="r"><div class="k">${n[0]}</div><div class="v">${n[1]}</div></div>`).join('')}</div>`);

  // 6) FAQ
  h+=sec('hd-faq','Hỏi đáp &amp; xử lý sự cố',HD_FAQ.length+' tình huống thường gặp',
    HD_FAQ.map(f=>`<details class="g-acc"><summary><span class="gi">❓</span>${f[0]}</summary><ul><li>${f[1]}</li></ul></details>`).join(''));

  // 7) Mẹo
  h+=sec('hd-tip','Mẹo dùng &amp; an toàn tài khoản','',
    HD_TIPS.map(t=>`<div class="tiprow"><span>${t[0]}</span><span>${t[1]}</span></div>`).join(''));

  h+=`<div class="panel"><div class="pbody" style="text-align:center;color:var(--muted);font-size:.86rem;line-height:1.6">
    Cần hỗ trợ thêm? Liên hệ bộ phận kỹ thuật của Trung tâm.<br/>
    <b style="color:var(--brand)">AVATAR English</b> — Hệ thống quản trị chuỗi · Nghệ An
  </div></div>`;

  $('#view').innerHTML=h;
  $$('#view [data-hr]').forEach(b=>b.onclick=()=>{hdRole=b.dataset.hr;renderHuongDan();window.scrollTo(0,0);});
  $$('#view [data-go]').forEach(b=>b.onclick=()=>{const el=$('#'+b.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
  $('#hdPrint').onclick=()=>{
    const acc=$$('#view details.g-acc'), was=acc.map(d=>d.open);
    acc.forEach(d=>d.open=true);                 // mở hết mục gấp để in đủ nội dung
    document.body.classList.add('print-guide');
    const restore=()=>{document.body.classList.remove('print-guide');acc.forEach((d,i)=>d.open=was[i]);window.removeEventListener('afterprint',restore);};
    window.addEventListener('afterprint',restore);
    window.print(); setTimeout(restore,1500);    // dự phòng cho trình duyệt không bắn afterprint
  };
}

/* ============ DASHBOARD ============ */
function renderDash(){
  const ids=scopeIds();
  const cosos=inCOSO().filter(c=>!c.build);
  const g=GV.filter(x=>ids.includes(x.coSoId)).length;
  const ls=LOP.filter(x=>ids.includes(x.coSoId));
  const hs=hsActiveCount(ids);                 // số HS đang học thực tế (khớp badge menu & trang Học sinh)

  // ---- tài chính THẬT: học phí từng học sinh ----
  const money=hpStat(ids);

  const today=ddToday(ids);                 // buổi đã điểm danh hôm nay
