<meta property="og:image:alt" content="Logo AVATAR English"/>

<meta name="twitter:title" content="AVATAR English - Hệ thống quản trị"/>
<meta name="twitter:description" content="Hệ thống quản trị chuỗi Trung tâm Anh ngữ AVATAR — Nghệ An"/>
<meta name="twitter:image" content="https://schoolrecords.github.io/avatar/logo.png"/>
<style>
:root{
  --bg:#eef1f7;--card:#ffffff;--ink:#132244;--muted:#5f6a86;--faint:#8b95ae;
  --line:#e2e7f1;--soft:#f2f5fb;
  --brand:#1f4276;--brand-600:#17335f;--brand-700:#10264c;--brand-soft:#dbe4f3;
  --navy-900:#0b1d3d;--navy-800:#10264c;
  --emerald:#2f6fd0;--emerald-soft:#dde8fa;
  --amber:#c98410;--amber-soft:#fbeecd;--rose:#e04b52;--rose-soft:#fbe6e7;
  --sky:#0e7fb0;--sky-soft:#d7edf6;--violet:#7c5cd6;--violet-soft:#e9e2fb;
  --radius:18px;--radius-sm:12px;
  --shadow:0 20px 45px -30px rgba(11,29,61,.55);--shadow-sm:0 8px 22px -16px rgba(11,29,61,.5);
  --dots:radial-gradient(rgba(255,255,255,.16) 1.5px, transparent 1.6px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
/* Font thương hiệu UTM Avo (tự host, hiển thị đồng nhất mọi máy kể cả điện thoại) */
@font-face{font-family:'UTM Avo';src:url('fonts/UTM-Avo.ttf') format('truetype');font-weight:400 600;font-style:normal;font-display:swap}
@font-face{font-family:'UTM Avo';src:url('fonts/UTM-Avo-Bold.ttf') format('truetype');font-weight:700 900;font-style:normal;font-display:swap}
body{margin:0;font-family:"UTM Avo","Quicksand","Nunito","Be Vietnam Pro","Segoe UI",Roboto,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,select,textarea{font-family:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{text-decoration:none;color:inherit}
svg{display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#c4d3d0;border-radius:8px}

/* ===== LOGIN ===== */
#login{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;
  background:var(--dots),
             radial-gradient(1100px 560px at 12% -8%,#1e3d76,transparent 58%),
             radial-gradient(900px 620px at 112% 118%,#12305e,transparent 55%),var(--navy-900);
  background-size:20px 20px,auto,auto,auto}
#login::before,#login::after{content:"";position:absolute;border-radius:50%;filter:blur(64px);pointer-events:none;z-index:0}
#login::before{width:540px;height:540px;left:-150px;top:-130px;background:radial-gradient(circle,rgba(74,120,200,.5),transparent 70%);animation:lblob1 20s ease-in-out infinite}
#login::after{width:480px;height:480px;right:-130px;bottom:-150px;background:radial-gradient(circle,rgba(244,196,48,.18),transparent 70%);animation:lblob2 24s ease-in-out infinite}
@keyframes lblob1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,46px)}}
@keyframes lblob2{0%,100%{transform:translate(0,0)}50%{transform:translate(-56px,-34px)}}
.login-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.login-deco span{position:absolute;width:var(--s,48px);height:var(--s,48px);color:#f4c430;opacity:.15;animation:lfloat var(--d,11s) ease-in-out var(--dl,0s) infinite;will-change:transform}
.login-deco span.w{color:#bcd2f5;opacity:.18}
.login-deco span svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
@keyframes lfloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-26px) rotate(calc(var(--r,0deg) - 6deg))}}
@media(prefers-reduced-motion:reduce){#login::before,#login::after,.login-deco span{animation:none}}
.lcard{position:relative;z-index:2;width:min(420px,100%);background:var(--card);border-radius:26px;box-shadow:0 44px 90px -46px #000;overflow:hidden}
.lhead{position:relative;overflow:hidden;color:#fff;padding:38px 30px 30px;text-align:center;background:radial-gradient(135% 90% at 50% -8%,rgba(74,120,200,.5) 0%,rgba(74,120,200,0) 55%),linear-gradient(162deg,#103166 0%,#0a1e46 56%,#071531 100%);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#8a6a1e,#f4c430,#8a6a1e) 1}
.lhead::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(212,175,55,.55) 1.2px,transparent 1.4px);background-size:12px 12px;-webkit-mask-image:radial-gradient(72% 62% at 6% 94%,#000 0%,transparent 60%),radial-gradient(62% 55% at 96% 6%,#000 0%,transparent 62%);mask-image:radial-gradient(72% 62% at 6% 94%,#000 0%,transparent 60%),radial-gradient(62% 55% at 96% 6%,#000 0%,transparent 62%);opacity:.85}
.lhead::after{content:"";position:absolute;left:-25%;right:-25%;top:-10%;bottom:-30%;pointer-events:none;transform:rotate(-7deg);background:radial-gradient(58% 38% at 22% 34%,transparent 38%,rgba(244,196,48,.5) 40%,rgba(244,196,48,0) 44%),radial-gradient(66% 42% at 82% 66%,transparent 43%,rgba(244,196,48,.38) 45%,rgba(244,196,48,0) 49%)}
.llogo{width:96px;height:96px;border-radius:24px;background:transparent;overflow:visible;margin:0 auto 12px;position:relative;z-index:1;filter:drop-shadow(0 12px 26px rgba(240,195,55,.4))}
.llogo img,.brand .lg img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.lhead h1{margin:0;font-size:1.7rem;letter-spacing:.12em;font-weight:900;position:relative;z-index:1;background:linear-gradient(180deg,#fff4c9 0%,#f4c430 48%,#d38f16 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
.lhead p{margin:9px 0 0;color:#dbe6f7;font-size:.86rem;position:relative;z-index:1}
.lbody{padding:26px 28px 30px}
.lbody label{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px 3px}
.field{margin-bottom:15px}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--soft);border-radius:13px;padding:13px 14px;outline:0;transition:.15s}
.field input:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.14)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.role{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;text-align:center;transition:.15s;display:grid;gap:8px;justify-items:center}
.role svg{width:23px;height:23px;stroke:var(--muted)}
.role b{font-size:.82rem;font-weight:800}
.role.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(31,66,118,.14)}
.role.on svg{stroke:var(--brand-600)}
.role.on b{color:var(--brand-700)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--faint)}
.eye:hover{color:var(--brand-600);background:var(--soft)}
.eye svg{width:20px;height:20px;stroke:currentColor}
.lnote{font-size:.75rem;color:var(--faint);text-align:center;margin:17px 0 0;line-height:1.5}

.btn{border-radius:13px;padding:13px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.18s;font-size:.92rem}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,#2a5490,#1f4276);color:#fff;box-shadow:0 14px 30px -14px rgba(16,38,76,.9)}
.btn-primary:hover{background:linear-gradient(135deg,#25497f,#17335f)}
.btn-block{width:100%}
.btn-light{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-mint{background:#F3FDF5;border:1.5px solid #bfe8cd;color:#1c7a54;font-weight:800}
.btn-mint:hover{background:#e6f9ec;border-color:#9fdcb4}
.btn-light:hover{background:var(--soft)}
.btn-sm{padding:8px 13px;font-size:.8rem;border-radius:10px}
.btn-ghost{background:var(--soft);color:var(--brand-700)}

/* ===== SHELL ===== */
#app{display:none}
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--dots),linear-gradient(188deg,#1c3c6e 0%,#0b1d3d 74%);background-size:22px 22px,auto;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:18px 13px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 17px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .lg{width:50px;height:50px;border-radius:15px;background:#fff;overflow:hidden;flex:none;box-shadow:0 10px 22px -10px rgba(0,0,0,.5)}
.brand b{display:block;font-size:1.14rem;letter-spacing:.07em;font-weight:800}
.brand small{display:block;color:#8fc0ba;font-size:.68rem;letter-spacing:.02em}
.navlab{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#5f8f88;margin:16px 12px 8px;font-weight:800}
.nav{display:grid;gap:8px;overflow-y:auto;flex:1;padding:2px 1px}
.nav button{display:flex;align-items:center;gap:13px;width:100%;text-align:left;color:#cfe4e0;border-radius:13px;padding:13px 14px;font-weight:600;font-size:1rem;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);transition:background .16s,border-color .16s,color .16s,transform .11s ease}
.nav button svg{width:21px;height:21px;stroke:currentColor;flex:none;opacity:.85}
.nav button .cnt{margin-left:auto;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:99px;color:#a9d3cd}
.nav button:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.13);color:#fff}
.nav button:hover svg{opacity:1}
.nav button:active{transform:translateY(-2px)}
.nav button.on{background:linear-gradient(135deg,#2a5490,var(--brand));border-color:transparent;color:#fff;font-weight:700;box-shadow:0 14px 26px -14px rgba(16,38,76,.95)}
.nav button.on svg{opacity:1}
.nav button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.suser{margin-top:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:15px;padding:11px 12px;display:flex;flex-direction:column;gap:11px}
.suser-top{display:flex;align-items:center;gap:10px}
.suser .ava{width:38px;height:38px;border-radius:12px;background:var(--emerald);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.suser b{display:block;font-size:.84rem;line-height:1.25}
.suser small{display:block;color:#8fc0ba;font-size:.7rem}
.btn-logout{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:11px;font-size:.83rem;font-weight:800;color:#d6e7e3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);transition:.15s}
.btn-logout svg{width:17px;height:17px;stroke:currentColor;flex:none}
.btn-logout:hover{background:var(--rose);border-color:var(--rose);color:#fff}
.btn-key:hover{background:var(--emerald)!important;border-color:var(--emerald)!important;color:#fff!important}

.main{min-width:0;padding:20px 26px 90px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.burger{display:none;width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow-sm)}
.burger svg{width:21px;height:21px;stroke:var(--ink)}
.ttl{min-width:0}
.ttl h1{margin:0;font-size:1.3rem;letter-spacing:-.02em;line-height:1.12}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:.83rem}
/* Thanh thương hiệu (bộ mặt app) */
.topbrand{position:relative;display:flex;align-items:center;gap:12px;background:var(--dots),linear-gradient(120deg,#1c3c6e 0%,#0b1d3d 88%);background-size:20px 20px,auto;color:#fff;border-radius:16px;padding:12px 15px;margin-bottom:13px;box-shadow:0 14px 30px -20px rgba(11,29,61,.85)}
.topbrand .burger{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);box-shadow:none}
.topbrand .burger svg{stroke:#fff}
.tb-logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none;overflow:hidden}
.tb-logo img{width:34px;height:34px;object-fit:contain}
.tb-name{flex:1;min-width:0}
.tb-name b{display:block;font-size:1.06rem;font-weight:800;line-height:1.16;letter-spacing:.02em}
.tb-name small{display:block;font-size:.78rem;color:#f0c552;font-weight:700;margin-top:1px}
.topbrand .bell-wrap{flex:none}
.topbrand .bell-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.24);color:#fff}
.topbrand .bell-btn:hover{background:rgba(255,255,255,.27)}
@media(max-width:560px){.tb-name b{font-size:.95rem}.tb-logo{width:40px;height:40px}.tb-logo img{width:30px;height:30px}}
.topact{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.scope{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 10px 8px 13px;box-shadow:var(--shadow-sm)}
/* ===== Chuông thông báo ===== */
.bell-wrap{position:relative}
.bell-btn{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-sm);color:var(--ink);cursor:pointer;transition:.15s}
.bell-btn:hover{background:#f4f7fb}
.bell-btn:active{transform:scale(.94)}
.bell-btn svg{width:21px;height:21px}
.bell-btn.ring svg{animation:bellRing .6s ease}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(11deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}
.bell-badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--rose);color:#fff;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(224,69,94,.55);border:2px solid #fff}
.bell-badge[hidden]{display:none}
.bell-panel{position:absolute;top:54px;right:0;width:360px;max-width:90vw;max-height:74vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 55px rgba(15,40,80,.24);z-index:200;color:var(--ink);text-align:left}
.bell-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0}
.bell-head b{font-size:.96rem}
.bell-head button{background:none;border:0;color:var(--brand);font-weight:800;font-size:.75rem;cursor:pointer;padding:4px 6px;border-radius:8px}
.bell-head button:hover{background:#f0f5f3}
.bell-head button:disabled{color:var(--muted);cursor:default;background:none}
.bell-list{padding:6px}
.bell-item{display:flex;gap:11px;padding:10px 11px;border-radius:12px;align-items:flex-start}
.bell-item+.bell-item{border-top:1px solid #f1f4f8}
.bell-item.unread{background:rgba(16,118,110,.07)}
.bell-ic{width:36px;height:36px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;background:#f1f5fb}
.bell-ic.n-thu{background:rgba(22,163,74,.14)}
.bell-ic.n-chi{background:rgba(224,69,94,.13)}
.bell-ic.n-hs{background:rgba(37,99,235,.13)}
.bell-ic.n-cc{background:rgba(217,150,59,.15)}
.bell-ic.n-left{background:#eef1f5}
.bell-tx{flex:1;min-width:0}
.bell-tx b{display:block;font-size:.85rem;font-weight:700;line-height:1.32}
.bell-tx small{display:block;color:var(--muted);font-size:.74rem;margin-top:1px}
.bell-tx .rt{color:var(--brand);font-weight:700}
.bell-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:.86rem;line-height:1.5}
.scope svg{width:16px;height:16px;stroke:var(--brand-600);flex:none}
.scope small{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.scope select{border:0;outline:0;background:none;font-weight:800;color:var(--brand-700);max-width:190px;padding:2px 4px}
.scope.lock{background:var(--soft)}.scope.lock select{color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-sm)}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.kpi-ic svg{width:21px;height:21px}
.ic-teal{background:var(--brand-soft)}.ic-teal svg{stroke:var(--brand-600)}
.ic-em{background:var(--emerald-soft)}.ic-em svg{stroke:var(--emerald)}
.ic-sky{background:var(--sky-soft)}.ic-sky svg{stroke:var(--sky)}
.ic-am{background:var(--amber-soft)}.ic-am svg{stroke:var(--amber)}
.ic-vi{background:var(--violet-soft)}.ic-vi svg{stroke:var(--violet)}
.kpi b{display:block;font-size:1.6rem;letter-spacing:-.02em;margin-top:13px;line-height:1}
.kpi span{font-size:.78rem;color:var(--muted)}
/* thẻ tiền ở trang Thu – Chi: hiện SỐ ĐẦY ĐỦ (kế toán), cỡ chữ nhỏ lại cho vừa */
.kpi.money b{font-size:1.2rem;font-variant-numeric:tabular-nums;word-break:break-word}
.kpi.money b.neg{color:var(--rose)}
@media(max-width:520px){.kpi.money b{font-size:1.05rem}}

/* KPI hero (dashboard) — thẻ gradient nổi bật */
.kcards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kcard{position:relative;overflow:hidden;border-radius:var(--radius);padding:18px 19px;color:#fff;box-shadow:0 18px 36px -22px rgba(11,29,61,.75)}
.kcard .kdeco{position:absolute;top:-32px;right:-32px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.14)}
.kcard .kdeco::after{content:"";position:absolute;top:36px;right:36px;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.12)}
.kcard .kic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.22);position:relative;z-index:1}
.kcard .kic svg{width:22px;height:22px;stroke:#fff}
.kcard b{display:block;font-size:1.75rem;letter-spacing:-.02em;margin-top:14px;line-height:1;position:relative;z-index:1}
.kcard .kl{font-size:.8rem;color:rgba(255,255,255,.88);position:relative;z-index:1}
.kc1{background:linear-gradient(135deg,#eaa845,#c9760f)}
.kc2{background:linear-gradient(135deg,#37b083,#1c7a54)}
.kc3{background:linear-gradient(135deg,#4785db,#1e4f9e)}
.kc4{background:linear-gradient(135deg,#8f70e6,#5d3fb2)}
@media(max-width:900px){.kcards{grid-template-columns:repeat(2,1fr);gap:11px}.kcard b{font-size:1.5rem}}

.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px}
.phead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead h3{margin:0;font-size:1rem}
.phead .sub{font-size:.72rem;color:var(--muted)}
.pbody{padding:16px 18px}

/* toolbar (search/filter) */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 14px;box-shadow:var(--shadow-sm)}
.search svg{width:18px;height:18px;stroke:var(--faint);flex:none}
.search input{border:0;outline:0;background:none;width:100%}
.fsel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm);outline:0;max-width:210px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-size:.83rem;font-weight:700;color:var(--muted);transition:.15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* table */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
thead th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;padding:11px 14px;border-bottom:2px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;background:var(--soft)}
thead th:last-child{border-right:0}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
tbody td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--soft)}
.tright{text-align:right}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.gvcell{display:flex;align-items:center;gap:11px;min-width:170px}
.gvava{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.82rem;color:#fff;flex:none}
.gvcell b{display:block;line-height:1.2}
.gvcell small{color:var(--muted);font-size:.74rem}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.bg-vh{background:var(--sky-soft);color:var(--sky)}
.bg-ta{background:var(--violet-soft);color:var(--violet)}
.bg-em{background:var(--emerald-soft);color:var(--emerald)}
.bg-am{background:var(--amber-soft);color:var(--amber)}
.bg-gray{background:var(--soft);color:var(--muted)}
.linkbtn{color:var(--brand-600);font-weight:800;font-size:.82rem}

/* cơ sở cards */
.cscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.cscard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px 17px;transition:.15s;cursor:pointer;position:relative;overflow:hidden}
.cscard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.cscard.build{opacity:.72;border-style:dashed}
.cscard .cs-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:15px}
.cs-badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.18rem;flex:none}
.avatar-a{font-weight:900;font-style:italic;letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.18)}
/* khối logo AVATAR — hình chữ nhật bo cong, nổi khối */
.cs-logo{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border-radius:11px;background:#fff;color:var(--brand);border:1.5px solid var(--brand-soft);font-weight:800;font-size:.74rem;letter-spacing:.13em;font-style:normal;box-shadow:0 4px 10px -4px rgba(16,38,76,.18)}
/* vòng tròn trang trí theo phong cách thẻ KPI */
.cs-deco{position:absolute;top:-34px;right:-34px;width:132px;height:132px;border-radius:50%;opacity:.12;z-index:0;pointer-events:none}
.cs-deco::after{content:"";position:absolute;top:40px;right:40px;width:78px;height:78px;border-radius:50%;background:inherit;opacity:.7}
.cscard .cs-top,.cscard .cs-stats{position:relative;z-index:1}
.cscard h4{margin:0;font-size:1.24rem;line-height:1.2;text-align:center;font-weight:800;color:var(--ink)}
.cscard .cs-sub{font-size:.82rem;color:var(--muted);text-align:center}
.cs-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cs-stat{background:rgba(255,255,255,.68);border-radius:13px;padding:13px 10px;text-align:center}
.cs-stat b{display:block;font-size:1.58rem;line-height:1.05;color:var(--brand);font-weight:600;letter-spacing:-.01em}
.cs-stat span{font-size:.74rem;color:var(--muted)}
.cs-rev{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.cs-rev small{font-size:.72rem;color:var(--muted)}
.cs-rev b{font-size:1.02rem;color:var(--brand-700)}
.cs-warn{display:inline-flex;align-items:center;gap:3px;font-size:.6rem;font-weight:800;color:#8a5a05;background:var(--amber-soft);border:1px solid #f2dca6;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.cs-mini{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:.74rem;color:var(--muted)}
.cs-mini .mk{color:var(--amber);font-weight:900}
.cs-mini .mbar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.65);overflow:hidden}
.cs-mini .mbar i{display:block;height:100%;background:var(--sky)}
.cs-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.6);margin-top:11px;overflow:hidden}
.cs-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--emerald))}
.cssum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cssum .s{flex:1;min-width:110px;background:var(--dots),linear-gradient(188deg,#3a5da0 0%,#22406f 78%);background-size:22px 22px,auto;border:0;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);text-align:center}
.cssum .s b{display:block;font-size:1.34rem;line-height:1;color:#fff;font-weight:900}
.cssum .s span{font-size:.73rem;color:#dce6f6}
.cs-back{margin-bottom:14px}
.csd-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.csd-hero h2{margin:0;font-size:1.5rem;line-height:1.2}
.csd-money{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.csd-money .mbox{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
.csd-money .mbox small{display:block;font-size:.74rem;color:var(--muted);margin-bottom:6px}
.csd-money .mbox b{font-size:1.22rem;line-height:1}
.csd-money .mbox.done{background:#eafaf1;border-color:#bfead2}
.csd-money .mbox.done b{color:var(--emerald)}
.csd-money .mbox.pend{background:#fdf1ec;border-color:#f6d4c6}
.csd-money .mbox.pend b{color:#d9663b}
.csd-prog{display:flex;align-items:center;gap:12px;padding:0 16px 16px}
.csd-prog-bar{flex:1;height:9px;border-radius:99px;background:#eef1f6;overflow:hidden}
.csd-prog-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--emerald))}
.csd-prog span{font-size:.8rem;color:var(--muted);white-space:nowrap}
/* nút trạng thái đóng học phí */
.hv-paid{display:flex;gap:8px}
.hv-paid button{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:.86rem;color:var(--muted);cursor:pointer;transition:.12s}
.hv-paid button[data-p="1"].sel{background:#eafaf1;border-color:var(--emerald);color:var(--emerald)}
.hv-paid button[data-p="0"].sel{background:#fdf1ec;border-color:#d9663b;color:#d9663b}
.hv-paid3{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:7px}
.hv-paid3 button{padding:10px 4px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;transition:.12s}
.hv-paid3 button[data-p="1"].sel{background:#eafaf1;border-color:var(--emerald);color:var(--emerald)}
.hv-paid3 button[data-p="0"].sel{background:#fdf1ec;border-color:#d9663b;color:#d9663b}
.hv-paid3 input{padding:10px 6px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:600;font-size:.82rem;text-align:center;color:var(--ink);min-width:0;width:100%}
.hv-paid3 input:disabled{background:#f2f4f8;color:var(--faint)}
.hv-stt2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.hv-stt2 button{padding:10px 4px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;transition:.12s}
.hv-stt2 button[data-s="0"].sel{background:#eafaf1;border-color:var(--emerald);color:var(--emerald)}
.hv-stt2 button[data-s="1"].sel{background:#eef1f5;border-color:#8a94a6;color:#5a6475}
.gv-lopcheck{max-height:220px;overflow:auto;border:1.5px solid var(--line);border-radius:11px;background:#fff}
.lopgrid{display:flex;flex-direction:column;font-size:.83rem}
.lopgrid-h,.lopgrid-r{display:grid;grid-template-columns:34px 1fr 52px 1.5fr;align-items:center;gap:6px}
.lopgrid-h{position:sticky;top:0;background:#f4f7fb;font-weight:800;color:var(--muted);font-size:.71rem;text-transform:uppercase;letter-spacing:.02em;padding:8px 10px;border-bottom:1.5px solid var(--line);z-index:1}
.lopgrid-r{padding:9px 10px;border-bottom:1px solid #eef1f6;cursor:pointer;margin:0;user-select:none}
.lopgrid-r:last-child{border-bottom:0}
.lopgrid-r:hover{background:#f7f9fc}
.lopgrid-r:has(input:checked){background:#eafaf1}
.lopgrid-r input{width:17px;height:17px;accent-color:var(--emerald);cursor:pointer;margin:0 auto}
.lg-lop{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-ss{color:var(--muted);text-align:center}
.lg-gv{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Hộp thoại AVATAR thông báo (thay alert/confirm mặc định) */
.ava-dlg-ov{position:fixed;inset:0;z-index:9999;background:rgba(11,29,61,.5);display:grid;place-items:center;padding:20px;animation:avaFade .15s ease}
.ava-dlg{background:#fff;border-radius:18px;max-width:410px;width:100%;box-shadow:0 30px 70px -20px rgba(11,29,61,.65);overflow:hidden;animation:avaPop .18s ease}
.ava-dlg-h{display:flex;align-items:center;gap:10px;padding:15px 18px;background:var(--dots),linear-gradient(135deg,#1f4276,#10264c);background-size:16px 16px,auto;color:#fff;font-weight:800;font-size:1.04rem}
.ava-dlg-h svg{width:22px;height:22px;fill:none;stroke:#f4c430;stroke-width:1.9;flex:none}
.ava-dlg-b{padding:18px;color:var(--ink);font-size:.95rem;line-height:1.55}
.ava-dlg-b b{color:var(--brand)}
.ava-dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:2px 18px 18px}
.ava-dlg-btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 22px;cursor:pointer;font-size:.9rem;transition:.12s}
.ava-dlg-btn.ghost{background:#eef1f7;color:var(--muted)}
.ava-dlg-btn.primary{background:var(--brand);color:#fff}
.ava-dlg-btn.danger{background:#d64541;color:#fff}
.ava-dlg-btn:active{transform:scale(.97)}
@keyframes avaFade{from{opacity:0}to{opacity:1}}
@keyframes avaPop{from{transform:translateY(8px) scale(.96);opacity:.5}to{transform:none;opacity:1}}
.paidtag{display:inline-block;font-size:.66rem;font-weight:800;padding:1px 7px;border-radius:99px;margin-left:5px;vertical-align:middle}
.paidtag.yes{background:#eafaf1;color:var(--emerald)}
.paidtag.part{background:#fff5e6;color:#c47f16}
.paidtag.no{background:#fdf1ec;color:#d9663b}
.leftTag{display:inline-block;font-size:.66rem;font-weight:800;padding:1px 7px;border-radius:99px;margin-left:5px;vertical-align:middle;background:#eef1f5;color:#6b7688}
.ddrow.hv-left{opacity:.72}
.ddrow.hv-left .nm b{color:#8a94a6}
.ddrow.hv-picked{background:#eaf2ff;border-color:var(--brand)}

/* ===== GHI DANH / ĐIỂM DANH ===== */
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form2 .fld{display:grid;gap:6px}
.form2 .fld.full{grid-column:1/-1}
.form2 label{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.form2 input,.form2 select{border:1.5px solid var(--line);background:var(--soft);border-radius:11px;padding:11px 12px;outline:0;width:100%}
.form2 input:focus,.form2 select:focus{border-color:var(--brand);background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{padding:7px 10px;font-size:.77rem;font-weight:800;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on-co,.seg button.on-day{background:var(--emerald-soft);color:var(--emerald)}
.seg button.on-muon,.seg button.on-bu{background:var(--amber-soft);color:var(--amber)}
.seg button.on-phep{background:var(--sky-soft);color:var(--sky)}
.seg button.on-vang,.seg button.on-nghi{background:var(--rose-soft);color:var(--rose)}
.ddrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ddrow:last-child{border-bottom:0}
.ddrow .idx{width:22px;color:var(--faint);font-weight:800;font-size:.8rem;flex:none;text-align:center}
.ddrow .nm{flex:1;min-width:0}
.ddrow .nm b{display:block;font-size:.9rem;line-height:1.25}
.ddrow .nm small{color:var(--muted);font-size:.73rem}
/* điểm danh 2 cột */
.ddgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:26px}
.ddgrid>.ddrow:nth-child(even){border-left:1px solid var(--line);padding-left:20px}
.ddgrid>.ddrow.ddh{background:var(--soft);border-radius:9px;border-bottom:0;margin-bottom:3px;padding:8px 11px}
.ddgrid>.ddrow.ddh .idx,.ddgrid>.ddrow.ddh .nm,.ddgrid>.ddrow.ddh .hh{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.ddgrid>.ddrow.ddh .hh{margin-left:auto}
.ddgrid>.ddrow.ddh:nth-child(even){border-left:0;padding-left:11px}
@media(max-width:760px){.ddgrid{grid-template-columns:1fr;column-gap:0}.ddgrid>.ddrow:nth-child(even){border-left:0;padding-left:0}.ddgrid>.ddrow.ddh:nth-child(2){display:none}}
.savednote{font-size:.73rem;color:var(--emerald);font-weight:800}
.tagmau{font-size:.6rem;font-weight:800;color:var(--amber);background:var(--amber-soft);padding:1px 6px;border-radius:6px;vertical-align:middle;letter-spacing:.02em}
.ddsum{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.ddsum .p{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 15px;display:flex;align-items:baseline;gap:6px}
.ddsum .p b{font-size:1.18rem;font-weight:900}.ddsum .p span{font-size:.8rem;color:var(--muted)}
.ddsum .p.co{background:#f0fdf4;border-color:#bbf7d0}.ddsum .p.co b{color:#16a34a}
.ddsum .p.muon{background:var(--amber-soft);border-color:#f4dfb0}.ddsum .p.muon b{color:var(--amber)}
.ddsum .p.vang{background:var(--rose-soft);border-color:#f4cdcf}.ddsum .p.vang b{color:var(--rose)}
.ddsum .p.phep{background:#eef2ff;border-color:#ccd6f6}.ddsum .p.phep b{color:#4f5fc4}
.ddsum .p.done{background:var(--emerald-soft);border-color:#c4d8f5}.ddsum .p.done b{color:var(--emerald)}
/* hàng điểm danh: hover nổi khối */
.ddgrid>.ddrow:not(.ddh){border-radius:9px;transition:background .12s}
.ddgrid>.ddrow:not(.ddh):hover{background:var(--soft)}
/* nút điểm danh học sinh — 4 trạng thái: Có / Muộn / Phép / Vắng */
.attseg{display:inline-flex;gap:6px;flex:none}
.attseg button{min-width:54px;padding:8px 4px;font-size:.76rem;font-weight:800;border-radius:10px;border:1.6px solid;background:#fff;transition:.12s}
.attseg button[data-v=co]{color:#16a34a;border-color:#bbf7d0}
.attseg button[data-v=muon]{color:var(--amber);border-color:#f0d79a}
.attseg button[data-v=phep]{color:#4f5fc4;border-color:#ccd6f6}
.attseg button[data-v=vang]{color:var(--rose);border-color:#f2bcbf}
.attseg button:hover{filter:brightness(.98);transform:translateY(-1px)}
.attseg button.on[data-v=co]{background:#16a34a;border-color:#16a34a;color:#fff;box-shadow:0 3px 9px rgba(22,163,74,.30)}
.attseg button.on[data-v=muon]{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 3px 9px rgba(201,132,16,.30)}
.attseg button.on[data-v=phep]{background:#4f5fc4;border-color:#4f5fc4;color:#fff;box-shadow:0 3px 9px rgba(79,95,196,.30)}
.attseg button.on[data-v=vang]{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 3px 9px rgba(224,75,82,.30)}
@media(max-width:400px){.attseg button{min-width:46px;padding:8px 2px;font-size:.72rem}}
@media(max-width:520px){.ddrow{flex-wrap:wrap}.ddrow .seg,.ddrow .attseg{margin-left:34px}}

/* ===== LỊCH DẠY THEO CA ===== */
.calist{display:grid;gap:8px}
.carow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.6px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:.14s}
.carow:hover{border-color:var(--brand-soft);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.carow.on{border-color:var(--brand);background:var(--brand-soft)}
.carow .cabad{flex:none;width:44px;height:44px;border-radius:12px;background:var(--navy-900);background-image:var(--dots);background-size:9px 9px;color:#fff;display:grid;place-items:center;font-weight:900;font-size:.9rem;line-height:1}
.carow .cainf{flex:1;min-width:0}
.carow .cainf b{display:block;font-size:.92rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carow .cainf small{display:block;color:var(--muted);font-size:.75rem;font-weight:600}
.carow .cast{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.cagio{font-size:.72rem;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:2px 7px;white-space:nowrap}
.caphong{font-size:.7rem;font-weight:800;color:var(--sky);background:var(--sky-soft);border-radius:8px;padding:2px 7px;white-space:nowrap}
.cangoai{font-size:.7rem;font-weight:800;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:2px 7px;white-space:nowrap}
/* lưới tích chọn Thứ × Ca khi khai lịch cho 1 lớp */
.lgrid{width:100%;border-collapse:collapse;font-size:.8rem}
.lgrid th,.lgrid td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.lgrid th{background:var(--soft);font-weight:800;font-size:.72rem;color:var(--muted)}
.lgrid th.calbl{text-align:left;padding-left:8px;min-width:104px}
.lgrid td.calbl{text-align:left;padding-left:8px;font-weight:800;font-size:.76rem}
.lgrid td.calbl small{display:block;font-weight:600;color:var(--muted);font-size:.68rem}
.lgrid td label{display:block;cursor:pointer;padding:5px 0;border-radius:7px}
/* sửa giờ ca ngay trong bảng tích lịch */
.cagio-in{display:flex;align-items:center;gap:3px;margin-top:3px}
.cagio-in input{width:52px;padding:3px 4px;border:1px solid var(--line);border-radius:6px;font-size:.72rem;font-weight:700;text-align:center;font-family:inherit}
.cagio-in input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.cagio-in span{font-size:.7rem;color:var(--muted)}
.lgrid td:has(input:checked){background:var(--brand-soft)}
.lgrid input{width:17px;height:17px;accent-color:var(--brand);cursor:pointer}
/* danh sách "Các buổi đã chọn" — mỗi buổi một giáo viên + một phòng riêng */
.buoiList{display:grid;gap:7px;margin-top:6px;max-height:34vh;overflow:auto;padding-right:2px}
.buoiRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.buoiKhi{flex:none;min-width:112px}
.buoiKhi b{display:block;font-size:.83rem;font-weight:800}
.buoiKhi small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.buoiRow .buoiGv{flex:2;min-width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:.83rem;font-weight:700;background:#fff}
.buoiRow .buoiPh{flex:1;min-width:96px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:.83rem;font-weight:700}
@media(max-width:520px){.buoiKhi{min-width:100%}.buoiRow .buoiGv,.buoiRow .buoiPh{min-width:0}}
/* thời khóa biểu cả tuần của cơ sở */
.tkb{width:100%;border-collapse:collapse;font-size:.76rem}
.tkb th,.tkb td{border:1px solid var(--line);padding:5px 6px;vertical-align:top}
.tkb th{background:var(--soft);font-weight:800;font-size:.7rem;color:var(--muted);text-align:center;white-space:nowrap}
.tkb th.cah{text-align:left;min-width:96px}
.tkb td.cah{background:#fafcff;font-weight:800;white-space:nowrap}
.tkb td.cah small{display:block;font-weight:600;color:var(--muted);font-size:.68rem}
.tkb .tkitem{background:var(--soft);border-left:3px solid var(--brand);border-radius:6px;padding:3px 6px;margin-bottom:4px}
.tkb .tkitem:last-child{margin-bottom:0}
.tkb .tkitem b{display:block;font-size:.76rem;font-weight:800}
.tkb .tkitem small{display:block;color:var(--muted);font-size:.68rem;font-weight:600}
.tkb .tkitem.dup{border-left-color:var(--rose);background:var(--rose-soft)}
.cs-chinh{display:inline-block;font-size:.66rem;font-weight:800;color:#a06a00;background:#fdf0d0;
  border:1px solid #f0d79a;border-radius:99px;padding:1px 8px;margin-left:7px;vertical-align:middle;white-space:nowrap}
.lwarn{background:#fffaf0;border:1.5px solid #f0d79a;border-radius:14px;padding:13px 15px;font-size:.82rem;font-weight:600;margin-bottom:14px}
.lwarn>b{display:block;margin-bottom:6px;font-size:.95rem;color:#8a5a00}
.lw-giai{font-weight:600;line-height:1.65;color:#6b5322;background:#fff;border:1px solid #f2e3bf;border-radius:11px;padding:10px 12px;margin-bottom:11px}
.lw-gv{background:#fff;border:1px solid #f2e3bf;border-radius:11px;padding:9px 11px;margin-bottom:8px}
.lw-ten{font-weight:800;font-size:.88rem;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.lw-dem{font-size:.7rem;font-weight:800;background:var(--amber-soft);color:var(--amber);padding:2px 9px;border-radius:99px}
.lw-slot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 0;border-top:1px dashed #f0e3c8}
.lw-slot:first-of-type{border-top:0}
.lw-khi{font-size:.78rem;font-weight:700;color:var(--muted);min-width:190px}
.lw-lop{font-size:.78rem;font-weight:800;background:var(--rose-soft);color:var(--rose);border:1.4px solid #f2bcbf;
  border-radius:9px;padding:4px 11px;cursor:pointer;transition:.14s}
.lw-lop:hover{background:var(--rose);color:#fff;border-color:var(--rose)}
.lw-them{font-size:.8rem;font-weight:600;color:var(--muted);padding:2px 2px 0}
@media(max-width:560px){.lw-khi{min-width:100%}}
/* ===== THÔNG BÁO CỦA TRUNG TÂM ===== */
.tbcard{border:1.6px solid var(--line);border-left-width:5px;border-radius:14px;background:#fff;padding:13px 15px;margin-bottom:11px;transition:.14s}
.tbcard:hover{box-shadow:var(--shadow-sm)}
.tbcard.m-thuong{border-left-color:var(--brand)}
.tbcard.m-quan_trong{border-left-color:var(--amber);background:#fffdf7}
.tbcard.m-khan{border-left-color:var(--rose);background:#fff8f8}
.tbcard.chuadoc{box-shadow:0 0 0 2px var(--brand-soft)}
.tbhead{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.tbhead h4{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:150px;line-height:1.35}
.tbnd{font-size:.88rem;line-height:1.6;margin-top:7px;white-space:pre-wrap;word-break:break-word}
.tbmeta{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:9px;font-size:.75rem;color:var(--muted);font-weight:600;align-items:center}
.tbtag{font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap}
.tbtag.m-thuong{background:var(--brand-soft);color:var(--brand)}
.tbtag.m-quan_trong{background:var(--amber-soft);color:var(--amber)}
.tbtag.m-khan{background:var(--rose-soft);color:var(--rose)}
.tbtag.moi{background:#e8f6ee;color:#12a150}
.tbtag.ghim{background:var(--violet-soft);color:var(--violet)}
.tbtag.het{background:#eef1f6;color:#7a8699}
/* băng thông báo nổi bật ở đầu trang Điểm danh / Bảng điều hành */
.tbbar{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:14px;margin-bottom:14px;
  background:var(--navy-900);background-image:var(--dots);background-size:9px 9px;color:#fff;cursor:pointer}
.tbbar.m-khan{background:#8d2b31;background-image:var(--dots)}
.tbbar.m-quan_trong{background:#8a5a00;background-image:var(--dots)}
.tbbar .tbb-ic{font-size:1.25rem;line-height:1.2;flex:none}
.tbbar b{display:block;font-size:.94rem;font-weight:800}
.tbbar small{display:block;font-size:.78rem;opacity:.85;margin-top:2px}
.tbbar .tbb-go{flex:none;font-size:.75rem;font-weight:800;background:rgba(255,255,255,.18);padding:5px 11px;border-radius:99px;white-space:nowrap}
/* cột hôm nay trên lưới lịch tuần */
.tkb th.homnay{background:var(--brand);color:#fff}
.tkb td.homnay{background:#f3f7ff}
.tkb td.cah.homnay{background:#f3f7ff}

/* bảng điểm danh in giấy A4 DỌC — bề rộng lấy theo .vpaper (186mm vùng in) */
.ddtbl{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;margin-top:8px}
.ddtbl th,.ddtbl td{border:1px solid #333;padding:5px 6px;overflow-wrap:break-word;word-break:break-word}
.ddtbl th{background:#e8eefa;font-weight:700;text-align:center;font-size:12px}
.ddtbl td.c{text-align:center}
.ddmeta{display:flex;flex-wrap:wrap;gap:4px 26px;font-size:13px;margin-top:6px}
@media print{
  .voucher.dd{padding:0}
  .ddtbl{font-size:11.5px}
  .ddtbl thead{display:table-header-group}
  .ddtbl tr{page-break-inside:avoid}
}

/* ===== SỔ QUỸ THU CHI ===== */
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn-thu{background:var(--emerald-soft);color:var(--emerald)}
.btn-thu:hover{background:#cdeede}
.btn-chi{background:var(--rose-soft);color:var(--rose)}
.btn-chi:hover{background:#fbdada}
.btn-xls{background:#1d6f42;color:#fff}
.btn-xls:hover{background:#175a36}
.bg-rose{background:var(--rose-soft);color:var(--rose)}
td.thu{color:var(--emerald);font-weight:800}
td.chi{color:var(--rose);font-weight:800}

/* ===== PHIẾU THU/CHI ===== */
.voucher{position:fixed;inset:0;z-index:80;background:rgba(9,32,29,.6);backdrop-filter:blur(3px);display:none;overflow-y:auto;padding:18px}
.voucher.on{display:block}
.vbar{width:210mm;max-width:100%;margin:0 auto 12px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.voucher.sq .vbar{width:297mm}     /* thanh nút rộng bằng tờ giấy để nút nằm đúng mép phải */
/* ===== KHỔ GIẤY A4 THẬT =====
   Trang xem trước đo bằng MILIMÉT đúng bằng khổ giấy, không dùng pixel nữa —
   nhìn trên màn hình thế nào thì in ra đúng thế ấy.
   Dọc  : giấy 210mm, lề 12mm  → vùng in 186mm
   Ngang: giấy 297mm, lề 10mm  → vùng in 277mm
   Khi in, phần lề do @page lo nên trang xem trước bỏ padding đi. */
.vpaper{box-sizing:content-box;width:186mm;margin:0 auto;background:#fff;border-radius:6px;padding:12mm;font-family:"Times New Roman",Georgia,serif;color:#000;line-height:1.55;box-shadow:0 30px 70px -30px #000}
.vtop{display:flex;justify-content:space-between;gap:16px;font-size:.9rem}
.vtop b{font-size:.95rem}
.vmau{text-align:right;font-size:.82rem}
.vmau i{font-size:.74rem}
.vtitle{text-align:center;font-size:1.7rem;font-weight:700;margin:14px 0 2px;letter-spacing:.02em}
.vdate{text-align:center;font-style:italic;font-size:.9rem}
.vno{text-align:center;font-size:.9rem;margin-bottom:14px}
.vfields{width:100%;border-collapse:collapse;font-size:.98rem}
.vfields td{padding:5px 0;vertical-align:top}
.vfields td:first-child{width:170px;white-space:nowrap}
.vsign{display:flex;justify-content:space-between;gap:6px;margin-top:26px;text-align:center;font-size:.86rem}
.vsign>div{flex:1}
.vsign b{display:block;font-size:.9rem}
.vsign small{display:block;font-style:italic;color:#333;font-size:.76rem;margin-top:2px}
.vsign::before{content:"";}
/* Sổ quỹ & lịch tuần in trên giấy A4 NẰM NGANG — bảng kẻ ô, chữ nhỏ hơn phiếu thu/chi */
.sqpaper{width:277mm;padding:10mm}
/* table-layout:fixed — BẮT BUỘC: nếu không, bảng tự nong rộng theo nội dung
   và cột cuối (Người lập / Chủ nhật) bị tràn ra ngoài mép giấy. */
.sqtbl{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.sqtbl th,.sqtbl td{border:1px solid #333;padding:4px 6px;vertical-align:middle;overflow-wrap:break-word;word-break:break-word}
.sqtbl th{background:#e8eefa;font-weight:700;text-align:center;font-size:12px}
.sqtbl td.c{text-align:center}
.sqtbl td.r{text-align:right;white-space:nowrap}
.sqtbl tr.sum td{background:#f2f5fb;font-weight:700}
.sqtbl tbody tr:nth-child(even) td{background:#fbfcfe}
.sqtbl tbody tr.sum:nth-child(even) td{background:#f2f5fb}
/* ===== KẺ Ô CHO MỌI BẢNG IN — cách vẽ CHỐNG MẤT NÉT =====
   ⚠ THỦ PHẠM làm bản in mất nét viền: ba dòng CSS chung của app ở phần "table"
   phía trên — thead th:last-child{border-right:0}, tbody td:last-child{border-right:0},
   tbody tr:last-child td{border-bottom:0} — cố tình bỏ nét cột cuối và dòng cuối cho
   bảng trên màn hình. Chúng "nặng ký" hơn (specificity cao hơn) mấy dòng .sqtbl/.ddtbl
   viết gọn, nên nuốt luôn nét viền phải và nét đáy của phiếu in.
   → Vì vậy các dòng dưới đây PHẢI viết đủ dài (table + thead/tbody + tr + th/td)
   để thắng. ĐỪNG rút gọn thành .sqtbl th,.sqtbl td — sẽ mất nét trở lại.
   Cách kẻ: mỗi ô tự vẽ nét PHẢI + DƯỚI, ô đầu dòng vẽ thêm nét TRÁI, ô tiêu đề vẽ
   thêm nét TRÊN → mỗi đường chỉ vẽ đúng một lần, trang nào cũng đủ khung kể cả khi
   bảng dài nhiều trang. Độ dày tính bằng pt để không bị làm tròn về 0 khi in. */
.sqtbl,.ddtbl{border-collapse:separate;border-spacing:0}
table.sqtbl thead tr th,table.sqtbl tbody tr td,table.ddtbl thead tr th,table.ddtbl tbody tr td{border:0;border-right:.8pt solid #000;border-bottom:.8pt solid #000}
table.sqtbl tr th:first-child,table.sqtbl tr td:first-child,table.ddtbl tr th:first-child,table.ddtbl tr td:first-child{border-left:.8pt solid #000}
table.sqtbl thead tr th,table.ddtbl thead tr th{border-top:.8pt solid #000}
/* Dòng đệm chừa lề trên/dưới khi bảng dài sang trang mới — xem chú thích ở khối @media print.
   Trên màn hình ẩn đi, chỉ hiện khi in. */
tr.pgpad,tfoot.pgpad{display:none}
/* Lịch dạy theo ca in giấy A4 DỌC (xem chú thích ở khối @media print bên dưới) */
.tkpaper .sqtbl{font-size:11px}
.tkpaper .sqtbl th{font-size:10.5px}
/* ===== BẢN IN NHIỀU TỜ =====
   Danh sách giáo viên / lớp / học sinh in TÁCH theo từng cơ sở (hoặc từng lớp):
   mỗi cơ sở là MỘT TỜ riêng để ký và lưu vào hồ sơ của cơ sở đó. Trên màn hình các
   tờ xếp dọc cách nhau; khi in, mỗi tờ bắt đầu ở một trang mới. */
.vpaper+.vpaper{margin-top:22px}
/* Nhắc chọn khổ giấy ngay trên thanh nút — chỉ hiện trên màn hình, không in ra */
.vhint{margin-right:auto;align-self:center;font-size:.78rem;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:5px 11px;border-radius:99px}
.vhint b{color:#fff}
@media(max-width:1140px){.voucher{overflow:auto}}   /* màn hình hẹp: cuộn ngang xem trang giấy, bản in không đổi */
/* ===== LỀ GIẤY = 0 — ĐỂ BỎ ĐẦU TRANG / CHÂN TRANG CỦA TRÌNH DUYỆT =====
   Trình duyệt in ngày giờ, tên trang, số trang và dòng địa chỉ web
   (https://...) vào PHẦN LỀ của tờ giấy. Đặt lề = 0 thì không còn chỗ cho
   những dòng đó nữa → bản in sạch, không cần người dùng phải nhớ đi bỏ tick
   "Headers and footers" trong hộp thoại in.
   Lề thật của tờ giấy chuyển sang cho padding của .vpaper lo, nên nhìn y hệt cũ.
   Bề rộng để hụt 1–2mm so với khổ giấy để không sinh trang trắng do làm tròn. */
@page vport{size:A4 portrait;margin:0}
@page sqland{size:A4 landscape;margin:0}             /* sổ quỹ & bảng lương in ngang, còn lại in dọc */
@media print{
  body>*{display:none!important}
  #voucher{display:block!important;position:static;background:#fff;padding:0;backdrop-filter:none;overflow:visible}
  .vbar{display:none!important}
  /* Lề = 0 nên trang giấy tự chừa lề bằng padding */
  .vpaper{box-shadow:none;border-radius:0;padding:12mm;width:185mm;page:vport}
  .voucher.sq,.voucher.tk{padding:0}
  .vpaper.sqpaper{width:275mm;padding:10mm;page:sqland}
  .vpaper+.vpaper{margin-top:0;page-break-before:always}   /* mỗi tờ (cơ sở/lớp) một trang riêng */
  .sqtbl{font-size:10.5px}
  /* LỊCH DẠY THEO CA in giấy A4 DỌC.
     Trước đây in ngang: máy in ảo "Microsoft Print to PDF" luôn đặt giấy DỌC,
     gặp yêu cầu in ngang nó không xoay tờ giấy mà xoay nội dung 90° → file PDF
     tải về bị nằm nghiêng, phải nghiêng đầu mới đọc được. In dọc thì máy in nào,
     điện thoại nào cũng ra đúng chiều. */
  .tkpaper .sqtbl{font-size:9.2px}
  .tkpaper .sqtbl th{font-size:9px}
  .tkpaper .sqtbl th,.tkpaper .sqtbl td{padding:3px 4px}
  .sqtbl thead{display:table-header-group}          /* lặp tiêu đề bảng ở mỗi trang in */
  .sqtbl tr{page-break-inside:avoid}
  /* ===== CHỪA LỀ TRÊN/DƯỚI CHO CÁC TRANG THỨ 2 TRỞ ĐI =====
     Lề giấy đang đặt = 0 nên padding của .vpaper chỉ chừa được lề trên ở trang
     đầu và lề dưới ở trang cuối. Với bảng dài, phần đầu mỗi trang tiếp theo sẽ
     sát mép giấy (máy in thật sẽ cắt mất). Cách chữa: chèn một dòng trống vào
     thead (lặp ở ĐẦU mỗi trang) và một dòng trống vào tfoot (lặp ở CUỐI mỗi
     trang) — hai dòng này chính là lề trên/dưới của từng trang. */
  tr.pgpad{display:table-row}
  tfoot.pgpad{display:table-footer-group}
  /* Phần cuối phiếu (tổng hợp + ngày tháng + chữ ký) đi liền một khối, không bị
     cắt đôi giữa hai trang. padding-top vừa là khoảng cách với bảng ở trên, vừa
     đóng vai lề trên nếu cả khối bị đẩy sang trang mới. */
  .vfoot,.vsign{page-break-inside:avoid}
  .vfoot{padding-top:8mm}
  .vpaper>.vsign{padding-top:8mm}
  tr.pgpad td,tfoot.pgpad td{border:0!important;padding:0!important;background:none!important}
  thead tr.pgpad td{height:9mm}
  tfoot.pgpad td{height:10mm}
  /* In trang Hướng dẫn (body.print-guide): chỉ in phần nội dung */
  body.print-guide #voucher{display:none!important}
  body.print-guide #app{display:block!important}
  body.print-guide .shell{display:block}
  body.print-guide .side,body.print-guide .top,body.print-guide .botnav,body.print-guide .scrim,
  body.print-guide .g-bar,body.print-guide .g-toc{display:none!important}
  body.print-guide .main{padding:0}
  body.print-guide .panel,body.print-guide .g-acc,body.print-guide .g-fstep,body.print-guide .feat{break-inside:avoid;page-break-inside:avoid;box-shadow:none}
  body.print-guide .guide-hero,body.print-guide .rolecard{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* rank list */
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .no{width:26px;height:26px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--muted);flex:none}
.rank .no.top{background:var(--brand);color:#fff}
.rank .rn{flex:1;min-width:0}
.rank .rn b{display:block;font-size:.9rem}
.rank .bar{height:6px;border-radius:99px;background:var(--soft);margin-top:5px;overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--emerald))}
.rank .rv{font-weight:800;font-size:.86rem;color:var(--brand-700);white-space:nowrap}
/* hoạt động gần đây — bố cục theo mảng chủ đề (dashboard) */
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px}
.actcard{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.actcard-h{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:14px 16px;color:#fff}
.actcard-h .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.1rem;flex:none;background:rgba(255,255,255,.24);position:relative;z-index:1}
.actcard-h b{font-size:.94rem;flex:1;min-width:0;color:#fff;position:relative;z-index:1}
.actcard-h .cnt{font-size:.74rem;font-weight:800;color:#fff;background:rgba(255,255,255,.26);padding:2px 11px;border-radius:99px;flex:none;position:relative;z-index:1}

.g-fstep .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;background:var(--brand);color:#fff;font-size:.78rem;font-weight:800;margin-bottom:7px}

.g-acc li{font-size:.85rem;line-height:1.62;color:var(--ink);margin-bottom:6px}
.g-acc li:last-child{margin-bottom:0}
.g-kv{display:grid;gap:0}
.g-kv .r{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.g-kv .r:last-child{border-bottom:0}
.g-kv .k{flex:0 0 190px;font-weight:800;font-size:.85rem;color:var(--brand-700)}
.g-kv .v{flex:1;min-width:200px;font-size:.84rem;color:var(--muted);line-height:1.55}

.g-mrow:last-child{border-bottom:0}

.g-mrow span{display:block;font-size:.81rem;color:var(--muted);line-height:1.5}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}

/* ===== BẢNG ĐIỀU HÀNH ===== */
.hello{background:var(--dots),linear-gradient(120deg,#1f4276,#0b1d3d);background-size:20px 20px,auto;color:#fff;border-radius:var(--radius);padding:18px 21px;margin-bottom:14px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm)}
.hello .hi{flex:1;min-width:0}

.hello .hmiss{display:block;font-size:.64rem;font-weight:800;letter-spacing:.14em;color:#f4c430;margin-bottom:5px}
.hello p{margin:6px 0 0;color:#b9c9e6;font-size:.84rem}
.hello .date{background:rgba(255,255,255,.13);border-radius:13px;padding:9px 15px;text-align:center;flex:none;border:1px solid rgba(255,255,255,.12)}
.hello .date b{display:block;font-size:1.35rem;line-height:1}
.hello .date span{font-size:.66rem;color:#c5d3ec;letter-spacing:.02em}
.simtag{display:inline-flex;align-items:center;gap:5px;font-size:.62rem;font-weight:800;color:var(--amber);background:var(--amber-soft);padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.ringbox{position:relative;width:120px;height:120px;flex:none}
.ringbox .rc{width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*3.6deg),var(--soft) 0)}
.ringbox .rin{position:absolute;inset:13px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.ringbox .rin b{font-size:1.55rem;line-height:1;color:var(--brand-700)}
.ringbox .rin span{font-size:.64rem;color:var(--muted);margin-top:2px}
.finrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.finnums{flex:1;min-width:150px;display:grid;gap:10px}
.finstat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.finstat:last-child{border-bottom:0;padding-bottom:0}
.finstat small{color:var(--muted);font-size:.8rem}
.finstat b{font-size:1.02rem;font-variant-numeric:tabular-nums}
.finstat b.pos{color:var(--brand-700)}.finstat b.neg{color:var(--amber)}
.tday{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tday:last-child{border-bottom:0}
.tday .tm{font-weight:800;font-size:.8rem;color:var(--brand-700);width:48px;flex:none}
.tday .ti{flex:1;min-width:0}
.tday .ti b{display:block;font-size:.9rem;line-height:1.25}
.tday .ti small{color:var(--muted);font-size:.74rem}
.warns{display:grid;gap:9px}
.warnrow{display:flex;gap:10px;align-items:center;background:var(--amber-soft);border:1px solid #f2dca6;border-radius:12px;padding:11px 13px;font-size:.85rem;color:#7a5406;line-height:1.35}
.warnrow.ok{background:var(--brand-soft);border-color:#c3d3ee;color:var(--brand-700)}
.warnrow svg{width:18px;height:18px;flex:none;stroke:currentColor}

/* modal */
.modal{position:fixed;inset:0;background:rgba(9,32,29,.5);backdrop-filter:blur(3px);display:none;place-items:center;padding:20px;z-index:60}
.modal.on{display:grid}
.mcard{width:min(460px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 40px 90px -40px #000;max-height:92vh;display:flex;flex-direction:column}
.mhead{padding:22px 22px 18px;background:var(--dots),linear-gradient(150deg,#17335f,#1f4276);background-size:18px 18px,auto;color:#fff;display:flex;gap:14px;align-items:center}
.mhead .mava{width:56px;height:56px;border-radius:17px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:900;font-size:1.2rem;flex:none}
.mhead h3{margin:0;font-size:1.16rem}
.mhead p{margin:3px 0 0;font-size:.8rem;color:#c9e6e2}
.mbody{padding:18px 22px 22px;overflow-y:auto}
.mrow{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.mrow:last-child{border-bottom:0}
.mrow .mi{width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;flex:none}
.mrow .mi svg{width:17px;height:17px;stroke:var(--brand-600)}
.mrow small{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.mrow b{font-weight:700;font-size:.93rem}
.mrow a{color:var(--brand-600);font-weight:800}
.mclose{margin-left:auto;color:#fff;padding:6px;border-radius:9px;background:rgba(255,255,255,.12)}

.botnav{display:none}

@media(max-width:920px){

  .side.open{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(9,32,29,.5);z-index:65}
  .scrim.on{display:block}
  .burger{display:flex}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}

  .ttl{flex:1 1 auto;min-width:0}
  .ttl h1{font-size:1.12rem}
  .ttl p{white-space:normal}
  .topact{margin-left:0;width:100%}
  .scope{width:100%}
  .scope small{white-space:nowrap}
  .scope select{max-width:none;flex:1}
  /* Thanh dưới cùng — giáo viên dùng hằng ngày nên phải NHÌN LÀ THẤY:
     mục đang mở có nền navy bo tròn + chữ trắng, icon to hơn ~10%, chữ đậm hơn. */
  .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;
    border-top:1px solid var(--line);padding:6px 5px calc(6px + env(safe-area-inset-bottom));
    justify-content:space-around;box-shadow:0 -12px 34px -18px rgba(9,42,38,.55)}
  /* Mỗi nút một màu pastel riêng, HIỆN SẴN ở mọi nút (không chờ bấm mới thấy).
     --c = màu chữ/icon · --cs = nền chip icon · --cb = nền nút khi đang mở (rất nhạt). */
  .botnav button{display:grid;justify-items:center;gap:3px;font-size:.66rem;font-weight:700;
    padding:6px 4px 5px;border-radius:14px;flex:1;min-width:0;transition:.16s;
    --c:#6b7690;--cs:#eef1f6;--cb:#f7f8fb;color:#7a8496}
  .botnav button.c-navy  {--c:#3f62b3;--cs:#e9eefb;--cb:#f5f8fd}
  .botnav button.c-green {--c:#2f9e63;--cs:#e7f5ed;--cb:#f4faf7}
  .botnav button.c-sky   {--c:#2d86b8;--cs:#e6f2f9;--cb:#f4f9fc}
  .botnav button.c-amber {--c:#c3891f;--cs:#fbf1de;--cb:#fdf8f0}
  .botnav button.c-violet{--c:#7c5cd6;--cs:#efeafc;--cb:#f8f6fd}
  .botnav button.c-rose  {--c:#d4626b;--cs:#fbeaec;--cb:#fdf5f6}
  .botnav button.c-slate {--c:#6b7690;--cs:#eef1f6;--cb:#f7f8fb}
  .botnav button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .botnav button .bi{position:relative;display:grid;place-items:center;width:36px;height:29px;border-radius:11px;
    background:var(--cs);transition:.16s}
  .botnav button svg{width:23px;height:23px;stroke:var(--c);opacity:.82;transition:.16s}
  .botnav button:active{transform:scale(.95)}
  /* Đang mở: đậm màu của chính nút đó, không dùng khối navy đặc */
  .botnav button.on{color:var(--c);font-weight:800;background:var(--cb)}
  .botnav button.on svg{opacity:1}
  .botnav button.on .bi{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}
  /* chấm số tin chưa đọc / việc cần xử lý */
  .botnav .bdot{position:absolute;top:-4px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;
    background:var(--rose);color:#fff;font-style:normal;font-size:.6rem;font-weight:900;line-height:17px;text-align:center;
    box-shadow:0 0 0 2px #fff}
}
@media(max-width:400px){
  .botnav button{font-size:.6rem;padding:6px 2px 5px}
  .botnav button svg{width:21px;height:21px}
  .botnav button .bi{width:32px;height:27px}
}
@media(max-width:480px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi b{font-size:1.4rem}
  .fsel{max-width:100%;flex:1}
}

<script>
/* ============ UTIL ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ===== SUPABASE (kho dữ liệu online) ===== */
const SB_URL='https://hdvtlbeozyumvnhgejxp.supabase.co';
const SB_KEY='sb_publishable_eGYgGZpxRRdIgLeO6_S_JQ_N7rHsINZ';
const SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'avatar-auth'}});
/* ánh xạ giữa cột CSDL (chữ_gạch) và tên dùng trong app (chữHoa) */
const hvFromDb=r=>{
  const hp=Number(r.hoc_phi)||0;
  // Số tiền đã đóng thực tế. HS cũ (trước khi có cột so_tien_dong): da_dong=true coi như đã đóng đủ = học phí.
  const sd=r.so_tien_dong!=null?(Number(r.so_tien_dong)||0):(r.da_dong?hp:0);
  return {id:r.id,ten:r.ten,ns:r.ns||'',ph:r.ph||'',sdt:r.sdt||'',hocPhi:hp,hocPhiChot:(r.hoc_phi_chot!=null?(Number(r.hoc_phi_chot)||0):null),soTienDong:sd,daDong:sd>0,ngayDong:r.ngay_dong||null,ngayNhapHoc:r.ngay_nhap_hoc||null,ngayThoiHoc:r.ngay_thoi_hoc||null,lyDo:r.ly_do_thoi_hoc||'',lopId:r.lop_id,coSoId:r.coso_id,mau:!!r.mau,createdAt:r.created_at||null};
};
/* Học sinh đang học = chưa có ngày thôi học */
const hvActive=h=>!h.ngayThoiHoc;
/* ===== HỌC PHÍ PHẢI THU CỦA MỘT LƯỢT GHI DANH =====
   Dùng THỐNG NHẤT cho mọi bảng tổng hợp (cơ sở, lớp, trang Học sinh, bản in):
   · đang học      → học phí cả khóa;
   · đã thôi học   → số QUYẾT TOÁN chốt lúc cho nghỉ (cột hoc_phi_chot).
                     Chưa chốt thì lấy đúng số đã đóng — "học tới đâu thu tới đó".
   Nhờ vậy: lớp không bị treo nợ ảo phần em chưa học, mà tiền em ĐÃ NỘP vẫn hiện
   nguyên trong bảng phí (trước đây em nghỉ là khoản thu bị ẩn mất, lệch sổ quỹ). */
const hpPhaiThu=h=>hvActive(h)?(h.hocPhi||0)
  :(h.hocPhiChot!=null?(Number(h.hocPhiChot)||0):(Number(h.soTienDong)||0));
const hvToDb=o=>({ten:o.ten,ns:o.ns||'',ph:o.ph||'',sdt:o.sdt||'',hoc_phi:o.hocPhi||0,da_dong:!!o.daDong,lop_id:o.lopId,coso_id:o.coSoId,mau:!!o.mau});
const gdFromDb=r=>({id:r.id,ngay:r.ngay,loai:r.loai,hangMuc:r.hang_muc,coSoId:r.coso_id,soTien:Number(r.so_tien)||0,
  noiDung:r.noi_dung||'',nguoiLap:r.nguoi_lap||'',hvId:(r.hv_id!=null?r.hv_id:null),createdAt:r.created_at||null,
  soPhieu:r.so_phieu||'',nguoiNop:r.nguoi_nop||'',hinhThuc:r.hinh_thuc||'tien_mat',
  gvId:(r.gv_id!=null?r.gv_id:null),kyLuong:r.ky_luong||''});
const gdToDb=o=>({ngay:o.ngay,loai:o.loai,hang_muc:o.hangMuc,coso_id:o.coSoId,so_tien:o.soTien,noi_dung:o.noiDung||'',nguoi_lap:o.nguoiLap||''});
/* Các cột thêm ở Giai đoạn 5 — tách riêng để còn chạy được khi chưa chạy SQL */
const gdToDb5=o=>({nguoi_nop:o.nguoiNop||'',hinh_thuc:o.hinhThuc||'tien_mat',
  ...(o.gvId!=null?{gv_id:o.gvId}:{}), ...(o.kyLuong?{ky_luong:o.kyLuong}:{})});
let sqLive5=true;      // false khi chưa chạy sql-giai-doan-5-thu-chi.sql (thiếu cột mới)
/* Thêm 1 phiếu vào sổ quỹ. Tự thử cột mới trước, thiếu cột thì lùi về bản tối thiểu
   và báo rõ cho người dùng biết cần chạy SQL — không "bỏ qua êm" như trước. */
const thieuCot=e=>/column .* does not exist|schema cache/i.test((e&&e.message)||'');
/* Phiên đăng nhập để lâu (nhất là trên điện thoại: khóa màn hình, tab ngủ) có thể hết hạn
   mà giao diện vẫn hiện đủ số liệu cũ → mọi lệnh GHI bị máy chủ từ chối bằng lỗi "khóa hàng".
   Hàm này xin cấp lại phiên; trả về true nếu lấy lại được để lệnh ghi thử lại luôn,
   người dùng khỏi phải nhập lại từ đầu. */
async function lamMoiPhien(){
  try{
    const {data}=await SB.auth.getSession();
    if(data&&data.session) return false;             // vẫn còn phiên → không phải nguyên nhân này
    const r=await SB.auth.refreshSession();
    return !!(r&&r.data&&r.data.session);
  }catch(e){ return false; }
}
async function insertPhieu(rec){
  const hv=(rec.hvId!=null?{hv_id:rec.hvId}:{});
  const ghi=()=>SB.from('so_quy').insert({...gdToDb(rec),...gdToDb5(rec),...hv}).select().single();
  if(sqLive5){
    let r=await ghi();
    if(!r.error) return r;
    if(laLoiQuyen(r.error) && await lamMoiPhien()) r=await ghi();   // hết hạn phiên → lấy lại rồi ghi lại
    if(!r.error) return r;
    if(!thieuCot(r.error)) return r;                 // lỗi thật (RLS, kỳ đã chốt…) → trả về nguyên trạng
    sqLive5=false;
  }
  const r2=await SB.from('so_quy').insert({...gdToDb(rec),...hv}).select().single();
  if(!r2.error || !thieuCot(r2.error) || !rec.hvId) return r2;
  return await SB.from('so_quy').insert(gdToDb(rec)).select().single();   // chưa chạy cả SQL đồng bộ học phí
}
/* Số phiếu hiển thị: ưu tiên số chuẩn sinh từ CSDL (PT-02-2607-001),
   chưa chạy SQL Giai đoạn 5 thì lùi về mã cũ theo id (PT0001). */
const soPhieu=g=>g&&g.soPhieu?g.soPhieu:((g&&g.loai==='thu'?'PT':'PC')+String((g&&g.id)||0).padStart(4,'0'));
const HT_LABEL={tien_mat:'Tiền mặt',chuyen_khoan:'Chuyển khoản'};
/* ---- Học phí: mỗi ĐỢT đóng là một phiếu thu riêng (giữ đầy đủ lịch sử) ---- */
const hpPhieuCua=hvId=>OPS.gd.filter(g=>g.hvId===hvId&&g.loai==='thu').sort((a,b)=>a.ngay.localeCompare(b.ngay)||a.id-b.id);
const hpDaDong=hvId=>hpPhieuCua(hvId).reduce((s,g)=>s+g.soTien,0);
/* Số đã đóng dùng để HIỂN THỊ: có phiếu thì lấy tổng phiếu; chưa có phiếu nào
   (dữ liệu cũ nhập tay trước khi tách theo đợt) thì lấy số lưu ở hồ sơ. */
const hpDaHT=h=>{const ps=hpPhieuCua(h.id); return ps.length?ps.reduce((s,g)=>s+g.soTien,0):(Number(h.soTienDong)||0);};
/* Ghi nhận một đợt đóng học phí: tạo phiếu thu + cập nhật lại tổng đã đóng của HS */
async function themDotDong(h,{soTien,ngay,nguoiNop,hinhThuc}){
  const daCo=hpDaDong(h.id), conLai=Math.max(0,(h.hocPhi||0)-daCo);
  const sd=Math.max(0,Number(soTien)||0);
  if(sd<=0) return {error:'Số tiền phải lớn hơn 0.'};
  const noi='Học phí: '+h.ten+' — '+lopName(h.lopId)
    + (h.hocPhi?(' (đợt này '+fmtVND(sd)+', lũy kế '+fmtVND(daCo+sd)+'/'+fmtVND(h.hocPhi)
      + ((h.hocPhi-daCo-sd)>0?', còn '+fmtVND(h.hocPhi-daCo-sd):', đã đủ')+')'):'');
  const rec={ngay:ngay||todayISO(),loai:'thu',hangMuc:'Học phí',coSoId:h.coSoId,soTien:sd,noiDung:noi,
    nguoiLap:USER.role==='admin'?'Quản trị':csName(USER.coSoId),nguoiNop:nguoiNop||h.ph||'',hinhThuc:hinhThuc||'tien_mat',hvId:h.id};
  const {data,error}=await insertPhieu(rec);
  if(error) return {error:error.message,loi:error};      // giữ cả lỗi gốc để còn chẩn đoán nguyên nhân
  OPS.gd.push(gdFromDb(data));
  await capNhatTongDong(h);
  return {data};
}
/* Tiền đã HOÀN lại cho một em (thôi học mà đóng thừa) — dùng ở hồ sơ, bản in */
const hpHoanCua=hvId=>OPS.gd.filter(g=>g.hvId===hvId&&g.loai==='chi'&&/hoàn/i.test(g.hangMuc||'')).reduce((s,g)=>s+g.soTien,0);
/* Hoàn lại phần học phí đóng thừa khi thôi học: lập phiếu CHI gắn đúng em.
   KHÔNG xóa phiếu thu cũ (xóa là mất chứng từ) — sổ quỹ giữ đủ cả hai chiều,
   bảng học phí tự lấy "thực thu = thu − hoàn" nên vẫn khớp. */
async function hoanHocPhi(h,soTien,xong){
  const sd=Math.max(0,Number(soTien)||0); if(sd<=0)return;
  if(!await avaConfirm('Lập phiếu chi hoàn '+fmtVND(sd)+' cho phụ huynh em '+h.ten+'?\n\nPhiếu chi vào sổ quỹ hôm nay, hạng mục "Hoàn học phí".',{okText:'Lập phiếu chi'}))return;
  const ngay=todayISO();
  if(await chanKyChot(h.coSoId,ngay,'hoàn học phí'))return;
  const rec={ngay,loai:'chi',hangMuc:'Hoàn học phí',coSoId:h.coSoId,soTien:sd,
    noiDung:'Hoàn học phí thôi học: '+h.ten+' — '+lopName(h.lopId),
    nguoiLap:USER.role==='admin'?'Quản trị':csName(USER.coSoId),nguoiNop:h.ph||'',hinhThuc:'tien_mat',hvId:h.id};
  const {data,error}=await insertPhieu(rec);
  if(error){ await baoLoiGhiSo(error,h.coSoId,ngay,'hoàn học phí'); return; }
  const g=gdFromDb(data); OPS.gd.push(g);
  avaAlert('Đã lập phiếu chi hoàn '+fmtVND(sd)+' — phiếu '+soPhieu(g)+'.');
  if(xong)xong();
}
/* Tổng đã đóng của học sinh = tổng các phiếu thu học phí của em đó */
async function capNhatTongDong(h){
  const tong=hpDaDong(h.id);
  const ps=hpPhieuCua(h.id);
  const ngayCuoi=ps.length?ps[ps.length-1].ngay:null;
  h.soTienDong=tong; h.daDong=tong>0; h.ngayDong=ngayCuoi;
  await SB.from('hoc_vien').update({da_dong:tong>0}).eq('id',h.id);
  await SB.from('hoc_vien').update({so_tien_dong:tong,ngay_dong:ngayCuoi}).eq('id',h.id);
}
/* Giáo viên & Lớp học sống (Giai đoạn 2) */
const gvFromDb=r=>({id:r.id,ten:r.ten,ns:r.ns||'',td:r.td||'',dc:r.dc||'',sdt:r.sdt||'',mon:r.mon||'VH',coSoId:r.coso_id,ngayHd:r.ngay_hd||null});
const gvToDb=o=>({ten:o.ten,ns:o.ns||'',td:o.td||'',dc:o.dc||'',sdt:o.sdt||'',mon:o.mon||'VH',coso_id:o.coSoId});
const lopFromDb=r=>({id:r.id,lop:r.lop,gv:r.gv||'',siso:Number(r.siso)||0,mon:r.mon||'VH',coSoId:r.coso_id,gvId:(r.gv_id!=null?r.gv_id:null)});
const lopToDb=o=>({lop:o.lop,gv:o.gv||'',siso:Number(o.siso)||0,mon:o.mon||'VH',coso_id:o.coSoId});
let gvLive=false;   // true khi đã chạy SQL Giai đoạn 2 (GV/Lớp lấy từ Supabase)
let caLive=false;   // true khi đã chạy SQL Giai đoạn 6 (khung ca + lịch lớp)
let ccLive=false;   // true khi đã chạy SQL Giai đoạn 7 (chấm công có cột gv_id — ai thực dạy)
let csLive=false;   // true khi đã chạy SQL Giai đoạn 7 (danh sách cơ sở lấy từ Supabase)
let tbLive=false;   // true khi đã chạy SQL Giai đoạn 8 (bảng thông báo)
let lichGvLive=true; // false khi CSDL chưa có cột lich_lop.gv_id (Giai đoạn 9)
/* ===== TẢI DỮ LIỆU LỚN AN TOÀN =====
   Supabase cắt mỗi truy vấn ở ~1000 dòng. Với 341 lớp (vài nghìn học sinh) mà
   không phân trang thì app hiện THIẾU dữ liệu mà KHÔNG báo lỗi. fetchAll() tải
   theo lô cho tới hết. Truyền hàm tạo query (builder dùng 1 lần là hỏng). */
const PAGE_SIZE=1000;
async function fetchAll(build){
  const out=[]; let buoc=PAGE_SIZE;
  for(let from=0; from<400000; from+=buoc){
    const {data,error}=await build().range(from,from+PAGE_SIZE-1);
    if(error)return {data:null,error};
    const lo=data||[]; out.push(...lo);
    // Lô đầu cho biết server thật sự trả tối đa bao nhiêu dòng (cấu hình "Max rows" của Supabase

/* Kiểm tra ngày sinh: để trống = hợp lệ; nếu có phải đúng dd/mm/yyyy, năm ≤ hiện tại */
function isValidDob(s){
  s=String(s||'').trim(); if(!s)return true;
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s); if(!m)return false;
  const d=+m[1],mo=+m[2],y=+m[3],now=new Date().getFullYear();
  if(mo<1||mo>12||y<1900||y>now)return false;
  const leap=(y%4===0&&y%100!==0)||y%400===0;
  const dim=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][mo-1];
  return d>=1&&d<=dim;
}

function avaDialog({title,message,okText,cancelText,danger}){
  return new Promise(resolve=>{
    const ov=document.createElement('div'); ov.className='ava-dlg-ov';
    const body=esc(String(message==null?'':message)).replace(/\n/g,'<br>');
    ov.innerHTML=`<div class="ava-dlg" role="dialog" aria-modal="true">
      <div class="ava-dlg-h"><svg viewBox="0 0 24 24">${IC_BELL}</svg><span>${esc(title||'AVATAR thông báo')}</span></div>
      <div class="ava-dlg-b">${body}</div>
      <div class="ava-dlg-f">
        ${cancelText!==null?`<button class="ava-dlg-btn ghost" data-r="0">${esc(cancelText||'Hủy')}</button>`:''}
        <button class="ava-dlg-btn ${danger?'danger':'primary'}" data-r="1">${esc(okText||'OK')}</button>
      </div></div>`;
    document.body.appendChild(ov);
    const done=v=>{ov.remove();document.removeEventListener('keydown',onKey);resolve(v);};
    const onKey=e=>{ if(e.key==='Escape'&&cancelText!==null)done(false); else if(e.key==='Enter')done(true); };
    ov.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>done(b.dataset.r==='1'));
    ov.addEventListener('click',e=>{ if(e.target===ov&&cancelText!==null)done(false); });
    document.addEventListener('keydown',onKey);
    const ok=ov.querySelector('[data-r="1"]'); if(ok)ok.focus();
  });
}

    cum.forEach(g=>{const ma=k+'#'+(++n); g.ids.forEach(id=>map.set(id,ma));});
  }
  return map;
}

const hsActiveCount=ids=>demHS(OPS.hv.filter(h=>ids.includes(h.coSoId)&&hvActive(h)));
function csStat(id){

/* ===== SỐ LIỆU THẬT (từ Supabase) ===== */
/* Học phí theo phạm vi cơ sở: dự thu = Σ học phí mọi HS; đã thu = HS đã đóng */
function hpStat(ids){
  // Gom phiếu thu MỘT LẦN (đừng quét lại theo từng em → chậm khi sổ quỹ nhiều phiếu).
  // le = phiếu thu học phí lập THẲNG trong Sổ quỹ, chưa gắn học sinh nào.
  const theoHS={}; let le=0,nLe=0;
  OPS.gd.forEach(g=>{ if(g.loai!=='thu'||!ids.includes(g.coSoId))return;
    if(g.hvId!=null){ theoHS[g.hvId]=(theoHS[g.hvId]||0)+(g.soTien||0); return; }
    if(/học phí/i.test(g.hangMuc||'')){ le+=g.soTien||0; nLe++; } });
  // Tiền đã HOÀN lại cho em (thôi học mà đóng thừa) → khoản thu thực của em phải trừ đi
  const hoanHS={};
  OPS.gd.forEach(g=>{ if(g.loai==='chi'&&g.hvId!=null&&ids.includes(g.coSoId)&&/hoàn/i.test(g.hangMuc||''))
    hoanHS[g.hvId]=(hoanHS[g.hvId]||0)+(g.soTien||0); });
  let du=0,da=0,n=0,nDa=0,nNghi=0,daNghi=0;
  OPS.hv.forEach(h=>{ if(!ids.includes(h.coSoId))return;
    const act=hvActive(h);
    // Có phiếu thu thì tin CHỨNG TỪ; chưa có phiếu nào thì dùng số ghi ở hồ sơ (dữ liệu cũ nhập tay)
    const thu=(theoHS[h.id]!=null)?theoHS[h.id]:(Number(h.soTienDong)||0);
    const sd=Math.max(0,thu-(hoanHS[h.id]||0));
    // Phải thu: đang học lấy cả khóa; đã nghỉ lấy số quyết toán, chưa chốt thì đúng bằng số đã thu
    const p=act?(h.hocPhi||0):(h.hocPhiChot!=null?(Number(h.hocPhiChot)||0):sd);
    if(!act&&sd<=0&&p<=0)return;          // em đã nghỉ, không phát sinh đồng nào → không đưa vào bảng phí
    // KHÔNG cắt "đã thu" theo học phí nữa: tiền đã vào két là tiền thật, phải khớp sổ quỹ
    du+=p; n++; if(sd>0){da+=sd;nDa++;}
    if(!act){nNghi++;daNghi+=sd;} });
  // "Đã thu" phải khớp tiền THẬT trong sổ quỹ → cộng cả phiếu chưa gắn học sinh
  return {du,da:da+le,daHS:da,le,nLe,nNghi,daNghi,chua:Math.max(0,du-da-le),rate:du?(da+le)/du:0,n,nDa};
}
/* Chuyên cần thật = (có mặt + muộn) / tổng lượt điểm danh trong 30 NGÀY GẦN NHẤT;
   null nếu chưa có dữ liệu. (Trước đây tính cả lịch sử nên loãng dần theo thời gian.) */
function ccStat(ids){
  const d=new Date(); d.setDate(d.getDate()-30);
  const cutoff=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let pres=0,tot=0;
  for(const k in OPS.ddHV){
    const parts=k.split('|'); if(parts[1]<cutoff)continue;
    const lop=LOP.find(l=>l.id===Number(parts[0]));
    if(!lop||!ids.includes(lop.coSoId))continue;
    const obj=OPS.ddHV[k];
    for(const hid in obj){ tot++; const st=obj[hid]; if(st==='co'||st==='muon')pres++; }
  }
  return tot?pres/tot:null;
}

}

/* ===== LỊCH DẠY THEO CA (Giai đoạn 6) =====
   Quy ước "thứ": 2..7 = Thứ Hai..Thứ Bảy, 8 = Chủ nhật (khớp cột thu của bảng lich_lop).
   Khung ca khai theo TỪNG CƠ SỞ vì trung tâm 5 ca × 2 giờ, mầm non 4 ca × 55 phút,
   trường liên kết mỗi nơi một khung riêng. */
const CA_MAC_DINH=[{ma:1,ten:'Ca 1',bd:'07:00',kt:'09:00'},{ma:2,ten:'Ca 2',bd:'09:15',kt:'11:15'},
  {ma:3,ten:'Ca 3',bd:'14:00',kt:'16:00'},{ma:4,ten:'Ca 4',bd:'17:15',kt:'19:15'},{ma:5,ten:'Ca 5',bd:'19:30',kt:'21:30'}];
const THU_LIST=[2,3,4,5,6,7,8];
const THU_NGAN={2:'T2',3:'T3',4:'T4',5:'T5',6:'T6',7:'T7',8:'CN'};
const THU_DAI={2:'Thứ Hai',3:'Thứ Ba',4:'Thứ Tư',5:'Thứ Năm',6:'Thứ Sáu',7:'Thứ Bảy',8:'Chủ nhật'};
/* Giờ hợp lệ: để trống, hoặc hh:mm với giờ 0–23, phút 0–59 */
function gioHopLe(s){
  s=String(s||'').trim(); if(!s)return true;
  const m=/^(\d{1,2}):(\d{2})$/.exec(s); if(!m)return false;
  return +m[1]<=23 && +m[2]<=59;
}
/* Ô nhập giờ: gõ kiểu gì cũng ra hh:mm khi rời ô — "14"→14:00, "700"→07:00, "1400"→14:00 */
function attachGioFormat(el){
  if(!el)return;
  el.addEventListener('blur',()=>{
    const s=el.value.trim(); if(!s)return;
    const m=/^(\d{1,2}):(\d{1,2})$/.exec(s);
    if(m){el.value=String(+m[1]).padStart(2,'0')+':'+String(+m[2]).padStart(2,'0');return;}
    const d=s.replace(/\D/g,'');
    if(d.length<=2) el.value=d.padStart(2,'0')+':00';
    else if(d.length===3) el.value='0'+d[0]+':'+d.slice(1);
    else el.value=d.slice(0,2)+':'+d.slice(2,4);
  });
}
/* so sánh tên phòng bỏ qua hoa/thường, dấu và khoảng trắng thừa: "Phòng 1" ≡ "phong  1" */
const phongKey=s=>fold(String(s||'')).toLowerCase().replace(/\s+/g,'');
/* ngày ISO → số thứ (Chủ nhật = 8) */
function thuOf(iso){ const d=new Date(String(iso)+'T00:00:00'); if(isNaN(d))return 0; const w=d.getDay(); return w===0?8:w+1; }
/* khung ca của 1 cơ sở; chưa khai (hoặc chưa chạy SQL) thì dùng khung mặc định */
const caList=coSoId=>{const a=OPS.ca[coSoId]; return (a&&a.length)?a:CA_MAC_DINH;};
const caInfo=(coSoId,ma)=>caList(coSoId).find(c=>c.ma===ma)||{ma,ten:'Ca '+ma,bd:'',kt:''};
const caGio=(coSoId,ma)=>{const c=caInfo(coSoId,ma);return (c.bd&&c.kt)?(c.bd+' – '+c.kt):'';};
