<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0b1d3d"/>
<link rel="icon" type="image/png" href="logo-mark.png"/>
<link rel="apple-touch-icon" href="logo-mark.png"/>
<title>AVATAR English Center · Hệ thống quản trị chuỗi</title>
<style>
:root{
  --bg:#eef1f7;--card:#ffffff;--ink:#132244;--muted:#5f6a86;--faint:#8b95ae;
  --line:#e2e7f1;--soft:#f2f5fb;
  --brand:#1f4276;--brand-600:#17335f;--brand-700:#10264c;--brand-soft:#dbe4f3;
  --navy-900:#0b1d3d;--navy-800:#10264c;
  --emerald:#2f6fd0;--emerald-soft:#dde8fa;
  --amber:#c98410;--amber-soft:#fbeecd;--rose:#e04b52;--rose-soft:#fbe6e7;
  --sky:#0e7fb0;--sky-soft:#d7edf6;--violet:#7c5cd6;--violet-soft:#e9e2fb;
  --radius:18px;--radius-sm:12px;
  --shadow:0 20px 45px -30px rgba(11,29,61,.55);--shadow-sm:0 8px 22px -16px rgba(11,29,61,.5);
  --dots:radial-gradient(rgba(255,255,255,.16) 1.5px, transparent 1.6px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Be Vietnam Pro","Segoe UI",Roboto,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{text-decoration:none;color:inherit}
svg{display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#c4d3d0;border-radius:8px}

/* ===== LOGIN ===== */
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;
  background:var(--dots),
             radial-gradient(1100px 560px at 12% -8%,#1e3d76,transparent 58%),
             radial-gradient(900px 620px at 112% 118%,#12305e,transparent 55%),var(--navy-900);
  background-size:20px 20px,auto,auto,auto}
.lcard{width:min(420px,100%);background:var(--card);border-radius:26px;box-shadow:0 44px 90px -46px #000;overflow:hidden}
.lhead{background:var(--dots),linear-gradient(160deg,#12305e 0%,#0b1d3d 100%);background-size:18px 18px,auto;color:#fff;padding:34px 30px 28px;text-align:center;border-bottom:3px solid #2a5490}
.llogo{width:76px;height:76px;border-radius:22px;background:#fff;overflow:hidden;margin:0 auto 15px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.llogo img,.brand .lg img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.lhead h1{margin:0;font-size:1.36rem;letter-spacing:.06em;font-weight:800}
.lhead p{margin:7px 0 0;color:#bfe0db;font-size:.85rem}
.lbody{padding:26px 28px 30px}
.lbody label{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px 3px}
.field{margin-bottom:15px}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--soft);border-radius:13px;padding:13px 14px;outline:0;transition:.15s}
.field input:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.14)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.role{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;text-align:center;transition:.15s;display:grid;gap:8px;justify-items:center}
.role svg{width:23px;height:23px;stroke:var(--muted)}
.role b{font-size:.82rem;font-weight:800}
.role.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(31,66,118,.14)}
.role.on svg{stroke:var(--brand-600)}
.role.on b{color:var(--brand-700)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--faint)}
.eye:hover{color:var(--brand-600);background:var(--soft)}
.eye svg{width:20px;height:20px;stroke:currentColor}
.lnote{font-size:.75rem;color:var(--faint);text-align:center;margin:17px 0 0;line-height:1.5}

.btn{border-radius:13px;padding:13px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.18s;font-size:.92rem}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,#2a5490,#1f4276);color:#fff;box-shadow:0 14px 30px -14px rgba(16,38,76,.9)}
.btn-primary:hover{background:linear-gradient(135deg,#25497f,#17335f)}
.btn-block{width:100%}
.btn-light{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-light:hover{background:var(--soft)}
.btn-sm{padding:8px 13px;font-size:.8rem;border-radius:10px}
.btn-ghost{background:var(--soft);color:var(--brand-700)}

/* ===== SHELL ===== */
#app{display:none}
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--dots),linear-gradient(188deg,#1c3c6e 0%,#0b1d3d 74%);background-size:22px 22px,auto;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:18px 13px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 17px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .lg{width:50px;height:50px;border-radius:15px;background:#fff;overflow:hidden;flex:none;box-shadow:0 10px 22px -10px rgba(0,0,0,.5)}
.brand b{display:block;font-size:1.14rem;letter-spacing:.07em;font-weight:800}
.brand small{display:block;color:#8fc0ba;font-size:.68rem;letter-spacing:.02em}
.navlab{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#5f8f88;margin:16px 12px 8px;font-weight:800}
.nav{display:grid;gap:4px;overflow-y:auto;flex:1}
.nav button{display:flex;align-items:center;gap:13px;width:100%;text-align:left;color:#cfe4e0;border-radius:13px;padding:12px 13px;font-weight:600;font-size:1rem;transition:.15s}
.nav button svg{width:21px;height:21px;stroke:currentColor;flex:none;opacity:.82}
.nav button .cnt{margin-left:auto;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.09);padding:2px 8px;border-radius:99px;color:#a9d3cd}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:linear-gradient(135deg,#2a5490,var(--brand));color:#fff;font-weight:700;box-shadow:0 14px 26px -14px rgba(16,38,76,.95)}
.nav button.on svg{opacity:1}
.nav button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.suser{margin-top:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:15px;padding:11px 12px;display:flex;align-items:center;gap:10px}
.suser .ava{width:38px;height:38px;border-radius:12px;background:var(--emerald);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.suser b{display:block;font-size:.82rem;line-height:1.25}
.suser small{display:block;color:#8fc0ba;font-size:.7rem}
.suser .out{margin-left:auto;color:#8fc0ba;padding:7px;border-radius:10px}
.suser .out:hover{background:rgba(255,255,255,.1);color:#fff}

.main{min-width:0;padding:20px 26px 90px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.burger{display:none;width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow-sm)}
.burger svg{width:21px;height:21px;stroke:var(--ink)}
.ttl{min-width:0}
.ttl h1{margin:0;font-size:1.5rem;letter-spacing:-.02em;line-height:1.12}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:.83rem}
.topact{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.scope{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 10px 8px 13px;box-shadow:var(--shadow-sm)}
.scope svg{width:16px;height:16px;stroke:var(--brand-600);flex:none}
.scope small{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.scope select{border:0;outline:0;background:none;font-weight:800;color:var(--brand-700);max-width:190px;padding:2px 4px}
.scope.lock{background:var(--soft)}.scope.lock select{color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-sm)}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.kpi-ic svg{width:21px;height:21px}
.ic-teal{background:var(--brand-soft)}.ic-teal svg{stroke:var(--brand-600)}
.ic-em{background:var(--emerald-soft)}.ic-em svg{stroke:var(--emerald)}
.ic-sky{background:var(--sky-soft)}.ic-sky svg{stroke:var(--sky)}
.ic-am{background:var(--amber-soft)}.ic-am svg{stroke:var(--amber)}
.ic-vi{background:var(--violet-soft)}.ic-vi svg{stroke:var(--violet)}
.kpi b{display:block;font-size:1.6rem;letter-spacing:-.02em;margin-top:13px;line-height:1}
.kpi span{font-size:.78rem;color:var(--muted)}

.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px}
.phead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead h3{margin:0;font-size:1rem}
.phead .sub{font-size:.72rem;color:var(--muted)}
.pbody{padding:16px 18px}

/* toolbar (search/filter) */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 14px;box-shadow:var(--shadow-sm)}
.search svg{width:18px;height:18px;stroke:var(--faint);flex:none}
.search input{border:0;outline:0;background:none;width:100%}
.fsel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm);outline:0;max-width:210px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-size:.83rem;font-weight:700;color:var(--muted);transition:.15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* table */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
thead th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--soft)}
.tright{text-align:right}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.gvcell{display:flex;align-items:center;gap:11px;min-width:170px}
.gvava{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.82rem;color:#fff;flex:none}
.gvcell b{display:block;line-height:1.2}
.gvcell small{color:var(--muted);font-size:.74rem}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.bg-vh{background:var(--sky-soft);color:var(--sky)}
.bg-ta{background:var(--violet-soft);color:var(--violet)}
.bg-em{background:var(--emerald-soft);color:var(--emerald)}
.bg-am{background:var(--amber-soft);color:var(--amber)}
.bg-gray{background:var(--soft);color:var(--muted)}
.linkbtn{color:var(--brand-600);font-weight:800;font-size:.82rem}

/* cơ sở cards */
.cscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.cscard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px 17px;transition:.15s;cursor:pointer;position:relative;overflow:hidden}
.cscard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.cscard.build{opacity:.72;border-style:dashed}
.cscard .cs-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cs-badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.05rem;flex:none}
.cscard h4{margin:0;font-size:1.02rem}
.cscard .cs-sub{font-size:.73rem;color:var(--muted)}
.cs-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cs-stat{background:var(--soft);border-radius:11px;padding:9px 11px}
.cs-stat b{display:block;font-size:1.08rem;line-height:1.1}
.cs-stat span{font-size:.68rem;color:var(--muted)}
.cs-rev{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.cs-rev small{font-size:.72rem;color:var(--muted)}
.cs-rev b{font-size:1.02rem;color:var(--brand-700)}
.cs-warn{display:inline-flex;align-items:center;gap:3px;font-size:.6rem;font-weight:800;color:#8a5a05;background:var(--amber-soft);border:1px solid #f2dca6;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.cs-mini{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:.74rem;color:var(--muted)}
.cs-mini .mk{color:var(--amber);font-weight:900}
.cs-mini .mbar{flex:1;height:5px;border-radius:99px;background:var(--soft);overflow:hidden}
.cs-mini .mbar i{display:block;height:100%;background:var(--sky)}
.cs-bar{height:6px;border-radius:99px;background:var(--soft);margin-top:11px;overflow:hidden}
.cs-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--emerald))}
.cssum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cssum .s{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;box-shadow:var(--shadow-sm)}
.cssum .s b{display:block;font-size:1.28rem;line-height:1}
.cssum .s span{font-size:.71rem;color:var(--muted)}

/* rank list */
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .no{width:26px;height:26px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--muted);flex:none}
.rank .no.top{background:var(--brand);color:#fff}
.rank .rn{flex:1;min-width:0}
.rank .rn b{display:block;font-size:.9rem}
.rank .bar{height:6px;border-radius:99px;background:var(--soft);margin-top:5px;overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--emerald))}
.rank .rv{font-weight:800;font-size:.86rem;color:var(--brand-700);white-space:nowrap}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;stroke:var(--faint);margin:0 auto 12px}
.pagehint{background:var(--amber-soft);border:1px solid #f2dca6;color:#8a5a05;border-radius:13px;padding:12px 15px;font-size:.84rem;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.pagehint svg{width:18px;height:18px;stroke:#a86b06;flex:none;margin-top:1px}

/* ===== BẢNG ĐIỀU HÀNH ===== */
.hello{background:var(--dots),linear-gradient(120deg,#1f4276,#0b1d3d);background-size:20px 20px,auto;color:#fff;border-radius:var(--radius);padding:18px 21px;margin-bottom:14px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm)}
.hello .hi{flex:1;min-width:0}
.hello h2{margin:0;font-size:1.2rem;letter-spacing:-.01em}
.hello p{margin:5px 0 0;color:#b9c9e6;font-size:.84rem}
.hello .date{background:rgba(255,255,255,.13);border-radius:13px;padding:9px 15px;text-align:center;flex:none;border:1px solid rgba(255,255,255,.12)}
.hello .date b{display:block;font-size:1.35rem;line-height:1}
.hello .date span{font-size:.66rem;color:#c5d3ec;letter-spacing:.02em}
.simtag{display:inline-flex;align-items:center;gap:5px;font-size:.62rem;font-weight:800;color:var(--amber);background:var(--amber-soft);padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.ringbox{position:relative;width:120px;height:120px;flex:none}
.ringbox .rc{width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*3.6deg),var(--soft) 0)}
.ringbox .rin{position:absolute;inset:13px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.ringbox .rin b{font-size:1.55rem;line-height:1;color:var(--brand-700)}
.ringbox .rin span{font-size:.64rem;color:var(--muted);margin-top:2px}
.finrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.finnums{flex:1;min-width:150px;display:grid;gap:10px}
.finstat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.finstat:last-child{border-bottom:0;padding-bottom:0}
.finstat small{color:var(--muted);font-size:.8rem}
.finstat b{font-size:1.02rem;font-variant-numeric:tabular-nums}
.finstat b.pos{color:var(--brand-700)}.finstat b.neg{color:var(--amber)}
.tday{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tday:last-child{border-bottom:0}
.tday .tm{font-weight:800;font-size:.8rem;color:var(--brand-700);width:48px;flex:none}
.tday .ti{flex:1;min-width:0}
.tday .ti b{display:block;font-size:.9rem;line-height:1.25}
.tday .ti small{color:var(--muted);font-size:.74rem}
.warns{display:grid;gap:9px}
.warnrow{display:flex;gap:10px;align-items:center;background:var(--amber-soft);border:1px solid #f2dca6;border-radius:12px;padding:11px 13px;font-size:.85rem;color:#7a5406;line-height:1.35}
.warnrow.ok{background:var(--brand-soft);border-color:#c3d3ee;color:var(--brand-700)}
.warnrow svg{width:18px;height:18px;flex:none;stroke:currentColor}

/* modal */
.modal{position:fixed;inset:0;background:rgba(9,32,29,.5);backdrop-filter:blur(3px);display:none;place-items:center;padding:20px;z-index:60}
.modal.on{display:grid}
.mcard{width:min(460px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 40px 90px -40px #000;max-height:92vh;display:flex;flex-direction:column}
.mhead{padding:22px 22px 18px;background:var(--dots),linear-gradient(150deg,#17335f,#1f4276);background-size:18px 18px,auto;color:#fff;display:flex;gap:14px;align-items:center}
.mhead .mava{width:56px;height:56px;border-radius:17px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:900;font-size:1.2rem;flex:none}
.mhead h3{margin:0;font-size:1.16rem}
.mhead p{margin:3px 0 0;font-size:.8rem;color:#c9e6e2}
.mbody{padding:18px 22px 22px;overflow-y:auto}
.mrow{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.mrow:last-child{border-bottom:0}
.mrow .mi{width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;flex:none}
.mrow .mi svg{width:17px;height:17px;stroke:var(--brand-600)}
.mrow small{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.mrow b{font-weight:700;font-size:.93rem}
.mrow a{color:var(--brand-600);font-weight:800}
.mclose{margin-left:auto;color:#fff;padding:6px;border-radius:9px;background:rgba(255,255,255,.12)}
.mclose svg{width:18px;height:18px;stroke:#fff}

/* bottom nav (mobile) */
.botnav{display:none}

@media(max-width:920px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:70;width:270px;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .side.open{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(9,32,29,.5);z-index:65}
  .scrim.on{display:block}
  .burger{display:flex}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .main{padding:16px 15px 96px}
  .ttl h1{font-size:1.28rem}
  .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -10px 30px -20px rgba(9,42,38,.5)}
  .botnav button{display:grid;justify-items:center;gap:3px;color:var(--faint);font-size:.62rem;font-weight:700;padding:5px 9px;border-radius:11px;flex:1}
  .botnav button svg{width:22px;height:22px;stroke:currentColor}
  .botnav button.on{color:var(--brand-600)}
  .botnav button.on svg{stroke:var(--brand-600)}
}
@media(max-width:480px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi b{font-size:1.4rem}
  .fsel{max-width:100%;flex:1}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="lcard">
    <div class="lhead">
      <div class="llogo"><img src="logo-mark.png" alt="AVATAR English Center"/></div>
      <h1>AVATAR</h1>
      <p>English Center · Quản trị chuỗi trung tâm</p>
    </div>
    <div class="lbody">
      <label>Vai trò đăng nhập</label>
      <div class="roles" id="roles">
        <button class="role on" data-role="admin">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/></svg>
          <b>Quản trị chuỗi</b>
        </button>
        <button class="role" data-role="owner">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <b>Lễ tân Cơ Sở</b>
        </button>
      </div>
      <div class="field" id="csField" style="display:none;margin-top:6px">
        <label>Chọn cơ sở</label>
        <select id="csPick"></select>
      </div>
      <div class="field" style="margin-top:6px">
        <label>Tên đăng nhập</label>
        <input id="uname" value="admin" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <div class="pass-wrap">
          <input id="upass" type="password" value="123456" autocomplete="current-password"/>
          <button type="button" class="eye" id="eyeBtn" aria-label="Hiện mật khẩu"></button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="loginBtn">Đăng nhập hệ thống</button>
      <p class="lnote">Bản quyền thuộc về Trung tâm Anh ngữ Avatar</p>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="scrim" id="scrim"></div>
  <div class="shell">
    <!-- SIDEBAR -->
    <aside class="side" id="side">
      <div class="brand">
        <div class="lg"><img src="logo-mark.png" alt="AVATAR"/></div>
        <div><b>AVATAR</b><small>English Center</small></div>
      </div>
      <div class="navlab">Điều hành</div>
      <nav class="nav" id="nav"></nav>
      <div class="suser">
        <div class="ava" id="uAva">A</div>
        <div style="min-width:0">
          <b id="uName">Quản trị</b>
          <small id="uRole">Toàn hệ thống</small>
        </div>
        <button class="out" id="logout" title="Đăng xuất">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="top">
        <button class="burger" id="burger"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="ttl"><h1 id="pgTitle">Tổng quan</h1><p id="pgSub">Toàn hệ thống</p></div>
        <div class="topact">
          <div class="scope" id="scopeWrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M3 21V9l9-6 9 6v12"/></svg>
            <div><small>Phạm vi</small></div>
            <select id="scope"></select>
          </div>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <!-- BOTTOM NAV (mobile) -->
  <nav class="botnav" id="botnav"></nav>
</div>

<!-- MODAL -->
<div class="modal" id="modal"><div class="mcard" id="mcard"></div></div>

<script src="data.js"></script>
<script>
/* ============ UTIL ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmtVND=n=>Math.round(n).toLocaleString('vi-VN')+'₫';
const fmtShort=n=>n>=1e9?(n/1e9).toFixed(n>=1e10?0:1).replace('.0','')+' tỷ':n>=1e6?Math.round(n/1e6)+' tr':n>=1e3?Math.round(n/1e3)+'k':String(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=s=>{const p=String(s).trim().split(/\s+/);return ((p[p.length-2]?.[0]||'')+(p[p.length-1]?.[0]||'')).toUpperCase()||'?';};
const AVCOL=['#1f4276','#2a5490','#0e7fb0','#3a5db0','#5b6fb8','#7c5cd6','#2f6fd0','#17335f'];
const avaColor=s=>AVCOL[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%AVCOL.length];

/* ============ DATA ============ */
const DATA=window.AVATAR_DATA;
const COSO=DATA.map(c=>({id:c.id,ten:c.ten,build:!!c.trong}));
/* viết tắt cơ sở, tự tách khi trùng (Diễn Hạnh/Diễn Hồng đều "DH") */
const fold=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
const CS_ABBR=(()=>{
  const base={},cnt={},map={};
  COSO.forEach(c=>{const w=fold(c.ten).trim().split(/\s+/);const b=((w[w.length-2]?.[0]||'')+(w[w.length-1]?.[0]||'')).toUpperCase();base[c.id]=b;cnt[b]=(cnt[b]||0)+1;});
  COSO.forEach(c=>{const w=fold(c.ten).trim().split(/\s+/);const b=base[c.id];
    if(cnt[b]>1){const last=w[w.length-1];map[c.id]=(w[w.length-2]?.[0]||'').toUpperCase()+last[0].toUpperCase()+(last.slice(1,2)||'').toLowerCase();}
    else map[c.id]=b;});
  return map;
})();
const csAbbr=id=>CS_ABBR[id]||'?';
let GV=[],LOP=[];
DATA.forEach(c=>{(c.gv||[]).forEach(g=>GV.push({...g,coSoId:c.id})); (c.lop||[]).forEach(l=>LOP.push({...l,coSoId:c.id}));});
const csName=id=>COSO.find(c=>c.id===id)?.ten||'—';
function csStat(id){
  const g=GV.filter(x=>x.coSoId===id), l=LOP.filter(x=>x.coSoId===id);
  return {gv:g.length,lop:l.length,hs:l.reduce((s,x)=>s+(x.siso||0),0),thu:l.reduce((s,x)=>s+(x.duthu||0),0)};
}
/* mô phỏng cố định (deterministic) cho phần chưa có nguồn vận hành */
function seed(str){let h=2166136261;str=String(str);for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967296;}
const thuRate=name=>0.63+seed('t'+name)*0.30;          // tỷ lệ thực thu 63–93%
const chuyenCan=key=>0.83+seed('c'+key)*0.15;          // chuyên cần 83–98%
const SLOTS=['17:15','17:30','18:00','18:30','19:00','19:30','20:00'];
const DOW=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];

/* ============ STATE ============ */
let USER={role:'admin',coSoId:null}, VIEW='dashboard', scope='all';
let gvSearch='',gvCs='all',gvMon='all', lopSearch='',lopCs='all', csSort='thu';

/* ============ ICONS ============ */
const IC={
  dashboard:'<path d="M3 13h8V3H3zM13 21h8V3h-8zM3 21h8v-6H3z"/>',
  coso:'<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/>',
  gv:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.8-5 5.5-5s5.5 1.8 5.5 5"/><path d="M17 11l2 2 3-3.5"/>',
  lop:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 18v3M16 18v3"/>',
  thu:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.2c0-1.2 1.1-2 2.5-2s2.5.7 2.5 2-1.1 1.8-2.5 1.8-2.5.6-2.5 2 1.1 2 2.5 2 2.5-.8 2.5-2"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3 2.6-4.8 6.5-4.8"/><circle cx="17" cy="9" r="2.6"/><path d="M14 20c0-2.6 1.8-4.2 4.5-4.2s3 1.4 3 3"/>',
  cap:'<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1 2.7 2.5 6 2.5s6-1.5 6-2.5v-5"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/>',
  cake:'<path d="M4 21h16v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M4 15c1.5 1.2 2.5 1.2 4 0s2.5-1.2 4 0 2.5 1.2 4 0 2.5-1.2 4 0"/><path d="M12 8V5M9 8V6M15 8V6"/>',
  pin:'<path d="M12 21s7-5.7 7-11a7 7 0 0 0-14 0c0 5.3 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>'
};
const svg=(p,sw=1.9)=>`<svg viewBox="0 0 24 24" fill="none" stroke-width="${sw}">${p}</svg>`;

/* ============ NAV ============ */
const NAV=[
  {k:'dashboard',t:'Điều hành',i:IC.dashboard},
  {k:'gv',t:'Giáo viên',i:IC.gv,cnt:()=>inGV().length},
  {k:'coso',t:'Cơ sở',i:IC.coso,cnt:()=>COSO.length,adminOnly:true},
  {k:'lop',t:'Lớp học',i:IC.lop,cnt:()=>inLOP().length},
  {k:'thu',t:'Khoản thu',i:IC.thu},
];
const visibleNav=()=>NAV.filter(n=>!n.adminOnly||USER.role==='admin');

function scopeIds(){
  if(USER.role!=='admin') return [USER.coSoId];
  return scope==='all'?COSO.map(c=>c.id):[Number(scope)];
}
const inGV=()=>GV.filter(g=>scopeIds().includes(g.coSoId));
const inLOP=()=>LOP.filter(l=>scopeIds().includes(l.coSoId));
const inCOSO=()=>COSO.filter(c=>scopeIds().includes(c.id));

/* ============ LOGIN ============ */
let selRole='admin';
function fillCsPick(){
  $('#csPick').innerHTML=COSO.filter(c=>!c.build).map(c=>`<option value="${c.id}">${esc(c.ten)}</option>`).join('');
}
$$('#roles .role').forEach(b=>b.onclick=()=>{
  $$('#roles .role').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  selRole=b.dataset.role;
  $('#csField').style.display=selRole==='owner'?'block':'none';
  $('#uname').value=selRole==='admin'?'admin':'coso';
});
$('#loginBtn').onclick=()=>{
  USER=selRole==='admin'?{role:'admin',coSoId:null}:{role:'owner',coSoId:Number($('#csPick').value)};
  scope='all'; startApp();
};
$('#upass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click();});

function startApp(){
  $('#login').style.display='none';
  $('#app').style.display='block';
  const nm=USER.role==='admin'?'Ban Quản trị':('Chủ cơ sở '+csName(USER.coSoId));
  $('#uName').textContent=USER.role==='admin'?'Quản trị chuỗi':csName(USER.coSoId);
  $('#uRole').textContent=USER.role==='admin'?'Toàn hệ thống':'Lễ tân Cơ Sở';
  $('#uAva').textContent=USER.role==='admin'?'QT':initials(csName(USER.coSoId));
  buildScope(); renderNav(); go('dashboard');
}
$('#logout').onclick=()=>{ $('#app').style.display='none'; $('#login').style.display='grid'; };

function buildScope(){
  const wrap=$('#scopeWrap'), sel=$('#scope');
  if(USER.role==='admin'){
    wrap.classList.remove('lock');
    sel.innerHTML='<option value="all">Toàn hệ thống ('+COSO.length+' cơ sở)</option>'+
      COSO.map(c=>`<option value="${c.id}">${esc(c.ten)}${c.build?' · đang XD':''}</option>`).join('');
    sel.disabled=false;
    sel.onchange=()=>{scope=sel.value; go(VIEW);};
  }else{
    wrap.classList.add('lock');
    sel.innerHTML=`<option>${esc(csName(USER.coSoId))}</option>`; sel.disabled=true;
  }
}

/* ============ NAV RENDER ============ */
function renderNav(){
  const vis=visibleNav();
  $('#nav').innerHTML=vis.map(n=>`<button data-k="${n.k}" class="${n.k===VIEW?'on':''}">${svg(n.i)}<span>${n.t}</span>${n.cnt?`<span class="cnt">${n.cnt()}</span>`:''}</button>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>{go(b.dataset.k);closeSide();});
  $('#botnav').innerHTML=vis.map(n=>`<button data-k="${n.k}" class="${n.k===VIEW?'on':''}">${svg(n.i,1.9)}<span>${n.t}</span></button>`).join('');
  $$('#botnav button').forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function syncNav(){
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===VIEW));
  $$('#botnav button').forEach(b=>b.classList.toggle('on',b.dataset.k===VIEW));
  const n=NAV.find(x=>x.k===VIEW);
  $('#nav .cnt')&&renderNavCounts();
}
function renderNavCounts(){
  NAV.forEach(n=>{if(!n.cnt)return;const b=$(`#nav button[data-k="${n.k}"] .cnt`);if(b)b.textContent=n.cnt();});
}

/* sidebar mobile */
function openSide(){$('#side').classList.add('open');$('#scrim').classList.add('on');}
function closeSide(){$('#side').classList.remove('open');$('#scrim').classList.remove('on');}
$('#burger').onclick=openSide; $('#scrim').onclick=closeSide;

/* ============ ROUTER ============ */
const TITLES={dashboard:['Bảng điều hành','Toàn cảnh điều hành'],gv:['Giáo viên','Danh sách & hồ sơ giáo viên'],coso:['Cơ sở','Mạng lưới các trung tâm'],lop:['Lớp học','Lớp học & sĩ số'],thu:['Khoản thu','Dự thu học phí theo cơ sở']};
function go(k){
  if(k==='coso'&&USER.role!=='admin')k='dashboard';
  VIEW=k;
  const scopeTxt=USER.role==='admin'?(scope==='all'?'Toàn hệ thống':csName(Number(scope))):csName(USER.coSoId);
  $('#pgTitle').textContent=TITLES[k][0];
  $('#pgSub').textContent=TITLES[k][1]+' · '+scopeTxt;
  syncNav(); renderNavCounts();
  ({dashboard:renderDash,gv:renderGV,coso:renderCoso,lop:renderLop,thu:renderThu}[k])();
  window.scrollTo(0,0);
}

/* ============ DASHBOARD ============ */
function renderDash(){
  const ids=scopeIds();
  const cosos=inCOSO().filter(c=>!c.build);
  const g=GV.filter(x=>ids.includes(x.coSoId)).length;
  const ls=LOP.filter(x=>ids.includes(x.coSoId));
  const hs=ls.reduce((s,x)=>s+(x.siso||0),0), duThu=ls.reduce((s,x)=>s+(x.duthu||0),0);

  // ---- tài chính: thực thu (mô phỏng cố định) ----
  let thucThu=0;
  cosos.forEach(c=>{ if(ids.includes(c.id)) thucThu+=csStat(c.id).thu*thuRate(c.ten); });
  const rate=duThu?thucThu/duThu*100:0, conNo=Math.max(0,duThu-thucThu);

  // ---- lớp học hôm nay + chuyên cần (mô phỏng) ----
  const today=ls.filter(l=>l.siso>0 && seed(l.lop+l.gv+l.coSoId)>0.45)
    .map(l=>({...l,gio:SLOTS[Math.floor(seed('g'+l.lop+l.coSoId)*SLOTS.length)],cc:chuyenCan(l.lop+l.gv),done:seed('d'+l.gv+l.lop)>0.3}))
    .sort((a,b)=>a.gio.localeCompare(b.gio));
  const ccAvg=today.length?today.reduce((s,l)=>s+l.cc,0)/today.length*100:0;
  const doneCnt=today.filter(l=>l.done).length;
  const coMat=today.reduce((s,l)=>s+Math.round(l.siso*l.cc),0);
  const siToday=today.reduce((s,l)=>s+l.siso,0);

  const now=new Date(), gio=now.getHours();
  const chao=gio<11?'Chào buổi sáng':gio<13?'Chào buổi trưa':gio<18?'Chào buổi chiều':'Chào buổi tối';
  const who=USER.role==='admin'?'Ban Giám đốc':('Lễ tân '+csName(USER.coSoId));
  const scopeTxt=USER.role==='admin'?(scope==='all'?'toàn hệ thống '+cosos.length+' cơ sở':csName(Number(scope))):csName(USER.coSoId);

  let h=`<div class="hello">
    <div class="hi"><h2>${chao}, ${esc(who)} 👋</h2><p>Tình hình ${esc(scopeTxt)} · cập nhật lúc ${String(gio).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</p></div>
    <div class="date"><b>${now.getDate()}/${now.getMonth()+1}</b><span>${DOW[now.getDay()]}</span></div>
  </div>`;

  // KPI
  const kpis=[
    {ic:'ic-am',i:IC.thu,v:fmtShort(duThu),l:'Dự thu tháng'},
    {ic:'ic-em',i:IC.thu,v:fmtShort(thucThu),l:'Thực thu (dự kiến)'},
    {ic:'ic-sky',i:IC.users,v:hs.toLocaleString('vi-VN'),l:'Học viên'},
    {ic:'ic-teal',i:IC.lop,v:ls.length,l:'Lớp học'},
  ];
  h+=`<div class="kpis">${kpis.map(k=>`<div class="kpi"><div class="kpi-top"><div class="kpi-ic ${k.ic}">${svg(k.i)}</div></div><b>${k.v}</b><span>${k.l}</span></div>`).join('')}</div>`;

  // Tài chính + Chuyên cần
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Tài chính học phí</h3><span class="simtag">◐ minh họa</span></div>
      <div class="pbody"><div class="finrow">
        ${ring(rate,'đã thu')}
        <div class="finnums">
          <div class="finstat"><small>Dự thu kế hoạch</small><b>${fmtVND(duThu)}</b></div>
          <div class="finstat"><small>Đã thu (dự kiến)</small><b class="pos">${fmtVND(thucThu)}</b></div>
          <div class="finstat"><small>Còn phải thu</small><b class="neg">${fmtVND(conNo)}</b></div>
        </div>
      </div></div>
    </div>
    <div class="panel"><div class="phead"><h3>Chuyên cần hôm nay</h3><span class="simtag">◐ minh họa</span></div>
      <div class="pbody"><div class="finrow">
        ${ring(ccAvg,'có mặt')}
        <div class="finnums">
          <div class="finstat"><small>Lớp học hôm nay</small><b>${today.length} lớp</b></div>
          <div class="finstat"><small>GV đã điểm danh</small><b class="pos">${doneCnt}/${today.length}</b></div>
          <div class="finstat"><small>Học viên có mặt</small><b>${coMat}/${siToday}</b></div>
        </div>
      </div></div>
    </div>
  </div>`;

  // Lớp hôm nay + Cảnh báo
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Lớp đang học hôm nay</h3><span class="simtag">◐ minh họa</span></div>
      <div class="pbody">${today.length?today.slice(0,7).map(l=>`
        <div class="tday">
          <div class="tm">${l.gio}</div>
          <div class="ti"><b>${esc(l.lop)}${USER.role==='admin'?' · '+esc(csName(l.coSoId)):''}</b><small>${esc(l.gv||'—')} · ${l.siso} HS</small></div>
          <span class="badge ${l.done?'bg-em':'bg-am'}">${l.done?'Đã điểm danh':'Chưa ĐD'}</span>
        </div>`).join(''):'<div class="empty">Hôm nay chưa có lớp trong phạm vi này</div>'}
      </div>
    </div>
    <div class="panel"><div class="phead"><h3>Cảnh báo điều hành</h3></div>
      <div class="pbody"><div class="warns">${dashWarns(ids)}</div></div>
    </div>
  </div>`;

  // Xếp hạng cơ sở (chỉ khi xem toàn hệ thống)
  if(USER.role==='admin' && scope==='all'){
    const ranks=cosos.map(c=>({c,...csStat(c.id)})).sort((a,b)=>b.thu-a.thu);
    const maxThu=Math.max(1,...ranks.map(r=>r.thu));
    h+=`<div class="panel"><div class="phead"><h3>Xếp hạng cơ sở theo dự thu</h3><span class="sub">${ranks.length} cơ sở</span></div>
      <div class="pbody">${ranks.map((r,i)=>`
        <div class="rank">
          <div class="no ${i<3?'top':''}">${i+1}</div>
          <div class="rn"><b>${esc(r.c.ten)}</b><div class="bar"><i style="width:${Math.max(4,r.thu/maxThu*100)}%"></i></div></div>
          <div class="rv">${fmtShort(r.thu)}</div>
        </div>`).join('')}
      </div></div>`;
  }
  $('#view').innerHTML=h;
}
function ring(pct,sub){pct=Math.max(0,Math.min(100,pct));return `<div class="ringbox" style="--p:${pct.toFixed(1)}"><div class="rc"></div><div class="rin"><b>${Math.round(pct)}%</b><span>${sub||''}</span></div></div>`;}
function dashWarns(ids){
  const rows=[];
  inCOSO().forEach(c=>{
    if(!ids.includes(c.id))return;
    if(c.build){rows.push({t:`<b>${esc(c.ten)}</b>: cơ sở đang xây dựng, chưa nhập dữ liệu`});return;}
    const st=csStat(c.id);
    if(st.gv>0&&st.lop===0) rows.push({t:`<b>${esc(c.ten)}</b>: có ${st.gv} GV nhưng chưa nhập lớp học`});
  });
  // cơ sở thực thu thấp (mô phỏng)
  const low=inCOSO().filter(c=>!c.build&&ids.includes(c.id)).map(c=>({c,r:thuRate(c.ten)})).filter(x=>x.r<0.72).sort((a,b)=>a.r-b.r).slice(0,2);
  low.forEach(x=>rows.push({t:`<b>${esc(x.c.ten)}</b>: tỷ lệ thu học phí thấp (~${Math.round(x.r*100)}%), cần đôn đốc`}));
  const ic=svg('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>');
  if(!rows.length) return `<div class="warnrow ok">${svg('<path d="M20 6 9 17l-5-5"/>')}<div>Mọi cơ sở đều ổn định, không có cảnh báo.</div></div>`;
  return rows.map(r=>`<div class="warnrow">${ic}<div>${r.t}</div></div>`).join('');
}

/* ============ GIÁO VIÊN ============ */
function renderGV(){
  const opts=inCOSO().filter(c=>!c.build);
  let h=`<div class="toolbar">
    <div class="search">${svg(IC.search,2)}<input id="gvq" placeholder="Tìm theo tên, SĐT, địa chỉ…" value="${esc(gvSearch)}"/></div>
    ${USER.role==='admin'?`<select class="fsel" id="gvcs"><option value="all">Tất cả cơ sở</option>${opts.map(c=>`<option value="${c.id}" ${String(gvCs)===String(c.id)?'selected':''}>${esc(c.ten)}</option>`).join('')}</select>`:''}
  </div>
  <div class="chips" style="margin-bottom:14px">
    ${[['all','Tất cả môn'],['VH','Văn hóa'],['TA','Tiếng Anh']].map(([k,t])=>`<button class="chip ${gvMon===k?'on':''}" data-mon="${k}">${t}</button>`).join('')}
  </div>`;

  let list=inGV();
  if(USER.role==='admin'&&gvCs!=='all') list=list.filter(g=>g.coSoId===Number(gvCs));
  if(gvMon!=='all') list=list.filter(g=>g.mon===gvMon);
  if(gvSearch.trim()){const q=gvSearch.trim().toLowerCase();list=list.filter(g=>(g.ten+' '+g.sdt+' '+g.dc).toLowerCase().includes(q));}
  list=list.slice().sort((a,b)=>a.coSoId-b.coSoId||a.ten.localeCompare(b.ten,'vi'));

  h+=`<div class="panel"><div class="phead"><h3>Danh sách giáo viên</h3><span class="sub">${list.length} người</span></div>
    <div class="twrap"><table><thead><tr>
      <th>Giáo viên</th><th>Môn</th>${USER.role==='admin'?'<th>Cơ sở</th>':''}<th>Ngày sinh</th><th>Trình độ</th><th>Điện thoại</th><th></th>
    </tr></thead><tbody>`;
  if(!list.length){
    h+=`<tr><td colspan="7"><div class="empty">${svg(IC.gv,1.6)}Không tìm thấy giáo viên phù hợp</div></td></tr>`;
  }else{
    list.forEach(g=>{
      h+=`<tr data-gid="${g.id}" class="gvRow" style="cursor:pointer">
        <td><div class="gvcell"><div class="gvava" style="background:${avaColor(g.ten)}">${initials(g.ten)}</div><div><b>${esc(g.ten)}</b><small>${esc((g.dc||'').split(',')[0]||'—')}</small></div></div></td>
        <td><span class="badge ${g.mon==='TA'?'bg-ta':'bg-vh'}">${g.mon==='TA'?'Tiếng Anh':'Văn hóa'}</span></td>
        ${USER.role==='admin'?`<td>${esc(csName(g.coSoId))}</td>`:''}
        <td class="num">${esc(g.ns||'—')}</td>
        <td>${esc(g.td||'—')}</td>
        <td class="num">${esc(g.sdt||'—')}</td>
        <td class="tright"><span class="linkbtn">Chi tiết →</span></td>
      </tr>`;
    });
  }
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;

  $('#gvq').oninput=e=>{gvSearch=e.target.value;refreshGVTable();};
  const cs=$('#gvcs'); if(cs)cs.onchange=e=>{gvCs=e.target.value;renderGV();};
  $$('#view .chip').forEach(b=>b.onclick=()=>{gvMon=b.dataset.mon;renderGV();});
  bindGVRows();
}
function refreshGVTable(){renderGV();$('#gvq').focus();const v=$('#gvq').value;$('#gvq').setSelectionRange(v.length,v.length);}
function bindGVRows(){$$('#view .gvRow').forEach(r=>r.onclick=()=>showGV(Number(r.dataset.gid)));}

function showGV(id){
  const g=GV.find(x=>x.id===id); if(!g)return;
  const lops=LOP.filter(l=>l.coSoId===g.coSoId && (l.gv||'').trim()===g.ten.trim());
  const hs=lops.reduce((s,l)=>s+(l.siso||0),0);
  $('#mcard').innerHTML=`
    <div class="mhead">
      <div class="mava">${initials(g.ten)}</div>
      <div style="flex:1"><h3>${esc(g.ten)}</h3><p>${g.mon==='TA'?'Giáo viên Tiếng Anh':'Giáo viên Văn hóa'} · ${esc(csName(g.coSoId))}</p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody">
      ${mrow(IC.cake,'Ngày sinh',esc(g.ns||'—'))}
      ${mrow(IC.cap,'Trình độ chuyên môn',esc(g.td||'—'))}
      ${mrow(IC.phone,'Số điện thoại',g.sdt?`<a href="tel:${g.sdt.replace(/\s/g,'')}">${esc(g.sdt)}</a>`:'—')}
      ${mrow(IC.pin,'Địa chỉ',esc(g.dc||'—'))}
      ${mrow(IC.coso,'Cơ sở công tác',esc(csName(g.coSoId)))}
      ${lops.length?mrow(IC.lop,'Phụ trách lớp',`${lops.length} lớp · ${hs} HS<br><small class="muted">${lops.map(l=>esc(l.lop)).join(', ')}</small>`):''}
    </div>`;
  $('#modal').classList.add('on');
}
function mrow(ic,label,val){return `<div class="mrow"><div class="mi">${svg(ic)}</div><div style="flex:1"><small>${label}</small><b>${val}</b></div></div>`;}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

/* ============ CƠ SỞ ============ */
function renderCoso(){
  const list=inCOSO();
  const active=list.filter(c=>!c.build);
  const tot=active.reduce((a,c)=>{const s=csStat(c.id);a.gv+=s.gv;a.hs+=s.hs;a.lop+=s.lop;a.thu+=s.thu;return a;},{gv:0,hs:0,lop:0,thu:0});
  const maxThu=Math.max(1,...active.map(c=>csStat(c.id).thu));
  const rows=list.map(c=>({c,...csStat(c.id)}));
  rows.sort((a,b)=>{
    if(a.c.build!==b.c.build) return a.c.build?1:-1;   // đang XD xuống cuối
    if(csSort==='ten') return a.c.ten.localeCompare(b.c.ten,'vi');
    return b[csSort]-a[csSort];
  });

  let h=`<div class="cssum">
    <div class="s"><b>${active.length}</b><span>Cơ sở hoạt động</span></div>
    <div class="s"><b>${tot.gv}</b><span>Giáo viên</span></div>
    <div class="s"><b>${tot.hs.toLocaleString('vi-VN')}</b><span>Học sinh</span></div>
    <div class="s"><b>${tot.lop}</b><span>Lớp học</span></div>
    <div class="s"><b>${fmtShort(tot.thu)}</b><span>Dự thu học phí</span></div>
  </div>
  <div class="toolbar"><div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <small class="muted" style="font-weight:700">Sắp xếp:</small>
    <select class="fsel" id="cssort">${[['thu','Dự thu cao nhất'],['hs','Học sinh nhiều nhất'],['gv','Giáo viên nhiều nhất'],['ten','Tên A→Z']].map(([k,t])=>`<option value="${k}" ${csSort===k?'selected':''}>${t}</option>`).join('')}</select>
  </div></div>
  <div class="cscards">`;

  rows.forEach(({c,gv,lop,hs,thu})=>{
    if(c.build){
      h+=`<div class="cscard build">
        <div class="cs-top"><div class="cs-badge" style="background:#8a97b3">${csAbbr(c.id)}</div>
          <div><h4>${esc(c.ten)}</h4><div class="cs-sub">Đang xây dựng</div></div></div>
        <div class="empty" style="padding:18px 0">Cơ sở mới · chưa nhập dữ liệu</div></div>`;
      return;
    }
    let warn='';
    if(lop===0&&gv>0) warn=`<span class="cs-warn">⚠ Chưa nhập lớp</span>`;
    else if(lop>0&&hs/lop<6) warn=`<span class="cs-warn">⚠ Sĩ số bất thường</span>`;
    const cc=Math.round(chuyenCan(c.ten+'cc')*100);
    h+=`<div class="cscard" data-cs="${c.id}">
      <div class="cs-top"><div class="cs-badge" style="background:${avaColor(c.ten)}">${csAbbr(c.id)}</div>
        <div style="min-width:0"><h4>${esc(c.ten)}${warn}</h4><div class="cs-sub">${lop} lớp · ${hs} học sinh</div></div></div>
      <div class="cs-stats">
        <div class="cs-stat"><b>${gv}</b><span>Giáo viên</span></div>
        <div class="cs-stat"><b>${hs}</b><span>Học sinh</span></div>
      </div>
      <div class="cs-mini"><span class="mk" title="Số liệu minh họa">◐</span> Chuyên cần <div class="mbar"><i style="width:${lop?cc:0}%"></i></div> <b style="color:var(--ink)">${lop?cc+'%':'—'}</b></div>
      <div class="cs-rev"><small>Dự thu học phí</small><b>${lop?fmtShort(thu):'Chưa nhập lớp'}</b></div>
      <div class="cs-bar"><i style="width:${Math.max(2,thu/maxThu*100)}%"></i></div>
    </div>`;
  });
  h+='</div>';
  $('#view').innerHTML=h;
  $('#cssort').onchange=e=>{csSort=e.target.value;renderCoso();};
  $$('#view .cscard[data-cs]').forEach(el=>el.onclick=()=>{
    if(USER.role==='admin'){scope=el.dataset.cs;$('#scope').value=scope;}
    gvCs=el.dataset.cs; go('gv');
  });
}

/* ============ LỚP HỌC ============ */
function renderLop(){
  const opts=inCOSO().filter(c=>!c.build);
  let list=inLOP();
  if(USER.role==='admin'&&lopCs!=='all') list=list.filter(l=>l.coSoId===Number(lopCs));
  if(lopSearch.trim()){const q=lopSearch.trim().toLowerCase();list=list.filter(l=>((l.lop||'')+' '+(l.gv||'')).toLowerCase().includes(q));}
  list=list.slice().sort((a,b)=>a.coSoId-b.coSoId);
  const hs=list.reduce((s,l)=>s+(l.siso||0),0), thu=list.reduce((s,l)=>s+(l.duthu||0),0);

  let h=`<div class="toolbar">
    <div class="search">${svg(IC.search,2)}<input id="lopq" placeholder="Tìm lớp hoặc giáo viên…" value="${esc(lopSearch)}"/></div>
    ${USER.role==='admin'?`<select class="fsel" id="lopcs"><option value="all">Tất cả cơ sở</option>${opts.map(c=>`<option value="${c.id}" ${String(lopCs)===String(c.id)?'selected':''}>${esc(c.ten)}</option>`).join('')}</select>`:''}
  </div>`;
  h+=`<div class="panel"><div class="phead"><h3>Danh sách lớp học</h3><span class="sub">${list.length} lớp · ${hs} HS · dự thu ${fmtShort(thu)}</span></div>
    <div class="twrap"><table><thead><tr><th>Lớp</th><th>Giáo viên phụ trách</th>${USER.role==='admin'?'<th>Cơ sở</th>':''}<th class="tright">Sĩ số</th><th class="tright">Dự thu</th></tr></thead><tbody>`;
  if(!list.length){h+=`<tr><td colspan="5"><div class="empty">${svg(IC.lop,1.6)}Chưa có lớp học trong phạm vi này</div></td></tr>`;}
  else list.forEach(l=>{
    h+=`<tr><td><b>${esc(l.lop||'—')}</b> ${l.mon==='TA'?'<span class="badge bg-ta" style="margin-left:4px">TA</span>':''}</td>
      <td>${esc(l.gv||'—')}</td>
      ${USER.role==='admin'?`<td>${esc(csName(l.coSoId))}</td>`:''}
      <td class="tright num">${l.siso||0}</td>
      <td class="tright num">${l.duthu?fmtVND(l.duthu):'—'}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;
  $('#lopq').oninput=e=>{lopSearch=e.target.value;const v=e.target.value;renderLop();$('#lopq').focus();$('#lopq').setSelectionRange(v.length,v.length);};
  const cs=$('#lopcs'); if(cs)cs.onchange=e=>{lopCs=e.target.value;renderLop();};
}

/* ============ KHOẢN THU ============ */
function renderThu(){
  const rows=inCOSO().filter(c=>!c.build).map(c=>({c,...csStat(c.id)})).sort((a,b)=>b.thu-a.thu);
  const total=rows.reduce((s,r)=>s+r.thu,0), totHs=rows.reduce((s,r)=>s+r.hs,0);
  const maxThu=Math.max(1,...rows.map(r=>r.thu));
  let h=`<div class="kpis">
    <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-am">${svg(IC.thu)}</div></div><b>${fmtShort(total)}</b><span>Tổng dự thu</span></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-sky">${svg(IC.users)}</div></div><b>${totHs.toLocaleString('vi-VN')}</b><span>Tổng học sinh</span></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-em">${svg(IC.coso)}</div></div><b>${rows.length}</b><span>Cơ sở có thu</span></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-teal">${svg(IC.thu)}</div></div><b>${fmtShort(totHs?total/totHs:0)}</b><span>BQ mỗi học sinh</span></div>
  </div>`;
  h+=`<div class="panel"><div class="phead"><h3>Dự thu theo cơ sở</h3><span class="sub">Tổng ${fmtVND(total)}</span></div>
    <div class="twrap"><table><thead><tr><th>Cơ sở</th><th class="tright">Lớp</th><th class="tright">Học sinh</th><th class="tright">Dự thu</th><th>Tỷ trọng</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    h+=`<tr style="cursor:pointer" data-cs="${r.c.id}"><td><div class="gvcell"><div class="gvava" style="width:32px;height:32px;font-size:.72rem;background:${avaColor(r.c.ten)}">${csAbbr(r.c.id)}</div><b>${esc(r.c.ten)}</b></div></td>
      <td class="tright num">${r.lop}</td><td class="tright num">${r.hs}</td>
      <td class="tright num">${fmtVND(r.thu)}</td>
      <td style="min-width:120px"><div class="bar" style="height:7px;border-radius:99px;background:var(--soft)"><i style="display:block;height:100%;border-radius:99px;width:${Math.max(3,r.thu/maxThu*100)}%;background:linear-gradient(90deg,var(--brand),var(--emerald))"></i></div></td></tr>`;
  });
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;
  $$('#view tr[data-cs]').forEach(t=>t.onclick=()=>{if(USER.role==='admin'){scope=t.dataset.cs;$('#scope').value=scope;}lopCs=t.dataset.cs;go('lop');});
}

/* ẩn/hiện mật khẩu */
const EYE_ON='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4"/><path d="M6.2 6.3A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
$('#eyeBtn').innerHTML=EYE_ON;
$('#eyeBtn').onclick=()=>{const i=$('#upass');const show=i.type==='password';i.type=show?'text':'password';$('#eyeBtn').innerHTML=show?EYE_OFF:EYE_ON;$('#eyeBtn').setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');i.focus();};

fillCsPick();
</script>
</body>
