      hpChot=soO($('#hv_hpchot'));      // số phải thu đã chốt đến ngày nghỉ (mặc định = số đã thu)
      const thv=$('#hv_thoihoc').value.trim();
      if(thv && !isValidDob(thv)){err('Ngày thôi học chưa đúng dạng ngày/tháng/năm.');$('#hv_thoihoc').focus();return;}
      thIso = thv ? vnToIso(thv) : todayISO();
      lyDo = $('#hv_lydo').value || 'Khác';
    }
    const lopId=Number($('#hv_lop').value);
    // Chuyển sang lớp mà em ĐANG học rồi → sẽ thành 2 lượt ghi danh y hệt trong một lớp
    if(lopId!==h.lopId && anhEm.some(x=>x.lopId===lopId)){
      err('Em này đã có trong lớp '+lopName(lopId)+' rồi. Chọn lớp khác, hoặc đóng hồ sơ này lại nếu muốn gộp.');
      return;
    }
    const daDong=sd>0;
    const patch={ten,ns:$('#hv_ns').value.trim(),ph:$('#hv_ph').value.trim(),sdt:$('#hv_sdt').value.trim(),hocPhi:hp,hocPhiChot:hpChot,soTienDong:sd,daDong,ngayDong:ndIso,ngayNhapHoc:nhIso,ngayThoiHoc:thIso,lyDo:lyDo||'',lopId};
    const btn=$('#hv_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    const {error}=await SB.from('hoc_vien').update({ten:patch.ten,ns:patch.ns,ph:patch.ph,sdt:patch.sdt,hoc_phi:hp,da_dong:daDong,lop_id:lopId,mau:false}).eq('id',h.id);
    btn.disabled=false; btn.textContent='✓ Lưu hồ sơ';
    if(error){err('Lỗi lưu: '+error.message);return;}
    // ---- Em học nhiều lớp: áp thông tin NHÂN THÂN sang các lớp còn lại ----
    if(anhEm.length){
      const ids=anhEm.map(x=>x.id);
      const prof={ten:patch.ten,ns:patch.ns,ph:patch.ph,sdt:patch.sdt};
      const r3=await SB.from('hoc_vien').update(prof).in('id',ids);
      if(r3.error){ err('Đã lưu lớp này, nhưng chưa cập nhật được hồ sơ ở '+ids.length+' lớp còn lại: '+r3.error.message); return; }
      anhEm.forEach(x=>Object.assign(x,prof));
      // Cho thôi học cả các lớp còn lại (nếu lễ tân tích ô)
      const thoiAll=thoi && $('#hv_thoiall') && $('#hv_thoiall').checked;
      if(thoiAll){
        const idSong=anhEmSong.map(x=>x.id);
        const r4=await SB.from('hoc_vien').update({ngay_thoi_hoc:thIso,ly_do_thoi_hoc:lyDo}).in('id',idSong);
        if(r4.error){ err('Đã lưu lớp này, nhưng chưa cho thôi học được các lớp còn lại: '+r4.error.message); return; }
        anhEmSong.forEach(x=>Object.assign(x,{ngayThoiHoc:thIso,lyDo:lyDo||''}));
      }
    }
    // Các cột thêm sau này — nếu thiếu cột thì báo rõ để anh chạy SQL, không im lặng bỏ qua
    const r2=await SB.from('hoc_vien').update({ngay_dong:ndIso,ngay_nhap_hoc:nhIso,ngay_thoi_hoc:thIso,ly_do_thoi_hoc:lyDo,so_tien_dong:sd}).eq('id',h.id);
    if(r2.error){
      err('Đã lưu thông tin cơ bản, nhưng chưa lưu được ngày nhập/thôi học & số tiền: '+r2.error.message
        +' — hãy chạy các file sql-*.sql còn thiếu trong Supabase.');
      Object.assign(h,{ten:patch.ten,ns:patch.ns,ph:patch.ph,sdt:patch.sdt,hocPhi:hp,lopId,mau:false});
      renderHocVien(); return;
    }
    // Số quyết toán để RIÊNG một lệnh: cơ sở nào chưa chạy sql-giai-doan-11 thì chỉ mất
    // riêng số này, chứ ngày thôi học & các thông tin trên vẫn lưu bình thường.
    const r5=await SB.from('hoc_vien').update({hoc_phi_chot:hpChot}).eq('id',h.id);
    if(r5.error){
      patch.hocPhiChot=h.hocPhiChot!=null?h.hocPhiChot:null;
      err(thieuCot(r5.error)
        ? 'Đã lưu hồ sơ, nhưng CHƯA lưu được số quyết toán học phí — cơ sở dữ liệu còn thiếu cột. Hãy chạy file sql-giai-doan-11-quyet-toan-thoi-hoc.sql trong Supabase.'
        : 'Đã lưu hồ sơ, nhưng chưa lưu được số quyết toán: '+r5.error.message);
      Object.assign(h,patch,{mau:false}); renderHocVien(); return;
    }
    Object.assign(h,patch,{mau:false});
    closeModal(); renderHocVien();
  };
  $('#hv_del').onclick=async()=>{
    // Em học nhiều lớp: nói rõ đang xóa khỏi MỘT lớp, rồi hỏi thêm có xóa khỏi tất cả không
    let xoa=[h];
    const msg=(anhEm.length?'Xóa em "'+h.ten+'" khỏi lớp '+lopName(h.lopId)+'?':'Xóa hồ sơ học sinh "'+h.ten+'"?')
      + (hpPhieuCua(h.id).length?('\n\n'+hpPhieuCua(h.id).length+' phiếu thu học phí của lớp này (tổng '+fmtVND(hpDaDong(h.id))+') sẽ bị xóa khỏi sổ quỹ.'):'')
      + (anhEm.length?('\n\nEm vẫn còn '+anhEm.length+' lớp khác: '+anhEm.map(x=>lopName(x.lopId)).join(', ')):'')
      + '\n\nThao tác này không thể hoàn tác.';
    if(!await avaConfirm(msg,{danger:true,okText:'Xóa'}))return;
    if(anhEm.length && await avaConfirm('Xóa luôn em khỏi cả '+anhEm.length+' lớp còn lại ('+anhEm.map(x=>lopName(x.lopId)).join(', ')+')?\n\nBấm Hủy nếu chỉ muốn xóa khỏi lớp '+lopName(h.lopId)+'.',
        {danger:true,okText:'Xóa khỏi tất cả',cancelText:'Chỉ lớp này'})) xoa=[h,...anhEm];
    const ps=xoa.flatMap(x=>hpPhieuCua(x.id));
    for(const p of ps){ if(daChotKy(p.coSoId,p.ngay)){ err('Không xóa được: phiếu thu học phí '+soPhieu(p)+' thuộc kỳ sổ quỹ đã chốt. Hãy nhờ Quản trị mở khóa kỳ đó trước.'); return; } }
    const hvIds=xoa.map(x=>x.id);
    // Xóa điểm danh của em TRƯỚC, nếu không sẽ để lại bản ghi mồ côi làm bảng điều hành
    // vẫn hiện "có mặt" của em đã xóa (chuyên cần, buổi điểm danh hôm nay, hoạt động gần đây).
    await SB.from('diem_danh_hv').delete().in('hv_id',hvIds);
    const {error}=await SB.from('hoc_vien').delete().in('id',hvIds);
    if(error){err('Lỗi xóa: '+error.message);return;}
    OPS.hv=OPS.hv.filter(x=>!hvIds.includes(x.id));
    for(const k in OPS.ddHV){ hvIds.forEach(id=>delete OPS.ddHV[k][id]); if(!Object.keys(OPS.ddHV[k]).length) delete OPS.ddHV[k]; }
    if(ps.length){                                   // xóa các phiếu thu học phí kèm theo
      const ids=ps.map(p=>p.id);
      await SB.from('so_quy').delete().in('id',ids);
      OPS.gd=OPS.gd.filter(g=>!ids.includes(g.id));
    }
    closeModal(); renderHocVien();
  };
}
/* ---- Khối "các đợt đóng học phí" trong hồ sơ học sinh ---- */
function hpDotHTML(h){
  const ps=hpPhieuCua(h.id), da=hpDaHT(h), hp=h.hocPhi||0, con=Math.max(0,hp-da);
  const rows=ps.map((p,i)=>`<div class="ddrow" style="padding:8px 10px">
      <div class="idx">${i+1}</div>
      <div class="nm"><b>${fmtVND(p.soTien)}</b><small>${isoVN(p.ngay)} · ${esc(soPhieu(p))}${p.nguoiNop?' · '+esc(p.nguoiNop):''}${p.hinhThuc==='chuyen_khoan'?' · CK':''}</small></div>
      ${daChotKy(p.coSoId,p.ngay)?'<span class="paidtag yes">🔒 đã chốt sổ</span>':`<button class="btn btn-sm btn-light" data-xoadot="${p.id}" style="color:var(--rose)">Xóa đợt</button>`}
    </div>`).join('');
  return `<label>Các đợt đóng học phí <span style="font-weight:600;color:var(--muted)">· mỗi đợt là một phiếu thu trong sổ quỹ</span></label>
    <div class="ddsum" style="margin:6px 0 8px">
      <div class="p co"><b>${fmtVND(da)}</b><span>đã đóng</span></div>
      <div class="p ${con>0?'muon':'done'}"><b>${fmtVND(con)}</b><span>còn phải thu</span></div>
      <div class="p"><b>${ps.length}</b><span>đợt</span></div>
    </div>
    ${ps.length?`<div class="ddgrid" style="max-height:30vh;overflow:auto">${rows}</div>`
      :(da>0?`<div class="g-note" style="margin:0 0 8px"><span>ℹ️</span><div>Hồ sơ ghi <b>${fmtVND(da)}</b> đã đóng nhưng <b>chưa có phiếu thu</b> trong sổ quỹ (số liệu nhập tay trước đây). Nên ghi nhận lại thành một đợt bên dưới để sổ quỹ có chứng từ.</div></div>`
        :'<div class="muted" style="font-size:.82rem;padding:4px 2px 8px">Chưa ghi nhận đợt đóng nào.</div>')}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:9px">
      <div style="flex:1;min-width:110px"><label style="font-size:.7rem">Số tiền đợt này</label>
        <input id="hv_dotTien" inputmode="numeric" placeholder="${con>0?fmtVND(con).replace('₫',''):'VD: 200.000'}" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-weight:700"/></div>
      <div style="flex:1;min-width:110px"><label style="font-size:.7rem">Ngày đóng</label>
        <input id="hv_dotNgay" placeholder="dd/mm/yyyy" value="${isoVN(todayISO())}" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-weight:700"/></div>
      <div style="flex:1;min-width:110px"><label style="font-size:.7rem">Người nộp</label>
        <input id="hv_dotNguoi" value="${esc(h.ph||'')}" placeholder="Tên phụ huynh" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px"/></div>
      <div style="flex:1;min-width:110px"><label style="font-size:.7rem">Hình thức</label>
        <select id="hv_dotHT" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-weight:700"><option value="tien_mat">Tiền mặt</option><option value="chuyen_khoan">Chuyển khoản</option></select></div>
      <button class="btn btn-sm btn-primary" id="hv_dotAdd" style="white-space:nowrap">＋ Ghi nhận đóng tiền</button>
    </div>
    <div id="hv_dotErr" style="display:none;color:#c0392b;font-size:.82rem;font-weight:600;margin-top:6px"></div>`;
}
function bindHpDot(h){
  const box=$('#hv_dotBox'); if(!box)return;
  attachMoneyFormat($('#hv_dotTien')); attachDateFormat($('#hv_dotNgay'));
  const err=m=>{const e=$('#hv_dotErr');if(e){e.textContent=m||'';e.style.display=m?'block':'none';}};
  const lamMoi=()=>{ box.innerHTML=hpDotHTML(h); bindHpDot(h); };
  $('#hv_dotAdd').onclick=async()=>{
    const sd=Number(String($('#hv_dotTien').value).replace(/[^\d]/g,''))||0;
    const nv=$('#hv_dotNgay').value.trim();
    if(sd<=0){err('Nhập số tiền đợt này.');$('#hv_dotTien').focus();return;}
    if(nv&&!isValidDob(nv)){err('Ngày đóng chưa đúng dạng ngày/tháng/năm.');$('#hv_dotNgay').focus();return;}
    const ngay=nv?vnToIso(nv):todayISO();
    const hp=Number(String($('#hv_hp').value).replace(/[^\d]/g,''))||h.hocPhi||0;
    h.hocPhi=hp;                                     // lấy học phí đang hiển thị để tính "còn phải thu"
    const da=hpDaHT(h);
    if(hp>0 && da+sd>hp){
      if(!await avaConfirm('Tổng đã đóng sẽ là '+fmtVND(da+sd)+', VƯỢT học phí cả khóa ('+fmtVND(hp)+').\nVẫn ghi nhận?'))return;
    }
    if(await chanKyChot(h.coSoId,ngay,'ghi nhận đóng tiền'))return;
    const btn=$('#hv_dotAdd'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    const r=await themDotDong(h,{soTien:sd,ngay,nguoiNop:$('#hv_dotNguoi').value.trim(),hinhThuc:$('#hv_dotHT').value});
    btn.disabled=false; btn.textContent='＋ Ghi nhận đóng tiền';
    if(r.error){ await baoLoiGhiSo(r.loi||r.error,h.coSoId,ngay,'ghi nhận đóng tiền',err); return; }
    lamMoi();
  };
  $$('#hv_dotBox [data-xoadot]').forEach(b=>b.onclick=async()=>{
    const id=Number(b.dataset.xoadot), p=OPS.gd.find(x=>x.id===id); if(!p)return;
    if(!await avaConfirm('Xóa đợt đóng '+fmtVND(p.soTien)+' ngày '+isoVN(p.ngay)+' (phiếu '+soPhieu(p)+')?\nPhiếu thu này sẽ bị xóa khỏi sổ quỹ.',{danger:true,okText:'Xóa'}))return;
    const {error}=await SB.from('so_quy').delete().eq('id',id);
    if(error){ await baoLoiGhiSo(error,p.coSoId,p.ngay,'xóa đợt đóng',err); return; }
    OPS.gd=OPS.gd.filter(x=>x.id!==id);
    await capNhatTongDong(h);
    lamMoi();
  });
}

  const impB=$('#hsImp'); if(impB)impB.onclick=()=>hsImportExcel(lop);
  const hpEl=$('#gd_hp'); if(hpEl)attachMoneyFormat(hpEl); attachDateFormat($('#gd_ns')); attachDateFormat($('#gd_nhaphoc'));
  // Gõ xong họ tên: nếu em này ĐÃ học lớp khác trong cơ sở thì tự điền lại hồ sơ cũ.
  // Vừa đỡ gõ, vừa để ngày sinh khớp nhau — có khớp thì hệ thống mới nhận ra là MỘT em.
  $('#gd_ten').onblur=()=>{

    const e=cu[cu.length-1];                       // bản ghi danh gần nhất của em đó

    const cu2=$('#gd_goi'); if(cu2)cu2.remove();
    $('#gd_ten').insertAdjacentHTML('afterend',`<div id="gd_goi" class="muted" style="font-size:.76rem;font-weight:600;margin-top:5px;color:var(--violet)">

  };
  $('#gd_add').onclick=async()=>{
    const ten=$('#gd_ten').value.trim(); if(!ten){$('#gd_ten').focus();return;}
    if(!isValidDob($('#gd_ns').value)){avaAlert('Ngày sinh chưa đúng dạng ngày/tháng/năm (VD: 01/09/2015).');$('#gd_ns').focus();return;}

    if(nhTxt&&!vnToIso(nhTxt)){avaAlert('Thời gian nhập học chưa đúng dạng ngày/tháng/năm (VD: 30/06/2026).');$('#gd_nhaphoc').focus();return;}
    const nhIso=vnToIso(nhTxt)||todayISO(); gdNhapHoc=nhIso;   // giữ lại cho em tiếp theo
    const ns=$('#gd_ns').value.trim(), nsIso=vnToIso(ns);
    // Chặn trùng: cùng tên trong cùng cơ sở, ngày sinh không mâu thuẫn
    // Chỉ cảnh báo khi trùng THẬT: cùng lớp + cùng tên + ngày sinh không mâu thuẫn.
    // Cùng tên nhưng khác lớp = em học thêm lớp nữa → cho ghi danh thẳng, không hỏi han.
    const hopNS=h=>{const a=vnToIso(h.ns);return !a||!nsIso||a===nsIso;};
    const cu=OPS.hv.find(h=>h.lopId===lop.id&&nameKey(h.ten)===nameKey(ten)&&hopNS(h));
    if(cu&&!await avaConfirm('Lớp '+lop.lop+' đã có học sinh tên "'+ten+'"'+(cu.ns?' (sinh '+cu.ns+')':'')+'.\n\nĐây có phải một em KHÁC trùng tên không?',{okText:'Đúng, vẫn ghi danh'}))return;
    const _hpEl=$('#gd_hp');
    const rec={ten,ns,ph:$('#gd_ph').value.trim(),sdt:$('#gd_sdt').value.trim(),hocPhi:_hpEl?Number(_hpEl.value.replace(/\D/g,''))||0:0,lopId:ghiLopId,coSoId:lop.coSoId,mau:false};
    const {data,error}=await SB.from('hoc_vien').insert(hvToDb(rec)).select().single();
    if(error){avaAlert('Lỗi ghi danh: '+error.message);return;}
    await SB.from('hoc_vien').update({ngay_nhap_hoc:nhIso}).eq('id',data.id);   // bỏ qua êm nếu chưa chạy SQL
    const obj=hvFromDb(data); obj.ngayNhapHoc=obj.ngayNhapHoc||nhIso;
    OPS.hv.push(obj);renderGhiDanh();
  };
  $$('#view [data-del]').forEach(b=>b.onclick=async()=>{const id=Number(b.dataset.del);
    await SB.from('diem_danh_hv').delete().eq('hv_id',id);        // xóa điểm danh kèm theo
    const {error}=await SB.from('hoc_vien').delete().eq('id',id);
    if(error){avaAlert('Lỗi xóa: '+error.message);return;}
    OPS.hv=OPS.hv.filter(x=>x.id!==id);
    for(const k in OPS.ddHV){ delete OPS.ddHV[k][id]; if(!Object.keys(OPS.ddHV[k]).length) delete OPS.ddHV[k]; }
    renderGhiDanh();});
  renderNavCounts();
}

/* ============ ĐIỂM DANH ============ */
function renderDiemDanh(){
  const lops=inLOP().filter(lopDiemDanhDuoc);
  if(!lops.length){$('#view').innerHTML=`<div class="panel"><div class="pbody"><div class="empty">Chưa có lớp học trong phạm vi này</div></div></div>`;return;}
  if(!lops.find(l=>l.id===ddLopId)) ddLopId=lops[0].id;
  const lop=LOP.find(l=>l.id===ddLopId), ds=hvOfLop(ddLopId).filter(hvActive);
  const ddKey=ddLopId+'|'+ddDate, state=OPS.ddHV[ddKey]||{};
  const ccKey='cc|'+ddLopId+'|'+ddDate, cc=OPS.ccGV[ccKey]||'';
  const cnt={co:0,muon:0,phep:0,vang:0}; ds.forEach(v=>{if(state[v.id])cnt[state[v.id]]++;});
  const marked=cnt.co+cnt.muon+cnt.phep+cnt.vang;
  const ca=caOf(ddLopId,ddDate);                 // trạng thái duyệt ca này
  const canEdit=!(ca&&ca.st==='da_chot');        // đã chốt → khóa (mọi vai trò; admin mở khóa để sửa)
  const dis=canEdit?'':'disabled';
  const lich=lichLopNgay(ddLopId,ddDate);        // lớp này hôm đó học ca nào (null = ngoài lịch)
  const dsCa=caNgay(ddDate,scopeIds());          // toàn bộ ca có lịch trong ngày, theo phạm vi
  // Ai dạy buổi này. GV tự chấm cho mình; lễ tân/quản trị chọn được người dạy thay.
  const gvDay=(()=>{
    const id=gvDayBuoi(ddLopId,ddDate);
    const ten=gvTenBuoi(ddLopId,ddDate), thay=laDayThay(ddLopId,ddDate);
    const chonDuoc = ccLive && USER.role!=='teacher';
    const dsGV=GV.filter(g=>g.coSoId===lop.coSoId).slice().sort((a,b)=>String(a.ten).localeCompare(b.ten,'vi'));
    const opts=`<option value="">— Chưa xác định —</option>`+dsGV.map(g=>
      `<option value="${g.id}" ${g.id===id?'selected':''}>${esc(g.ten)}${lop.gvId===g.id?' (phụ trách lớp)':''}</option>`).join('');
    return {id,ten,thay,chonDuoc,opts};
  })();

  let h=`${tbBarHTML()}
  <div class="toolbar">
    <div style="display:grid;gap:6px"><label style="font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.04em">NGÀY ĐIỂM DANH</label>
      <input type="date" class="fsel" id="ddDate" value="${ddDate}"/></div>
    <div style="display:grid;gap:6px;flex:1;min-width:180px"><label style="font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.04em">LỚP</label>
      <select class="fsel" id="ddLop" style="max-width:100%">${lopPickHTML(ddLopId)}</select></div>
  </div>
  ${caNgayPanel(dsCa)}
  ${duyetBar(ca,lop,lich)}
  <div class="panel"><div class="phead"><h3>Chấm công giáo viên</h3>${cc?'<span class="savednote">✓ '+CC_LABEL[cc]+'</span>':'<span class="sub">chưa chấm công</span>'}</div>
    <div class="pbody"><div class="ddrow" style="border:0;padding:0">
      <div class="gvava" style="width:40px;height:40px;background:${avaColor(gvDay.ten||'?')}">${initials(gvDay.ten||'?')}</div>
      <div class="nm"><b>${esc(gvDay.ten||'—')}</b>${gvDay.thay?'<span class="paidtag" style="background:var(--violet-soft);color:var(--violet);border-color:#d6c8f5">dạy thay</span>':''}
        <small>Lớp ${esc(lop.lop)}${USER.role==='admin'?' · '+esc(csName(lop.coSoId)):''}</small></div>
      <div class="seg" id="ccSeg">${['day','nghi','bu'].map(v=>`<button data-v="${v}" class="${cc===v?'on-'+v:''}" ${dis}>${CC_LABEL[v]}</button>`).join('')}</div>
    </div>
    ${gvDay.chonDuoc?`<div style="display:grid;gap:5px;margin-top:12px">
      <label style="font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.04em">GIÁO VIÊN DẠY BUỔI NÀY</label>
      <select class="fsel" id="ccGvSel" style="max-width:100%" ${dis}>${gvDay.opts}</select>
      <span class="muted" style="font-size:.74rem;font-weight:600">Mặc định là giáo viên phụ trách lớp. Có người dạy thay thì chọn đúng tên để tính công cho họ.</span>
    </div>`:''}
    </div>
  </div>
  <div class="panel"><div class="phead"><h3>Điểm danh học sinh</h3><span class="savednote">✓ tự động lưu</span></div>
    <div class="pbody">`;
  if(!ds.length){
    // GV không được ghi danh (đang tạm khóa) → chỉ dẫn báo lễ tân, đừng đưa nút dẫn tới trang họ không vào được
    h+=`<div class="empty">${svg(IC.diemdanh,1.5)}Lớp này chưa có danh sách học sinh để điểm danh.${
      (USER.role==='teacher'&&!GV_DUOC_GHI_DANH)?'<br/><span style="font-size:.85rem">Hãy báo lễ tân cơ sở thêm học sinh vào lớp.</span>'
      :'<br/><button class="btn btn-sm btn-ghost" id="toGhi" style="margin-top:12px">→ Sang trang Ghi danh</button>'}</div>`;
  }else{
    h+=`<div class="ddsum">
      <div class="p co"><b>${cnt.co}</b><span>có mặt</span></div>
      <div class="p muon"><b>${cnt.muon}</b><span>muộn</span></div>
      <div class="p phep"><b>${cnt.phep}</b><span>phép</span></div>
      <div class="p vang"><b>${cnt.vang}</b><span>vắng</span></div>
      <div class="p done"><b>${marked}/${ds.length}</b><span>đã điểm</span></div>
    </div>
    <div class="ddgrid">
      <div class="ddrow ddh"><div class="idx">TT</div><div class="nm">HỌC SINH</div><span class="hh">ĐIỂM DANH</span></div>`;
    ds.forEach((v,i)=>{
      h+=`<div class="ddrow"><div class="idx">${i+1}</div>
        <div class="nm"><b>${esc(v.ten)}</b>${v.ns?`<small>${esc(v.ns)}</small>`:''}</div>
        <div class="attseg ddSeg" data-hv="${v.id}">${[['co','Có'],['muon','Muộn'],['phep','Phép'],['vang','Vắng']].map(([k,t])=>`<button data-v="${k}" class="${state[v.id]===k?'on':''}" ${dis}>${t}</button>`).join('')}</div>
      </div>`;
    });
    h+=`</div>`;
  }
  h+='</div></div>';
  $('#view').innerHTML=h;
  tbBarBind();
  $('#ddDate').onchange=e=>{ddDate=e.target.value;renderDiemDanh();};
  $('#ddLop').onchange=e=>{ddLopId=Number(e.target.value);renderDiemDanh();};
  const tg=$('#toGhi'); if(tg)tg.onclick=()=>{ghiLopId=ddLopId;go('ghidanh');};
  $$('#view .carow[data-ca]').forEach(r=>r.onclick=()=>{ddLopId=Number(r.dataset.ca);renderDiemDanh();});
  const tl=$('#toLich'); if(tl)tl.onclick=()=>go('lichhoc');
  const pr=$('#ddPrint'); if(pr)pr.onclick=()=>inDiemDanh(ddLopId,ddDate);
  // Nút hành động luồng duyệt (Gửi đối soát / Chấp nhận / Chốt / Mở khóa)
  const caBtn=$('#caAct');
  if(caBtn) caBtn.onclick=async()=>{
    const act=caBtn.dataset.act; caBtn.disabled=true; let r;
    if(act==='submit'||act==='ownersubmit'){ if(!marked&&!cc){caBtn.disabled=false;avaAlert('Chưa điểm danh gì để gửi đối soát.');return;} r=await caSetState(ddLopId,ddDate,lop.coSoId, act==='ownersubmit'?'da_doi_soat':'cho_duyet'); }
    else if(act==='accept') r=await caSetState(ddLopId,ddDate,lop.coSoId,'da_doi_soat');
    else if(act==='chot'){ if(!await avaConfirm('Chốt số liệu ca "'+lop.lop+'" ngày '+isoVN(ddDate)+'?\nSau khi chốt sẽ KHÓA, muốn sửa phải Mở khóa.')){caBtn.disabled=false;return;} r=await caSetState(ddLopId,ddDate,lop.coSoId,'da_chot'); }
    else if(act==='unlock'){ if(!await avaConfirm('Mở khóa ca này để sửa lại điểm danh?')){caBtn.disabled=false;return;} r=await caUnlock(ddLopId,ddDate); }
    if(r&&r.error){avaAlert('Lỗi: '+r.error);caBtn.disabled=false;return;}
    renderDiemDanh();
  };
  // Ai được ghi là người dạy: GV tự chấm → chính mình; lễ tân/quản trị → theo ô đã chọn
  const gvGhi=()=>{
    if(USER.role==='teacher') return USER.gvId!=null?USER.gvId:null;
    const sel=$('#ccGvSel');
    if(sel) return sel.value?Number(sel.value):null;
    return gvDay.id;
  };
  $$('#ccSeg button').forEach(b=>b.onclick=async()=>{
    if(!canEdit)return;
    if(cc===b.dataset.v){
      const {error}=await SB.from('cham_cong_gv').delete().eq('lop_id',ddLopId).eq('ngay',ddDate);
      if(error){avaAlert('Lỗi lưu chấm công: '+error.message);return;}
      delete OPS.ccGV[ccKey]; delete OPS.ccGvId[ccKey];
    }else{
      const gid=gvGhi();
      const row={lop_id:ddLopId,ngay:ddDate,coso_id:lop.coSoId,trang_thai:b.dataset.v};
      if(ccLive) row.gv_id=gid;                    // chưa chạy SQL thì bỏ qua êm, không làm hỏng chấm công
      const {error}=await SB.from('cham_cong_gv').upsert(row,{onConflict:'lop_id,ngay'});
      if(error){avaAlert('Lỗi lưu chấm công: '+error.message);return;}
      OPS.ccGV[ccKey]=b.dataset.v;
      if(ccLive){ if(gid!=null)OPS.ccGvId[ccKey]=gid; else delete OPS.ccGvId[ccKey]; }
    }
    renderDiemDanh();
  });
  // Đổi người dạy khi ĐÃ chấm công → cập nhật ngay; chưa chấm thì để dành, bấm Lên lớp mới ghi
  const ccSel=$('#ccGvSel');
  if(ccSel) ccSel.onchange=async()=>{
    if(!canEdit)return;
    const gid=ccSel.value?Number(ccSel.value):null;
    if(!cc) return;                    // chưa chấm công: giữ nguyên lựa chọn trên ô, bấm Lên lớp sẽ ghi kèm
    const {error}=await SB.from('cham_cong_gv').update({gv_id:gid}).eq('lop_id',ddLopId).eq('ngay',ddDate);
    if(error){avaAlert('Lỗi đổi giáo viên dạy: '+error.message);return;}
    if(gid!=null)OPS.ccGvId[ccKey]=gid; else delete OPS.ccGvId[ccKey];
    renderDiemDanh();
  };
  $$('#view .ddSeg').forEach(seg=>{const id=Number(seg.dataset.hv);
    seg.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
      if(!canEdit)return;
      OPS.ddHV[ddKey]=OPS.ddHV[ddKey]||{};
      if(OPS.ddHV[ddKey][id]===b.dataset.v){
        const {error}=await SB.from('diem_danh_hv').delete().eq('lop_id',ddLopId).eq('ngay',ddDate).eq('hv_id',id);
        if(error){avaAlert('Lỗi lưu điểm danh: '+error.message);return;}
        delete OPS.ddHV[ddKey][id];
      }else{
        const {error}=await SB.from('diem_danh_hv').upsert({lop_id:ddLopId,ngay:ddDate,hv_id:id,coso_id:lop.coSoId,trang_thai:b.dataset.v},{onConflict:'lop_id,ngay,hv_id'});
        if(error){avaAlert('Lỗi lưu điểm danh: '+error.message);return;}
        OPS.ddHV[ddKey][id]=b.dataset.v;
      }
      renderDiemDanh();});
  });
}
/* Danh sách các CA có lịch trong ngày đang chọn — bấm 1 ca là nhảy thẳng vào điểm danh lớp đó.
   Mỗi ca hiện: giờ, phòng, đã điểm bao nhiêu em, trạng thái đối soát. */
function caNgayPanel(dsCa){
  const thuTxt=THU_DAI[thuOf(ddDate)]||'', canSua=USER.role!=='teacher';
  if(!dsCa.length){
    if(!caLive) return '';    // chưa chạy SQL Giai đoạn 6 → giữ nguyên giao diện cũ
    return `<div class="panel"><div class="phead"><h3>Ca trong ngày</h3><span class="sub">${thuTxt} · ${isoVN(ddDate)}</span></div>
      <div class="pbody"><div class="empty">${svg(IC.lichhoc,1.5)}${thuTxt} không có lớp nào theo lịch.
      ${canSua?'<br/><button class="btn btn-sm btn-ghost" id="toLich" style="margin-top:12px">→ Khai lịch học cho lớp</button>':''}</div></div></div>`;
  }
  const rows=dsCa.map(x=>{
    const m=OPS.ddHV[x.lop.id+'|'+ddDate]||{}, da=Object.keys(m).length;
    const tong=hvOfLop(x.lop.id).filter(hvActive).length;
    const c=caOf(x.lop.id,ddDate), gio=caGio(x.coSoId,x.caMa);
    const chip=c?`<span class="castat ${CA_CLS[c.st]}">${CA_LABEL[c.st]}</span>`
      :`<span class="castat ca-none">${da?da+'/'+tong+' đã điểm':'chưa điểm danh'}</span>`;
    return `<div class="carow ${x.lop.id===ddLopId?'on':''}" data-ca="${x.lop.id}">
      <div class="cabad">${x.caMa}</div>
      <div class="cainf"><b>${esc(x.lop.lop)}</b><small>${esc(x.gv||'chưa phân công GV')}${USER.role==='admin'?' · '+esc(csName(x.coSoId)):''} · ${da}/${tong} đã điểm</small></div>
      <div class="cast">${gio?`<span class="cagio">${esc(gio)}</span>`:''}${x.phong?`<span class="caphong">${esc(x.phong)}</span>`:''}${chip}</div>
    </div>`;}).join('');
  return `<div class="panel"><div class="phead"><h3>${USER.role==='teacher'?'Ca dạy của tôi':'Ca trong ngày'}</h3>
      <span class="sub">${thuTxt} · ${isoVN(ddDate)} · ${dsCa.length} ca</span></div>
    <div class="pbody"><div class="calist">${rows}</div></div></div>`;
}
/* Thanh trạng thái + nút hành động luồng duyệt trên màn Điểm danh (theo vai trò) */
function duyetBar(ca,lop,lich){
  const st=ca?ca.st:null;
  const chip = st?`<span class="castat ${CA_CLS[st]}">${CA_LABEL[st]}</span>`:`<span class="castat ca-none">Chưa gửi đối soát</span>`;
  let action='';
  const info=m=>`<span class="muted" style="font-size:.8rem;font-weight:600">${m}</span>`;
  if(USER.role==='teacher'){
    if(st==='da_chot') action=info('🔒 Đã chốt — không sửa được');
    else if(st==='da_doi_soat') action=info('✓ Lễ tân đã đối soát · chờ Quản trị chốt');   // không cho GV kéo ngược về "chờ" (sẽ vướng RLS)
    else action=`<button class="btn btn-sm btn-primary" id="caAct" data-act="submit">${st==='cho_duyet'?'↻ Gửi lại đối soát':'✓ Gửi đối soát'}</button>`;
  } else if(USER.role==='owner'){
    if(st==='cho_duyet') action=`<button class="btn btn-sm btn-primary" id="caAct" data-act="accept">✓ Chấp nhận (đối soát)</button>`;
    else if(st==='da_doi_soat') action=info('Đã đối soát · chờ Quản trị chốt');
    else if(st==='da_chot') action=info('🔒 Đã chốt');
    else action=`<button class="btn btn-sm btn-primary" id="caAct" data-act="ownersubmit">✓ Gửi đối soát</button>`;   // cơ sở không có TK giáo viên: lễ tân tự điểm danh & gửi thẳng
  } else if(USER.role==='admin'){
    if(st==='da_chot') action=`<button class="btn btn-sm btn-light" id="caAct" data-act="unlock" style="color:var(--rose)">🔓 Mở khóa</button>`;
    else if(st) action=`<button class="btn btn-sm btn-primary" id="caAct" data-act="chot">✓ Chốt số liệu</button>`;
    else action=info('Chưa có điểm danh gửi lên');
  }
  // Nhãn ca: có lịch thì hiện "Ca 1 · 07:00 – 09:00 · Phòng 3"; không có lịch thì báo là buổi ngoài lịch
  let caTxt=`Ca dạy · ${isoVN(ddDate)}`, extra='';
  if(lich){
    const gio=caGio(lop.coSoId,lich.caMa);
    caTxt=`Ca ${lich.caMa} · ${isoVN(ddDate)}`;
    extra=`${gio?`<span class="cagio">${esc(gio)}</span>`:''}${lich.phong?`<span class="caphong">${esc(lich.phong)}</span>`:''}`;
  } else if(caLive && lichOfLop(ddLopId).length){
    extra=`<span class="cangoai" title="Lớp này không có lịch vào ngày đã chọn">ngoài lịch</span>`;
  }
  const inBtn=`<button class="btn btn-sm btn-light" id="ddPrint" style="white-space:nowrap">🖶 In danh sách</button>`;
  return `<div class="panel"><div class="pbody" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px">
    <b style="font-size:.82rem">${caTxt}</b>${extra}${chip}<div style="flex:1"></div>${inBtn}${action}</div></div>`;
}

/* ============ ĐỐI SOÁT (Lễ tân) / CHỐT (Quản trị) ============ */
let duyetFilter=null;
function renderDuyet(){
  if(USER.role==='teacher'){go('diemdanh');return;}
  const isAdm=USER.role==='admin', ids=scopeIds();
  const list=[];
  for(const k in OPS.duyet){ const c=OPS.duyet[k]; const p=k.split('|'); const lopId=Number(p[0]), ngay=p[1];
    const lop=LOP.find(l=>l.id===lopId); if(!lop||!ids.includes(lop.coSoId))continue;
    const m=OPS.ddHV[k]?Object.values(OPS.ddHV[k]):[]; const co=m.filter(s=>s==='co'||s==='muon').length;
    list.push({lopId,ngay,lop,st:c.st,co,tot:m.length});
  }
  list.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  const cnt={cho:list.filter(x=>x.st==='cho_duyet').length,soat:list.filter(x=>x.st==='da_doi_soat').length,chot:list.filter(x=>x.st==='da_chot').length};
  const f=duyetFilter||(isAdm?'da_doi_soat':'cho_duyet');
  const shown=f==='all'?list:list.filter(x=>x.st===f);
  const fopts=[['cho_duyet','Chờ đối soát ('+cnt.cho+')'],['da_doi_soat','Đã đối soát ('+cnt.soat+')'],['da_chot','Đã chốt ('+cnt.chot+')'],['all','Tất cả ('+list.length+')']];
  const fsel=`<select class="fsel" id="dzFilter" style="flex:1;min-width:180px;max-width:100%">${fopts.map(([k,t])=>`<option value="${k}" ${f===k?'selected':''}>${t}</option>`).join('')}</select>`;
  let h=`<div class="toolbar">${fsel}<button class="btn btn-sm btn-light" id="dzPrint" style="white-space:nowrap">🖶 In biên bản</button><button class="btn btn-sm btn-ghost" id="dzReload" style="white-space:nowrap">↻ Tải lại</button></div>
   <div class="panel"><div class="phead"><h3>${isAdm?'Chốt số liệu ca dạy':'Đối soát điểm danh'}</h3><span class="sub">${shown.length} ca</span></div>
   <div class="pbody">

/* ============ LỊCH HỌC THEO CA ============
   Quản trị / Lễ tân: khai khung ca của cơ sở + lịch từng lớp, xem thời khóa biểu tuần.
   Giáo viên: chỉ XEM lịch dạy của mình. */
let lhCs='auto';                       // cơ sở đang xem (admin chọn); 'auto' = theo ô Phạm vi
let lhGv='all';                        // lọc lưới lịch theo 1 giáo viên (để soi chỗ xếp trùng)
function lhCoSo(){
  if(USER.role!=='admin') return USER.coSoId;
  if(lhCs!=='auto') return Number(lhCs);
  return scope!=='all' ? Number(scope) : (inCOSO().filter(c=>!c.build)[0]||{id:0}).id;
}
/* Dò lịch xếp trùng GIỜ trong 1 cơ sở.
   Ý nghĩa: cùng MỘT giáo viên (hoặc MỘT phòng) bị xếp cho NHIỀU LỚP trong cùng thứ + ca.
   KHÔNG phải lỗi "một lớp có hai giáo viên" — mỗi lớp vẫn chỉ có một GV phụ trách.
   Gom cả nhóm (3 lớp cùng ca thì gom thành 1 chỗ, không tách thành 3 cặp rời rạc). */
function lichTrung(coSoId){
  const oGv={}, oPh={}, dup=new Set();
  OPS.lich.forEach(x=>{
    const lop=LOP.find(l=>l.id===x.lopId); if(!lop||lop.coSoId!==coSoId)return;
    const slot=x.thu+'|'+x.caMa;
    // Xét GV THỰC DẠY BUỔI ĐÓ, không xét GV phụ trách lớp — vì một lớp có thể
    // học 2 buổi với 2 giáo viên khác nhau, hai buổi đó không hề trùng nhau.
    const gvB=(x.gvId!=null?gvTen(x.gvId):'')||lop.gv||'';
    if(gvB){ const k=slot+'|'+nameKey(gvB);           // bỏ qua hoa/thường & khoảng trắng thừa
      const g=oGv[k]=oGv[k]||{thu:x.thu,caMa:x.caMa,ten:gvB,lops:[]};
      if(!g.lops.some(l=>l.id===lop.id))g.lops.push(lop); }
    if(x.phong){ const k=slot+'|'+phongKey(x.phong);   // "Phòng 1" và "phòng 1" là một
      const g=oPh[k]=oPh[k]||{thu:x.thu,caMa:x.caMa,ten:x.phong,lops:[]};
      if(!g.lops.some(l=>l.id===lop.id))g.lops.push(lop); }
  });
  const loc=o=>Object.values(o).filter(g=>g.lops.length>1).sort((a,b)=>a.thu-b.thu||a.caMa-b.caMa);
  const gv=loc(oGv), ph=loc(oPh);
  [...gv,...ph].forEach(g=>g.lops.forEach(l=>dup.add(l.id)));
  return {gv,ph,dup};
}
/* Gom các chỗ trùng theo TỪNG giáo viên để lễ tân xử lý gọn từng người một */
function trungTheoGV(ds){
  const m={};
  ds.forEach(g=>{const k=nameKey(g.ten);(m[k]=m[k]||{ten:g.ten,slots:[]}).slots.push(g);});
  return Object.values(m).sort((a,b)=>b.slots.length-a.slots.length);
}

    if(rows.some(r=>!gioHopLe(r.bd)||!gioHopLe(r.kt))){err('Giờ phải ghi dạng 14:00 (giờ 0–23, phút 0–59) hoặc để trống.');return;}
    const apHet=$('#kc_all')&&$('#kc_all').checked;
    if(apHet && !await avaConfirm('Áp khung giờ này cho tất cả '+COSO.length+' cơ sở?\n\nCác ca cùng số hiệu ở mọi cơ sở sẽ lấy tên và giờ theo bảng này.',{okText:'Áp cho tất cả'}))return;
    const giu=rows.map(r=>r.ma);
    const cu=(OPS.ca[coSoId]||[]).filter(c=>!giu.includes(c.ma));
    // Xóa một ca mà vẫn còn lớp xếp vào ca đó → lịch những lớp ấy sẽ biến mất khỏi lưới. Hỏi trước.
    const keo=cu.length?OPS.lich.filter(x=>x.coSoId===coSoId&&cu.some(c=>c.ma===x.caMa)):[];
    if(keo.length){
      const ten=[...new Set(keo.map(x=>(LOP.find(l=>l.id===x.lopId)||{}).lop).filter(Boolean))];
      if(!await avaConfirm('Ca sắp xóa vẫn còn '+keo.length+' buổi của '+ten.length+' lớp: '+ten.slice(0,6).join(', ')+(ten.length>6?'…':'')
        +'.\n\nXóa ca thì lịch các buổi đó KHÔNG còn hiển thị. Vẫn xóa?')) return;
    }
    const btn=$('#kc_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    if(cu.length){ const {error}=await SB.from('ca_hoc').delete().eq('coso_id',coSoId).in('ma',cu.map(c=>c.ma));
      if(error){btn.disabled=false;btn.textContent='💾 Lưu khung ca';err('Lỗi xóa ca: '+error.message);return;} }
    // Áp cho 1 cơ sở, hoặc cho mọi cơ sở nếu quản trị tích ô (chỉ ghi đè ca cùng số hiệu)
    const dsCs = apHet ? COSO.map(c=>c.id) : [coSoId];
    const banGhi=[]; dsCs.forEach(id=>rows.forEach(r=>banGhi.push({coso_id:id,ma:r.ma,ten:r.ten||('Ca '+r.ma),gio_bd:r.bd,gio_kt:r.kt})));
    const {error}=await SB.from('ca_hoc').upsert(banGhi,{onConflict:'coso_id,ma'});
    btn.disabled=false; btn.textContent='💾 Lưu khung ca';
    if(error){err('Lỗi lưu: '+error.message);return;}
    const moi=rows.map(r=>({ma:r.ma,ten:r.ten||('Ca '+r.ma),bd:r.bd,kt:r.kt}));
    dsCs.forEach(id=>{
      const con=(OPS.ca[id]||[]).filter(c=>!moi.some(m=>m.ma===c.ma));   // giữ ca riêng của cơ sở đó
      OPS.ca[id]=moi.map(m=>({...m})).concat(id===coSoId?[]:con).sort((a,b)=>a.ma-b.ma);
    });
    caLive=true; closeModal(); renderLichHoc();
    if(apHet) avaAlert('Đã áp khung giờ cho '+dsCs.length+' cơ sở.',{title:'Khung ca'});
  };
}
/* Khai lịch cho 1 lớp: tích ô Thứ × Ca + phòng học */
function openLopLich(l){
  const cas=caList(l.coSoId), cur=lichOfLop(l.id);
  const co=(t,m)=>cur.some(x=>x.thu===t&&x.caMa===m);
  const phong=(cur.find(x=>x.phong)||{}).phong||'';
  $('#mcard').innerHTML=`
    <div class="mhead"><div class="mava">${svg(IC.lichhoc)}</div>
      <div style="flex:1"><h3>Lịch học · ${esc(l.lop)}</h3><p>${esc(csName(l.coSoId))} · ${esc(l.gv||'chưa phân công GV')}</p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div>
    <div class="mbody">
      <p class="muted" style="font-size:.8rem;margin:0 0 10px">Tích vào ô giao giữa <b>ca</b> và <b>thứ</b> mà lớp này học. Bỏ tích hết = lớp chưa có lịch.
        <br/>Cần đổi giờ thì sửa thẳng vào ô giờ bên dưới tên ca — sửa xong bấm <b>Lưu lịch</b> là lưu cả hai.</p>
      <div class="twrap"><table class="lgrid" id="llTbl"><thead><tr><th class="calbl">CA</th>${THU_LIST.map(t=>`<th>${THU_NGAN[t]}</th>`).join('')}</tr></thead><tbody>
        ${cas.map(c=>`<tr><td class="calbl">${esc(c.ten)}
            <div class="cagio-in"><input class="llBd" data-ma="${c.ma}" value="${esc(c.bd||'')}" placeholder="07:00" inputmode="numeric" maxlength="5"/>
              <span>–</span><input class="llKt" data-ma="${c.ma}" value="${esc(c.kt||'')}" placeholder="09:00" inputmode="numeric" maxlength="5"/></div></td>
          ${THU_LIST.map(t=>`<td><label><input type="checkbox" data-thu="${t}" data-ca="${c.ma}" ${co(t,c.ma)?'checked':''}/></label></td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="g-note" style="margin:10px 0 0"><span>ℹ️</span><div>Giờ của ca dùng chung cho <b>mọi lớp của ${esc(csName(l.coSoId))}</b>. Sửa ở đây là đổi cho cả cơ sở, không riêng lớp ${esc(l.lop)}.</div></div>
      <div id="ll_buoi" style="margin-top:14px"></div>
      <div class="fld full" style="margin-top:10px"><label>Điền nhanh phòng cho mọi buổi</label>
        <div style="display:flex;gap:8px"><input id="ll_phong" value="${esc(phong)}" placeholder="VD: Phòng 3" style="flex:1"/>
          <button class="btn btn-light" id="ll_apPhong" style="white-space:nowrap">Áp cho tất cả</button></div></div>
      <div id="ll_err" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;margin-top:6px"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-light" style="flex:1" onclick="closeModal()">Hủy</button>
        <button class="btn btn-primary" style="flex:2" id="ll_save">💾 Lưu lịch</button></div></div>`;
  $('#modal').classList.add('on');
  const err=m=>{const e=$('#ll_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  $$('#llTbl .llBd, #llTbl .llKt').forEach(attachGioFormat);

  // ---- Danh sách "Các buổi đã chọn": mỗi buổi một giáo viên + một phòng riêng ----
  // Giữ trong biến để tích/bỏ tích không làm mất lựa chọn đã đặt cho buổi khác.
  const chiTiet={};                              // "thu|ca" -> {gvId, phong}
  cur.forEach(x=>{chiTiet[x.thu+'|'+x.caMa]={gvId:(x.gvId!=null?String(x.gvId):''),phong:x.phong||''};});
  const dsGV=GV.filter(g=>g.coSoId===l.coSoId).slice().sort((a,b)=>String(a.ten).localeCompare(String(b.ten),'vi'));
  const tenPhuTrach=l.gv||'chưa phân công';
  function veBuoi(){
    const chon=$$('#llTbl input[type=checkbox]:checked')
      .map(i=>({thu:Number(i.dataset.thu),caMa:Number(i.dataset.ca)}))
      .sort((a,b)=>a.thu-b.thu||a.caMa-b.caMa);
    const box=$('#ll_buoi');
    if(!chon.length){ box.innerHTML=`<div class="muted" style="font-size:.8rem;padding:4px 2px">Chưa tích buổi nào. Tích ở bảng trên để khai lịch.</div>`; return; }
    box.innerHTML=`<label style="font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.04em">CÁC BUỔI ĐÃ CHỌN (${chon.length})</label>
      <div class="buoiList">${chon.map(x=>{const k=x.thu+'|'+x.caMa, d=chiTiet[k]||{gvId:'',phong:''}, gio=caGio(l.coSoId,x.caMa);
        return `<div class="buoiRow">
          <div class="buoiKhi"><b>${THU_NGAN[x.thu]} · Ca ${x.caMa}</b><small>${esc(gio||'—')}</small></div>
          <select class="buoiGv" data-k="${k}"><option value="">GV phụ trách lớp — ${esc(tenPhuTrach)}</option>${
            dsGV.map(g=>`<option value="${g.id}" ${d.gvId===String(g.id)?'selected':''}>${esc(g.ten)}</option>`).join('')}</select>
          <input class="buoiPh" data-k="${k}" value="${esc(d.phong)}" placeholder="Phòng"/>
        </div>`;}).join('')}</div>
      <div class="muted" style="font-size:.76rem;font-weight:600;margin-top:6px">Buổi nào để <b>“GV phụ trách lớp”</b> thì do ${esc(tenPhuTrach)} dạy. Lớp học 2 buổi với 2 giáo viên khác nhau thì chọn đúng tên ở từng buổi.</div>`;
    $$('#ll_buoi .buoiGv').forEach(s=>s.onchange=()=>{const k=s.dataset.k;(chiTiet[k]=chiTiet[k]||{}).gvId=s.value;});
    $$('#ll_buoi .buoiPh').forEach(i=>i.onchange=()=>{const k=i.dataset.k;(chiTiet[k]=chiTiet[k]||{}).phong=i.value.trim();});
  }
  $$('#llTbl input[type=checkbox]').forEach(c=>c.onchange=veBuoi);
  veBuoi();
  $('#ll_apPhong').onclick=()=>{
    const ph=$('#ll_phong').value.trim();
    $$('#ll_buoi .buoiPh').forEach(i=>{i.value=ph;(chiTiet[i.dataset.k]=chiTiet[i.dataset.k]||{}).phong=ph;});
  };

  $('#ll_save').onclick=async()=>{
    const chon=$$('#llTbl input[type=checkbox]:checked').map(i=>{
      const thu=Number(i.dataset.thu), caMa=Number(i.dataset.ca), d=chiTiet[thu+'|'+caMa]||{};
      return {thu,caMa,gvId:d.gvId?Number(d.gvId):null,phong:(d.phong||'').trim()};});
    // Giờ ca đã sửa trong bảng → lưu cho CẢ CƠ SỞ trước, rồi mới lưu lịch lớp
    const gioMoi=cas.map(c=>({ma:c.ma,ten:c.ten,
      bd:($('#llTbl .llBd[data-ma="'+c.ma+'"]')||{}).value?.trim()||'',
      kt:($('#llTbl .llKt[data-ma="'+c.ma+'"]')||{}).value?.trim()||''}));
    const xau=gioMoi.find(g=>!gioHopLe(g.bd)||!gioHopLe(g.kt));
    if(xau){err('Giờ của "'+xau.ten+'" chưa đúng dạng giờ:phút (VD 14:00). Để trống cũng được.');return;}
    const doi=gioMoi.filter(g=>{const c=cas.find(x=>x.ma===g.ma);return c&&(c.bd!==g.bd||c.kt!==g.kt);});
    const btn=$('#ll_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    if(doi.length && caLive){
      const {error:e0}=await SB.from('ca_hoc').upsert(
        doi.map(g=>({coso_id:l.coSoId,ma:g.ma,ten:g.ten,gio_bd:g.bd,gio_kt:g.kt})),{onConflict:'coso_id,ma'});
      if(e0){btn.disabled=false;btn.textContent='💾 Lưu lịch';err('Lỗi lưu giờ ca: '+e0.message);return;}
      OPS.ca[l.coSoId]=gioMoi.map(g=>({ma:g.ma,ten:g.ten,bd:g.bd,kt:g.kt})).sort((a,b)=>a.ma-b.ma);
    }
    // Cách chắc chắn nhất với lưới tích: xóa sạch lịch cũ của lớp rồi ghi lại lịch mới
    const {error:e1}=await SB.from('lich_lop').delete().eq('lop_id',l.id);
    if(e1){btn.disabled=false;btn.textContent='💾 Lưu lịch';err('Lỗi xóa lịch cũ: '+e1.message);return;}
    if(chon.length){
      const dong=x=>{const o={lop_id:l.id,coso_id:l.coSoId,thu:x.thu,ca_ma:x.caMa,phong:x.phong};
        if(lichGvLive)o.gv_id=x.gvId; return o;};
      let e2=(await SB.from('lich_lop').insert(chon.map(dong))).error;
      // Chưa chạy SQL Giai đoạn 9 → CSDL chưa có cột gv_id: lưu lại phần còn lại, đừng mất lịch
      if(e2 && /gv_id|column .* does not exist|schema cache/i.test(e2.message||'')){
        lichGvLive=false;
        e2=(await SB.from('lich_lop').insert(chon.map(dong))).error;
        if(!e2) avaAlert('Đã lưu lịch, nhưng CSDL chưa có chỗ ghi "giáo viên của từng buổi".\nHãy chạy file sql-giai-doan-9-gv-tung-buoi.sql trong Supabase → SQL Editor.');
      }
      if(e2){btn.disabled=false;btn.textContent='💾 Lưu lịch';err('Lỗi lưu lịch: '+e2.message);return;}
    }
    OPS.lich=OPS.lich.filter(x=>x.lopId!==l.id)
      .concat(chon.map(x=>({id:0,lopId:l.id,coSoId:l.coSoId,thu:x.thu,caMa:x.caMa,phong:x.phong,gvId:lichGvLive?x.gvId:null})));
    caLive=true; closeModal(); renderLichHoc();
  };
}

    return;
  }
  const daDoc=tbDaDoc();

  const chuaDoc=tbCuaToi().filter(t=>!daDoc.has(t.id));   // "chưa đọc" chỉ tính tin GỬI CHO MÌNH

  const hetHan=tbQuanLy().filter(tbHetHan);

  const fopts=[['moi','Chưa đọc ('+chuaDoc.length+')'],['tatca','Tất cả ('+cuaToi.length+')']];
  if(soanDuoc&&hetHan.length)fopts.push(['hethan','Đã hết hạn ('+hetHan.length+')']);
  let h=`<div class="toolbar">
    <select class="fsel" id="tbLoc" style="flex:1;min-width:170px;max-width:100%">${fopts.map(([k,t])=>`<option value="${k}" ${tbLoc===k?'selected':''}>${t}</option>`).join('')}</select>
    ${chuaDoc.length?`<button class="btn btn-sm btn-ghost" id="tbDocHet" style="white-space:nowrap">✓ Đánh dấu đã đọc</button>`:''}
    ${soanDuoc?`<button class="btn btn-sm btn-primary" id="tbNew" style="white-space:nowrap">＋ Soạn thông báo</button>`:''}
  </div>`;
  if(!ds.length){
    h+=`<div class="panel"><div class="pbody"><div class="empty">${svg(IC.thongbao,1.5)}
      ${tbLoc==='moi'?'Không có thông báo mới.<br/>Chọn <b>Tất cả</b> để xem lại các tin trước đó.':'Chưa có thông báo nào.'}
      ${soanDuoc?'<br/><button class="btn btn-sm btn-ghost" id="tbNew2" style="margin-top:12px">＋ Soạn thông báo đầu tiên</button>':''}</div></div></div>`;
  }else{
    ds.forEach(t=>{
      const moi=!daDoc.has(t.id), het=tbHetHan(t);
      const nhan=[t.coSoId==null?'Toàn chuỗi':csName(t.coSoId), TB_AI[t.vaiTro]||'Tất cả'].join(' · ');

          <h4>${TB_IC[t.mucDo]} ${esc(t.tieuDe)}</h4>

          ${t.ghim?'<span class="tbtag ghim">📌 Ghim</span>':''}

        </div>

          ${t.hetHan?`<span>⏳ đến ${isoVN(t.hetHan)}</span>`:''}

  $$('#view [data-tbedit]').forEach(b=>b.onclick=()=>{const t=OPS.tb.find(x=>x.id===Number(b.dataset.tbedit));if(t)openThongBao(t);});

  if(tbLoc!=='hethan'&&ds.length){ setTimeout(()=>{tbGhiDoc(ds.map(t=>t.id));renderNavCounts();renderBell();},1200); }
  renderNavCounts();
}

        <button class="btn btn-primary" style="flex:2" id="tb_save">${them?'📣 Đăng thông báo':'💾 Lưu'}</button>
      </div></div></div>`;
  $('#modal').classList.add('on');
  attachDateFormat($('#tb_han'));
  const err=m=>{const e=$('#tb_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  $('#tb_save').onclick=async()=>{

      vai_tro:$('#tb_ai').value,ghim:$('#tb_ghim').checked,het_han:hanTxt?vnToIso(hanTxt):null,
      coso_id: isAdm ? (csv===''?null:Number(csv)) : USER.coSoId,
      nguoi_dang: USER.role==='admin'?'Quản trị':csName(USER.coSoId),
      updated_at:new Date().toISOString()};
    const btn=$('#tb_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    let r;
    if(them) r=await SB.from('thong_bao').insert(rec).select().single();
    else     r=await SB.from('thong_bao').update(rec).eq('id',t.id).select().single();
    btn.disabled=false; btn.textContent=them?'📣 Đăng thông báo':'💾 Lưu';
    if(r.error){err('Lỗi lưu: '+r.error.message);return;}
    const d=r.data, obj={id:d.id,tieuDe:d.tieu_de,noiDung:d.noi_dung||'',mucDo:d.muc_do,coSoId:(d.coso_id==null?null:d.coso_id),
      vaiTro:d.vai_tro,ghim:!!d.ghim,hetHan:d.het_han||null,nguoiDang:d.nguoi_dang||'',createdAt:d.created_at,updatedAt:d.updated_at};
    if(them){OPS.tb.push(obj);tbGhiDoc([obj.id]);}      // người đăng coi như đã đọc tin của mình
    else Object.assign(t,obj);
    closeModal(); tbLoc='tatca'; renderThongBao(); renderBell();
  };
  const bd=$('#tb_del');
  if(bd)bd.onclick=async()=>{
    if(!await avaConfirm('Xóa thông báo "'+t.tieuDe+'"?\n\nMọi người sẽ không còn thấy tin này.',{danger:true,okText:'Xóa'}))return;
    const {error}=await SB.from('thong_bao').delete().eq('id',t.id);
    if(error){err('Lỗi xóa: '+error.message);return;}
    OPS.tb=OPS.tb.filter(x=>x.id!==t.id);
    closeModal(); renderThongBao(); renderBell();
  };
}

/* ==========================================================================
   TRUNG TÂM IN ẤN — CÁC BẢN IN A4 ĐỂ KÝ VÀ LƯU HỒ SƠ
   Mọi bản in ở đây dùng chung một khuôn: khối đầu (tên trung tâm + cơ sở) →
   tiêu đề → dòng thông tin → bảng kẻ ô → tổng hợp → ngày tháng → khối ký.
   Danh sách nhiều cơ sở được TÁCH THÀNH NHIỀU TỜ, mỗi cơ sở (hoặc mỗi lớp) một
   tờ riêng — in ra là ký lưu được ngay vào hồ sơ của đơn vị đó.

   Cách dùng: dựng mảng tờ bằng toIn({...}) rồi gọi moBanIn('Dọc'|'Ngang', tos).
   Định nghĩa cột: {t:'tiêu đề', w:bề rộng %, a:'c'|'r' (mặc định trái),
                    b:true (in đậm), stt:true (tự đánh số thứ tự)}.
   ========================================================================== */
const KY_LAP_GD=[['Người lập biểu','(Ký, họ tên)'],['Giám đốc','(Ký, họ tên)']];
const KY_KE_TOAN=[['Người lập biểu','(Ký, họ tên)'],['Kế toán','(Ký, họ tên)'],['Giám đốc','(Ký, họ tên)']];
/* Gom một danh sách thành từng cơ sở, giữ đúng thứ tự cơ sở của hệ thống (cơ sở chính đứng đầu) */
function nhomTheoCoSo(arr){
  const m=new Map();
  arr.forEach(x=>{ const k=x.coSoId; if(!m.has(k))m.set(k,[]); m.get(k).push(x); });
  return [...m.entries()].sort((a,b)=>csCmp(a[0],b[0])).map(([coSoId,ds])=>({coSoId,ds}));
}
/* Số lớp một giáo viên đang phụ trách (khớp theo mã GV, dữ liệu cũ thì khớp theo tên) */
const soLopCuaGV=g=>LOP.filter(l=>l.coSoId===g.coSoId &&
  ((g.id!=null&&l.gvId===g.id)||(!!l.gv&&String(l.gv).trim()===String(g.ten).trim()))).length;
/* Dựng MỘT TỜ in A4 hoàn chỉnh.
   t = {tieuDe, coSo, sub, meta:[[nhãn,giá trị]], cot:[], rows:[[…]], tong:{span,nhan,o:[]},
        ghiChu:[], ky:[[chức danh,chú thích]], trong:'câu hiện khi bảng rỗng', ngang:bool} */
function toIn(t){
  const now=new Date(), cot=t.cot, nC=cot.length;
  const tongW=cot.reduce((s,c)=>s+(c.w||10),0);
  const cls=c=>c.a==='c'?' class="c"':c.a==='r'?' class="r"':'';
  const o=(c,v)=>{const s=(v==null||v==='')?'':esc(v); return c.b&&s?`<b>${s}</b>`:s;};
  const body=t.rows.length
    ? t.rows.map((r,i)=>{ let j=0;
        return `<tr>${cot.map(c=>`<td${cls(c)}>${o(c,c.stt?i+1:r[j++])}</td>`).join('')}</tr>`; }).join('')
    : `<tr><td colspan="${nC}" style="text-align:center;font-style:italic;padding:14px">${esc(t.trong||'Chưa có dữ liệu.')}</td></tr>`;
  let tong='';
  if(t.tong&&t.rows.length){
    const con=cot.slice(t.tong.span);
    tong=`<tr class="sum"><td colspan="${t.tong.span}" class="r">${esc(t.tong.nhan||'TỔNG CỘNG')}</td>`
      + con.map((c,i)=>`<td${cls(c)}>${t.tong.o[i]==null?'':`<b>${esc(t.tong.o[i])}</b>`}</td>`).join('') + `</tr>`;
  }
  const ky=(t.ky||KY_LAP_GD);
  return `<div class="vpaper${t.ngang?' sqpaper':''}">
      <div class="vtop"><div><b>TRUNG TÂM ANH NGỮ AVATAR</b><br/><span>Cơ sở: ${esc(t.coSo||'Toàn hệ thống')}</span></div></div>
      <div class="vtitle">${esc(t.tieuDe)}</div>
      ${t.sub?`<div class="vdate">${esc(t.sub)}</div>`:''}
      ${(t.meta&&t.meta.length)?`<div class="ddmeta">${t.meta.filter(m=>m&&m[1]).map(m=>`<div><b>${esc(m[0])}:</b> ${esc(m[1])}</div>`).join('')}</div>`:''}
      <table class="sqtbl">
        <colgroup>${cot.map(c=>`<col style="width:${((c.w||10)*100/tongW).toFixed(2)}%"/>`).join('')}</colgroup>
        <thead>${PGPAD(nC)}<tr>${cot.map(c=>`<th>${esc(c.t)}</th>`).join('')}</tr></thead>${PGFOOT(nC)}
        <tbody>${body}${tong}</tbody>
      </table>
      <div class="vfoot">
        ${(t.ghiChu||[]).filter(Boolean).map(g=>`<div style="font-size:12.5px;margin-top:6px">${g}</div>`).join('')}
        <div style="text-align:right;font-style:italic;font-size:12.5px;margin-top:10px">Quảng Châu, ngày ${now.getDate()} tháng ${now.getMonth()+1} năm ${now.getFullYear()}</div>
        <div class="vsign" style="margin-top:6px">
          ${ky.map(k=>`<div><b>${esc(k[0])}</b><small>${esc(k[1]||'(Ký, họ tên)')}</small><div style="height:48px"></div></div>`).join('')}
        </div>
      </div>
    </div>`;
}
/* Mở cửa sổ xem trước bản in. huong = 'Dọc' | 'Ngang' (quyết định luôn khổ giấy khi in). */
function moBanIn(huong,tos){
  const ngang=(huong==='Ngang');
  const v=$('#voucher');
  v.innerHTML=`<div class="vbar">${VHINT(huong)}
      <button class="btn btn-sm btn-light" id="prGo">🖶 In / lưu PDF</button>
      <button class="btn btn-sm btn-light" id="prClose">Đóng</button></div>`+tos.join('');
  v.classList.remove('sq','tk','dd');
  v.classList.add('on'); if(ngang)v.classList.add('sq');
  $('#prClose').onclick=()=>v.classList.remove('on','sq');
  $('#prGo').onclick=()=>window.print();
}
/* Bản in tách quá nhiều tờ (VD danh sách học sinh của cả trăm lớp) hoặc quá dài
   thì hỏi lại — vừa tốn giấy, vừa làm máy chậm khi dựng trang xem trước. */
async function xacNhanNhieuTo(n,donVi,soDong){
  const nhieuTo=n>20, dai=(soDong||0)>1500;
  if(!nhieuTo&&!dai)return true;
  const ly=[nhieuTo?`${n} tờ (mỗi ${donVi} một tờ riêng để ký lưu)`:'',dai?`${soDong} dòng`:''].filter(Boolean).join(' · ');
  return await avaConfirm(`Bản in này rất lớn: ${ly}.\n\nMáy có thể chậm vài giây khi dựng trang xem trước. Nên lọc lại phạm vi (chọn cơ sở hoặc lớp cụ thể) cho gọn trước khi in.\n\nVẫn tiếp tục?`,{okText:'Vẫn in'});
}

/* ===== 1) DANH SÁCH GIÁO VIÊN — A4 dọc, mỗi cơ sở một tờ ===== */
async function inDsGiaoVien(list,ghiChuLoc){
  if(!list.length){avaAlert('Không có giáo viên nào trong danh sách đang xem để in.');return;}
  const nhom=nhomTheoCoSo(list);
  if(!await xacNhanNhieuTo(nhom.length,'cơ sở',list.length))return;
  const cot=[{t:'TT',w:5,a:'c',stt:true},{t:'HỌ VÀ TÊN',w:21,b:true},{t:'NGÀY SINH',w:11,a:'c'},
    {t:'MÔN',w:10,a:'c'},{t:'TRÌNH ĐỘ',w:15},{t:'ĐIỆN THOẠI',w:12,a:'c'},{t:'SỐ LỚP',w:7,a:'c'},{t:'KÝ TÊN',w:19}];
  const tos=nhom.map(({coSoId,ds})=>toIn({
    tieuDe:'DANH SÁCH GIÁO VIÊN', coSo:csName(coSoId),
    sub:'Số liệu tính đến ngày '+isoVN(todayISO()),
    meta:[['Tổng số',ds.length+' giáo viên'],['Phạm vi lọc',ghiChuLoc||'']],
    cot, rows:ds.slice().sort((a,b)=>String(a.ten).localeCompare(String(b.ten),'vi'))
      .map(g=>[g.ten,g.ns||'',g.mon==='TA'?'Tiếng Anh':'Văn hóa',g.td||'',g.sdt||'',soLopCuaGV(g)||'',''] ),
    trong:'Cơ sở này chưa có giáo viên.',
    ghiChu:['Giáo viên ký xác nhận thông tin cá nhân và số lớp được phân công trong danh sách này.'],
    ky:KY_LAP_GD }));
  moBanIn('Dọc',tos);
}

/* ===== 2) DANH SÁCH LỚP HỌC — A4 dọc, mỗi cơ sở một tờ ===== */
async function inDsLop(list){
  if(!list.length){avaAlert('Không có lớp nào trong danh sách đang xem để in.');return;}
  const nhom=nhomTheoCoSo(list);
  if(!await xacNhanNhieuTo(nhom.length,'cơ sở',list.length))return;
  const cot=[{t:'TT',w:5,a:'c',stt:true},{t:'TÊN LỚP',w:15,b:true},{t:'MÔN',w:9,a:'c'},
    {t:'GIÁO VIÊN PHỤ TRÁCH',w:20},{t:'SĨ SỐ',w:7,a:'c'},{t:'LỊCH HỌC',w:24},{t:'DỰ THU HỌC PHÍ',w:20,a:'r'}];
  const tos=nhom.map(({coSoId,ds})=>{
    const arr=ds.slice().sort((a,b)=>String(a.lop).localeCompare(String(b.lop),'vi'));
    const tSiSo=arr.reduce((s,l)=>s+hvOfLop(l.id).filter(hvActive).length,0);
    const tThu=arr.reduce((s,l)=>s+lopHP(l.id),0);
    return toIn({
      tieuDe:'DANH SÁCH LỚP HỌC', coSo:csName(coSoId),
      sub:'Số liệu tính đến ngày '+isoVN(todayISO()),
      meta:[['Tổng số',arr.length+' lớp'],['Học sinh',tSiSo+' em']],
      cot,
      rows:arr.map(l=>[l.lop||'',l.mon==='TA'?'Tiếng Anh':'Văn hóa',
        gvCuaLop(l.id).join(', ')||l.gv||'(chưa phân công)',
        hvOfLop(l.id).filter(hvActive).length,
        lichTomTat(l.id)||'(chưa xếp lịch)',
        lopHP(l.id)?Math.round(lopHP(l.id)).toLocaleString('vi-VN'):'']),
      tong:{span:4,nhan:'TỔNG CỘNG',o:[tSiSo,'',tThu?Math.round(tThu).toLocaleString('vi-VN'):'']},
      trong:'Cơ sở này chưa có lớp học.',

/* ===== 3) DANH SÁCH HỌC SINH — A4 dọc, mỗi LỚP một tờ =====
   In theo lớp chứ không theo cơ sở: danh sách lớp là thứ giáo viên chủ nhiệm ký,
   dán ở lớp và lưu trong hồ sơ lớp. */
async function inDsHocSinh(list){
  if(!list.length){avaAlert('Không có học sinh nào trong danh sách đang xem để in.');return;}

  list.forEach(h=>{ if(!m.has(h.lopId))m.set(h.lopId,[]); m.get(h.lopId).push(h); });
  const nhom=[...m.entries()].map(([lopId,ds])=>({lop:LOP.find(l=>l.id===lopId),lopId,ds}))
    .sort((a,b)=>csCmp(a.lop?a.lop.coSoId:999,b.lop?b.lop.coSoId:999)
      ||String(a.lop&&a.lop.lop).localeCompare(String(b.lop&&b.lop.lop),'vi'));

  const tos=nhom.map(({lop,ds})=>{

      tieuDe:'DANH SÁCH HỌC SINH', coSo:lop?csName(lop.coSoId):'—',
      sub:'Số liệu tính đến ngày '+isoVN(todayISO()),

        ['Giáo viên phụ trách',lop?(gvCuaLop(lop.id).join(', ')||lop.gv||'(chưa phân công)'):''],
        ['Lịch học',lop?(lichTomTat(lop.id)||'(chưa xếp lịch)'):''],
        ['Sĩ số',nDangHoc+' em đang học'+(arr.length>nDangHoc?' · '+(arr.length-nDangHoc)+' em đã thôi học':'')]],
      cot,

/* ===== 4) BẢNG THEO DÕI HỌC PHÍ — A4 ngang, mỗi cơ sở một tờ ===== */
async function inHocPhi(list,themNghi){
  // Gộp: các em trong danh sách đang xem + các em ĐÃ THÔI HỌC còn phát sinh tiền.
  // Trước đây bảng này lọc bỏ hết em đã nghỉ nên tiền các em ấy đã nộp không hiện ra,
  // in ra không khớp sổ quỹ. Nay em nghỉ vẫn có dòng, phải thu lấy theo số quyết toán.
  const seen=new Set(), ds=[];
  list.concat(themNghi||[]).forEach(h=>{ if(seen.has(h.id))return; seen.add(h.id);
    if(hvActive(h)||(Number(h.soTienDong)||0)>0||hpPhaiThu(h)>0) ds.push(h); });
  if(!ds.length){avaAlert('Không có học sinh nào trong danh sách đang xem để in bảng học phí.');return;}
  const nhom=nhomTheoCoSo(ds);
  if(!await xacNhanNhieuTo(nhom.length,'cơ sở',ds.length))return;
  const daThu=daThuTheoEm().cua;
  const hoanMap={}; OPS.gd.forEach(g=>{ if(g.loai==='chi'&&g.hvId!=null&&/hoàn/i.test(g.hangMuc||''))
    hoanMap[g.hvId]=(hoanMap[g.hvId]||0)+(g.soTien||0); });
  const cot=[{t:'TT',w:4,a:'c',stt:true},{t:'HỌ VÀ TÊN HỌC SINH',w:16,b:true},{t:'LỚP',w:10},
    {t:'PHỤ HUYNH',w:13},{t:'ĐIỆN THOẠI',w:9,a:'c'},{t:'PHẢI THU',w:10,a:'r'},{t:'ĐÃ THU',w:10,a:'r'},
    {t:'CÒN PHẢI THU',w:10,a:'r'},{t:'NGÀY ĐÓNG',w:8,a:'c'},{t:'GHI CHÚ',w:10}];
  const vnd=n=>n?Math.round(n).toLocaleString('vi-VN'):'';
  const tos=nhom.map(({coSoId,ds:arr0})=>{
    const arr=arr0.slice().sort((a,b)=>String(lopName(a.lopId)).localeCompare(String(lopName(b.lopId)),'vi')
      ||String(a.ten).localeCompare(String(b.ten),'vi'));
    let tHP=0,tDa=0,nNghi=0;
    const rows=arr.map(h=>{ const nghi=!hvActive(h);
      const hp=hpPhaiThu(h), hoan=hoanMap[h.id]||0, sd=Math.max(0,daThu(h)-hoan), con=Math.max(0,hp-sd);
      tHP+=hp; tDa+=sd; if(nghi)nNghi++;
      const gc=nghi?('Thôi học'+(h.ngayThoiHoc?' '+isoVN(h.ngayThoiHoc):'')+(hoan?' · hoàn '+vnd(hoan):''))
        :(sd<=0?'Chưa đóng':(con>0?'Còn nợ':'Đủ'));
      return [h.ten,lopName(h.lopId),h.ph||'',h.sdt||'',vnd(hp),vnd(sd),vnd(con),
        h.ngayDong?isoVN(h.ngayDong):'', gc];
    });
    const tCon=Math.max(0,tHP-tDa);
    return toIn({ ngang:true,
      tieuDe:'BẢNG THEO DÕI THU HỌC PHÍ', coSo:csName(coSoId),
      sub:'Số liệu tính đến ngày '+isoVN(todayISO()),
      meta:[['Tổng số',(arr.length-nNghi)+' học sinh đang học'+(nNghi?' · '+nNghi+' em đã thôi học':'')],
        ['Đã thu',fmtVND(tDa)],['Còn phải thu',fmtVND(tCon)]],
      cot, rows,
      tong:{span:5,nhan:'TỔNG CỘNG',o:[vnd(tHP),vnd(tDa),vnd(tCon),'','']},
      trong:'Cơ sở này chưa có học sinh.',
      ghiChu:[`Tổng số tiền đã thu bằng chữ: <i>${docSoVN(tDa)}</i>`,
        'Số đã thu lấy theo phiếu thu trong sổ quỹ (đã trừ khoản hoàn trả); em nào chưa có phiếu thì lấy số ghi ở hồ sơ học sinh.',
        'Em đã thôi học: cột "phải thu" là số QUYẾT TOÁN tính đến ngày nghỉ, không tính phần khóa học em chưa học.'],
      ky:KY_KE_TOAN });
  });
  moBanIn('Ngang',tos);
}

/* ============ BÁO CÁO ĐIỂM DANH (Giai đoạn A — mức ngày, dùng dữ liệu hiện có) ============ */
const fmtDT=iso=>{ if(!iso)return''; const d=new Date(iso); if(isNaN(d))return''; const p=n=>('0'+n).slice(-2); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
let bcFrom=todayISO().slice(0,7)+'-01', bcTo=todayISO(), bcLop='all';
/* ===== ĐƠN GIÁ MỘT CA DẠY =====
   Lưu ngay trên máy (localStorage), không đưa lên CSDL vì đây là con số nội bộ
   của người lập bảng lương, mỗi cơ sở một khác và hay đổi. */
let bcGia=0, bcGiaGV={};
const giaKey=()=>'avatar_gia_ca_'+((USER&&USER.email)||'x');
function napGiaCa(){
  try{const v=JSON.parse(localStorage.getItem(giaKey())||'{}');bcGia=Number(v.mac)||0;bcGiaGV=v.gv||{};}
  catch(e){bcGia=0;bcGiaGV={};}
}
const luuGiaCa=()=>{try{localStorage.setItem(giaKey(),JSON.stringify({mac:bcGia,gv:bcGiaGV}));}catch(e){}};
/* Đơn giá riêng lưu theo MÃ giáo viên (g.key) — lưu theo tên sẽ áp nhầm sang
   người khác trùng tên ở cơ sở khác. Vẫn đọc được dữ liệu cũ lưu theo tên. */
const giaCua=g=>{ if(g&&typeof g==='object') return Number(bcGiaGV[g.key])||Number(bcGiaGV[g.name])||bcGia||0;
  return Number(bcGiaGV[g])||bcGia||0; };
const DD_LABEL={co:'Có mặt',muon:'Muộn',phep:'Phép',vang:'Vắng'};
/* Gom số liệu theo khoảng ngày + phạm vi (cơ sở đang chọn) + lớp (tùy chọn) */
function bcCollect(){
  const ids=scopeIds();
  const onlyLop = bcLop!=='all' ? Number(bcLop) : null;
  const inR=ngay=>ngay>=bcFrom&&ngay<=bcTo;
  const okLop=lop=> lop && ids.includes(lop.coSoId) && (onlyLop==null||lop.id===onlyLop);
  const hsMap={}, lopMap={}, gvMap={}, duky=[], buoiRows=[], roster=[], gvDayMap={};
  // Điểm danh học sinh -> chuyên cần HS + tổng hợp lớp + chi tiết buổi + điểm danh chi tiết
  for(const k in OPS.ddHV){ const [lidS,ngay]=k.split('|'); if(!inR(ngay))continue;
    const lop=LOP.find(l=>l.id===Number(lidS)); if(!okLop(lop))continue;
    const lm=lopMap[lop.id]=lopMap[lop.id]||{lop,buoi:new Set(),co:0,tot:0}; lm.buoi.add(ngay);
    const obj=OPS.ddHV[k];
    const b={ngay,lop,co:0,muon:0,phep:0,vang:0,tot:0};
    for(const hid in obj){ const st=obj[hid];
      const hm=hsMap[hid]=hsMap[hid]||{hvId:Number(hid),co:0,muon:0,phep:0,vang:0};
      if(hm[st]!=null)hm[st]++;
      if(b[st]!=null)b[st]++; b.tot++;
      lm.tot++; if(st==='co'||st==='muon')lm.co++;
      const hv=OPS.hv.find(x=>x.id===Number(hid));
      roster.push({ngay,lop,hsName:hv?hv.ten:('HS #'+hid),status:st});
    }
    b.pct=b.tot?Math.round((b.co+b.muon)/b.tot*100):0;
    const ca=OPS.duyet[k]; b.st=ca?ca.st:null;
    buoiRows.push(b);
  }
  // Chấm công GV -> công theo buổi + GV dạy mấy ca/ngày (chỉ ca thực dạy: lên lớp + dạy bù)
  for(const k in OPS.ccGV){ const p=k.split('|'); const ngay=p[2]; if(!inR(ngay))continue;
    const lop=LOP.find(l=>l.id===Number(p[1])); if(!okLop(lop))continue;
    // Quy công cho NGƯỜI THỰC DẠY buổi đó, không quy theo GV đang phụ trách lớp
    const nm=gvTenBuoi(lop.id,ngay), gid=gvDayBuoi(lop.id,ngay), thay=laDayThay(lop.id,ngay);
    // Gom theo MÃ giáo viên, không theo tên: 12 tên trùng nhau giữa các cơ sở
    // (Nguyễn Thị Hoa ở Diễn Kỷ và ở Hợp Thành là hai người) — gom theo tên sẽ
    // cộng công của hai người vào một dòng, bảng lương ra sai tiền.
    const gkey=(gid!=null)?('#'+gid):('~'+nameKey(nm));
    const gm=gvMap[gkey]=gvMap[gkey]||{key:gkey,gvId:gid,name:nm,day:0,bu:0,nghi:0,thay:0,cs:new Set(),lops:new Set()};
    const st=OPS.ccGV[k]; if(gm[st]!=null)gm[st]++;
    gm.cs.add(lop.coSoId);
    if(st==='day'||st==='bu'){ gm.lops.add(lop.lop); if(thay)gm.thay++;
      const dk=gkey+'|'+ngay; const gd=gvDayMap[dk]=gvDayMap[dk]||{gv:nm,ngay,n:0,lops:new Set()}; gd.n++; gd.lops.add(lop.lop); }
  }
  // Nhật ký đối soát/chốt
  for(const k in OPS.duyet){ const [lidS,ngay]=k.split('|'); if(!inR(ngay))continue;
    const lop=LOP.find(l=>l.id===Number(lidS)); if(!okLop(lop))continue;
    const c=OPS.duyet[k]; duky.push({lop,ngay,st:c.st,gvAt:c.gvAt,letanAt:c.letanAt,adminAt:c.adminAt});
  }
  const hsRows=Object.values(hsMap).map(m=>{const hv=OPS.hv.find(x=>x.id===m.hvId); const tot=m.co+m.muon+m.phep+m.vang;
      return {ten:hv?hv.ten:('HS #'+m.hvId), coSoId:hv?hv.coSoId:null, lop:hv?lopName(hv.lopId):'—', co:m.co,muon:m.muon,phep:m.phep,vang:m.vang, tot, pct:tot?Math.round((m.co+m.muon)/tot*100):0};})
    .sort((a,b)=>a.pct-b.pct||String(a.ten).localeCompare(b.ten,'vi'));
  const gvRows=Object.values(gvMap).map(g=>({...g,ca:g.day+g.bu,
      csTen:[...g.cs].map(csName).join(', '), soLop:g.lops.size}))
    .sort((a,b)=>b.ca-a.ca||String(a.name).localeCompare(b.name,'vi'));
  const lopRows=Object.values(lopMap).map(l=>({lop:l.lop.lop,coSoId:l.lop.coSoId,buoi:l.buoi.size,co:l.co,tot:l.tot,pct:l.tot?Math.round(l.co/l.tot*100):0}))
    .sort((a,b)=>csCmp(a.coSoId,b.coSoId)||String(a.lop).localeCompare(b.lop,'vi'));
  const bySort=(a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1: String(a.lop.lop).localeCompare(b.lop.lop,'vi');
  buoiRows.sort(bySort);
  roster.sort((a,b)=> bySort(a,b)||String(a.hsName).localeCompare(b.hsName,'vi'));
  duky.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  // GV ca/ngày: chi tiết (gv,ngày) + tổng hợp mỗi GV
  const gvDayRows=Object.values(gvDayMap).map(g=>({gv:g.gv,ngay:g.ngay,n:g.n,lops:[...g.lops].sort((a,b)=>String(a).localeCompare(b,'vi')).join(', ')}))
    .sort((a,b)=> String(a.gv).localeCompare(b.gv,'vi') || (a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0));
  const gvSumMap={};
  Object.values(gvDayMap).forEach(g=>{const s=gvSumMap[g.gv]=gvSumMap[g.gv]||{gv:g.gv,ngayDay:0,tongCa:0,max:0}; s.ngayDay++; s.tongCa+=g.n; if(g.n>s.max)s.max=g.n;});
  const gvDaySummary=Object.values(gvSumMap).map(s=>({...s,bq:s.ngayDay?Math.round(s.tongCa/s.ngayDay*10)/10:0}))
    .sort((a,b)=>b.tongCa-a.tongCa||String(a.gv).localeCompare(b.gv,'vi'));
  const totBuoi=lopRows.reduce((s,l)=>s+l.buoi,0), luotCo=lopRows.reduce((s,l)=>s+l.co,0), luotTot=lopRows.reduce((s,l)=>s+l.tot,0);
  const chot=duky.filter(d=>d.st==='da_chot').length;
  return {hsRows,gvRows,lopRows,duky,buoiRows,roster,gvDayRows,gvDaySummary,totBuoi,luotCo,luotTot,chot};
}

/* Một sheet báo cáo ĐẸP + mi trang A4: tiêu đề nền navy, phụ đề, header tô màu,
   kẻ viền, zebra, cố định + lặp tiêu đề mỗi trang in, autofilter, footer số trang.
   cols: [{h,k,w,a('left'|'center'|'right'),num,pct,wrap}] */
async function bcSheetPro(wb,name,title,sub,cols,rows,orient){
  const ws=wb.addWorksheet(name,{
    views:[{state:'frozen',ySplit:3}],
    pageSetup:{paperSize:9,orientation:orient||'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,
      horizontalCentered:true,margins:{left:0.4,right:0.4,top:0.55,bottom:0.55,header:0.25,footer:0.25}}
  });
  const nC=cols.length;
  ws.columns=cols.map(c=>({width:c.w||14}));
  ws.mergeCells(1,1,1,nC);
  const tc=ws.getCell(1,1); tc.value=title; tc.font={bold:true,size:14,color:{argb:'FFFFFFFF'}};
  tc.alignment={vertical:'middle',horizontal:'center'}; tc.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL_NAVY}}; ws.getRow(1).height=26;
  ws.mergeCells(2,1,2,nC);
  const sc=ws.getCell(2,1); sc.value=sub; sc.font={italic:true,size:10,color:{argb:'FF44506B'}};
  sc.alignment={horizontal:'center',vertical:'middle'}; ws.getRow(2).height=16;
  const hr=ws.getRow(3); hr.height=24;
  cols.forEach((c,i)=>{const cell=hr.getCell(i+1); cell.value=c.h;
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2A5490'}};
    cell.font={bold:true,color:{argb:'FFFFFFFF'},size:11};
    cell.alignment={vertical:'middle',horizontal:'center',wrapText:true}; cell.border=xlBorder('FF2A5490');});
  rows.forEach((r,ri)=>{const row=ws.getRow(4+ri); row.height=17;
    cols.forEach((c,ci)=>{const cell=row.getCell(ci+1); const v=r[c.k];
      cell.value=(v==null||v==='')?null:v;
      cell.alignment={vertical:'middle',horizontal:c.a||((c.num||c.pct)?'right':'left'),wrapText:!!c.wrap};
      cell.font={size:10.5};
      if(ri%2===1)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEFF3FA'}};
      cell.border=xlBorder('FFD6DEEA');
      if(c.num)cell.numFmt='#,##0'; else if(c.pct)cell.numFmt='0"%"';});
  });
  ws.autoFilter={from:{row:3,column:1},to:{row:3,column:nC}};
  ws.pageSetup.printTitlesRow='1:3';
  ws.headerFooter={oddFooter:'&C&"Calibri"&8Trang &P/&N — AVATAR English'};
  return ws;
}

  // 5) Điểm danh chi tiết (từng học sinh / buổi)

/* ============ GIỮ ĐĂNG NHẬP TRÊN TỪNG THIẾT BỊ ============
   Đăng nhập một lần trên máy nào thì lần sau mở app vào THẲNG, chỉ trình duyệt
   hoặc thiết bị khác mới phải nhập lại (phiên nằm trong bộ nhớ trình duyệt của
   riêng máy đó, khóa 'avatar-auth' — không có ai đọc được mật khẩu).
   Ba việc phải làm cho phiên khỏi đứt vặt:
     1) Mở app: dùng lại phiên đã lưu, CHỈ xin token mới khi sắp hết hạn. Xin lại
        vô cớ mỗi lần mở rất dễ mất phiên khi mạng chập chờn — máy chủ đã thu hồi
        token cũ mà token mới chưa về tới máy là đứt, phải đăng nhập lại.
     2) Mạng lỗi lúc mở: thử lại vài lần chứ KHÔNG đá về màn hình đăng nhập.
     3) Máy vừa thức dậy / có mạng trở lại: làm mới token sớm, để thao tác đầu
        tiên (thu tiền, điểm danh…) không bị máy chủ từ chối. */
const AUTH_KEY='avatar-auth';
const coPhienLuu=()=>{ try{ return !!localStorage.getItem(AUTH_KEY); }catch(e){ return false; } };
const bootHien=m=>{const b=$('#boot'); if(!b)return; b.style.display='grid'; const t=$('#bootMsg'); if(t&&m)t.textContent=m;};
const bootAn=()=>{const b=$('#boot'); if(b)b.style.display='none';};
/* Lấy phiên đang dùng; token còn dưới 10 phút mới xin token mới cho nhẹ và an toàn */
async function phienHienTai(batBuocLamMoi){
  let s=null;
  try{ const {data}=await SB.auth.getSession(); s=data&&data.session; }catch(e){}
  const conLai = (s&&s.expires_at) ? (s.expires_at*1000-Date.now())/1000 : -1;
  if(!s || batBuocLamMoi || conLai<600){
    try{ const rf=await SB.auth.refreshSession(); if(rf.data&&rf.data.session) s=rf.data.session; }
    catch(e){}                       // mạng lỗi → giữ token cũ; còn hạn thì vẫn làm việc bình thường
  }
  return s;
}
(async()=>{
  if(!coPhienLuu()) return;          // máy này chưa từng đăng nhập → hiện màn hình đăng nhập như thường
  bootHien('Đang mở lại phiên làm việc…');
  let s=null;
  for(let lan=1; lan<=3 && !s; lan++){
    s=await phienHienTai(false);
    if(!s && lan<3){ bootHien('Mạng chậm — đang thử lại…'); await new Promise(r=>setTimeout(r,900*lan)); }
  }
  if(s&&s.user){
    bootHien('Đang tải dữ liệu…');
    await afterAuth(s.user);         // không vào được (mạng lỗi / hết quyền) thì afterAuth đã ghi rõ lý do ở màn hình đăng nhập
  }else{
    showLoginErr('Phiên đăng nhập trên máy này đã hết hạn. Vui lòng đăng nhập lại — lần sau máy sẽ tự nhớ.');
  }
  bootAn();
})();
/* Máy thức dậy, chuyển về tab app, hoặc có mạng lại → làm mới token ngay */
let lanLamMoiCuoi=0;
const dangTrongApp=()=>{ const a=$('#app'); return !!a && a.style.display!=='none'; };
const lamTuoiPhien=()=>{
  if(!dangTrongApp()) return;                        // chưa vào app thì không cần làm gì
  if(Date.now()-lanLamMoiCuoi<30000) return;         // gộp các sự kiện dồn dập
  lanLamMoiCuoi=Date.now();
  phienHienTai(false).catch(()=>{});
};
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) lamTuoiPhien(); });
window.addEventListener('focus',lamTuoiPhien);
window.addEventListener('online',()=>{ lanLamMoiCuoi=0; lamTuoiPhien(); });
window.addEventListener('pageshow',e=>{ if(e.persisted){ lanLamMoiCuoi=0; lamTuoiPhien(); } });  // trở lại từ bộ nhớ đệm trình duyệt
/* Phiên bị máy chủ chấm dứt thật (đổi mật khẩu, quản trị thu hồi, refresh-token hỏng):
   nói rõ lý do rồi đưa về màn hình đăng nhập — không để app treo với số liệu cũ. */
let dangTuDangXuat=false;
SB.auth.onAuthStateChange(async(sk)=>{
  if(sk==='SIGNED_OUT' && dangTrongApp() && !dangTuDangXuat){
    try{ await avaAlert('Phiên đăng nhập trên máy này đã kết thúc — thường do đổi mật khẩu hoặc Quản trị thu hồi quyền.\n\nBấm OK để đăng nhập lại.'); }catch(e){}
    location.reload();
  }
});
</script>
