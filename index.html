  const ccAvg=ccReal==null?0:ccReal*100;
  const today=ddToday(ids);                 // buổi đã điểm danh hôm nay
  const coMat=today.reduce((s,l)=>s+l.co,0);
  const siToday=today.reduce((s,l)=>s+l.tot,0);

  const now=new Date(), gio=now.getHours();
  const scopeTxt=USER.role==='admin'?(scope==='all'?'toàn hệ thống':csName(Number(scope))):csName(USER.coSoId);

  let h=`<div class="hello">
    <div class="hi"><small class="hmiss">✦ SỨ MỆNH AVATAR</small><h2>Chắp cánh ước mơ · Vươn tầm tiếng Anh</h2><p>Tình hình ${esc(scopeTxt)} · cập nhật lúc ${String(gio).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</p></div>
    <div class="date"><b>${now.getDate()}/${now.getMonth()+1}</b><span>${DOW[now.getDay()]}</span></div>
  </div>`;

  // KPI hero
  const kpis=[
    {i:IC.thu,v:fmtShort(duThu),l:'Dự thu học phí'},
    {i:IC.thu,v:fmtShort(thucThu),l:'Đã thu học phí'},
    {i:IC.users,v:hs.toLocaleString('vi-VN'),l:'Học sinh'},
    {i:IC.lop,v:ls.length,l:'Lớp học'},
  ];
  h+=`<div class="kcards">${kpis.map((k,i)=>`<div class="kcard kc${i+1}"><span class="kdeco"></span><div class="kic">${svg(k.i)}</div><b>${k.v}</b><span class="kl">${k.l}</span></div>`).join('')}</div>`;

  // Tài chính + Chuyên cần (SỐ LIỆU THẬT)
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Tài chính học phí</h3><span class="sub">${money.nDa}/${money.n} HS đã đóng</span></div>
      <div class="pbody">${money.n===0?'<div class="empty" style="padding:26px 0">Chưa nhập học phí cho học sinh nào.<br/>Vào <b>Học sinh</b> để nhập học phí & đánh dấu đã đóng.</div>':`<div class="finrow">
        ${ring(rate,'đã thu')}
        <div class="finnums">
          <div class="finstat"><small>Dự thu (theo học phí HS)</small><b>${fmtVND(duThu)}</b></div>
          <div class="finstat"><small>Đã thu</small><b class="pos">${fmtVND(thucThu)}</b></div>
          <div class="finstat"><small>Còn phải thu</small><b class="neg">${fmtVND(conNo)}</b></div>
        </div>
      </div>`}</div>
    </div>
    <div class="panel"><div class="phead"><h3>Chuyên cần</h3><span class="sub">theo điểm danh đã ghi</span></div>
      <div class="pbody">${ccReal==null?'<div class="empty" style="padding:26px 0">Chưa có dữ liệu điểm danh trong phạm vi này.<br/>Vào <b>Điểm danh</b> để bắt đầu ghi nhận.</div>':`<div class="finrow">
        ${ring(ccAvg,'có mặt')}
        <div class="finnums">
          <div class="finstat"><small>Buổi điểm danh hôm nay</small><b>${today.length} buổi</b></div>
          <div class="finstat"><small>Lượt có mặt hôm nay</small><b class="pos">${coMat}/${siToday||0}</b></div>
          <div class="finstat"><small>Chuyên cần chung</small><b>${Math.round(ccAvg)}%</b></div>
        </div>
      </div>`}</div>
    </div>
  </div>`;

  // Điểm danh hôm nay + Cảnh báo
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Điểm danh hôm nay</h3><span class="sub">${today.length} buổi</span></div>
      <div class="pbody">${today.length?today.slice(0,8).map(l=>`
        <div class="tday">
          <div class="ti"><b>${esc(l.lop.lop)}${USER.role==='admin'?' · '+esc(csName(l.lop.coSoId)):''}</b><small>${esc(l.lop.gv||'—')}</small></div>
          <span class="badge bg-em">${l.co}/${l.tot} có mặt</span>
        </div>`).join(''):'<div class="empty">Hôm nay chưa có lớp nào điểm danh.</div>'}
      </div>
    </div>
    <div class="panel"><div class="phead"><h3>Cảnh báo điều hành</h3></div>
      <div class="pbody"><div class="warns">${dashWarns(ids)}</div></div>
    </div>
  </div>`;

  // Hoạt động gần đây — chia theo mảng chủ đề (admin: toàn chuỗi; lễ tân: cơ sở mình, theo RLS)
  const isAdm=USER.role==='admin', CAP=5;
  const scopeLbl=isAdm?(scope==='all'?'toàn chuỗi':csName(Number(scope))):'cơ sở của bạn';
  // 1) Học sinh mới ghi danh
  const hsAll=(OPS.hv||[]).filter(x=>!x.mau&&x.createdAt&&ids.includes(x.coSoId)).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));
  const hsItems=hsAll.slice(0,CAP).map(x=>({main:x.ten,sub:[lopName(x.lopId),isAdm?csName(x.coSoId):''].filter(Boolean).join(' · '),rt:relTime(x.createdAt)}));
  // 2) Đóng học phí & khoản thu
  const thuAll=(OPS.gd||[]).filter(x=>x.loai==='thu'&&x.createdAt&&ids.includes(x.coSoId)).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));
  const thuItems=thuAll.slice(0,CAP).map(x=>{
    let name=''; if(x.hvId!=null){const hv=(OPS.hv||[]).find(h=>h.id===x.hvId); if(hv)name=hv.ten;}
    return isAdm
      ? {main:'Thu '+fmtVND(x.soTien),sub:[x.hangMuc||'Khoản thu',csName(x.coSoId)].filter(Boolean).join(' · '),rt:relTime(x.createdAt)}
      : {main:(name||x.hangMuc||'Khoản thu')+' · '+fmtVND(x.soTien),sub:name?(x.hangMuc||''):'',rt:relTime(x.createdAt)};
  });
  // 3) Điểm danh giáo viên (chấm công buổi dạy)
  const CC_TXT={day:'Lên lớp',nghi:'Nghỉ',bu:'Dạy bù'};
  const ccAll=[];
  for(const k in (OPS.ccGV||{})){ const p=k.split('|'); const lop=LOP.find(l=>l.id===Number(p[1])); if(!lop||!ids.includes(lop.coSoId))continue; ccAll.push({lop,ngay:p[2],st:OPS.ccGV[k]}); }
  ccAll.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  const ccItems=ccAll.slice(0,CAP).map(x=>({main:(x.lop.gv||'—')+' · '+x.lop.lop,sub:[CC_TXT[x.st]||x.st,isAdm?csName(x.lop.coSoId):''].filter(Boolean).join(' · '),rt:isoVN(x.ngay)}));
  // 4) Chi tiêu gần đây
  const chiAll=(OPS.gd||[]).filter(x=>x.loai==='chi'&&x.createdAt&&ids.includes(x.coSoId)).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));
  const chiItems=chiAll.slice(0,CAP).map(x=>isAdm
    ? {main:'Chi '+fmtVND(x.soTien),sub:[x.hangMuc||'Khoản chi',csName(x.coSoId)].filter(Boolean).join(' · '),rt:relTime(x.createdAt)}
    : {main:(x.hangMuc||'Khoản chi')+' · '+fmtVND(x.soTien),sub:x.noiDung||'',rt:relTime(x.createdAt)});
  // 5) Học sinh thôi học
  const thoiAll=(OPS.hv||[]).filter(x=>!x.mau&&x.ngayThoiHoc&&ids.includes(x.coSoId)).sort((a,b)=>a.ngayThoiHoc<b.ngayThoiHoc?1:a.ngayThoiHoc>b.ngayThoiHoc?-1:0);
  const thoiItems=thoiAll.slice(0,CAP).map(x=>({main:x.ten,sub:[lopName(x.lopId),x.lyDo,isAdm?csName(x.coSoId):''].filter(Boolean).join(' · '),rt:isoVN(x.ngayThoiHoc)}));
  h+=`<div class="panel" style="background:transparent;border:0;box-shadow:none;padding:0">
    <div class="phead" style="padding:0 2px 10px;border:0"><h3>Hoạt động gần đây</h3><span class="sub">${esc(scopeLbl)}</span></div>
    <div class="actgrid">
      ${actCatCard('🧑‍🎓','n-hs','Học sinh mới ghi danh',hsItems,hsAll.length,CAP,'ah-blue')}
      ${actCatCard('💰','n-thu','Đóng học phí & khoản thu',thuItems,thuAll.length,CAP,'ah-amber')}
      ${actCatCard('🗓️','n-cc','Điểm danh giáo viên',ccItems,ccAll.length,CAP,'ah-emerald')}
      ${actCatCard('🧾','n-chi','Chi tiêu gần đây',chiItems,chiAll.length,CAP,'ah-rose')}
      ${actCatCard('🚪','n-left','Học sinh thôi học',thoiItems,thoiAll.length,CAP,'ah-slate')}
    </div></div>`;
  $('#view').innerHTML=h;
}
function ring(pct,sub){pct=Math.max(0,Math.min(100,pct));return `<div class="ringbox" style="--p:${pct.toFixed(1)}"><div class="rc"></div><div class="rin"><b>${Math.round(pct)}%</b><span>${sub||''}</span></div></div>`;}
/* Thẻ 1 nhóm hoạt động: icon + tiêu đề + badge tổng, tối đa `cap` dòng, còn lại "… và N nữa" */
function actCatCard(ic,cls,title,items,total,cap,hcls){
  const body = items.length
    ? items.map(it=>`<div class="actitem"><b>${esc(it.main)}</b><small>${it.sub?esc(it.sub)+' · ':''}<span class="rt">${esc(it.rt||'')}</span></small></div>`).join('')
      + (total>cap?`<div class="actmore">… và ${total-cap} mục nữa</div>`:'')
    : `<div class="actcard-empty">Chưa có cập nhật</div>`;
  return `<div class="actcard"><div class="actcard-h ${hcls||''}"><span class="kdeco"></span><div class="ci">${ic}</div><b>${title}</b><span class="cnt">${total}</span></div><div class="actcard-b">${body}</div></div>`;
}
function dashWarns(ids){
  const rows=[];
  inCOSO().forEach(c=>{
    if(!ids.includes(c.id))return;
    if(c.build){rows.push({t:`<b>${esc(c.ten)}</b>: cơ sở đang xây dựng, chưa nhập dữ liệu`});return;}
    const st=csStat(c.id);
    if(st.gv>0&&st.lop===0) rows.push({t:`<b>${esc(c.ten)}</b>: có ${st.gv} GV nhưng chưa nhập lớp học`});
  });
  // cơ sở thu học phí thấp (số thật — chỉ xét nơi đã nhập học phí)
  const low=inCOSO().filter(c=>!c.build&&ids.includes(c.id)).map(c=>({c,...hpStat([c.id])})).filter(x=>x.du>0&&x.rate<0.72).sort((a,b)=>a.rate-b.rate).slice(0,2);
  low.forEach(x=>rows.push({t:`<b>${esc(x.c.ten)}</b>: mới thu ~${Math.round(x.rate*100)}% học phí, cần đôn đốc`}));
  const ic=svg('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>');
  if(!rows.length) return `<div class="warnrow ok">${svg('<path d="M20 6 9 17l-5-5"/>')}<div>Mọi cơ sở đều ổn định, không có cảnh báo.</div></div>`;
  return rows.map(r=>`<div class="warnrow">${ic}<div>${r.t}</div></div>`).join('');
}

/* ============ GIÁO VIÊN ============ */
function renderGV(){
  const opts=inCOSO().filter(c=>!c.build);
  let h=`<div class="toolbar">
    <div class="search">${svg(IC.search,2)}<input id="gvq" placeholder="Tìm theo tên, SĐT, địa chỉ…" value="${esc(gvSearch)}"/></div>
    ${USER.role==='admin'?`<select class="fsel" id="gvcs"><option value="all">Tất cả cơ sở</option>${opts.map(c=>`<option value="${c.id}" ${String(gvCs)===String(c.id)?'selected':''}>${esc(c.ten)}</option>`).join('')}</select>`:''}
    ${gvLive?`<button class="btn btn-sm btn-ghost" id="gvTpl" style="white-space:nowrap">⬇ Tải mẫu Excel</button>
    <button class="btn btn-sm btn-ghost" id="gvImp" style="white-space:nowrap">⬆ Nhập Excel</button>
    <button class="btn btn-sm btn-primary" id="gvAdd" style="white-space:nowrap">＋ Thêm giáo viên</button>`:''}
  </div>
  <div class="chips" style="margin-bottom:14px">
    ${[['all','Tất cả môn'],['VH','Văn hóa'],['TA','Tiếng Anh']].map(([k,t])=>`<button class="chip ${gvMon===k?'on':''}" data-mon="${k}">${t}</button>`).join('')}
  </div>`;

  let list=inGV();
  if(USER.role==='admin'&&gvCs!=='all') list=list.filter(g=>g.coSoId===Number(gvCs));
  if(gvMon!=='all') list=list.filter(g=>g.mon===gvMon);
  if(gvSearch.trim()){const q=gvSearch.trim().toLowerCase();list=list.filter(g=>(g.ten+' '+g.sdt+' '+g.dc).toLowerCase().includes(q));}
  list=list.slice().sort((a,b)=>a.coSoId-b.coSoId||a.ten.localeCompare(b.ten,'vi'));

  h+=`<div class="panel"><div class="phead"><h3>Danh sách giáo viên</h3><span class="sub">${list.length} người</span></div>
    <div class="twrap"><table><thead><tr>
      <th>Giáo viên</th><th>Môn</th>${USER.role==='admin'?'<th>Cơ sở</th>':''}<th>Ngày sinh</th><th>Trình độ</th><th>Điện thoại</th><th></th>
    </tr></thead><tbody>`;
  if(!list.length){
    h+=`<tr><td colspan="7"><div class="empty">${svg(IC.gv,1.6)}Không tìm thấy giáo viên phù hợp</div></td></tr>`;
  }else{
    list.forEach(g=>{
      h+=`<tr data-gid="${g.id}" class="gvRow" style="cursor:pointer">
        <td><div class="gvcell"><div class="gvava" style="background:${avaColor(g.ten)}">${initials(g.ten)}</div><div><b>${esc(g.ten)}</b><small>${esc((g.dc||'').split(',')[0]||'—')}</small></div></div></td>
        <td><span class="badge ${g.mon==='TA'?'bg-ta':'bg-vh'}">${g.mon==='TA'?'Tiếng Anh':'Văn hóa'}</span></td>
        ${USER.role==='admin'?`<td>${esc(csName(g.coSoId))}</td>`:''}
        <td class="num">${esc(g.ns||'—')}</td>
        <td>${esc(g.td||'—')}</td>
        <td class="num">${esc(g.sdt||'—')}</td>
        <td class="tright"><span class="linkbtn">Chi tiết →</span></td>
      </tr>`;
    });
  }
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;

  $('#gvq').oninput=e=>{gvSearch=e.target.value;refreshGVTable();};
  const cs=$('#gvcs'); if(cs)cs.onchange=e=>{gvCs=e.target.value;renderGV();};
  $$('#view .chip').forEach(b=>b.onclick=()=>{gvMon=b.dataset.mon;renderGV();});
  const ga=$('#gvAdd'); if(ga)ga.onclick=openGvNew;
  const gt=$('#gvTpl'); if(gt)gt.onclick=gvDownloadTemplate;
  const gi=$('#gvImp'); if(gi)gi.onclick=gvImportExcel;
  bindGVRows();
}
function refreshGVTable(){renderGV();$('#gvq').focus();const v=$('#gvq').value;$('#gvq').setSelectionRange(v.length,v.length);}
function bindGVRows(){$$('#view .gvRow').forEach(r=>r.onclick=()=>showGV(Number(r.dataset.gid)));}

/* Danh sách lớp trong 1 cơ sở dạng LƯỚI kẻ cột — tích = giáo viên phụ trách lớp đó */
function lopCheckHTML(coSoId,gvName){
  const ls=LOP.filter(l=>l.coSoId===coSoId).slice().sort((a,b)=>String(a.lop).localeCompare(String(b.lop),'vi'));
  if(!ls.length) return `<div class="muted" style="font-size:.82rem;padding:12px">Cơ sở này chưa có lớp học.</div>`;
  const nm=(gvName||'').trim();
  const rows=ls.map(l=>{const cur=(l.gv||'').trim(); const mine=nm&&cur===nm;
    const gvTxt=cur?(mine?`<span style="color:var(--emerald);font-weight:700">${esc(cur)}</span>`:esc(cur)):'—';
    return `<label class="lopgrid-r"><input type="checkbox" value="${l.id}" ${mine?'checked':''}/><span class="lg-lop">${esc(l.lop)}</span><span class="lg-ss">${l.siso||0}</span><span class="lg-gv">${gvTxt}</span></label>`;
  }).join('');
  return `<div class="lopgrid"><div class="lopgrid-h"><span></span><span>Lớp</span><span>Sĩ số</span><span>GV phụ trách</span></div>${rows}</div>`;
}
function showGV(id){
  const g=GV.find(x=>x.id===id); if(!g)return;
  const lops=LOP.filter(l=>l.coSoId===g.coSoId && (l.gv||'').trim()===g.ten.trim());
  const hs=lops.reduce((s,l)=>s+(l.siso||0),0);
  $('#mcard').innerHTML=`
    <div class="mhead">
      <div class="mava">${initials(g.ten)}</div>
      <div style="flex:1"><h3>${esc(g.ten)}</h3><p>Hồ sơ giáo viên · ${esc(csName(g.coSoId))} · <span style="opacity:.85">bấm để sửa</span></p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody"><div class="form2">
      <div class="fld full"><label>Họ và tên</label><input id="ev_ten" value="${esc(g.ten)}"/></div>
      <div class="fld"><label>Ngày sinh</label><input id="ev_ns" value="${esc(g.ns||'')}" placeholder="dd/mm/yyyy"/></div>
      <div class="fld"><label>Môn</label><select id="ev_mon"><option value="VH" ${g.mon!=='TA'?'selected':''}>Văn hóa</option><option value="TA" ${g.mon==='TA'?'selected':''}>Tiếng Anh</option></select></div>
      <div class="fld"><label>Trình độ chuyên môn</label><input id="ev_td" value="${esc(g.td||'')}"/></div>
      <div class="fld"><label>Số điện thoại</label><input id="ev_sdt" value="${esc(g.sdt||'')}" inputmode="tel"/></div>
      <div class="fld full"><label>Địa chỉ</label><input id="ev_dc" value="${esc(g.dc||'')}"/></div>
      <div class="fld"><label>Cơ sở công tác</label><input value="${esc(csName(g.coSoId))}" disabled style="opacity:.7"/></div>
      <div class="fld"><label>Ngày hợp đồng làm việc</label><input id="ev_hd" value="${g.ngayHd?isoVN(g.ngayHd):''}" placeholder="dd/mm/yyyy"/></div>
      ${gvLive
        ? `<div class="fld full"><label>Phụ trách lớp <span style="font-weight:600;color:var(--muted)">· tích chọn lớp</span></label><div class="gv-lopcheck" id="ev_lops">${lopCheckHTML(g.coSoId,g.ten)}</div></div>`
        : (lops.length?`<div class="fld full"><label>Phụ trách lớp</label><input value="${lops.length} lớp · ${hs} HS — ${esc(lops.map(l=>l.lop).join(', '))}" disabled style="opacity:.7"/></div>`:'')}
      <div id="ev_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px;margin-top:2px">
        ${gvLive?`<button class="btn btn-light" style="color:var(--rose)" id="ev_del">Xóa</button>`:''}
        <button class="btn btn-light" style="flex:1" onclick="closeModal()">Đóng</button>
        <button class="btn btn-primary" style="flex:2" id="ev_save">💾 Lưu thay đổi</button>
      </div>
      <div class="fld full" style="padding:0"><small class="muted">Thay đổi được lưu online, đồng bộ mọi máy.</small></div>
    </div></div>`;
  $('#modal').classList.add('on');
  attachDateFormat($('#ev_ns')); attachDateFormat($('#ev_hd'));
  const err=$('#ev_err'); const showErr=m=>{err.textContent=m||'';err.style.display=m?'block':'none';};
  $('#ev_save').onclick=async()=>{
    const rec={ten:$('#ev_ten').value.trim(),ns:$('#ev_ns').value.trim(),td:$('#ev_td').value.trim(),sdt:$('#ev_sdt').value.trim(),dc:$('#ev_dc').value.trim(),mon:$('#ev_mon').value};
    if(!rec.ten){showErr('Vui lòng nhập họ tên.');$('#ev_ten').focus();return;}
    if(!isValidDob(rec.ns)){showErr('Ngày sinh chưa đúng dạng ngày/tháng/năm (VD: 12/10/1990).');$('#ev_ns').focus();return;}
    const hdv=($('#ev_hd')&&$('#ev_hd').value.trim())||'';
    if(hdv && !isValidDob(hdv)){showErr('Ngày hợp đồng chưa đúng dạng ngày/tháng/năm.');$('#ev_hd').focus();return;}
    const hdIso = hdv ? vnToIso(hdv) : null;
    const oldName=g.ten.trim();
    const btn=$('#ev_save'); btn.disabled=true; btn.textContent='Đang lưu…'; showErr('');
    const {error}= gvLive
      ? await SB.from('giao_vien').update({ten:rec.ten,ns:rec.ns,td:rec.td,dc:rec.dc,sdt:rec.sdt,mon:rec.mon}).eq('id',g.id)
      : await SB.from('gv_edits').upsert({gv_id:g.id,coso_id:g.coSoId,...rec},{onConflict:'gv_id'});
    if(error){btn.disabled=false;btn.textContent='💾 Lưu thay đổi';showErr('Lỗi lưu: '+error.message);return;}
    ['ten','ns','td','sdt','dc','mon'].forEach(k=>{g[k]=rec[k];});
    // Ngày hợp đồng (best-effort; bỏ qua êm nếu chưa chạy SQL)
    if(gvLive) await SB.from('giao_vien').update({ngay_hd:hdIso}).eq('id',g.id);
    else await SB.from('gv_edits').update({ngay_hd:hdIso}).eq('gv_id',g.id);
    g.ngayHd=hdIso;
    // Phân công lớp: tích = phụ trách; bỏ tích lớp đang của mình = gỡ (chỉ khi có bảng lop_hoc sống)
    if(gvLive){
      const box=$('#ev_lops');
      const checked=new Set(box?[...box.querySelectorAll('input:checked')].map(x=>Number(x.value)):[]);
      const newName=rec.ten.trim();
      for(const l of LOP.filter(x=>x.coSoId===g.coSoId)){
        const was=(l.gv||'').trim()===oldName;
        if(checked.has(l.id)){ if((l.gv||'')!==newName){await SB.from('lop_hoc').update({gv:newName}).eq('id',l.id); l.gv=newName;} }
        else if(was){ await SB.from('lop_hoc').update({gv:''}).eq('id',l.id); l.gv=''; }
      }
    }
    btn.disabled=false; btn.textContent='💾 Lưu thay đổi';
    closeModal();
    if(VIEW==='gv')renderGV();
  };
  const del=$('#ev_del'); if(del)del.onclick=async()=>{
    if(!await avaConfirm('Xóa giáo viên "'+g.ten+'"? Thao tác này không thể hoàn tác.',{danger:true,okText:'Xóa'}))return;
    const {error}=await SB.from('giao_vien').delete().eq('id',g.id);
    if(error){showErr('Lỗi xóa: '+error.message);return;}
    const i=GV.findIndex(x=>x.id===g.id); if(i>=0)GV.splice(i,1);
    closeModal(); if(VIEW==='gv')renderGV();
  };
}

/* ============ CƠ SỞ ============ */
function renderCoso(){
  if(csDetailId!=null){renderCosoDetail(csDetailId);return;}
  const list=inCOSO();
  const active=list.filter(c=>!c.build);
  const tot=active.reduce((a,c)=>{const s=csStat(c.id);a.gv+=s.gv;a.hs+=s.hs;a.lop+=s.lop;return a;},{gv:0,hs:0,lop:0});
  const totDu=hpStat(scopeIds()).du;
  const rows=list.map(c=>({c,...csStat(c.id),du:hpStat([c.id]).du}));
  rows.sort((a,b)=>{
    if(a.c.build!==b.c.build) return a.c.build?1:-1;   // đang XD xuống cuối
    if(csSort==='ten') return a.c.ten.localeCompare(b.c.ten,'vi');
    const key=csSort==='thu'?'du':csSort;
    return b[key]-a[key];
  });

  let h=`<div class="cssum">
    <div class="s"><b>${active.length}</b><span>Cơ sở hoạt động</span></div>
    <div class="s"><b>${tot.gv}</b><span>Giáo viên</span></div>
    <div class="s"><b>${tot.hs.toLocaleString('vi-VN')}</b><span>Học sinh</span></div>
    <div class="s"><b>${tot.lop}</b><span>Lớp học</span></div>
    <div class="s"><b>${fmtShort(totDu)}</b><span>Dự thu học phí</span></div>
  </div>
  <div class="toolbar"><div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <small class="muted" style="font-weight:700">Sắp xếp:</small>
    <select class="fsel" id="cssort">${[['thu','Dự thu cao nhất'],['hs','Học sinh nhiều nhất'],['gv','Giáo viên nhiều nhất'],['ten','Tên A→Z']].map(([k,t])=>`<option value="${k}" ${csSort===k?'selected':''}>${t}</option>`).join('')}</select>
  </div></div>
  <div class="cscards">`;

  rows.forEach(({c,gv,lop,hs,thu})=>{
    if(c.build){
      h+=`<div class="cscard build">
        <div class="cs-top"><div class="cs-logo">AVATAR</div>
          <div><h4>${esc(c.ten)}</h4><div class="cs-sub">Đang xây dựng</div></div></div>
        <div class="empty" style="padding:18px 0">Cơ sở mới · chưa nhập dữ liệu</div></div>`;
      return;
    }
    let warn='';
    if(lop===0&&gv>0) warn=`<span class="cs-warn">⚠ Chưa nhập lớp</span>`;
    else if(lop>0&&hs/lop<6) warn=`<span class="cs-warn">⚠ Sĩ số bất thường</span>`;
    h+=`<div class="cscard" data-cs="${c.id}" style="background:${csPastel(c.id)};border-left:4px solid ${avaColor(c.ten)}">
      <span class="cs-deco" style="background:${avaColor(c.ten)}"></span>
      <div class="cs-top"><div class="cs-logo">AVATAR</div>
        <div class="cs-head"><h4>${esc(c.ten)}${warn}</h4><div class="cs-sub">${lop} lớp · ${hs} học sinh</div></div></div>
      <div class="cs-stats">
        <div class="cs-stat"><b>${gv}</b><span>Giáo viên</span></div>
        <div class="cs-stat"><b>${hs}</b><span>Học sinh</span></div>
      </div>
    </div>`;
  });
  h+='</div>';
  $('#view').innerHTML=h;
  $('#cssort').onchange=e=>{csSort=e.target.value;renderCoso();};
  $$('#view .cscard[data-cs]').forEach(el=>el.onclick=()=>{
    csDetailId=Number(el.dataset.cs); renderCoso();
  });
}

/* ===== Chi tiết 1 trung tâm — tổng quan lớp, học sinh, kinh phí ===== */

  const money=hpStat([id]);
  const duthu=money.du, daThu=money.da, chuaThu=money.chua;
  const pct=duthu?Math.round(money.rate*100):0;
  const siTb=s.lop?Math.round(s.hs/s.lop):0;
  const ccR=ccStat([id]);
  const ccTxt=ccR==null?'—':Math.round(ccR*100)+'%';

  let h=`<button class="btn btn-sm btn-ghost cs-back" id="csBack">← Tất cả cơ sở</button>
  <div class="csd-hero" style="background:${csPastel(id)};border-left:5px solid ${avaColor(c.ten)}">

  </div>
  <div class="cssum" style="margin-top:14px">
    <div class="s"><b>${s.lop}</b><span>Lớp học</span></div>
    <div class="s"><b>${s.hs}</b><span>Học sinh</span></div>
    <div class="s"><b>${s.gv}</b><span>Giáo viên</span></div>
    <div class="s"><b>${siTb}</b><span>Sĩ số TB/lớp</span></div>
    <div class="s"><b>${ccTxt}</b><span>Chuyên cần</span></div>
  </div>
  <div class="panel">
    <div class="phead"><h3>Tổng kinh phí học phí</h3><span class="sub">${money.nDa}/${money.n} HS đã đóng</span></div>
    ${money.n===0?'<div class="empty" style="padding:20px">Chưa nhập học phí cho học sinh nào của cơ sở này.</div>':`<div class="csd-money">
      <div class="mbox"><small>Dự thu</small><b>${fmtShort(duthu)}</b></div>
      <div class="mbox done"><small>Đã thu</small><b>${fmtShort(daThu)}</b></div>
      <div class="mbox pend"><small>Chưa thu</small><b>${fmtShort(chuaThu)}</b></div>
    </div>
    <div class="csd-prog"><div class="csd-prog-bar"><i style="width:${pct}%"></i></div><span>Đã thu <b>${pct}%</b> dự thu</span></div>`}
  </div>
  <div class="panel"><div class="phead"><h3>Danh sách lớp học</h3><span class="sub">${lops.length} lớp</span></div>
    <div class="twrap"><table><thead><tr><th>Lớp</th><th>Giáo viên phụ trách</th><th class="tright">Sĩ số</th><th class="tright">Dự thu</th></tr></thead><tbody>`;
  if(!lops.length){h+=`<tr><td colspan="4"><div class="empty">${svg(IC.lop,1.6)}Trung tâm chưa có lớp học</div></td></tr>`;}
  else lops.forEach(l=>{
    const lopDu=OPS.hv.filter(h=>h.lopId===l.id&&hvActive(h)).reduce((sm,h)=>sm+(h.hocPhi||0),0);
    h+=`<tr><td><b>${esc(l.lop||'—')}</b> ${l.mon==='TA'?'<span class="badge bg-ta" style="margin-left:4px">TA</span>':''}</td>

      <td class="tright num">${l.siso||0}</td>
      <td class="tright num">${lopDu?fmtVND(lopDu):'—'}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;
  $('#csBack').onclick=()=>{csDetailId=null;renderCoso();};
}

/* ============ LỚP HỌC ============ */
function renderLop(){
  const opts=inCOSO().filter(c=>!c.build);
  let list=inLOP();
  if(USER.role==='admin'&&lopCs!=='all') list=list.filter(l=>l.coSoId===Number(lopCs));
  if(lopSearch.trim()){const q=lopSearch.trim().toLowerCase();list=list.filter(l=>((l.lop||'')+' '+(l.gv||'')).toLowerCase().includes(q));}
  list=list.slice().sort((a,b)=>a.coSoId-b.coSoId);
  const hs=list.reduce((s,l)=>s+(l.siso||0),0), thu=list.reduce((s,l)=>s+lopHP(l.id),0);

  let h=`<div class="toolbar">
    <div class="search">${svg(IC.search,2)}<input id="lopq" placeholder="Tìm lớp hoặc giáo viên…" value="${esc(lopSearch)}"/></div>

  </div>`;
  h+=`<div class="panel"><div class="phead"><h3>Danh sách lớp học</h3><span class="sub">${list.length} lớp · ${hs} HS · dự thu ${fmtShort(thu)}${gvLive?' · bấm dòng để sửa':''}</span></div>
    <div class="twrap"><table><thead><tr><th>Lớp</th><th>Giáo viên phụ trách</th>${USER.role==='admin'?'<th>Cơ sở</th>':''}<th class="tright">Sĩ số</th><th class="tright">Dự thu</th></tr></thead><tbody>`;
  if(!list.length){h+=`<tr><td colspan="5"><div class="empty">${svg(IC.lop,1.6)}Chưa có lớp học trong phạm vi này</div></td></tr>`;}
  else list.forEach(l=>{
    h+=`<tr ${gvLive?`data-lid="${l.id}" class="lopRow" style="cursor:pointer"`:''}><td><b>${esc(l.lop||'—')}</b> ${l.mon==='TA'?'<span class="badge bg-ta" style="margin-left:4px">TA</span>':''}</td>
      <td>${esc(l.gv||'—')}</td>

      <td class="tright num">${l.siso||0}</td>
      <td class="tright num">${lopHP(l.id)?fmtVND(lopHP(l.id)):'—'}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;
  $('#lopq').oninput=e=>{lopSearch=e.target.value;const v=e.target.value;renderLop();$('#lopq').focus();$('#lopq').setSelectionRange(v.length,v.length);};
  const cs=$('#lopcs'); if(cs)cs.onchange=e=>{lopCs=e.target.value;renderLop();};
  const la=$('#lopAdd'); if(la)la.onclick=openLopNew;
  if(gvLive)$$('#view .lopRow').forEach(r=>r.onclick=()=>{const l=LOP.find(x=>x.id===Number(r.dataset.lid));if(l)openLopEdit(l);});

/* đọc số tiền bằng chữ (VND) */
function docSoVN(number){
  number=Math.round(number); if(number===0)return 'Không đồng';
  const ch=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const dv=['','nghìn','triệu','tỷ'];
  function doc3(baso,daydu){
    let tram=Math.floor(baso/100),chuc=Math.floor((baso%100)/10),donvi=baso%10,s='';
    if(daydu||tram>0){ s+=ch[tram]+' trăm'; if(chuc===0&&donvi>0)s+=' lẻ'; }
    if(chuc>1){ s+=' '+ch[chuc]+' mươi'; if(donvi===1)s+=' mốt'; else if(donvi===4)s+=' tư'; else if(donvi===5)s+=' lăm'; else if(donvi>0)s+=' '+ch[donvi]; }
    else if(chuc===1){ s+=' mười'; if(donvi===5)s+=' lăm'; else if(donvi>0)s+=' '+ch[donvi]; }
    else if(chuc===0&&donvi>0){ s+=' '+ch[donvi]; }
    return s.trim();
  }
  const nhom=[]; let so=number; while(so>0){nhom.push(so%1000);so=Math.floor(so/1000);}
  let kq='';
  for(let g=nhom.length-1;g>=0;g--){ if(nhom[g]===0)continue; kq+=(kq?' ':'')+doc3(nhom[g], g<nhom.length-1&&kq!=='')+(dv[g]?' '+dv[g]:''); }
  kq=kq.trim(); return kq.charAt(0).toUpperCase()+kq.slice(1)+' đồng';
}
function taiWord(html,filename){
  const pre="<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>body{font-family:'Times New Roman',serif}table{width:100%;border-collapse:collapse}td{padding:4px 0;vertical-align:top}</style></head><body>";
  const blob=new Blob(['﻿'+pre+html+"</body></html>"],{type:'application/msword'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'); a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  // Học sinh mẫu cũ (cờ mau) còn sót trong DB — cho phép dọn hàng loạt theo phạm vi cơ sở đang xem
  let mauList=inHV();

/* Dọn học sinh mẫu cũ (mau=true) hàng loạt — xóa theo lô, RLS tự chặn ngoài quyền */
async function cleanMauHV(mauList){
  if(!mauList||!mauList.length)return;
  const n=mauList.length;
  if(!await avaConfirm(`Xóa vĩnh viễn ${n} học sinh mẫu (dữ liệu cũ, chưa có học phí) trong phạm vi đang xem? Thao tác này không thể hoàn tác.`,{danger:true,okText:'Xóa '+n+' em'}))return;
  const ids=mauList.map(h=>h.id);
  const done=new Set(); let fail=0, msg='';
  for(let i=0;i<ids.length;i+=100){
    const chunk=ids.slice(i,i+100);
    const {error}=await SB.from('hoc_vien').delete().in('id',chunk);
    if(error){fail+=chunk.length;msg=error.message;} else chunk.forEach(id=>done.add(id));
  }
  if(done.size) OPS.hv=OPS.hv.filter(x=>!done.has(x.id));
  renderHocVien();
  if(fail) avaAlert(`Đã dọn ${done.size} em. Còn ${fail} em không xóa được${msg?': '+msg:''}.`);
  else avaAlert(`Đã dọn xong ${done.size} học sinh mẫu.`);
}

      <input type="date" class="fsel" id="ddDate" value="${ddDate}"/></div>
    <div style="display:grid;gap:6px;flex:1;min-width:180px"><label style="font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.04em">LỚP</label>
      <select class="fsel" id="ddLop" style="max-width:100%">${lopPickHTML(ddLopId)}</select></div>
  </div>
  <div class="panel"><div class="phead"><h3>Chấm công giáo viên</h3>${cc?'<span class="savednote">✓ '+CC_LABEL[cc]+'</span>':'<span class="sub">chưa chấm công</span>'}</div>
    <div class="pbody"><div class="ddrow" style="border:0;padding:0">
      <div class="gvava" style="width:40px;height:40px;background:${avaColor(lop.gv||'?')}">${initials(lop.gv||'?')}</div>
      <div class="nm"><b>${esc(lop.gv||'—')}</b><small>Lớp ${esc(lop.lop)}${USER.role==='admin'?' · '+esc(csName(lop.coSoId)):''}</small></div>
      <div class="seg" id="ccSeg">${['day','nghi','bu'].map(v=>`<button data-v="${v}" class="${cc===v?'on-'+v:''}">${CC_LABEL[v]}</button>`).join('')}</div>
    </div></div>
  </div>
  <div class="panel"><div class="phead"><h3>Điểm danh học sinh</h3><span class="savednote">✓ tự động lưu</span></div>
    <div class="pbody">`;
  if(!ds.length){
    h+=`<div class="empty">${svg(IC.diemdanh,1.5)}Lớp này chưa có danh sách học sinh để điểm danh.<br/><button class="btn btn-sm btn-ghost" id="toGhi" style="margin-top:12px">→ Sang trang Ghi danh</button></div>`;
  }else{
    h+=`<div class="ddsum">
      <div class="p co"><b>${cnt.co}</b><span>có mặt</span></div>
      <div class="p muon"><b>${cnt.muon}</b><span>muộn</span></div>
      <div class="p vang"><b>${cnt.phep+cnt.vang}</b><span>vắng</span></div>
      <div class="p done"><b>${marked}/${ds.length}</b><span>đã điểm</span></div>
    </div>
    <div class="ddgrid">
      <div class="ddrow ddh"><div class="idx">TT</div><div class="nm">HỌC VIÊN</div><span class="hh">ĐIỂM DANH</span></div>
      <div class="ddrow ddh"><div class="idx">TT</div><div class="nm">HỌC SINH</div><span class="hh">ĐIỂM DANH</span></div>`;
    ds.forEach((v,i)=>{
      h+=`<div class="ddrow"><div class="idx">${i+1}</div>
        <div class="nm"><b>${esc(v.ten)}</b>${v.ns?`<small>${esc(v.ns)}</small>`:''}</div>
        <div class="attseg ddSeg" data-hv="${v.id}">${[['co','Có'],['muon','Muộn'],['vang','Vắng']].map(([k,t])=>`<button data-v="${k}" class="${state[v.id]===k?'on':''}">${t}</button>`).join('')}</div>
      </div>`;
    });
    h+=`</div>`;
  }
  h+='</div></div>';
  $('#view').innerHTML=h;
  $('#ddDate').onchange=e=>{ddDate=e.target.value;renderDiemDanh();};
  $('#ddLop').onchange=e=>{ddLopId=Number(e.target.value);renderDiemDanh();};
  const tg=$('#toGhi'); if(tg)tg.onclick=()=>{ghiLopId=ddLopId;go('ghidanh');};
  $$('#ccSeg button').forEach(b=>b.onclick=async()=>{
    if(cc===b.dataset.v){
      const {error}=await SB.from('cham_cong_gv').delete().eq('lop_id',ddLopId).eq('ngay',ddDate);
      if(error){avaAlert('Lỗi lưu chấm công: '+error.message);return;}
      delete OPS.ccGV[ccKey];
    }else{
      const {error}=await SB.from('cham_cong_gv').upsert({lop_id:ddLopId,ngay:ddDate,coso_id:lop.coSoId,trang_thai:b.dataset.v},{onConflict:'lop_id,ngay'});
      if(error){avaAlert('Lỗi lưu chấm công: '+error.message);return;}
      OPS.ccGV[ccKey]=b.dataset.v;
    }
    renderDiemDanh();
  });
  $$('#view .ddSeg').forEach(seg=>{const id=Number(seg.dataset.hv);
    seg.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
      OPS.ddHV[ddKey]=OPS.ddHV[ddKey]||{};
      if(OPS.ddHV[ddKey][id]===b.dataset.v){
        const {error}=await SB.from('diem_danh_hv').delete().eq('lop_id',ddLopId).eq('ngay',ddDate).eq('hv_id',id);
        if(error){avaAlert('Lỗi lưu điểm danh: '+error.message);return;}
        delete OPS.ddHV[ddKey][id];
      }else{
        const {error}=await SB.from('diem_danh_hv').upsert({lop_id:ddLopId,ngay:ddDate,hv_id:id,coso_id:lop.coSoId,trang_thai:b.dataset.v},{onConflict:'lop_id,ngay,hv_id'});
        if(error){avaAlert('Lỗi lưu điểm danh: '+error.message);return;}
        OPS.ddHV[ddKey][id]=b.dataset.v;
      }
      renderDiemDanh();});
  });
}

/* ẩn/hiện mật khẩu */
const EYE_ON='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4"/><path d="M6.2 6.3A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
$('#eyeBtn').innerHTML=EYE_ON;
$('#eyeBtn').onclick=()=>{const i=$('#upass');const show=i.type==='password';i.type=show?'text':'password';$('#eyeBtn').innerHTML=show?EYE_OFF:EYE_ON;$('#eyeBtn').setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');i.focus();};

/* Giữ đăng nhập: khôi phục phiên khi mở lại app; làm mới token để tránh hết hạn (>1 giờ) */
(async()=>{
  try{
    let {data:{session}}=await SB.auth.getSession();
    if(session){
      const rf=await SB.auth.refreshSession();          // dùng refresh-token đổi lấy token mới
      if(rf.data&&rf.data.session) session=rf.data.session;
    }
    if(session&&session.user) await afterAuth(session.user);
  }catch(e){}
})();
/* Làm mới token định kỳ khi app đang mở (Supabase tự chạy, nhưng gọi lại khi quay lại tab cho chắc) */
document.addEventListener('visibilitychange',()=>{ const app=$('#app'); if(!document.hidden && app && app.style.display!=='none') SB.auth.getSession().catch(()=>{}); });
</script>
</body>
</html>
