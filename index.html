<meta name="twitter:description" content="Hệ thống quản trị chuỗi Trung tâm Anh ngữ AVATAR — Nghệ An"/>
<meta name="twitter:image" content="https://schoolrecords.github.io/avatar/logo.png"/>
<style>
:root{
  --bg:#eef1f7;--card:#ffffff;--ink:#132244;--muted:#5f6a86;--faint:#8b95ae;
  --line:#e2e7f1;--soft:#f2f5fb;
  --brand:#1f4276;--brand-600:#17335f;--brand-700:#10264c;--brand-soft:#dbe4f3;
  --navy-900:#0b1d3d;--navy-800:#10264c;
  --emerald:#2f6fd0;--emerald-soft:#dde8fa;
  --amber:#c98410;--amber-soft:#fbeecd;--rose:#e04b52;--rose-soft:#fbe6e7;
  --sky:#0e7fb0;--sky-soft:#d7edf6;--violet:#7c5cd6;--violet-soft:#e9e2fb;
  --radius:18px;--radius-sm:12px;
  --shadow:0 20px 45px -30px rgba(11,29,61,.55);--shadow-sm:0 8px 22px -16px rgba(11,29,61,.5);
  --dots:radial-gradient(rgba(255,255,255,.16) 1.5px, transparent 1.6px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
/* Font thương hiệu UTM Avo (tự host, hiển thị đồng nhất mọi máy kể cả điện thoại) */
@font-face{font-family:'UTM Avo';src:url('fonts/UTM-Avo.ttf') format('truetype');font-weight:400 600;font-style:normal;font-display:swap}
@font-face{font-family:'UTM Avo';src:url('fonts/UTM-Avo-Bold.ttf') format('truetype');font-weight:700 900;font-style:normal;font-display:swap}
body{margin:0;font-family:"UTM Avo","Quicksand","Nunito","Be Vietnam Pro","Segoe UI",Roboto,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,select,textarea{font-family:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{text-decoration:none;color:inherit}
svg{display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#c4d3d0;border-radius:8px}

/* ===== LOGIN ===== */
#login{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;
  background:var(--dots),
             radial-gradient(1100px 560px at 12% -8%,#1e3d76,transparent 58%),
             radial-gradient(900px 620px at 112% 118%,#12305e,transparent 55%),var(--navy-900);
  background-size:20px 20px,auto,auto,auto}
#login::before,#login::after{content:"";position:absolute;border-radius:50%;filter:blur(64px);pointer-events:none;z-index:0}
#login::before{width:540px;height:540px;left:-150px;top:-130px;background:radial-gradient(circle,rgba(74,120,200,.5),transparent 70%);animation:lblob1 20s ease-in-out infinite}
#login::after{width:480px;height:480px;right:-130px;bottom:-150px;background:radial-gradient(circle,rgba(244,196,48,.18),transparent 70%);animation:lblob2 24s ease-in-out infinite}
@keyframes lblob1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,46px)}}
@keyframes lblob2{0%,100%{transform:translate(0,0)}50%{transform:translate(-56px,-34px)}}
.login-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.login-deco span{position:absolute;width:var(--s,48px);height:var(--s,48px);color:#f4c430;opacity:.15;animation:lfloat var(--d,11s) ease-in-out var(--dl,0s) infinite;will-change:transform}
.login-deco span.w{color:#bcd2f5;opacity:.18}
.login-deco span svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
@keyframes lfloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-26px) rotate(calc(var(--r,0deg) - 6deg))}}
@media(prefers-reduced-motion:reduce){#login::before,#login::after,.login-deco span{animation:none}}
.lcard{position:relative;z-index:2;width:min(420px,100%);background:var(--card);border-radius:26px;box-shadow:0 44px 90px -46px #000;overflow:hidden}
.lhead{position:relative;overflow:hidden;color:#fff;padding:38px 30px 30px;text-align:center;background:radial-gradient(135% 90% at 50% -8%,rgba(74,120,200,.5) 0%,rgba(74,120,200,0) 55%),linear-gradient(162deg,#103166 0%,#0a1e46 56%,#071531 100%);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#8a6a1e,#f4c430,#8a6a1e) 1}
.lhead::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(212,175,55,.55) 1.2px,transparent 1.4px);background-size:12px 12px;-webkit-mask-image:radial-gradient(72% 62% at 6% 94%,#000 0%,transparent 60%),radial-gradient(62% 55% at 96% 6%,#000 0%,transparent 62%);mask-image:radial-gradient(72% 62% at 6% 94%,#000 0%,transparent 60%),radial-gradient(62% 55% at 96% 6%,#000 0%,transparent 62%);opacity:.85}
.lhead::after{content:"";position:absolute;left:-25%;right:-25%;top:-10%;bottom:-30%;pointer-events:none;transform:rotate(-7deg);background:radial-gradient(58% 38% at 22% 34%,transparent 38%,rgba(244,196,48,.5) 40%,rgba(244,196,48,0) 44%),radial-gradient(66% 42% at 82% 66%,transparent 43%,rgba(244,196,48,.38) 45%,rgba(244,196,48,0) 49%)}
.llogo{width:96px;height:96px;border-radius:24px;background:transparent;overflow:visible;margin:0 auto 12px;position:relative;z-index:1;filter:drop-shadow(0 12px 26px rgba(240,195,55,.4))}
.llogo img,.brand .lg img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.lhead h1{margin:0;font-size:1.7rem;letter-spacing:.12em;font-weight:900;position:relative;z-index:1;background:linear-gradient(180deg,#fff4c9 0%,#f4c430 48%,#d38f16 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
.lhead p{margin:9px 0 0;color:#dbe6f7;font-size:.86rem;position:relative;z-index:1}
.lbody{padding:26px 28px 30px}
.lbody label{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px 3px}
.field{margin-bottom:15px}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--soft);border-radius:13px;padding:13px 14px;outline:0;transition:.15s}
.field input:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.14)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.role{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;text-align:center;transition:.15s;display:grid;gap:8px;justify-items:center}
.role svg{width:23px;height:23px;stroke:var(--muted)}
.role b{font-size:.82rem;font-weight:800}
.role.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(31,66,118,.14)}
.role.on svg{stroke:var(--brand-600)}
.role.on b{color:var(--brand-700)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--faint)}
.eye:hover{color:var(--brand-600);background:var(--soft)}
.eye svg{width:20px;height:20px;stroke:currentColor}
.lnote{font-size:.75rem;color:var(--faint);text-align:center;margin:17px 0 0;line-height:1.5}

.btn{border-radius:13px;padding:13px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.18s;font-size:.92rem}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,#2a5490,#1f4276);color:#fff;box-shadow:0 14px 30px -14px rgba(16,38,76,.9)}
.btn-primary:hover{background:linear-gradient(135deg,#25497f,#17335f)}
.btn-block{width:100%}
.btn-light{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-mint{background:#F3FDF5;border:1.5px solid #bfe8cd;color:#1c7a54;font-weight:800}
.btn-mint:hover{background:#e6f9ec;border-color:#9fdcb4}
.btn-light:hover{background:var(--soft)}
.btn-sm{padding:8px 13px;font-size:.8rem;border-radius:10px}
.btn-ghost{background:var(--soft);color:var(--brand-700)}

/* ===== SHELL ===== */
#app{display:none}
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--dots),linear-gradient(188deg,#1c3c6e 0%,#0b1d3d 74%);background-size:22px 22px,auto;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:18px 13px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 17px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .lg{width:50px;height:50px;border-radius:15px;background:#fff;overflow:hidden;flex:none;box-shadow:0 10px 22px -10px rgba(0,0,0,.5)}
.brand b{display:block;font-size:1.14rem;letter-spacing:.07em;font-weight:800}
.brand small{display:block;color:#8fc0ba;font-size:.68rem;letter-spacing:.02em}
.navlab{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#5f8f88;margin:16px 12px 8px;font-weight:800}
.nav{display:grid;gap:8px;overflow-y:auto;flex:1;padding:2px 1px}
.nav button{display:flex;align-items:center;gap:13px;width:100%;text-align:left;color:#cfe4e0;border-radius:13px;padding:13px 14px;font-weight:600;font-size:1rem;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);transition:background .16s,border-color .16s,color .16s,transform .11s ease}
.nav button svg{width:21px;height:21px;stroke:currentColor;flex:none;opacity:.85}
.nav button .cnt{margin-left:auto;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:99px;color:#a9d3cd}
.nav button:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.13);color:#fff}
.nav button:hover svg{opacity:1}
.nav button:active{transform:translateY(-2px)}
.nav button.on{background:linear-gradient(135deg,#2a5490,var(--brand));border-color:transparent;color:#fff;font-weight:700;box-shadow:0 14px 26px -14px rgba(16,38,76,.95)}
.nav button.on svg{opacity:1}
.nav button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.suser{margin-top:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:15px;padding:11px 12px;display:flex;flex-direction:column;gap:11px}
.suser-top{display:flex;align-items:center;gap:10px}
.suser .ava{width:38px;height:38px;border-radius:12px;background:var(--emerald);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.suser b{display:block;font-size:.84rem;line-height:1.25}
.suser small{display:block;color:#8fc0ba;font-size:.7rem}
.btn-logout{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:11px;font-size:.83rem;font-weight:800;color:#d6e7e3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);transition:.15s}
.btn-logout svg{width:17px;height:17px;stroke:currentColor;flex:none}
.btn-logout:hover{background:var(--rose);border-color:var(--rose);color:#fff}
.btn-key:hover{background:var(--emerald)!important;border-color:var(--emerald)!important;color:#fff!important}

.main{min-width:0;padding:20px 26px 90px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.burger{display:none;width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow-sm)}
.burger svg{width:21px;height:21px;stroke:var(--ink)}
.ttl{min-width:0}
.ttl h1{margin:0;font-size:1.3rem;letter-spacing:-.02em;line-height:1.12}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:.83rem}
/* Thanh thương hiệu (bộ mặt app) */
.topbrand{position:relative;display:flex;align-items:center;gap:12px;background:var(--dots),linear-gradient(120deg,#1c3c6e 0%,#0b1d3d 88%);background-size:20px 20px,auto;color:#fff;border-radius:16px;padding:12px 15px;margin-bottom:13px;box-shadow:0 14px 30px -20px rgba(11,29,61,.85)}
.topbrand .burger{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);box-shadow:none}
.topbrand .burger svg{stroke:#fff}
.tb-logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none;overflow:hidden}
.tb-logo img{width:34px;height:34px;object-fit:contain}
.tb-name{flex:1;min-width:0}
.tb-name b{display:block;font-size:1.06rem;font-weight:800;line-height:1.16;letter-spacing:.02em}
.tb-name small{display:block;font-size:.78rem;color:#f0c552;font-weight:700;margin-top:1px}
.topbrand .bell-wrap{flex:none}
.topbrand .bell-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.24);color:#fff}
.topbrand .bell-btn:hover{background:rgba(255,255,255,.27)}
@media(max-width:560px){.tb-name b{font-size:.95rem}.tb-logo{width:40px;height:40px}.tb-logo img{width:30px;height:30px}}
.topact{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.scope{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 10px 8px 13px;box-shadow:var(--shadow-sm)}
/* ===== Chuông thông báo ===== */
.bell-wrap{position:relative}
.bell-btn{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-sm);color:var(--ink);cursor:pointer;transition:.15s}
.bell-btn:hover{background:#f4f7fb}
.bell-btn:active{transform:scale(.94)}
.bell-btn svg{width:21px;height:21px}
.bell-btn.ring svg{animation:bellRing .6s ease}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(11deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}
.bell-badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--rose);color:#fff;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(224,69,94,.55);border:2px solid #fff}
.bell-badge[hidden]{display:none}
.bell-panel{position:absolute;top:54px;right:0;width:360px;max-width:90vw;max-height:74vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 55px rgba(15,40,80,.24);z-index:200;color:var(--ink);text-align:left}
.bell-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0}
.bell-head b{font-size:.96rem}
.bell-head button{background:none;border:0;color:var(--brand);font-weight:800;font-size:.75rem;cursor:pointer;padding:4px 6px;border-radius:8px}
.bell-head button:hover{background:#f0f5f3}
.bell-head button:disabled{color:var(--muted);cursor:default;background:none}
.bell-list{padding:6px}
.bell-item{display:flex;gap:11px;padding:10px 11px;border-radius:12px;align-items:flex-start}
.bell-item+.bell-item{border-top:1px solid #f1f4f8}
.bell-item.unread{background:rgba(16,118,110,.07)}
.bell-ic{width:36px;height:36px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;background:#f1f5fb}
.bell-ic.n-thu{background:rgba(22,163,74,.14)}
.bell-ic.n-chi{background:rgba(224,69,94,.13)}
.bell-ic.n-hs{background:rgba(37,99,235,.13)}
.bell-ic.n-cc{background:rgba(217,150,59,.15)}
.bell-ic.n-left{background:#eef1f5}
.bell-tx{flex:1;min-width:0}
.bell-tx b{display:block;font-size:.85rem;font-weight:700;line-height:1.32}
.bell-tx small{display:block;color:var(--muted);font-size:.74rem;margin-top:1px}
.bell-tx .rt{color:var(--brand);font-weight:700}
.bell-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:.86rem;line-height:1.5}
.scope svg{width:16px;height:16px;stroke:var(--brand-600);flex:none}
.scope small{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.scope select{border:0;outline:0;background:none;font-weight:800;color:var(--brand-700);max-width:190px;padding:2px 4px}
.scope.lock{background:var(--soft)}.scope.lock select{color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-sm)}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.kpi-ic svg{width:21px;height:21px}
.ic-teal{background:var(--brand-soft)}.ic-teal svg{stroke:var(--brand-600)}
.ic-em{background:var(--emerald-soft)}.ic-em svg{stroke:var(--emerald)}
.ic-sky{background:var(--sky-soft)}.ic-sky svg{stroke:var(--sky)}
.ic-am{background:var(--amber-soft)}.ic-am svg{stroke:var(--amber)}
.ic-vi{background:var(--violet-soft)}.ic-vi svg{stroke:var(--violet)}
.kpi b{display:block;font-size:1.6rem;letter-spacing:-.02em;margin-top:13px;line-height:1}
.kpi span{font-size:.78rem;color:var(--muted)}

/* KPI hero (dashboard) — thẻ gradient nổi bật */
.kcards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kcard{position:relative;overflow:hidden;border-radius:var(--radius);padding:18px 19px;color:#fff;box-shadow:0 18px 36px -22px rgba(11,29,61,.75)}
.kcard .kdeco{position:absolute;top:-32px;right:-32px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.14)}
.kcard .kdeco::after{content:"";position:absolute;top:36px;right:36px;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.12)}
.kcard .kic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.22);position:relative;z-index:1}
.kcard .kic svg{width:22px;height:22px;stroke:#fff}
.kcard b{display:block;font-size:1.75rem;letter-spacing:-.02em;margin-top:14px;line-height:1;position:relative;z-index:1}
.kcard .kl{font-size:.8rem;color:rgba(255,255,255,.88);position:relative;z-index:1}
.kc1{background:linear-gradient(135deg,#eaa845,#c9760f)}
.kc2{background:linear-gradient(135deg,#37b083,#1c7a54)}
.kc3{background:linear-gradient(135deg,#4785db,#1e4f9e)}
.kc4{background:linear-gradient(135deg,#8f70e6,#5d3fb2)}
@media(max-width:900px){.kcards{grid-template-columns:repeat(2,1fr);gap:11px}.kcard b{font-size:1.5rem}}

.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px}
.phead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead h3{margin:0;font-size:1rem}
.phead .sub{font-size:.72rem;color:var(--muted)}
.pbody{padding:16px 18px}

/* toolbar (search/filter) */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 14px;box-shadow:var(--shadow-sm)}
.search svg{width:18px;height:18px;stroke:var(--faint);flex:none}
.search input{border:0;outline:0;background:none;width:100%}
.fsel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm);outline:0;max-width:210px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-size:.83rem;font-weight:700;color:var(--muted);transition:.15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* table */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
thead th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;padding:11px 14px;border-bottom:2px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;background:var(--soft)}
thead th:last-child{border-right:0}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
tbody td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--soft)}
.tright{text-align:right}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.gvcell{display:flex;align-items:center;gap:11px;min-width:170px}
.gvava{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.82rem;color:#fff;flex:none}
.gvcell b{display:block;line-height:1.2}
.gvcell small{color:var(--muted);font-size:.74rem}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.bg-vh{background:var(--sky-soft);color:var(--sky)}
.bg-ta{background:var(--violet-soft);color:var(--violet)}
.bg-em{background:var(--emerald-soft);color:var(--emerald)}
.bg-am{background:var(--amber-soft);color:var(--amber)}
.bg-gray{background:var(--soft);color:var(--muted)}
.linkbtn{color:var(--brand-600);font-weight:800;font-size:.82rem}

/* cơ sở cards */
.cscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.cscard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px 17px;transition:.15s;cursor:pointer;position:relative;overflow:hidden}
.cscard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.cscard.build{opacity:.72;border-style:dashed}
.cscard .cs-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:15px}
.cs-badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.18rem;flex:none}
.avatar-a{font-weight:900;font-style:italic;letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.18)}
/* khối logo AVATAR — hình chữ nhật bo cong, nổi khối */
.cs-logo{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border-radius:11px;background:#fff;color:var(--brand);border:1.5px solid var(--brand-soft);font-weight:800;font-size:.74rem;letter-spacing:.13em;font-style:normal;box-shadow:0 4px 10px -4px rgba(16,38,76,.18)}
/* vòng tròn trang trí theo phong cách thẻ KPI */
.cs-deco{position:absolute;top:-34px;right:-34px;width:132px;height:132px;border-radius:50%;opacity:.12;z-index:0;pointer-events:none}
.cs-deco::after{content:"";position:absolute;top:40px;right:40px;width:78px;height:78px;border-radius:50%;background:inherit;opacity:.7}
.cscard .cs-top,.cscard .cs-stats{position:relative;z-index:1}
.cscard h4{margin:0;font-size:1.24rem;line-height:1.2;text-align:center;font-weight:800;color:var(--ink)}
.cscard .cs-sub{font-size:.82rem;color:var(--muted);text-align:center}
.cs-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cs-stat{background:rgba(255,255,255,.68);border-radius:13px;padding:13px 10px;text-align:center}
.cs-stat b{display:block;font-size:1.58rem;line-height:1.05;color:var(--brand);font-weight:600;letter-spacing:-.01em}
.cs-stat span{font-size:.74rem;color:var(--muted)}
.cs-rev{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.cs-rev small{font-size:.72rem;color:var(--muted)}
.cs-rev b{font-size:1.02rem;color:var(--brand-700)}
.cs-warn{display:inline-flex;align-items:center;gap:3px;font-size:.6rem;font-weight:800;color:#8a5a05;background:var(--amber-soft);border:1px solid #f2dca6;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.cs-mini{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:.74rem;color:var(--muted)}
.cs-mini .mk{color:var(--amber);font-weight:900}
.cs-mini .mbar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.65);overflow:hidden}
.cs-mini .mbar i{display:block;height:100%;background:var(--sky)}
.cs-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.6);margin-top:11px;overflow:hidden}
.cs-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--emerald))}
.cssum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cssum .s{flex:1;min-width:110px;background:var(--dots),linear-gradient(188deg,#3a5da0 0%,#22406f 78%);background-size:22px 22px,auto;border:0;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);text-align:center}
.cssum .s b{display:block;font-size:1.34rem;line-height:1;color:#fff;font-weight:900}
.cssum .s span{font-size:.73rem;color:#dce6f6}
.cs-back{margin-bottom:14px}
.csd-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.csd-hero h2{margin:0;font-size:1.5rem;line-height:1.2}
.csd-money{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.csd-money .mbox{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
.csd-money .mbox small{display:block;font-size:.74rem;color:var(--muted);margin-bottom:6px}
.csd-money .mbox b{font-size:1.22rem;line-height:1}
.csd-money .mbox.done{background:#eafaf1;border-color:#bfead2}
.csd-money .mbox.done b{color:var(--emerald)}
.csd-money .mbox.pend{background:#fdf1ec;border-color:#f6d4c6}
.csd-money .mbox.pend b{color:#d9663b}
.csd-prog{display:flex;align-items:center;gap:12px;padding:0 16px 16px}
.csd-prog-bar{flex:1;height:9px;border-radius:99px;background:#eef1f6;overflow:hidden}
.csd-prog-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--emerald))}
.csd-prog span{font-size:.8rem;color:var(--muted);white-space:nowrap}
/* nút trạng thái đóng học phí */
.hv-paid{display:flex;gap:8px}
.hv-paid button{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:.86rem;color:var(--muted);cursor:pointer;transition:.12s}
.hv-paid button[data-p="1"].sel{background:#eafaf1;border-color:var(--emerald);color:var(--emerald)}
.hv-paid button[data-p="0"].sel{background:#fdf1ec;border-color:#d9663b;color:#d9663b}
.hv-paid3{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:7px}
.hv-paid3 button{padding:10px 4px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;transition:.12s}
.hv-paid3 button[data-p="1"].sel{background:#eafaf1;border-color:var(--emerald);color:var(--emerald)}
.hv-paid3 button[data-p="0"].sel{background:#fdf1ec;border-color:#d9663b;color:#d9663b}
.hv-paid3 input{padding:10px 6px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:600;font-size:.82rem;text-align:center;color:var(--ink);min-width:0;width:100%}
.hv-paid3 input:disabled{background:#f2f4f8;color:var(--faint)}
.hv-stt2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.hv-stt2 button{padding:10px 4px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;transition:.12s}
.hv-stt2 button[data-s="0"].sel{background:#eafaf1;border-color:var(--emerald);color:var(--emerald)}
.hv-stt2 button[data-s="1"].sel{background:#eef1f5;border-color:#8a94a6;color:#5a6475}
.gv-lopcheck{max-height:220px;overflow:auto;border:1.5px solid var(--line);border-radius:11px;background:#fff}
.lopgrid{display:flex;flex-direction:column;font-size:.83rem}
.lopgrid-h,.lopgrid-r{display:grid;grid-template-columns:34px 1fr 52px 1.5fr;align-items:center;gap:6px}
.lopgrid-h{position:sticky;top:0;background:#f4f7fb;font-weight:800;color:var(--muted);font-size:.71rem;text-transform:uppercase;letter-spacing:.02em;padding:8px 10px;border-bottom:1.5px solid var(--line);z-index:1}
.lopgrid-r{padding:9px 10px;border-bottom:1px solid #eef1f6;cursor:pointer;margin:0;user-select:none}
.lopgrid-r:last-child{border-bottom:0}
.lopgrid-r:hover{background:#f7f9fc}
.lopgrid-r:has(input:checked){background:#eafaf1}
.lopgrid-r input{width:17px;height:17px;accent-color:var(--emerald);cursor:pointer;margin:0 auto}
.lg-lop{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-ss{color:var(--muted);text-align:center}
.lg-gv{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Hộp thoại AVATAR thông báo (thay alert/confirm mặc định) */
.ava-dlg-ov{position:fixed;inset:0;z-index:9999;background:rgba(11,29,61,.5);display:grid;place-items:center;padding:20px;animation:avaFade .15s ease}
.ava-dlg{background:#fff;border-radius:18px;max-width:410px;width:100%;box-shadow:0 30px 70px -20px rgba(11,29,61,.65);overflow:hidden;animation:avaPop .18s ease}
.ava-dlg-h{display:flex;align-items:center;gap:10px;padding:15px 18px;background:var(--dots),linear-gradient(135deg,#1f4276,#10264c);background-size:16px 16px,auto;color:#fff;font-weight:800;font-size:1.04rem}
.ava-dlg-h svg{width:22px;height:22px;fill:none;stroke:#f4c430;stroke-width:1.9;flex:none}
.ava-dlg-b{padding:18px;color:var(--ink);font-size:.95rem;line-height:1.55}
.ava-dlg-b b{color:var(--brand)}
.ava-dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:2px 18px 18px}
.ava-dlg-btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 22px;cursor:pointer;font-size:.9rem;transition:.12s}
.ava-dlg-btn.ghost{background:#eef1f7;color:var(--muted)}
.ava-dlg-btn.primary{background:var(--brand);color:#fff}
.ava-dlg-btn.danger{background:#d64541;color:#fff}
.ava-dlg-btn:active{transform:scale(.97)}
@keyframes avaFade{from{opacity:0}to{opacity:1}}
@keyframes avaPop{from{transform:translateY(8px) scale(.96);opacity:.5}to{transform:none;opacity:1}}
.paidtag{display:inline-block;font-size:.66rem;font-weight:800;padding:1px 7px;border-radius:99px;margin-left:5px;vertical-align:middle}
.paidtag.yes{background:#eafaf1;color:var(--emerald)}
.paidtag.part{background:#fff5e6;color:#c47f16}
.paidtag.no{background:#fdf1ec;color:#d9663b}
.leftTag{display:inline-block;font-size:.66rem;font-weight:800;padding:1px 7px;border-radius:99px;margin-left:5px;vertical-align:middle;background:#eef1f5;color:#6b7688}
.ddrow.hv-left{opacity:.72}
.ddrow.hv-left .nm b{color:#8a94a6}

/* ===== GHI DANH / ĐIỂM DANH ===== */
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form2 .fld{display:grid;gap:6px}
.form2 .fld.full{grid-column:1/-1}
.form2 label{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.form2 input,.form2 select{border:1.5px solid var(--line);background:var(--soft);border-radius:11px;padding:11px 12px;outline:0;width:100%}
.form2 input:focus,.form2 select:focus{border-color:var(--brand);background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{padding:7px 10px;font-size:.77rem;font-weight:800;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on-co,.seg button.on-day{background:var(--emerald-soft);color:var(--emerald)}
.seg button.on-muon,.seg button.on-bu{background:var(--amber-soft);color:var(--amber)}
.seg button.on-phep{background:var(--sky-soft);color:var(--sky)}
.seg button.on-vang,.seg button.on-nghi{background:var(--rose-soft);color:var(--rose)}
.ddrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ddrow:last-child{border-bottom:0}
.ddrow .idx{width:22px;color:var(--faint);font-weight:800;font-size:.8rem;flex:none;text-align:center}
.ddrow .nm{flex:1;min-width:0}
.ddrow .nm b{display:block;font-size:.9rem;line-height:1.25}
.ddrow .nm small{color:var(--muted);font-size:.73rem}
/* điểm danh 2 cột */
.ddgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:26px}
.ddgrid>.ddrow:nth-child(even){border-left:1px solid var(--line);padding-left:20px}
.ddgrid>.ddrow.ddh{background:var(--soft);border-radius:9px;border-bottom:0;margin-bottom:3px;padding:8px 11px}
.ddgrid>.ddrow.ddh .idx,.ddgrid>.ddrow.ddh .nm,.ddgrid>.ddrow.ddh .hh{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.ddgrid>.ddrow.ddh .hh{margin-left:auto}
.ddgrid>.ddrow.ddh:nth-child(even){border-left:0;padding-left:11px}
@media(max-width:760px){.ddgrid{grid-template-columns:1fr;column-gap:0}.ddgrid>.ddrow:nth-child(even){border-left:0;padding-left:0}.ddgrid>.ddrow.ddh:nth-child(2){display:none}}
.savednote{font-size:.73rem;color:var(--emerald);font-weight:800}
.tagmau{font-size:.6rem;font-weight:800;color:var(--amber);background:var(--amber-soft);padding:1px 6px;border-radius:6px;vertical-align:middle;letter-spacing:.02em}
.ddsum{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.ddsum .p{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 15px;display:flex;align-items:baseline;gap:6px}
.ddsum .p b{font-size:1.18rem;font-weight:900}.ddsum .p span{font-size:.8rem;color:var(--muted)}
.ddsum .p.co{background:#f0fdf4;border-color:#bbf7d0}.ddsum .p.co b{color:#16a34a}
.ddsum .p.muon{background:var(--amber-soft);border-color:#f4dfb0}.ddsum .p.muon b{color:var(--amber)}
.ddsum .p.vang{background:var(--rose-soft);border-color:#f4cdcf}.ddsum .p.vang b{color:var(--rose)}
.ddsum .p.phep{background:#eef2ff;border-color:#ccd6f6}.ddsum .p.phep b{color:#4f5fc4}
.ddsum .p.done{background:var(--emerald-soft);border-color:#c4d8f5}.ddsum .p.done b{color:var(--emerald)}
/* hàng điểm danh: hover nổi khối */
.ddgrid>.ddrow:not(.ddh){border-radius:9px;transition:background .12s}
.ddgrid>.ddrow:not(.ddh):hover{background:var(--soft)}
/* nút điểm danh học sinh — 4 trạng thái: Có / Muộn / Phép / Vắng */
.attseg{display:inline-flex;gap:6px;flex:none}
.attseg button{min-width:54px;padding:8px 4px;font-size:.76rem;font-weight:800;border-radius:10px;border:1.6px solid;background:#fff;transition:.12s}
.attseg button[data-v=co]{color:#16a34a;border-color:#bbf7d0}
.attseg button[data-v=muon]{color:var(--amber);border-color:#f0d79a}
.attseg button[data-v=phep]{color:#4f5fc4;border-color:#ccd6f6}
.attseg button[data-v=vang]{color:var(--rose);border-color:#f2bcbf}
.attseg button:hover{filter:brightness(.98);transform:translateY(-1px)}
.attseg button.on[data-v=co]{background:#16a34a;border-color:#16a34a;color:#fff;box-shadow:0 3px 9px rgba(22,163,74,.30)}
.attseg button.on[data-v=muon]{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 3px 9px rgba(201,132,16,.30)}
.attseg button.on[data-v=phep]{background:#4f5fc4;border-color:#4f5fc4;color:#fff;box-shadow:0 3px 9px rgba(79,95,196,.30)}
.attseg button.on[data-v=vang]{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 3px 9px rgba(224,75,82,.30)}
@media(max-width:400px){.attseg button{min-width:46px;padding:8px 2px;font-size:.72rem}}
@media(max-width:520px){.ddrow{flex-wrap:wrap}.ddrow .seg,.ddrow .attseg{margin-left:34px}}

/* ===== SỔ QUỸ THU CHI ===== */
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn-thu{background:var(--emerald-soft);color:var(--emerald)}
.btn-thu:hover{background:#cdeede}
.btn-chi{background:var(--rose-soft);color:var(--rose)}
.btn-chi:hover{background:#fbdada}
.btn-xls{background:#1d6f42;color:#fff}
.btn-xls:hover{background:#175a36}
.bg-rose{background:var(--rose-soft);color:var(--rose)}
td.thu{color:var(--emerald);font-weight:800}
td.chi{color:var(--rose);font-weight:800}

/* ===== PHIẾU THU/CHI ===== */
.voucher{position:fixed;inset:0;z-index:80;background:rgba(9,32,29,.6);backdrop-filter:blur(3px);display:none;overflow-y:auto;padding:18px}
.voucher.on{display:block}
.vbar{max-width:720px;margin:0 auto 12px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.vpaper{max-width:720px;margin:0 auto;background:#fff;border-radius:6px;padding:34px 40px 30px;font-family:"Times New Roman",Georgia,serif;color:#000;line-height:1.55;box-shadow:0 30px 70px -30px #000}
.vtop{display:flex;justify-content:space-between;gap:16px;font-size:.9rem}
.vtop b{font-size:.95rem}
.vmau{text-align:right;font-size:.82rem}
.vmau i{font-size:.74rem}
.vtitle{text-align:center;font-size:1.7rem;font-weight:700;margin:14px 0 2px;letter-spacing:.02em}
.vdate{text-align:center;font-style:italic;font-size:.9rem}
.vno{text-align:center;font-size:.9rem;margin-bottom:14px}
.vfields{width:100%;border-collapse:collapse;font-size:.98rem}
.vfields td{padding:5px 0;vertical-align:top}
.vfields td:first-child{width:170px;white-space:nowrap}
.vsign{display:flex;justify-content:space-between;gap:6px;margin-top:26px;text-align:center;font-size:.86rem}
.vsign>div{flex:1}
.vsign b{display:block;font-size:.9rem}
.vsign small{display:block;font-style:italic;color:#333;font-size:.76rem;margin-top:2px}
.vsign::before{content:"";}
@media print{
  body>*{display:none!important}
  #voucher{display:block!important;position:static;background:#fff;padding:0;backdrop-filter:none}
  .vbar{display:none!important}
  .vpaper{box-shadow:none;max-width:100%;padding:10px 6px}
  /* In trang Hướng dẫn (body.print-guide): chỉ in phần nội dung */
  body.print-guide #voucher{display:none!important}
  body.print-guide #app{display:block!important}
  body.print-guide .shell{display:block}
  body.print-guide .side,body.print-guide .top,body.print-guide .botnav,body.print-guide .scrim,
  body.print-guide .g-bar,body.print-guide .g-toc{display:none!important}
  body.print-guide .main{padding:0}

async function syncHocPhiVoucher(h,amt){
  const del=await SB.from('so_quy').delete().eq('hv_id',h.id);
  if(del.error) return;                       // cột hv_id chưa có → chưa chạy SQL đồng bộ
  OPS.gd=OPS.gd.filter(g=>g.hvId!==h.id);

  const hp=h.hocPhi||0;
  const sd=Math.min(Number(amt!=null?amt:h.soTienDong)||0,hp);
  if(sd>0){
    const conLai=hp-sd;
    const noi='Học phí: '+h.ten+' — '+lopName(h.lopId)+(conLai>0?(' (đóng '+fmtVND(sd)+'/'+fmtVND(hp)+', còn '+fmtVND(conLai)+')'):' (đã đủ)');
    const rec={ngay:h.ngayDong||todayISO(),loai:'thu',hangMuc:'Học phí',coSoId:h.coSoId,soTien:sd,noiDung:noi,nguoiLap:USER.role==='admin'?'Quản trị':csName(USER.coSoId)};

    if(!error&&data) OPS.gd.push(gdFromDb(data));
  }
}
/* Giáo viên & Lớp học sống (Giai đoạn 2) */
const gvFromDb=r=>({id:r.id,ten:r.ten,ns:r.ns||'',td:r.td||'',dc:r.dc||'',sdt:r.sdt||'',mon:r.mon||'VH',coSoId:r.coso_id,ngayHd:r.ngay_hd||null});
const gvToDb=o=>({ten:o.ten,ns:o.ns||'',td:o.td||'',dc:o.dc||'',sdt:o.sdt||'',mon:o.mon||'VH',coso_id:o.coSoId});
const lopFromDb=r=>({id:r.id,lop:r.lop,gv:r.gv||'',siso:Number(r.siso)||0,mon:r.mon||'VH',coSoId:r.coso_id,gvId:(r.gv_id!=null?r.gv_id:null)});
const lopToDb=o=>({lop:o.lop,gv:o.gv||'',siso:Number(o.siso)||0,mon:o.mon||'VH',coso_id:o.coSoId});
let gvLive=false;   // true khi đã chạy SQL Giai đoạn 2 (GV/Lớp lấy từ Supabase)
async function loadCloud(){
  const [hv,gd,dd,cc,ge,gvR,lopR,dz]=await Promise.all([
    SB.from('hoc_vien').select('*'),
    SB.from('so_quy').select('*'),
    SB.from('diem_danh_hv').select('*'),
    SB.from('cham_cong_gv').select('*'),
    SB.from('gv_edits').select('*'),
    SB.from('giao_vien').select('*'),
    SB.from('lop_hoc').select('*'),
    SB.from('duyet_diem_danh').select('*')
  ]);
  if(hv.error||gd.error||dd.error||cc.error) throw (hv.error||gd.error||dd.error||cc.error);
  OPS.hv=(hv.data||[]).map(hvFromDb);
  OPS.gd=(gd.data||[]).map(gdFromDb);
  OPS.ddHV={}; (dd.data||[]).forEach(r=>{const k=r.lop_id+'|'+r.ngay;(OPS.ddHV[k]=OPS.ddHV[k]||{})[r.hv_id]=r.trang_thai;});
  OPS.ccGV={}; (cc.data||[]).forEach(r=>{OPS.ccGV['cc|'+r.lop_id+'|'+r.ngay]=r.trang_thai;});
  // Trạng thái duyệt ca dạy (bỏ qua êm nếu chưa chạy SQL Giai đoạn 4)
  OPS.duyet={}; if(!dz.error)(dz.data||[]).forEach(r=>{OPS.duyet[r.lop_id+'|'+r.ngay]={id:r.id,st:r.trang_thai,gvAt:r.gv_gui_at,letanAt:r.letan_at,adminAt:r.admin_at};});
  // GV giảng dạy: RLS chỉ trả lớp mình phụ trách → LOP = đúng các lớp đó (GV có thể rỗng)
  if(USER.role==='teacher'){
    gvLive=true;
    LOP.length=0; (lopR.data||[]).forEach(r=>LOP.push(lopFromDb(r)));
    GV.length=0; (gvR.data||[]).forEach(r=>GV.push(gvFromDb(r)));
  } else {
    // Nếu đã migrate (bảng giao_vien có dữ liệu) → dùng bản SỐNG; chưa thì giữ data.js
    gvLive = !gvR.error && !lopR.error && (gvR.data||[]).length>0;
    if(gvLive){
      GV.length=0; (gvR.data||[]).forEach(r=>GV.push(gvFromDb(r)));
      LOP.length=0; (lopR.data||[]).forEach(r=>LOP.push(lopFromDb(r)));
    } else if(!ge.error){
      applyGvEdits(ge.data||[]);
    }
  }
}
/* gộp các chỉnh sửa giáo viên (lưu ở Supabase) đè lên dữ liệu tĩnh data.js */
function applyGvEdits(rows){
  rows.forEach(e=>{const g=GV.find(x=>x.id===e.gv_id); if(!g)return;
    ['ten','ns','td','dc','sdt','mon'].forEach(k=>{ if(e[k]!=null && String(e[k]).length) g[k]=e[k]; });
    if(e.ngay_hd) g.ngayHd=e.ngay_hd;});
}
const fmtVND=n=>Math.round(n).toLocaleString('vi-VN')+'₫';
const fmtShort=n=>{n=Math.round(n);
  if(n>=1e9)return (n/1e9).toFixed(n>=1e10?0:1).replace(/\.0$/,'')+' tỷ';
  if(n>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+' tr';
  if(n>=1e3){const k=Math.round(n/1e3); return k>=1000?(n/1e6).toFixed(1).replace(/\.0$/,'')+' tr':k+'k';}   // 999.999 → "1 tr" thay vì "1000k"
  return n+'₫';};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Ô nhập tiền: tự thêm dấu chấm nghìn khi gõ (1200000 → 1.200.000) */
function attachMoneyFormat(el){
  if(!el)return;
  el.setAttribute('inputmode','numeric');
  const grp=()=>{const d=el.value.replace(/\D/g,'');el.value=d?Number(d).toLocaleString('vi-VN'):'';};
  grp();                       // định dạng luôn giá trị có sẵn
  el.addEventListener('input',grp);
}
/* Ô ngày sinh: tự chèn "/" khi gõ (29072015 → 29/07/2015), tối đa dd/mm/yyyy */
function attachDateFormat(el){
  if(!el)return;
  el.setAttribute('inputmode','numeric'); el.setAttribute('maxlength','10');
  const fmt=()=>{const d=el.value.replace(/\D/g,'').slice(0,8);
    el.value = d.length>4 ? d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4)
             : d.length>2 ? d.slice(0,2)+'/'+d.slice(2) : d;};
  fmt(); el.addEventListener('input',fmt);
}
/* Kiểm tra ngày sinh: để trống = hợp lệ; nếu có phải đúng dd/mm/yyyy, năm ≤ hiện tại */
function isValidDob(s){
  s=String(s||'').trim(); if(!s)return true;
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s); if(!m)return false;
  const d=+m[1],mo=+m[2],y=+m[3],now=new Date().getFullYear();
  if(mo<1||mo>12||y<1900||y>now)return false;
  const leap=(y%4===0&&y%100!==0)||y%400===0;
  const dim=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][mo-1];
  return d>=1&&d<=dim;
}
/* ===== Hộp thoại AVATAR (thay alert/confirm của trình duyệt) ===== */
const IC_BELL='<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>';
function avaDialog({title,message,okText,cancelText,danger}){
  return new Promise(resolve=>{
    const ov=document.createElement('div'); ov.className='ava-dlg-ov';
    const body=esc(String(message==null?'':message)).replace(/\n/g,'<br>');
    ov.innerHTML=`<div class="ava-dlg" role="dialog" aria-modal="true">
      <div class="ava-dlg-h"><svg viewBox="0 0 24 24">${IC_BELL}</svg><span>${esc(title||'AVATAR thông báo')}</span></div>
      <div class="ava-dlg-b">${body}</div>
      <div class="ava-dlg-f">
        ${cancelText!==null?`<button class="ava-dlg-btn ghost" data-r="0">${esc(cancelText||'Hủy')}</button>`:''}
        <button class="ava-dlg-btn ${danger?'danger':'primary'}" data-r="1">${esc(okText||'OK')}</button>
      </div></div>`;
    document.body.appendChild(ov);
    const done=v=>{ov.remove();document.removeEventListener('keydown',onKey);resolve(v);};
    const onKey=e=>{ if(e.key==='Escape'&&cancelText!==null)done(false); else if(e.key==='Enter')done(true); };
    ov.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>done(b.dataset.r==='1'));
    ov.addEventListener('click',e=>{ if(e.target===ov&&cancelText!==null)done(false); });
    document.addEventListener('keydown',onKey);
    const ok=ov.querySelector('[data-r="1"]'); if(ok)ok.focus();
  });
}
const avaAlert=(message,opts={})=>avaDialog({title:opts.title||'AVATAR thông báo',message,okText:opts.okText||'Đã hiểu',cancelText:null,danger:opts.danger});
const avaConfirm=(message,opts={})=>avaDialog({title:opts.title||'AVATAR thông báo',message,okText:opts.okText||'Đồng ý',cancelText:opts.cancelText||'Hủy',danger:opts.danger});
const initials=s=>{const p=String(s).trim().split(/\s+/);return ((p[p.length-2]?.[0]||'')+(p[p.length-1]?.[0]||'')).toUpperCase()||'?';};
const AVCOL=['#1f4276','#2a5490','#0e7fb0','#3a5db0','#5b6fb8','#7c5cd6','#2f6fd0','#17335f'];
const avaColor=s=>AVCOL[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%AVCOL.length];
/* nền màu cho thẻ cơ sở — tông theo dải KPI (rực hơn nhưng vẫn nhạt để chữ navy đọc rõ) */
const CS_PASTEL=[['#e0f2e9','#bfe6d1'],['#fce6cf','#f6d3a6'],['#dfebfc','#bfd9f8'],['#ebe3fb','#d3c2f4'],['#fbe0e3','#f4c4c9'],['#d9eff6','#b8e2ec'],['#e3e7fa','#c9d1f3'],['#fbe0ef','#f3c2dd'],['#defaec','#bef0d6'],['#fdeed6','#f6dcb0']];
const csPastel=id=>{const p=CS_PASTEL[((id%CS_PASTEL.length)+CS_PASTEL.length)%CS_PASTEL.length];return`linear-gradient(150deg,${p[0]},${p[1]})`;};

/* ============ DATA ============ */
const DATA=window.AVATAR_DATA;

/* viết tắt cơ sở, tự tách khi trùng (Diễn Hạnh/Diễn Hồng đều "DH") */
const fold=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
const CS_ABBR=(()=>{
  const base={},cnt={},map={};
  COSO.forEach(c=>{const w=fold(c.ten).trim().split(/\s+/);const b=((w[w.length-2]?.[0]||'')+(w[w.length-1]?.[0]||'')).toUpperCase();base[c.id]=b;cnt[b]=(cnt[b]||0)+1;});
  COSO.forEach(c=>{const w=fold(c.ten).trim().split(/\s+/);const b=base[c.id];
    if(cnt[b]>1){const last=w[w.length-1];map[c.id]=(w[w.length-2]?.[0]||'').toUpperCase()+last[0].toUpperCase()+(last.slice(1,2)||'').toLowerCase();}
    else map[c.id]=b;});
  return map;
})();
const csAbbr=id=>CS_ABBR[id]||'?';
let GV=[],LOP=[];
DATA.forEach(c=>{(c.gv||[]).forEach(g=>GV.push({...g,coSoId:c.id})); (c.lop||[]).forEach(l=>LOP.push({...l,coSoId:c.id}));});
const csName=id=>COSO.find(c=>c.id===id)?.ten||'—';
/* Số học sinh ĐANG HỌC thực tế (từ bảng hoc_vien) theo phạm vi cơ sở —
   dùng thống nhất cho KPI, thẻ cơ sở & badge menu để không lệch với trang Học sinh. */
const hsActiveCount=ids=>OPS.hv.filter(h=>ids.includes(h.coSoId)&&hvActive(h)).length;
function csStat(id){
  const g=GV.filter(x=>x.coSoId===id), l=LOP.filter(x=>x.coSoId===id);
  return {gv:g.length,lop:l.length,hs:hsActiveCount([id]),thu:l.reduce((s,x)=>s+(x.duthu||0),0)};
}
/* ===== SỐ LIỆU THẬT (từ Supabase) ===== */
/* Học phí theo phạm vi cơ sở: dự thu = Σ học phí mọi HS; đã thu = HS đã đóng */
function hpStat(ids){
  let du=0,da=0,n=0,nDa=0;
  OPS.hv.forEach(h=>{ if(!ids.includes(h.coSoId)||!hvActive(h))return; const p=h.hocPhi||0; const sd=Math.min(Number(h.soTienDong)||0,p); du+=p; n++; if(sd>0){da+=sd;nDa++;} });
  return {du,da,chua:Math.max(0,du-da),rate:du?da/du:0,n,nDa};
}
/* Chuyên cần thật = (có mặt + muộn) / tổng lượt điểm danh trong 30 NGÀY GẦN NHẤT;
   null nếu chưa có dữ liệu. (Trước đây tính cả lịch sử nên loãng dần theo thời gian.) */
function ccStat(ids){
  const d=new Date(); d.setDate(d.getDate()-30);
  const cutoff=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let pres=0,tot=0;
  for(const k in OPS.ddHV){
    const parts=k.split('|'); if(parts[1]<cutoff)continue;
    const lop=LOP.find(l=>l.id===Number(parts[0]));
    if(!lop||!ids.includes(lop.coSoId))continue;
    const obj=OPS.ddHV[k];
    for(const hid in obj){ tot++; const st=obj[hid]; if(st==='co'||st==='muon')pres++; }
  }
  return tot?pres/tot:null;
}
/* Các buổi đã điểm danh HÔM NAY trong phạm vi (thật) */
function ddToday(ids){
  const t=todayISO(), out=[];
  for(const k in OPS.ddHV){
    const parts=k.split('|'), lop=LOP.find(l=>l.id===Number(parts[0]));
    if(parts[1]!==t||!lop||!ids.includes(lop.coSoId))continue;

/* Tạo file mẫu .xlsx trang trọng: tiêu đề nền navy chữ trắng, kẻ viền, cố định dòng đầu, lọc, dòng ví dụ + sheet Hướng dẫn */
async function makeTemplate({sheet,columns,example,filename,title,guide}){
  await ensureExcelJS();
  const wb=new ExcelJS.Workbook(); wb.creator='AVATAR';
  const ws=wb.addWorksheet(sheet,{views:[{state:'frozen',ySplit:2}]});
  // Dòng 1: tiêu đề gộp ô
  ws.mergeCells(1,1,1,columns.length);
  const tc=ws.getCell(1,1); tc.value=title; tc.font={bold:true,size:14,color:{argb:XL_NAVY},name:'Calibri'};
  tc.alignment={vertical:'middle',horizontal:'center'}; ws.getRow(1).height=28;
  // Dòng 2: tiêu đề cột
  ws.columns=columns.map(c=>({key:c.k,width:c.w||18}));
  const hr=ws.getRow(2); hr.height=24;
  columns.forEach((c,i)=>{const cell=hr.getCell(i+1); cell.value=c.h; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL_NAVY}};
    cell.font={bold:true,color:{argb:'FFFFFFFF'},size:12,name:'Calibri'}; cell.alignment={vertical:'middle',horizontal:'center',wrapText:true}; cell.border=xlBorder('FF2A5490');});
  // Danh mục cho cột có danh sách ĐỘNG (dvList, vd tên lớp) → dropdown tham chiếu, không giới hạn độ dài
  const dmRef={};
  const listCols=columns.filter(c=>c.dvList&&c.dvList.length);
  if(listCols.length){
    const dm=wb.addWorksheet('DanhMuc'); dm.state='veryHidden';
    listCols.forEach((c,ci)=>{ const col=ci+1;
      c.dvList.forEach((v,ri)=>{ dm.getCell(ri+1,col).value=v; });
      const L=dm.getColumn(col).letter; dmRef[c.k]=`DanhMuc!$${L}$1:$${L}$${c.dvList.length}`;
    });
  }
  // Danh sách xổ xuống (data validation): dvList (động, tham chiếu) hoặc dv (tĩnh) → chỉ chọn, không gõ sai
  const dvOf=c=> (c.dvList&&dmRef[c.k]) ? {type:'list',allowBlank:true,showErrorMessage:true,errorStyle:'stop',error:'Vui lòng chọn một giá trị trong danh sách.',formulae:[dmRef[c.k]]}
    : c.dv ? {type:'list',allowBlank:true,showErrorMessage:true,errorStyle:'stop',error:'Vui lòng chọn một giá trị trong danh sách.',formulae:['"'+c.dv.join(',')+'"']}
    : null;
  // Dòng 3 trở đi: các dòng trống kẻ viền sẵn để điền (không còn dòng ví dụ để lễ tân khỏi nhầm; cột TT tự đánh số cho dễ nhìn)
  for(let r=0;r<25;r++){const row=ws.getRow(3+r); row.height=20; columns.forEach((c,i)=>{const cell=row.getCell(i+1); cell.border=xlBorder(); if(c.k==='tt'){cell.value=r+1; cell.alignment={horizontal:'center'}; cell.font={color:{argb:'FF9AA6BC'},size:11};} const dv=dvOf(c); if(dv)cell.dataValidation=dv;});}
  ws.autoFilter={from:{row:2,column:1},to:{row:2,column:columns.length}};
  // Sheet hướng dẫn
  if(guide&&guide.length){const g=wb.addWorksheet('Hướng dẫn'); g.getColumn(1).width=90;
    g.getCell(1,1).value='HƯỚNG DẪN NHẬP DỮ LIỆU — AVATAR'; g.getCell(1,1).font={bold:true,size:13,color:{argb:XL_NAVY}};
    guide.forEach((line,i)=>{const cell=g.getCell(3+i,1); cell.value=line; cell.alignment={wrapText:true,vertical:'top'}; cell.font={size:11};});}
  dlBlob(await wb.xlsx.writeBuffer(),filename);
}
/* Đọc file .xlsx người dùng tải lên → mảng object (khóa = tiêu đề cột đã bỏ dấu, chữ thường) */
function xlCellStr(v){if(v==null)return'';if(v instanceof Date){const d=v;return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}if(typeof v==='object'){if(v.text!=null)return String(v.text);if(v.result!=null)return String(v.result);if(v.richText)return v.richText.map(t=>t.text).join('');if(v.hyperlink)return String(v.hyperlink);return '';}return String(v);}
async function readSheet(file){
  await ensureExcelJS();
  const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
  // chỉ xét sheet hiển thị (bỏ qua sheet danh mục ẩn "DanhMuc"), chọn sheet nhiều dòng nhất
  const vis=wb.worksheets.filter(w=>w.state!=='hidden'&&w.state!=='veryHidden');
  const pool=vis.length?vis:wb.worksheets;
  let ws=pool[0]; pool.forEach(w=>{if((w.rowCount||0)>((ws&&ws.rowCount)||0))ws=w;});
  if(!ws)return [];
  // tìm dòng tiêu đề: dòng đầu tiên có >=2 ô chữ KHÁC NHAU
  // (dòng tiêu đề gộp ô như "DANH SÁCH HỌC SINH" trải cùng 1 giá trị ra nhiều cột → phải loại)
  let hRow=1; for(let r=1;r<=Math.min(6,ws.rowCount);r++){const set=new Set();ws.getRow(r).eachCell(c=>{const v=xlCellStr(c.value).trim();if(v)set.add(v.toLowerCase());});if(set.size>=2){hRow=r;break;}}
  const headers=[]; ws.getRow(hRow).eachCell((c,col)=>{headers[col]=fold(xlCellStr(c.value)).toLowerCase().trim();});
  const rows=[];
  for(let r=hRow+1;r<=ws.rowCount;r++){const row=ws.getRow(r);const obj={};let any=false;
    // cột "TT" chỉ là số thứ tự tự đánh sẵn — không tính là dữ liệu (tránh dòng trống có sẵn số bị coi là "thiếu họ tên")
    for(let col=1;col<headers.length;col++){const h=headers[col];if(!h)continue;const val=xlCellStr(row.getCell(col).value).trim();obj[h]=val;if(val&&h!=='tt')any=true;}
    if(any)rows.push(obj);}
  return rows;
}
const xlPick=(o,keys)=>{for(const k in o){if(keys.some(x=>k.includes(x)))return o[k];}return '';};
/* Nạp hàng loạt lên Supabase theo lô 500. Trả về mảng bản ghi DB đã nhập (theo đúng thứ tự), hoặc false nếu lỗi. */
async function importRows(table,dbRows,fromDb,targetArr){
  const inserted=[];
  for(let i=0;i<dbRows.length;i+=500){
    const {data,error}=await SB.from(table).insert(dbRows.slice(i,i+500)).select();
    if(error){avaAlert('Lỗi nhập dữ liệu: '+error.message);return false;}
    (data||[]).forEach(r=>{targetArr.push(fromDb(r));inserted.push(r);});
  }
  return inserted;
}

function hsImportExcel(lop){

    let rows; try{rows=await readSheet(file);}catch(e){avaAlert('Không đọc được file. Hãy dùng file .xlsx theo mẫu tải về.');return;}
    const recs=[],bad=[],badLop=[];
    rows.forEach((r,i)=>{const ten=String(xlPick(r,['ho va ten','ho ten','ten'])).trim(); if(!ten){bad.push(i+2);return;}
      const lopCell=String(xlPick(r,['lop hoc','lop'])).trim();

      if(lopCell){ lp=lopByName[fold(lopCell).toLowerCase().trim()]; if(!lp){badLop.push(i+2);return;} }
      const nh=vnToIso(String(xlPick(r,['thoi gian nhap','ngay nhap'])).trim());

        const groups={};

          const key=(r.ngayNhapHoc||'')+'|'+(r.ngayThoiHoc||'')+'|'+(r.lyDo||'');

       : {role:'owner',coSoId:prof.coso_id,email:user.email,hoTen:prof.ho_ten||''};

let NOTIF=[], notifLastCount=-1;
const notifSeenKey=()=>'avatar_notif_seen_'+((USER&&USER.email)||'x');
const getNotifSeen=()=>{const v=localStorage.getItem(notifSeenKey());return v?Date.parse(v):0;};
const setNotifSeen=ts=>{try{localStorage.setItem(notifSeenKey(),new Date(ts||Date.now()).toISOString());}catch(e){}};
/* Khoảng thời gian dạng "5 phút trước", "2 giờ trước", "hôm qua"… */
function relTime(iso){
  if(!iso)return'';
  const t=Date.parse(iso); if(isNaN(t))return'';
  const s=(Date.now()-t)/1000;
  if(s<45)return'vừa xong';
  if(s<3600)return Math.max(1,Math.floor(s/60))+' phút trước';
  if(s<86400)return Math.floor(s/3600)+' giờ trước';
  if(s<172800)return'hôm qua';
  if(s<604800)return Math.floor(s/86400)+' ngày trước';
  const d=new Date(t);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
}
/* Gom sự kiện: học sinh mới ghi danh, phiếu thu mới, phiếu chi mới */
function buildNotifs(){
  const out=[];
  (OPS.hv||[]).forEach(h=>{ if(h.mau||!h.createdAt)return;
    out.push({ts:h.createdAt, ic:'🧑‍🎓', cls:'n-hs', title:'Học sinh mới: '+h.ten,
      sub:[lopName(h.lopId),csName(h.coSoId)].filter(Boolean).join(' · ')}); });
  (OPS.gd||[]).forEach(g=>{ if(!g.createdAt)return;
    const co=csName(g.coSoId);
    if(g.loai==='thu') out.push({ts:g.createdAt, ic:'💰', cls:'n-thu', title:'Thu '+fmtVND(g.soTien),
      sub:[g.hangMuc||'Khoản thu',co].filter(Boolean).join(' · ')});
    else out.push({ts:g.createdAt, ic:'🧾', cls:'n-chi', title:'Chi '+fmtVND(g.soTien),
      sub:[g.hangMuc||'Khoản chi',co].filter(Boolean).join(' · ')}); });
  out.sort((a,b)=>Date.parse(b.ts)-Date.parse(a.ts));
  return out.slice(0,50);
}
/* Cập nhật badge + (nếu đang mở) nội dung panel — gọi sau mỗi lần dữ liệu đổi */
function renderBell(){
  const badge=$('#bellBadge'); if(!badge)return;
  NOTIF=buildNotifs();
  const seen=getNotifSeen();
  const unread=NOTIF.filter(n=>Date.parse(n.ts)>seen).length;
  if(unread>0){badge.hidden=false;badge.textContent=unread>99?'99+':unread;}
  else badge.hidden=true;
  // rung chuông khi có thêm thông báo mới (không rung lần nạp đầu)
  if(notifLastCount>=0 && NOTIF.length>notifLastCount){
    const b=$('#bellBtn'); if(b){b.classList.remove('ring');void b.offsetWidth;b.classList.add('ring');}
  }
  notifLastCount=NOTIF.length;
  const panel=$('#bellPanel');
  if(panel && !panel.hidden){ fillBellList(seen); const rb=$('#bellRead'); if(rb)rb.disabled=!unread; }
}
/* Chỉ hiện tin CHƯA đọc (ts > mốc đã đọc). Đánh dấu đã đọc = danh sách trống. */
function fillBellList(seen){
  const box=$('#bellList'); if(!box)return;
  const items=NOTIF.filter(n=>Date.parse(n.ts)>seen);
  if(!items.length){ box.innerHTML=`<div class="bell-empty">✅ Không có thông báo mới.<br/>Khi các cơ sở ghi danh học sinh hoặc thu–chi, thông báo sẽ hiện ở đây.</div>`; return; }
  box.innerHTML=items.map(n=>
    `<div class="bell-item unread"><div class="bell-ic ${n.cls}">${n.ic}</div>
      <div class="bell-tx"><b>${esc(n.title)}</b><small>${esc(n.sub||'')}${n.sub?' · ':''}<span class="rt">${relTime(n.ts)}</span></small></div></div>`
  ).join('');
}
function markNotifRead(){
  const newest=NOTIF.length?Date.parse(NOTIF[0].ts):Date.now();
  setNotifSeen(newest);                   // dời mốc đã đọc lên tin mới nhất
  const badge=$('#bellBadge'); if(badge)badge.hidden=true;
  const rb=$('#bellRead'); if(rb)rb.disabled=true;
  fillBellList(getNotifSeen());           // → danh sách trống
}
function openBellPanel(){
  const panel=$('#bellPanel'); if(!panel)return;
  panel.hidden=false;
  const seen=getNotifSeen();
  fillBellList(seen);                     // hiện các tin chưa đọc; KHÔNG tự đánh dấu — để anh bấm "Đánh dấu đã đọc"
  const unread=NOTIF.filter(n=>Date.parse(n.ts)>seen).length;
  const rb=$('#bellRead'); if(rb)rb.disabled=!unread;
}
function closeBellPanel(){ const p=$('#bellPanel'); if(p)p.hidden=true; }

let tkList=null, tkCs='all';
async function callTK(action,payload){
  try{
    // Gắn RÕ token phiên đang đăng nhập (tránh 401 "Chưa đăng nhập" khi invoke chưa kịp đính token)
    const sres=await SB.auth.getSession();
    const token=sres&&sres.data&&sres.data.session&&sres.data.session.access_token;
    if(!token) return {error:'Phiên đăng nhập đã hết hạn. Hãy tải lại trang (Ctrl+F5) rồi đăng nhập lại.'};
    const {data,error}=await SB.functions.invoke('quan-ly-tk',{body:{action,...(payload||{})},headers:{Authorization:'Bearer '+token}});
    if(error){ let msg=error.message||'Không gọi được máy chủ';
      try{ if(error.context&&error.context.json){const j=await error.context.json(); if(j&&j.error)msg=j.error;} }catch(_){}
      return {error:msg}; }
    if(data&&data.error) return {error:data.error};
    return {data:data?data.data:null};
  }catch(e){ return {error:String(e&&e.message||e)}; }
}

/* Sinh mật khẩu ngẫu nhiên dễ đọc (bỏ ký tự gây nhầm: 0 O l 1 i) */
function genPass(len){
  len=len||8; const cs='abcdefghjkmnpqrstuvwxyz23456789';
  const a=new Uint32Array(len); (self.crypto||window.crypto).getRandomValues(a);
  let s=''; for(let i=0;i<len;i++) s+=cs[a[i]%cs.length]; return s;
}

  ['Học sinh đã đóng tiền nhưng Sổ quỹ không thấy phiếu','Phiếu thu học phí chỉ sinh khi <b>số tiền đã đóng &gt; 0</b> và đã bấm <b>Lưu hồ sơ</b>. Mở lại hồ sơ em đó kiểm tra ô số tiền.'],
  ['Quên mật khẩu','Giáo viên: Quản trị vào <b>Tài khoản</b> → <b>Đổi MK</b>. Giám đốc / Lễ tân: liên hệ bộ phận kỹ thuật đặt lại.'],
  ['Muốn đổi mật khẩu của chính mình','Bấm <b>Đổi mật khẩu</b> ở cuối thanh menu bên trái (điện thoại: bấm ☰ rồi kéo xuống), nhập mật khẩu mới hai lần.']

const HD_TIPS=[
  ['📲','Cài lên màn hình chính điện thoại (chọn “Thêm vào Màn hình chính”) để dùng như một ứng dụng riêng, mở nhanh hơn.'],
  ['💡','Sau khi hệ thống được cập nhật, hãy tải lại trang (máy tính bấm Ctrl+F5, điện thoại kéo xuống làm mới) để nhận bản mới nhất.'],
  ['🔔','Chuông ở góc trên báo học sinh mới ghi danh và các khoản thu – chi mới. Bấm <b>“Đánh dấu đã đọc”</b> một lần cho gọn.'],

function renderHuongDan(){
  const allowed=hdRolesAllowed();
  if(!hdRole||!allowed.includes(hdRole)) hdRole=USER.role;
  const R=hdRole, mine=R===USER.role;
  const scopeTxt=USER.role==='admin'?(scope==='all'?'Toàn hệ thống':csName(Number(scope))):csName(USER.coSoId);
  const navs=hdNavFor(R);
  const sec=(id,title,sub,body,extra)=>`<div class="panel" id="${id}"><div class="phead"><h3>${title}</h3>${sub?`<span class="sub">${sub}</span>`:''}${extra||''}</div><div class="pbody">${body}</div></div>`;

  let h=`<div class="guide-hero">
    <span class="ghb">✦ HƯỚNG DẪN SỬ DỤNG</span>
    <h2>AVATAR English — Hệ thống quản trị chuỗi trung tâm</h2>
    <p>Một nơi duy nhất để điều hành cả chuỗi: giáo viên, lớp học, học sinh, học phí, điểm danh – đối soát và báo cáo. Dữ liệu lưu tập trung, mọi máy thấy cùng một con số ngay khi có thay đổi.</p>
    <div class="g-meta">
      <span>${HD_ROLE_ICON[USER.role]} Bạn đang đăng nhập: <b>${esc(HD_ROLE_LABEL[USER.role])}</b></span>
      <span>📍 Phạm vi: <b>${esc(scopeTxt)}</b></span>
      <span>🔄 Đồng bộ thời gian thực</span>
    </div>
  </div>`;

  // Thanh chọn vai trò + nút in
  h+=`<div class="g-bar">
    ${allowed.length>1?`<div class="g-tabs">${allowed.map(r=>`<button data-hr="${r}" class="${R===r?'on':''}">${HD_ROLE_ICON[r]} ${esc(HD_ROLE_LABEL[r])}</button>`).join('')}</div>`:''}
    <button class="btn btn-sm btn-ghost" id="hdPrint" style="white-space:nowrap;margin-left:auto">🖶 In / lưu PDF</button>
  </div>`;
  if(!mine) h+=`<div class="g-note"><span>👁</span><div>Đang xem hướng dẫn dành cho <b>${esc(HD_ROLE_LABEL[R])}</b> — không phải vai trò của bạn. Dùng để in phát cho nhân viên; bấm lại thẻ <b>${esc(HD_ROLE_LABEL[USER.role])}</b> để về hướng dẫn của mình.</div></div>`;

  // Mục lục
  const toc=[['hd-start','Bắt đầu'],['hd-flow','Quy trình một buổi'],['hd-menu','Menu có gì'],['hd-howto','Thao tác từng bước'],['hd-num','Cách tính số liệu'],['hd-faq','Hỏi đáp & sự cố'],['hd-tip','Mẹo dùng']];
  h+=`<div class="g-toc">${toc.map(t=>`<button data-go="${t[0]}">${t[1]}</button>`).join('')}</div>`;

  // 1) Bắt đầu
  h+=sec('hd-start','Bắt đầu — 3 việc đầu tiên',esc(HD_ROLE_LABEL[R]),
    HD_START[R].map((s,i)=>`<div class="step"><div class="sn">${i+1}</div><div class="sc"><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join(''));

  // 2) Quy trình
  h+=sec('hd-flow','Quy trình một buổi dạy','từ ghi danh đến chốt số liệu',
    `<div class="g-flow">${HD_FLOW.map((f,i)=>`<div class="g-fstep"><span class="n">${i+1}</span><b>${f[0]}</b><span>${f[1]}</span><span class="who">${f[2]}</span></div>`).join('')}</div>
     <div class="g-note ok" style="margin-top:12px"><span>🎨</span><div>Màu trạng thái ca dạy: <span class="castat ca-none">Chưa gửi đối soát</span> <span class="castat ca-cho">Chờ đối soát</span> <span class="castat ca-soat">Đã đối soát</span> <span class="castat ca-chot">Đã chốt</span> — ca <b>Đã chốt</b> là số liệu đã khóa, dùng để đối chiếu lương và học phí.</div></div>
     <div class="g-note"><span>💡</span><div>Cơ sở chưa có tài khoản giáo viên: lễ tân tự điểm danh rồi bấm <b>✓ Gửi đối soát</b> — ca chuyển thẳng sang <b>Đã đối soát</b>, bỏ qua bước của giáo viên.</div></div>`);

  // 3) Menu có gì
  h+=sec('hd-menu','Menu có gì',navs.length+' mục hiện với '+esc(HD_ROLE_LABEL[R]),
    navs.map(n=>`<div class="g-mrow"><div class="mi">${svg(n.i)}</div><div><b>${esc(n.t)}</b><span>${HD_MENU_DESC[n.k]||''}</span></div></div>`).join('')
    + (R==='admin'?`<div class="g-note ok" style="margin-top:12px"><span>📍</span><div>Riêng Giám đốc có ô <b>chọn phạm vi</b> ở đầu trang: “Toàn hệ thống” hoặc từng cơ sở — mọi số liệu, danh sách, báo cáo đều đổi theo lựa chọn này.</div></div>`
      :R==='owner'?`<div class="g-note ok" style="margin-top:12px"><span>🔒</span><div>Lễ tân được khóa cố định ở <b>một cơ sở</b>; mọi trang chỉ hiện dữ liệu của cơ sở mình.</div></div>`
      :`<div class="g-note ok" style="margin-top:12px"><span>🔒</span><div>Giáo viên chỉ thấy <b>lớp mình phụ trách</b>, không thấy học phí, sổ quỹ hay lớp của cơ sở khác.</div></div>`));

  // 4) Thao tác từng bước
  h+=sec('hd-howto','Thao tác từng bước','bấm vào từng mục để mở',
    HD_HOWTO[R].map((g,i)=>`<details class="g-acc" ${i===0?'open':''}><summary><span class="gi">${g[0]}</span>${g[1]}</summary><ol>${g[2].map(x=>`<li>${x}</li>`).join('')}</ol></details>`).join(''));

  // 5) Cách tính số liệu
  h+=sec('hd-num','Cách hệ thống tính số liệu','để mọi người đọc số giống nhau',
    `<div class="g-kv">${HD_NUMBERS.map(n=>`<div class="r"><div class="k">${n[0]}</div><div class="v">${n[1]}</div></div>`).join('')}</div>`);

  // 6) FAQ
  h+=sec('hd-faq','Hỏi đáp &amp; xử lý sự cố',HD_FAQ.length+' tình huống thường gặp',
    HD_FAQ.map(f=>`<details class="g-acc"><summary><span class="gi">❓</span>${f[0]}</summary><ul><li>${f[1]}</li></ul></details>`).join(''));

  // 7) Mẹo
  h+=sec('hd-tip','Mẹo dùng &amp; an toàn tài khoản','',
    HD_TIPS.map(t=>`<div class="tiprow"><span>${t[0]}</span><span>${t[1]}</span></div>`).join(''));

  h+=`<div class="panel"><div class="pbody" style="text-align:center;color:var(--muted);font-size:.86rem;line-height:1.6">
    Cần hỗ trợ thêm? Liên hệ bộ phận kỹ thuật của Trung tâm.<br/>
    <b style="color:var(--brand)">AVATAR English</b> — Hệ thống quản trị chuỗi · Nghệ An
  </div></div>`;

  $('#view').innerHTML=h;
  $$('#view [data-hr]').forEach(b=>b.onclick=()=>{hdRole=b.dataset.hr;renderHuongDan();window.scrollTo(0,0);});
  $$('#view [data-go]').forEach(b=>b.onclick=()=>{const el=$('#'+b.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
  $('#hdPrint').onclick=()=>{
    const acc=$$('#view details.g-acc'), was=acc.map(d=>d.open);
    acc.forEach(d=>d.open=true);                 // mở hết mục gấp để in đủ nội dung
    document.body.classList.add('print-guide');
    const restore=()=>{document.body.classList.remove('print-guide');acc.forEach((d,i)=>d.open=was[i]);window.removeEventListener('afterprint',restore);};
    window.addEventListener('afterprint',restore);
    window.print(); setTimeout(restore,1500);    // dự phòng cho trình duyệt không bắn afterprint
  };
}

/* ============ DASHBOARD ============ */
function renderDash(){
  const ids=scopeIds();
  const cosos=inCOSO().filter(c=>!c.build);
  const g=GV.filter(x=>ids.includes(x.coSoId)).length;
  const ls=LOP.filter(x=>ids.includes(x.coSoId));
  const hs=hsActiveCount(ids);                 // số HS đang học thực tế (khớp badge menu & trang Học sinh)

  // ---- tài chính THẬT: học phí từng học sinh ----
  const money=hpStat(ids);
  const duThu=money.du, thucThu=money.da, conNo=money.chua, rate=money.rate*100;

  // ---- chuyên cần THẬT: từ điểm danh đã ghi ----
  const ccReal=ccStat(ids);                 // null nếu chưa có dữ liệu
  const ccAvg=ccReal==null?0:ccReal*100;
  const today=ddToday(ids);                 // buổi đã điểm danh hôm nay
  const coMat=today.reduce((s,l)=>s+l.co,0);
  const siToday=today.reduce((s,l)=>s+l.tot,0);

  const now=new Date(), gio=now.getHours();
  const scopeTxt=USER.role==='admin'?(scope==='all'?'toàn hệ thống':csName(Number(scope))):csName(USER.coSoId);

  let h=`<div class="hello">
    <div class="hi"><small class="hmiss">✦ SỨ MỆNH AVATAR</small><h2>Chắp cánh ước mơ · Vươn tầm tiếng Anh</h2><p>Tình hình ${esc(scopeTxt)} · cập nhật lúc ${String(gio).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</p></div>
    <div class="date"><b>${now.getDate()}/${now.getMonth()+1}</b><span>${DOW[now.getDay()]}</span></div>
  </div>`;

  // KPI hero
  const kpis=[
    {i:IC.thu,v:fmtShort(duThu),l:'Dự thu học phí'},
    {i:IC.thu,v:fmtShort(thucThu),l:'Đã thu học phí'},
    {i:IC.users,v:hs.toLocaleString('vi-VN'),l:'Học sinh'},
    {i:IC.lop,v:ls.length,l:'Lớp học'},
  ];
  h+=`<div class="kcards">${kpis.map((k,i)=>`<div class="kcard kc${i+1}"><span class="kdeco"></span><div class="kic">${svg(k.i)}</div><b>${k.v}</b><span class="kl">${k.l}</span></div>`).join('')}</div>`;

  // Tài chính + Chuyên cần (SỐ LIỆU THẬT)
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Tài chính học phí</h3><span class="sub">${money.nDa}/${money.n} HS đã đóng</span></div>
      <div class="pbody">${money.n===0?'<div class="empty" style="padding:26px 0">Chưa nhập học phí cho học sinh nào.<br/>Vào <b>Học sinh</b> để nhập học phí & đánh dấu đã đóng.</div>':`<div class="finrow">
        ${ring(rate,'đã thu')}
        <div class="finnums">
          <div class="finstat"><small>Dự thu (theo học phí HS)</small><b>${fmtVND(duThu)}</b></div>
          <div class="finstat"><small>Đã thu</small><b class="pos">${fmtVND(thucThu)}</b></div>
          <div class="finstat"><small>Còn phải thu</small><b class="neg">${fmtVND(conNo)}</b></div>
        </div>
      </div>`}</div>
    </div>
    <div class="panel"><div class="phead"><h3>Chuyên cần</h3><span class="sub">30 ngày gần nhất</span></div>
      <div class="pbody">${ccReal==null?'<div class="empty" style="padding:26px 0">Chưa có dữ liệu điểm danh trong phạm vi này.<br/>Vào <b>Điểm danh</b> để bắt đầu ghi nhận.</div>':`<div class="finrow">
        ${ring(ccAvg,'có mặt')}
        <div class="finnums">
          <div class="finstat"><small>Buổi điểm danh hôm nay</small><b>${today.length} buổi</b></div>
          <div class="finstat"><small>Lượt có mặt hôm nay</small><b class="pos">${coMat}/${siToday||0}</b></div>
          <div class="finstat"><small>Chuyên cần chung</small><b>${Math.round(ccAvg)}%</b></div>
        </div>
      </div>`}</div>
    </div>
  </div>`;

  // Điểm danh hôm nay + Cảnh báo
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Điểm danh hôm nay</h3><span class="sub">${today.length} buổi</span></div>
      <div class="pbody">${today.length?today.slice(0,8).map(l=>`
        <div class="tday">
          <div class="ti"><b>${esc(l.lop.lop)}${USER.role==='admin'?' · '+esc(csName(l.lop.coSoId)):''}</b><small>${esc(l.lop.gv||'—')}</small></div>
          <span class="badge bg-em">${l.co}/${l.tot} có mặt</span>
        </div>`).join(''):'<div class="empty">Hôm nay chưa có lớp nào điểm danh.</div>'}
      </div>
    </div>
    <div class="panel"><div class="phead"><h3>Cảnh báo điều hành</h3></div>
      <div class="pbody"><div class="warns">${dashWarns(ids)}</div></div>
    </div>
  </div>`;

  // Hoạt động gần đây — chia theo mảng chủ đề (admin: toàn chuỗi; lễ tân: cơ sở mình, theo RLS)
  const isAdm=USER.role==='admin', CAP=5;
  const scopeLbl=isAdm?(scope==='all'?'toàn chuỗi':csName(Number(scope))):'cơ sở của bạn';
  // 1) Học sinh mới ghi danh
  const hsAll=(OPS.hv||[]).filter(x=>!x.mau&&x.createdAt&&ids.includes(x.coSoId)).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));
  const hsItems=hsAll.map(x=>({main:x.ten,sub:[lopName(x.lopId),isAdm?csName(x.coSoId):''].filter(Boolean).join(' · '),rt:relTime(x.createdAt)}));
  // 2) Điểm danh giáo viên (chấm công buổi dạy)
  const CC_TXT={day:'Lên lớp',nghi:'Nghỉ',bu:'Dạy bù'};
  const ccAll=[];
  for(const k in (OPS.ccGV||{})){ const p=k.split('|'); const lop=LOP.find(l=>l.id===Number(p[1])); if(!lop||!ids.includes(lop.coSoId))continue; ccAll.push({lop,ngay:p[2],st:OPS.ccGV[k]}); }
  ccAll.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  const ccItems=ccAll.map(x=>({main:(x.lop.gv||'—')+' · '+x.lop.lop,tag:{text:CC_TXT[x.st]||x.st,cls:'cc-'+x.st},sub:isAdm?csName(x.lop.coSoId):'',rt:isoVN(x.ngay)}));
  // 3) Điểm danh học sinh — mỗi buổi 1 dòng, ghi số có mặt/tổng đã điểm theo lớp (VD 34/35)
  const ddAll=[];
  for(const k in (OPS.ddHV||{})){ const p=k.split('|'); const lop=LOP.find(l=>l.id===Number(p[0])); if(!lop||!ids.includes(lop.coSoId))continue; const m=Object.values(OPS.ddHV[k]); if(!m.length)continue; const co=m.filter(s=>s==='co'||s==='muon').length; ddAll.push({lop,ngay:p[1],co,tot:m.length}); }
  ddAll.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  const ddItems=ddAll.map(x=>({main:'Lớp '+x.lop.lop,tag:{text:x.co+'/'+x.tot+' có mặt',cls:x.co>=x.tot?'cc-day':(x.co*2>=x.tot?'cc-bu':'cc-nghi')},sub:isAdm?csName(x.lop.coSoId):'',rt:isoVN(x.ngay)}));
  // 4) Học sinh vắng học — tên cụ thể + lớp, mỗi HS vắng 1 dòng
  const vangAll=[];
  for(const k in (OPS.ddHV||{})){ const p=k.split('|'); const lop=LOP.find(l=>l.id===Number(p[0])); if(!lop||!ids.includes(lop.coSoId))continue; const obj=OPS.ddHV[k];
    for(const hid in obj){ const st=obj[hid]; if(st==='vang'||st==='phep'){ const hv=(OPS.hv||[]).find(h=>h.id===Number(hid)); vangAll.push({ten:hv?hv.ten:('HS #'+hid),lop,ngay:p[1],st}); } } }
  vangAll.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  const vangItems=vangAll.map(x=>({main:x.ten,tag:{text:x.st==='phep'?'Vắng phép':'Vắng',cls:'cc-nghi'},sub:['Lớp '+x.lop.lop,isAdm?csName(x.lop.coSoId):''].filter(Boolean).join(' · '),rt:isoVN(x.ngay)}));
  // 5) Học sinh thôi học
  const thoiAll=(OPS.hv||[]).filter(x=>!x.mau&&x.ngayThoiHoc&&ids.includes(x.coSoId)).sort((a,b)=>a.ngayThoiHoc<b.ngayThoiHoc?1:a.ngayThoiHoc>b.ngayThoiHoc?-1:0);
  const thoiItems=thoiAll.map(x=>({main:x.ten,sub:[lopName(x.lopId),x.lyDo,isAdm?csName(x.coSoId):''].filter(Boolean).join(' · '),rt:isoVN(x.ngayThoiHoc)}));
  // 6) Đóng học phí & khoản thu (tài chính — xếp sau các hoạt động)
  const thuAll=(OPS.gd||[]).filter(x=>x.loai==='thu'&&x.createdAt&&ids.includes(x.coSoId)).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));
  const thuItems=thuAll.map(x=>{
    let name=''; if(x.hvId!=null){const hv=(OPS.hv||[]).find(h=>h.id===x.hvId); if(hv)name=hv.ten;}
    return isAdm
      ? {main:'Thu '+fmtVND(x.soTien),sub:[x.hangMuc||'Khoản thu',csName(x.coSoId)].filter(Boolean).join(' · '),rt:relTime(x.createdAt)}
      : {main:(name||x.hangMuc||'Khoản thu')+' · '+fmtVND(x.soTien),sub:name?(x.hangMuc||''):'',rt:relTime(x.createdAt)};
  });
  // 7) Chi tiêu gần đây (tài chính)

function ring(pct,sub){pct=Math.max(0,Math.min(100,pct));return `<div class="ringbox" style="--p:${pct.toFixed(1)}"><div class="rc"></div><div class="rin"><b>${Math.round(pct)}%</b><span>${sub||''}</span></div></div>`;}
/* Thẻ 1 nhóm hoạt động: icon + tiêu đề + badge tổng, tối đa `cap` dòng, còn lại "… và N nữa" */
function actCatCard(ic,cls,title,items,total,cap,hcls){
  cap=cap||5;
  const render=it=>`<div class="actitem"><b>${esc(it.main)}</b><small>${it.tag?`<span class="cctag ${it.tag.cls}">${esc(it.tag.text)}</span> · `:''}${it.sub?esc(it.sub)+' · ':''}<span class="rt">${esc(it.rt||'')}</span></small></div>`;
  let body;
  if(items.length){
    const shown=items.slice(0,cap), hidden=items.slice(cap);
    body=shown.map(render).join('')
      + (hidden.length?`<div class="acthide">${hidden.map(render).join('')}</div><button class="actmore" data-more data-n="${hidden.length}">… và ${hidden.length} mục nữa</button>`:'');
  } else body=`<div class="actcard-empty">Chưa có cập nhật</div>`;
  return `<div class="actcard"><div class="actcard-h ${hcls||''}"><span class="kdeco"></span><div class="ci">${ic}</div><b>${title}</b><span class="cnt">${total}</span></div><div class="actcard-b">${body}</div></div>`;
}
function dashWarns(ids){
  const rows=[];
  inCOSO().forEach(c=>{
    if(!ids.includes(c.id))return;
    if(c.build){rows.push({t:`<b>${esc(c.ten)}</b>: cơ sở đang xây dựng, chưa nhập dữ liệu`});return;}
    const st=csStat(c.id);
    if(st.gv>0&&st.lop===0) rows.push({t:`<b>${esc(c.ten)}</b>: có ${st.gv} GV nhưng chưa nhập lớp học`});
  });
  // cơ sở thu học phí thấp (số thật — chỉ xét nơi đã nhập học phí)
  const low=inCOSO().filter(c=>!c.build&&ids.includes(c.id)).map(c=>({c,...hpStat([c.id])})).filter(x=>x.du>0&&x.rate<0.72).sort((a,b)=>a.rate-b.rate).slice(0,2);
  low.forEach(x=>rows.push({t:`<b>${esc(x.c.ten)}</b>: mới thu ~${Math.round(x.rate*100)}% học phí, cần đôn đốc`}));
  const ic=svg('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>');
  if(!rows.length) return `<div class="warnrow ok">${svg('<path d="M20 6 9 17l-5-5"/>')}<div>Mọi cơ sở đều ổn định, không có cảnh báo.</div></div>`;
  return rows.map(r=>`<div class="warnrow">${ic}<div>${r.t}</div></div>`).join('');
}
