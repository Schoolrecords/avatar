  const scopeTxt=USER.role==='admin'?(scope==='all'?'toàn hệ thống':csName(Number(scope))):csName(USER.coSoId);

  let h=`${tbBarHTML()}
  <div class="hello">
    <div class="hi"><small class="hmiss">✦ SỨ MỆNH AVATAR</small><h2>Chắp cánh ước mơ · Vươn tầm tiếng Anh</h2><p>Tình hình ${esc(scopeTxt)} · cập nhật lúc ${String(gio).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</p></div>
    <div class="date"><b>${now.getDate()}/${now.getMonth()+1}</b><span>${DOW[now.getDay()]}</span></div>
  </div>`;

  // KPI hero
  const kpis=[
    {i:IC.thu,v:fmtShort(duThu),l:'Dự thu học phí'},
    {i:IC.thu,v:fmtShort(thucThu),l:'Đã thu học phí'},
    {i:IC.users,v:hs.toLocaleString('vi-VN'),l:'Học sinh'},
    {i:IC.lop,v:ls.length,l:'Lớp học'},
  ];
  h+=`<div class="kcards">${kpis.map((k,i)=>`<div class="kcard kc${i+1}"><span class="kdeco"></span><div class="kic">${svg(k.i)}</div><b>${k.v}</b><span class="kl">${k.l}</span></div>`).join('')}</div>`;

  // Tài chính + Chuyên cần (SỐ LIỆU THẬT)
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Tài chính học phí</h3><span class="sub">${money.nDa}/${money.n} HS đã đóng</span></div>
      <div class="pbody">${money.n===0?'<div class="empty" style="padding:26px 0">Chưa nhập học phí cho học sinh nào.<br/>Vào <b>Học sinh</b> để nhập học phí & đánh dấu đã đóng.</div>':`<div class="finrow">
        ${ring(rate,'đã thu')}
        <div class="finnums">
          <div class="finstat"><small>Dự thu (theo học phí HS)</small><b>${fmtVND(duThu)}</b></div>
          <div class="finstat"><small>Đã thu</small><b class="pos">${fmtVND(thucThu)}</b></div>
          <div class="finstat"><small>Còn phải thu</small><b class="neg">${fmtVND(conNo)}</b></div>
        </div>
      </div>
      ${money.le?`<div class="g-note" style="margin:12px 0 0"><span>ℹ️</span><div>Trong đó <b>${fmtVND(money.le)}</b> từ <b>${money.nLe} phiếu thu học phí chưa gắn học sinh</b> (lập thẳng ở Sổ quỹ). Tiền đã vào quỹ, nhưng hệ thống chưa biết của em nào nên chưa tính vào phần "đã đóng" của từng em. Vào <b>Thu – Chi</b> → bấm <b>Sửa</b> ở phiếu đó → chọn học sinh.</div></div>`:''}`}</div>
    </div>
    <div class="panel"><div class="phead"><h3>Chuyên cần</h3><span class="sub">30 ngày gần nhất</span></div>
      <div class="pbody">${ccReal==null?'<div class="empty" style="padding:26px 0">Chưa có dữ liệu điểm danh trong phạm vi này.<br/>Vào <b>Điểm danh</b> để bắt đầu ghi nhận.</div>':`<div class="finrow">
        ${ring(ccAvg,'có mặt')}
        <div class="finnums">
          <div class="finstat"><small>Buổi điểm danh hôm nay</small><b>${today.length} buổi</b></div>
          <div class="finstat"><small>Lượt có mặt hôm nay</small><b class="pos">${coMat}/${siToday||0}</b></div>
          <div class="finstat"><small>Chuyên cần chung</small><b>${Math.round(ccAvg)}%</b></div>
        </div>
      </div>`}</div>
    </div>
  </div>`;

  // Điểm danh hôm nay + Cảnh báo
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Điểm danh hôm nay</h3><span class="sub">${today.length} buổi</span></div>
      <div class="pbody">${today.length?today.slice(0,8).map(l=>`
        <div class="tday">
          <div class="ti"><b>${esc(l.lop.lop)}${USER.role==='admin'?' · '+esc(csName(l.lop.coSoId)):''}</b><small>${esc(l.lop.gv||'—')}</small></div>
          <span class="badge bg-em">${l.co}/${l.tot} có mặt</span>
        </div>`).join(''):'<div class="empty">Hôm nay chưa có lớp nào điểm danh.</div>'}
      </div>
    </div>
    <div class="panel"><div class="phead"><h3>Cảnh báo điều hành</h3></div>
      <div class="pbody"><div class="warns">${dashWarns(ids)}</div></div>
    </div>
  </div>`;

  // Hoạt động gần đây — chia theo mảng chủ đề (admin: toàn chuỗi; lễ tân: cơ sở mình, theo RLS)
  const isAdm=USER.role==='admin', CAP=5;
  const scopeLbl=isAdm?(scope==='all'?'toàn chuỗi':csName(Number(scope))):'cơ sở của bạn';
  // 1) Học sinh mới ghi danh
  const hsAll=(OPS.hv||[]).filter(x=>!x.mau&&x.createdAt&&ids.includes(x.coSoId)).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));
  const hsItems=hsAll.map(x=>({main:x.ten,sub:[lopName(x.lopId),isAdm?csName(x.coSoId):''].filter(Boolean).join(' · '),rt:relTime(x.createdAt)}));
  // 2) Điểm danh giáo viên (chấm công buổi dạy)
  const CC_TXT={day:'Lên lớp',nghi:'Nghỉ',bu:'Dạy bù'};
  const ccAll=[];
  for(const k in (OPS.ccGV||{})){ const p=k.split('|'); const lop=LOP.find(l=>l.id===Number(p[1])); if(!lop||!ids.includes(lop.coSoId))continue;
    ccAll.push({lop,ngay:p[2],st:OPS.ccGV[k],gv:gvTenBuoi(lop.id,p[2]),thay:laDayThay(lop.id,p[2])}); }
  ccAll.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  const ccItems=ccAll.map(x=>({main:x.gv+' · '+x.lop.lop+(x.thay?' (dạy thay)':''),tag:{text:CC_TXT[x.st]||x.st,cls:'cc-'+x.st},sub:isAdm?csName(x.lop.coSoId):'',rt:isoVN(x.ngay)}));
  // 3) Điểm danh học sinh — mỗi buổi 1 dòng, ghi số có mặt/tổng đã điểm theo lớp (VD 34/35)
  const ddAll=[];
  for(const k in (OPS.ddHV||{})){ const p=k.split('|'); const lop=LOP.find(l=>l.id===Number(p[0])); if(!lop||!ids.includes(lop.coSoId))continue; const m=Object.values(OPS.ddHV[k]); if(!m.length)continue; const co=m.filter(s=>s==='co'||s==='muon').length; ddAll.push({lop,ngay:p[1],co,tot:m.length}); }
  ddAll.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  const ddItems=ddAll.map(x=>({main:'Lớp '+x.lop.lop,tag:{text:x.co+'/'+x.tot+' có mặt',cls:x.co>=x.tot?'cc-day':(x.co*2>=x.tot?'cc-bu':'cc-nghi')},sub:isAdm?csName(x.lop.coSoId):'',rt:isoVN(x.ngay)}));
  // 4) Học sinh vắng học — tên cụ thể + lớp, mỗi HS vắng 1 dòng
  const vangAll=[];
  for(const k in (OPS.ddHV||{})){ const p=k.split('|'); const lop=LOP.find(l=>l.id===Number(p[0])); if(!lop||!ids.includes(lop.coSoId))continue; const obj=OPS.ddHV[k];
    for(const hid in obj){ const st=obj[hid]; if(st==='vang'||st==='phep'){ const hv=(OPS.hv||[]).find(h=>h.id===Number(hid)); vangAll.push({ten:hv?hv.ten:('HS #'+hid),lop,ngay:p[1],st}); } } }
  vangAll.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  const vangItems=vangAll.map(x=>({main:x.ten,tag:{text:x.st==='phep'?'Vắng phép':'Vắng',cls:'cc-nghi'},sub:['Lớp '+x.lop.lop,isAdm?csName(x.lop.coSoId):''].filter(Boolean).join(' · '),rt:isoVN(x.ngay)}));
  // 5) Học sinh thôi học
  const thoiAll=(OPS.hv||[]).filter(x=>!x.mau&&x.ngayThoiHoc&&ids.includes(x.coSoId)).sort((a,b)=>a.ngayThoiHoc<b.ngayThoiHoc?1:a.ngayThoiHoc>b.ngayThoiHoc?-1:0);
  const thoiItems=thoiAll.map(x=>({main:x.ten,sub:[lopName(x.lopId),x.lyDo,isAdm?csName(x.coSoId):''].filter(Boolean).join(' · '),rt:isoVN(x.ngayThoiHoc)}));
  // 6) Đóng học phí & khoản thu (tài chính — xếp sau các hoạt động)
  const thuAll=(OPS.gd||[]).filter(x=>x.loai==='thu'&&x.createdAt&&ids.includes(x.coSoId)).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));
  const thuItems=thuAll.map(x=>{
    let name=''; if(x.hvId!=null){const hv=(OPS.hv||[]).find(h=>h.id===x.hvId); if(hv)name=hv.ten;}
    return isAdm
      ? {main:'Thu '+fmtVND(x.soTien),sub:[x.hangMuc||'Khoản thu',csName(x.coSoId)].filter(Boolean).join(' · '),rt:relTime(x.createdAt)}
      : {main:(name||x.hangMuc||'Khoản thu')+' · '+fmtVND(x.soTien),sub:name?(x.hangMuc||''):'',rt:relTime(x.createdAt)};
  });
  // 7) Chi tiêu gần đây (tài chính)
  const chiAll=(OPS.gd||[]).filter(x=>x.loai==='chi'&&x.createdAt&&ids.includes(x.coSoId)).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));
  const chiItems=chiAll.map(x=>isAdm
    ? {main:'Chi '+fmtVND(x.soTien),sub:[x.hangMuc||'Khoản chi',csName(x.coSoId)].filter(Boolean).join(' · '),rt:relTime(x.createdAt)}
    : {main:(x.hangMuc||'Khoản chi')+' · '+fmtVND(x.soTien),sub:x.noiDung||'',rt:relTime(x.createdAt)});
  h+=`<div class="panel" style="background:transparent;border:0;box-shadow:none;padding:0">
    <div class="phead" style="padding:0 2px 10px;border:0"><h3>Hoạt động gần đây</h3><span class="sub">${esc(scopeLbl)}</span></div>
    <div class="actgrid">
      ${actCatCard('🧑‍🎓','n-hs','Học sinh mới ghi danh',hsItems,hsAll.length,CAP,'ah-blue')}
      ${actCatCard('🗓️','n-cc','Điểm danh giáo viên',ccItems,ccAll.length,CAP,'ah-emerald')}
      ${actCatCard('📋','n-dd','Điểm danh học sinh',ddItems,ddAll.length,CAP,'ah-teal')}
      ${actCatCard('🚫','n-vang','Học sinh vắng học',vangItems,vangAll.length,CAP,'ah-orange')}
      ${actCatCard('🚪','n-left','Học sinh thôi học',thoiItems,thoiAll.length,CAP,'ah-slate')}
      ${actCatCard('💰','n-thu','Đóng học phí & khoản thu',thuItems,thuAll.length,CAP,'ah-amber')}
      ${actCatCard('🧾','n-chi','Chi tiêu gần đây',chiItems,chiAll.length,CAP,'ah-rose')}
    </div></div>`;
  $('#view').innerHTML=h;
  tbBarBind();
  // Bấm "… và N mục nữa" để mở rộng / thu gọn thẻ
  $$('#view [data-more]').forEach(b=>b.onclick=()=>{const c=b.closest('.actcard'); const open=c.classList.toggle('open'); b.textContent=open?'Thu gọn ▲':('… và '+b.dataset.n+' mục nữa');});
}
function ring(pct,sub){pct=Math.max(0,Math.min(100,pct));return `<div class="ringbox" style="--p:${pct.toFixed(1)}"><div class="rc"></div><div class="rin"><b>${Math.round(pct)}%</b><span>${sub||''}</span></div></div>`;}
/* Thẻ 1 nhóm hoạt động: icon + tiêu đề + badge tổng, tối đa `cap` dòng, còn lại "… và N nữa" */
function actCatCard(ic,cls,title,items,total,cap,hcls){
  cap=cap||5;
  const render=it=>`<div class="actitem"><b>${esc(it.main)}</b><small>${it.tag?`<span class="cctag ${it.tag.cls}">${esc(it.tag.text)}</span> · `:''}${it.sub?esc(it.sub)+' · ':''}<span class="rt">${esc(it.rt||'')}</span></small></div>`;
  let body;
  if(items.length){
    const shown=items.slice(0,cap), hidden=items.slice(cap);
    body=shown.map(render).join('')
      + (hidden.length?`<div class="acthide">${hidden.map(render).join('')}</div><button class="actmore" data-more data-n="${hidden.length}">… và ${hidden.length} mục nữa</button>`:'');
  } else body=`<div class="actcard-empty">Chưa có cập nhật</div>`;
  return `<div class="actcard"><div class="actcard-h ${hcls||''}"><span class="kdeco"></span><div class="ci">${ic}</div><b>${title}</b><span class="cnt">${total}</span></div><div class="actcard-b">${body}</div></div>`;
}
function dashWarns(ids){
  const rows=[];
  inCOSO().forEach(c=>{
    if(!ids.includes(c.id))return;
    if(c.build){rows.push({t:`<b>${esc(c.ten)}</b>: cơ sở đang xây dựng, chưa nhập dữ liệu`});return;}
    const st=csStat(c.id);
    if(st.gv>0&&st.lop===0) rows.push({t:`<b>${esc(c.ten)}</b>: có ${st.gv} GV nhưng chưa nhập lớp học`});
  });
  // cơ sở thu học phí thấp (số thật — chỉ xét nơi đã nhập học phí)
  const low=inCOSO().filter(c=>!c.build&&ids.includes(c.id)).map(c=>({c,...hpStat([c.id])})).filter(x=>x.du>0&&x.rate<0.72).sort((a,b)=>a.rate-b.rate).slice(0,2);
  low.forEach(x=>rows.push({t:`<b>${esc(x.c.ten)}</b>: mới thu ~${Math.round(x.rate*100)}% học phí, cần đôn đốc`}));
  const ic=svg('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>');
  if(!rows.length) return `<div class="warnrow ok">${svg('<path d="M20 6 9 17l-5-5"/>')}<div>Mọi cơ sở đều ổn định, không có cảnh báo.</div></div>`;
  return rows.map(r=>`<div class="warnrow">${ic}<div>${r.t}</div></div>`).join('');
}

/* ============ GIÁO VIÊN ============ */
function renderGV(){
  const opts=inCOSO().filter(c=>!c.build);
  let h=`<div class="toolbar">
    <div class="search">${svg(IC.search,2)}<input id="gvq" placeholder="Tìm theo tên, SĐT, địa chỉ…" value="${esc(gvSearch)}"/></div>
    ${USER.role==='admin'?`<select class="fsel" id="gvcs"><option value="all">Tất cả cơ sở</option>${opts.map(c=>`<option value="${c.id}" ${String(gvCs)===String(c.id)?'selected':''}>${esc(c.ten)}</option>`).join('')}</select>`:''}
    <button class="btn btn-sm btn-light" id="gvPrint" style="white-space:nowrap">🖶 In danh sách</button>
    ${gvLive?`<button class="btn btn-sm btn-ghost" id="gvTpl" style="white-space:nowrap">⬇ Tải mẫu Excel</button>
    <button class="btn btn-sm btn-ghost" id="gvImp" style="white-space:nowrap">⬆ Nhập Excel</button>
    <button class="btn btn-sm btn-primary" id="gvAdd" style="white-space:nowrap">＋ Thêm giáo viên</button>`:''}
  </div>
  <div class="chips" style="margin-bottom:14px">
    ${[['all','Tất cả môn'],['VH','Văn hóa'],['TA','Tiếng Anh']].map(([k,t])=>`<button class="chip ${gvMon===k?'on':''}" data-mon="${k}">${t}</button>`).join('')}
  </div>`;

  let list=inGV();
  if(USER.role==='admin'&&gvCs!=='all') list=list.filter(g=>g.coSoId===Number(gvCs));
  if(gvMon!=='all') list=list.filter(g=>g.mon===gvMon);
  if(gvSearch.trim()){const q=gvSearch.trim().toLowerCase();list=list.filter(g=>(g.ten+' '+g.sdt+' '+g.dc).toLowerCase().includes(q));}
  list=list.slice().sort((a,b)=>csCmp(a.coSoId,b.coSoId)||a.ten.localeCompare(b.ten,'vi'));

  h+=`<div class="panel"><div class="phead"><h3>Danh sách giáo viên</h3><span class="sub">${list.length} người</span></div>
    <div class="twrap"><table><thead><tr>
      <th>Giáo viên</th><th>Môn</th>${USER.role==='admin'?'<th>Cơ sở</th>':''}<th>Ngày sinh</th><th>Trình độ</th><th>Điện thoại</th><th></th>
    </tr></thead><tbody>`;
  if(!list.length){
    h+=`<tr><td colspan="7"><div class="empty">${svg(IC.gv,1.6)}Không tìm thấy giáo viên phù hợp</div></td></tr>`;
  }else{
    list.forEach(g=>{
      h+=`<tr data-gid="${g.id}" class="gvRow" style="cursor:pointer">
        <td><div class="gvcell"><div class="gvava" style="background:${avaColor(g.ten)}">${initials(g.ten)}</div><div><b>${esc(g.ten)}</b><small>${esc((g.dc||'').split(',')[0]||'—')}</small></div></div></td>
        <td><span class="badge ${g.mon==='TA'?'bg-ta':'bg-vh'}">${g.mon==='TA'?'Tiếng Anh':'Văn hóa'}</span></td>
        ${USER.role==='admin'?`<td>${esc(csName(g.coSoId))}</td>`:''}
        <td class="num">${esc(g.ns||'—')}</td>
        <td>${esc(g.td||'—')}</td>
        <td class="num">${esc(g.sdt||'—')}</td>
        <td class="tright"><span class="linkbtn">Chi tiết →</span></td>
      </tr>`;
    });
  }
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;

  $('#gvq').oninput=e=>{gvSearch=e.target.value;refreshGVTable();};
  const cs=$('#gvcs'); if(cs)cs.onchange=e=>{gvCs=e.target.value;renderGV();};
  $$('#view .chip').forEach(b=>b.onclick=()=>{gvMon=b.dataset.mon;renderGV();});
  const ga=$('#gvAdd'); if(ga)ga.onclick=openGvNew;
  const gt=$('#gvTpl'); if(gt)gt.onclick=gvDownloadTemplate;
  const gi=$('#gvImp'); if(gi)gi.onclick=gvImportExcel;
  /* In danh sách giáo viên — in ĐÚNG danh sách đang xem, tách theo từng cơ sở để ký lưu */
  const gp=$('#gvPrint'); if(gp)gp.onclick=()=>inDsGiaoVien(list,
    [gvMon==='TA'?'Môn Tiếng Anh':gvMon==='VH'?'Môn Văn hóa':'', gvSearch.trim()?('tìm "'+gvSearch.trim()+'"'):'']
      .filter(Boolean).join(' · '));
  bindGVRows();
}
function refreshGVTable(){renderGV();$('#gvq').focus();const v=$('#gvq').value;$('#gvq').setSelectionRange(v.length,v.length);}
function bindGVRows(){$$('#view .gvRow').forEach(r=>r.onclick=()=>showGV(Number(r.dataset.gid)));}

/* Danh sách lớp trong 1 cơ sở dạng LƯỚI kẻ cột — tích = giáo viên phụ trách lớp đó */
function lopCheckHTML(coSoId,gvName){
  const ls=LOP.filter(l=>l.coSoId===coSoId).slice().sort((a,b)=>String(a.lop).localeCompare(String(b.lop),'vi'));
  if(!ls.length) return `<div class="muted" style="font-size:.82rem;padding:12px">Cơ sở này chưa có lớp học.</div>`;
  const nm=(gvName||'').trim();
  const rows=ls.map(l=>{const cur=(l.gv||'').trim(); const mine=nm&&cur===nm;
    const gvTxt=cur?(mine?`<span style="color:var(--emerald);font-weight:700">${esc(cur)}</span>`:esc(cur)):'—';
    return `<label class="lopgrid-r"><input type="checkbox" value="${l.id}" ${mine?'checked':''}/><span class="lg-lop">${esc(l.lop)}</span><span class="lg-ss">${l.siso||0}</span><span class="lg-gv">${gvTxt}</span></label>`;
  }).join('');
  return `<div class="lopgrid"><div class="lopgrid-h"><span></span><span>Lớp</span><span>Sĩ số</span><span>GV phụ trách</span></div>${rows}</div>`;
}
function showGV(id){
  const g=GV.find(x=>x.id===id); if(!g)return;
  const lops=LOP.filter(l=>l.coSoId===g.coSoId && (l.gv||'').trim()===g.ten.trim());
  const hs=lops.reduce((s,l)=>s+(l.siso||0),0);
  $('#mcard').innerHTML=`
    <div class="mhead">
      <div class="mava">${initials(g.ten)}</div>
      <div style="flex:1"><h3>${esc(g.ten)}</h3><p>Hồ sơ giáo viên · ${esc(csName(g.coSoId))} · <span style="opacity:.85">bấm để sửa</span></p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody"><div class="form2">
      <div class="fld full"><label>Họ và tên</label><input id="ev_ten" value="${esc(g.ten)}"/></div>
      <div class="fld"><label>Ngày sinh</label><input id="ev_ns" value="${esc(g.ns||'')}" placeholder="dd/mm/yyyy"/></div>
      <div class="fld"><label>Môn</label><select id="ev_mon"><option value="VH" ${g.mon!=='TA'?'selected':''}>Văn hóa</option><option value="TA" ${g.mon==='TA'?'selected':''}>Tiếng Anh</option></select></div>
      <div class="fld"><label>Trình độ chuyên môn</label><input id="ev_td" value="${esc(g.td||'')}"/></div>
      <div class="fld"><label>Số điện thoại</label><input id="ev_sdt" value="${esc(g.sdt||'')}" inputmode="tel"/></div>
      <div class="fld full"><label>Địa chỉ</label><input id="ev_dc" value="${esc(g.dc||'')}"/></div>
      <div class="fld"><label>Cơ sở công tác</label><input value="${esc(csName(g.coSoId))}" disabled style="opacity:.7"/></div>
      <div class="fld"><label>Ngày hợp đồng làm việc</label><input id="ev_hd" value="${g.ngayHd?isoVN(g.ngayHd):''}" placeholder="dd/mm/yyyy"/></div>
      ${gvLive
        ? `<div class="fld full"><label>Phụ trách lớp <span style="font-weight:600;color:var(--muted)">· tích chọn lớp</span></label><div class="gv-lopcheck" id="ev_lops">${lopCheckHTML(g.coSoId,g.ten)}</div></div>`
        : (lops.length?`<div class="fld full"><label>Phụ trách lớp</label><input value="${lops.length} lớp · ${hs} HS — ${esc(lops.map(l=>l.lop).join(', '))}" disabled style="opacity:.7"/></div>`:'')}
      <div id="ev_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px;margin-top:2px">
        ${gvLive?`<button class="btn btn-light" style="color:var(--rose)" id="ev_del">Xóa</button>`:''}
        <button class="btn btn-light" style="flex:1" onclick="closeModal()">Đóng</button>
        <button class="btn btn-primary" style="flex:2" id="ev_save">💾 Lưu thay đổi</button>
      </div>
      <div class="fld full" style="padding:0"><small class="muted">Thay đổi được lưu online, đồng bộ mọi máy.</small></div>
    </div></div>`;
  $('#modal').classList.add('on');
  attachDateFormat($('#ev_ns')); attachDateFormat($('#ev_hd'));
  const err=$('#ev_err'); const showErr=m=>{err.textContent=m||'';err.style.display=m?'block':'none';};
  $('#ev_save').onclick=async()=>{
    const rec={ten:$('#ev_ten').value.trim(),ns:$('#ev_ns').value.trim(),td:$('#ev_td').value.trim(),sdt:$('#ev_sdt').value.trim(),dc:$('#ev_dc').value.trim(),mon:$('#ev_mon').value};
    if(!rec.ten){showErr('Vui lòng nhập họ tên.');$('#ev_ten').focus();return;}
    if(!isValidDob(rec.ns)){showErr('Ngày sinh chưa đúng dạng ngày/tháng/năm (VD: 12/10/1990).');$('#ev_ns').focus();return;}
    const hdv=($('#ev_hd')&&$('#ev_hd').value.trim())||'';
    if(hdv && !isValidDob(hdv)){showErr('Ngày hợp đồng chưa đúng dạng ngày/tháng/năm.');$('#ev_hd').focus();return;}
    const hdIso = hdv ? vnToIso(hdv) : null;
    const oldName=g.ten.trim();
    const btn=$('#ev_save'); btn.disabled=true; btn.textContent='Đang lưu…'; showErr('');
    const {error}= gvLive
      ? await SB.from('giao_vien').update({ten:rec.ten,ns:rec.ns,td:rec.td,dc:rec.dc,sdt:rec.sdt,mon:rec.mon}).eq('id',g.id)
      : await SB.from('gv_edits').upsert({gv_id:g.id,coso_id:g.coSoId,...rec},{onConflict:'gv_id'});
    if(error){btn.disabled=false;btn.textContent='💾 Lưu thay đổi';showErr('Lỗi lưu: '+error.message);return;}
    ['ten','ns','td','sdt','dc','mon'].forEach(k=>{g[k]=rec[k];});
    // Ngày hợp đồng (best-effort; bỏ qua êm nếu chưa chạy SQL)
    if(gvLive) await SB.from('giao_vien').update({ngay_hd:hdIso}).eq('id',g.id);
    else await SB.from('gv_edits').update({ngay_hd:hdIso}).eq('gv_id',g.id);
    g.ngayHd=hdIso;
    // Phân công lớp: tích = phụ trách; bỏ tích lớp đang của mình = gỡ (chỉ khi có bảng lop_hoc sống)
    if(gvLive){
      const box=$('#ev_lops');
      const checked=new Set(box?[...box.querySelectorAll('input:checked')].map(x=>Number(x.value)):[]);
      const newName=rec.ten.trim();
      for(const l of LOP.filter(x=>x.coSoId===g.coSoId)){
        const was=(l.gv||'').trim()===oldName || l.gvId===g.id;
        if(checked.has(l.id)){ if((l.gv||'')!==newName||l.gvId!==g.id){await SB.from('lop_hoc').update({gv:newName,gv_id:g.id}).eq('id',l.id); l.gv=newName; l.gvId=g.id;} }
        else if(was){ await SB.from('lop_hoc').update({gv:'',gv_id:null}).eq('id',l.id); l.gv=''; l.gvId=null; }
      }
    }
    btn.disabled=false; btn.textContent='💾 Lưu thay đổi';
    closeModal();
    if(VIEW==='gv')renderGV();
  };
  const del=$('#ev_del'); if(del)del.onclick=async()=>{
    // Lớp đang do GV này phụ trách (theo mã, hoặc theo tên với dữ liệu cũ chưa gắn mã)
    const myLops=LOP.filter(l=>l.coSoId===g.coSoId && (l.gvId===g.id || (l.gv||'').trim()===g.ten.trim()));
    const msg='Xóa giáo viên "'+g.ten+'"?'
      + (myLops.length?('\n\n'+myLops.length+' lớp đang phụ trách ('+myLops.map(l=>l.lop).join(', ')+') sẽ được GỠ PHÂN CÔNG, chờ giao cho giáo viên khác.'):'')
      + '\n\nNếu giáo viên này đã có tài khoản đăng nhập, hãy vào mục Tài khoản để khóa hoặc xóa tài khoản đó.'
      + '\n\nThao tác này không thể hoàn tác.';
    if(!await avaConfirm(msg,{danger:true,okText:'Xóa'}))return;
    // Gỡ phân công TRƯỚC khi xóa — tránh lớp "mồ côi" còn giữ tên và mã của GV đã xóa
    for(const l of myLops){
      const {error}=await SB.from('lop_hoc').update({gv:'',gv_id:null}).eq('id',l.id);
      if(error){showErr('Lỗi gỡ phân công lớp '+l.lop+': '+error.message);return;}
      l.gv=''; l.gvId=null;
    }
    const {error}=await SB.from('giao_vien').delete().eq('id',g.id);
    if(error){showErr('Lỗi xóa: '+error.message);return;}
    const i=GV.findIndex(x=>x.id===g.id); if(i>=0)GV.splice(i,1);
    closeModal(); if(VIEW==='gv')renderGV(); else if(VIEW==='lop')renderLop();
  };
}
/* ＋ Thêm giáo viên mới (bảng giao_vien sống) */
function openGvNew(){
  const csList=inCOSO().filter(c=>!c.build);
  const csOpts=csList.map(c=>`<option value="${c.id}">${esc(c.ten)}</option>`).join('');

    <div class="mhead">
      <div class="mava">＋</div>

      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody"><div class="form2">
      <div class="fld full"><label>Họ và tên *</label><input id="nv_ten" placeholder="VD: Nguyễn Văn An"/></div>
      <div class="fld"><label>Ngày sinh</label><input id="nv_ns" placeholder="dd/mm/yyyy"/></div>

      <div class="fld"><label>Số điện thoại</label><input id="nv_sdt" inputmode="tel"/></div>
      <div class="fld"><label>Địa chỉ</label><input id="nv_dc"/></div>
      <div class="fld"><label>Ngày hợp đồng làm việc</label><input id="nv_hd" placeholder="dd/mm/yyyy"/></div>
      ${USER.role==='admin'?`<div class="fld full"><label>Cơ sở công tác *</label><select id="nv_cs">${csOpts}</select></div>`:''}
      <div class="fld full"><label>Phụ trách lớp <span style="font-weight:600;color:var(--muted)">· tích chọn lớp</span></label><div class="gv-lopcheck" id="nv_lops">${lopCheckHTML(initCs,'')}</div></div>
      <div id="nv_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px"><button class="btn btn-light" style="flex:1" onclick="closeModal()">Hủy</button><button class="btn btn-primary" style="flex:2" id="nv_save">＋ Thêm giáo viên</button></div>
    </div></div>`;
  $('#modal').classList.add('on');
  attachDateFormat($('#nv_ns')); attachDateFormat($('#nv_hd'));
  const csSel=$('#nv_cs'); if(csSel)csSel.onchange=e=>{$('#nv_lops').innerHTML=lopCheckHTML(Number(e.target.value),'');};
  const err=m=>{const e=$('#nv_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  $('#nv_save').onclick=async()=>{
    const ten=$('#nv_ten').value.trim();
    if(!ten){err('Vui lòng nhập họ tên.');$('#nv_ten').focus();return;}
    if(!isValidDob($('#nv_ns').value)){err('Ngày sinh chưa đúng dạng ngày/tháng/năm (VD: 12/10/1990).');$('#nv_ns').focus();return;}
    const hdv=$('#nv_hd').value.trim();
    if(hdv && !isValidDob(hdv)){err('Ngày hợp đồng chưa đúng dạng ngày/tháng/năm.');$('#nv_hd').focus();return;}
    const hdIso=hdv?vnToIso(hdv):null;
    const coSoId=USER.role==='admin'?Number($('#nv_cs').value):USER.coSoId;
    const lopIds=[...document.querySelectorAll('#nv_lops input:checked')].map(x=>Number(x.value));
    const rec={ten,ns:$('#nv_ns').value.trim(),td:$('#nv_td').value.trim(),sdt:$('#nv_sdt').value.trim(),dc:$('#nv_dc').value.trim(),mon:$('#nv_mon').value,coSoId};
    const btn=$('#nv_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    const {data,error}=await SB.from('giao_vien').insert(gvToDb(rec)).select().single();
    if(error){btn.disabled=false;btn.textContent='＋ Thêm giáo viên';err('Lỗi thêm: '+error.message);return;}
    await SB.from('giao_vien').update({ngay_hd:hdIso}).eq('id',data.id);   // ngày hợp đồng; bỏ qua êm nếu chưa chạy SQL
    // phân công lớp cho GV mới
    for(const id of lopIds){ await SB.from('lop_hoc').update({gv:ten,gv_id:data.id}).eq('id',id); const l=LOP.find(x=>x.id===id); if(l){l.gv=ten;l.gvId=data.id;} }
    const obj=gvFromDb(data); obj.ngayHd=obj.ngayHd||hdIso;
    GV.push(obj);
    btn.disabled=false; btn.textContent='＋ Thêm giáo viên';
    closeModal(); renderGV();
  };
}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

/* ============ CƠ SỞ ============ */
function renderCoso(){
  if(csDetailId!=null){renderCosoDetail(csDetailId);return;}
  const list=inCOSO();
  const active=list.filter(c=>!c.build);
  const tot=active.reduce((a,c)=>{const s=csStat(c.id);a.gv+=s.gv;a.hs+=s.hs;a.lop+=s.lop;return a;},{gv:0,hs:0,lop:0});
  const totDu=hpStat(scopeIds()).du;
  const rows=list.map(c=>({c,...csStat(c.id),du:hpStat([c.id]).du}));
  rows.sort((a,b)=>{
    if(!!a.c.chinh!==!!b.c.chinh) return a.c.chinh?-1:1;   // CƠ SỞ CHÍNH luôn trên cùng
    if(a.c.build!==b.c.build) return a.c.build?1:-1;       // đang XD xuống cuối
    if(csSort==='ten') return a.c.ten.localeCompare(b.c.ten,'vi');
    const key=csSort==='thu'?'du':csSort;
    return b[key]-a[key];
  });

  let h=`<div class="cssum">
    <div class="s"><b>${active.length}</b><span>Cơ sở hoạt động</span></div>
    <div class="s"><b>${tot.gv}</b><span>Giáo viên</span></div>
    <div class="s"><b>${tot.hs.toLocaleString('vi-VN')}</b><span>Học sinh</span></div>
    <div class="s"><b>${tot.lop}</b><span>Lớp học</span></div>
    <div class="s"><b>${fmtShort(totDu)}</b><span>Dự thu học phí</span></div>
  </div>
  <div class="toolbar">
    ${csLive?`<button class="btn btn-sm btn-primary" id="csAdd" style="white-space:nowrap">＋ Thêm cơ sở</button>`:''}
    <button class="btn btn-sm btn-light" id="csPrint" style="white-space:nowrap">🖶 In tổng hợp</button>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <small class="muted" style="font-weight:700">Sắp xếp:</small>
    <select class="fsel" id="cssort">${[['thu','Dự thu cao nhất'],['hs','Học sinh nhiều nhất'],['gv','Giáo viên nhiều nhất'],['ten','Tên A→Z']].map(([k,t])=>`<option value="${k}" ${csSort===k?'selected':''}>${t}</option>`).join('')}</select>
  </div></div>
  <div class="cscards">`;

  rows.forEach(({c,gv,lop,hs,thu})=>{
    if(c.build){
      h+=`<div class="cscard build">
        <div class="cs-top"><div class="cs-logo">AVATAR</div>
          <div><h4>${esc(c.ten)}</h4><div class="cs-sub">Đang xây dựng</div></div></div>
        <div class="empty" style="padding:18px 0">Cơ sở mới · chưa nhập dữ liệu</div></div>`;
      return;
    }
    let warn='';
    if(lop===0&&gv>0) warn=`<span class="cs-warn">⚠ Chưa nhập lớp</span>`;
    else if(lop>0&&hs/lop<6) warn=`<span class="cs-warn">⚠ Sĩ số bất thường</span>`;
    h+=`<div class="cscard" data-cs="${c.id}" style="background:${csPastel(c.id)};border-left:4px solid ${avaColor(c.ten)}">
      <span class="cs-deco" style="background:${avaColor(c.ten)}"></span>
      <div class="cs-top"><div class="cs-logo">AVATAR</div>
        <div class="cs-head"><h4>${esc(c.ten)}${c.chinh?'<span class="cs-chinh">★ Cơ sở chính</span>':''}${warn}</h4><div class="cs-sub">${lop} lớp · ${hs} học sinh</div></div></div>
      <div class="cs-stats">
        <div class="cs-stat"><b>${gv}</b><span>Giáo viên</span></div>
        <div class="cs-stat"><b>${hs}</b><span>Học sinh</span></div>
      </div>
    </div>`;
  });
  h+='</div>';
  $('#view').innerHTML=h;
  $('#cssort').onchange=e=>{csSort=e.target.value;renderCoso();};
  const cp=$('#csPrint'); if(cp)cp.onclick=()=>inTongHopCoSo();
  const ca2=$('#csAdd'); if(ca2)ca2.onclick=()=>openCoSo(null);
  $$('#view .cscard[data-cs]').forEach(el=>el.onclick=()=>{
    csDetailId=Number(el.dataset.cs); renderCoso();
  });

/* ===== Chi tiết 1 trung tâm — tổng quan lớp, học sinh, kinh phí ===== */
/* Thêm / sửa / xóa một cơ sở (Quản trị). c=null là thêm mới.
   Mã cơ sở giữ nguyên suốt đời vì học sinh, lớp, sổ quỹ... đều tham chiếu tới nó. */
function openCoSo(c){
  if(USER.role!=='admin'){avaAlert('Chỉ Quản trị mới thêm/sửa cơ sở.');return;}
  const them=!c;
  const soLop=them?0:LOP.filter(l=>l.coSoId===c.id).length;
  const soGV=them?0:GV.filter(g=>g.coSoId===c.id).length;
  const soHS=them?0:OPS.hv.filter(h=>h.coSoId===c.id).length;
  $('#mcard').innerHTML=`
    <div class="mhead"><div class="mava">${them?'＋':svg(IC.coso)}</div>
      <div style="flex:1"><h3>${them?'Thêm cơ sở':esc(c.ten)}</h3>
        <p>${them?'Cơ sở mới của chuỗi':(soLop+' lớp · '+soGV+' giáo viên · '+soHS+' học sinh')}</p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div>
    <div class="mbody"><div class="form2">
      <div class="fld full"><label>Tên cơ sở *</label><input id="cs_ten" value="${them?'':esc(c.ten)}" placeholder="VD: Diễn Kỷ 2"/></div>
      <div class="fld full"><label>Địa chỉ</label><input id="cs_dc" value="${them?'':esc(c.dc||'')}" placeholder="Xóm/Thôn, Xã, Tỉnh"/></div>
      <div class="fld full"><label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-weight:600">
        <input type="checkbox" id="cs_build" ${(!them&&c.build)?'checked':''} style="margin-top:3px;width:17px;height:17px;accent-color:var(--brand)"/>
        <span>Đang xây dựng <span class="muted" style="font-weight:600">— chưa hoạt động, không tính vào thống kê toàn chuỗi</span></span></label></div>
      <div class="fld full"><label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-weight:600">
        <input type="checkbox" id="cs_chinh" ${(!them&&c.chinh)?'checked':''} style="margin-top:3px;width:17px;height:17px;accent-color:var(--brand)"/>
        <span>★ Cơ sở chính <span class="muted" style="font-weight:600">— luôn đứng đầu mọi danh sách và được chọn sẵn khi mở các trang. Chỉ một cơ sở được đánh dấu; tích ở đây thì cơ sở cũ tự bỏ dấu.</span></span></label></div>
      <div id="cs_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px">
        ${them?'':`<button class="btn btn-light" id="cs_del" style="color:var(--rose)">Xóa</button>`}
        <button class="btn btn-light" style="flex:1" onclick="closeModal()">Hủy</button>
        <button class="btn btn-primary" style="flex:2" id="cs_save">${them?'＋ Thêm cơ sở':'💾 Lưu'}</button>
      </div></div></div>`;
  $('#modal').classList.add('on');
  const err=m=>{const e=$('#cs_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  $('#cs_save').onclick=async()=>{
    const ten=$('#cs_ten').value.trim();
    if(!ten){err('Vui lòng nhập tên cơ sở.');$('#cs_ten').focus();return;}
    if(COSO.some(x=>nameKey(x.ten)===nameKey(ten)&&(them||x.id!==c.id))){err('Đã có cơ sở tên này rồi.');return;}
    const laChinh=$('#cs_chinh').checked;
    const rec={ten,dc:$('#cs_dc').value.trim(),build:$('#cs_build').checked,chinh:laChinh};
    const btn=$('#cs_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    // Chỉ MỘT cơ sở chính: bỏ dấu ở cơ sở cũ trước
    if(laChinh){
      const cu=COSO.filter(x=>x.chinh&&(them||x.id!==c.id));
      if(cu.length){ await SB.from('co_so').update({chinh:false}).in('id',cu.map(x=>x.id));
        cu.forEach(x=>{x.chinh=false;}); }
    }
    let r;
    if(them){
      const id=COSO.length?Math.max(...COSO.map(x=>x.id))+1:0;    // mã mới = mã lớn nhất + 1, không tái dùng mã cũ
      r=await SB.from('co_so').insert({id,...rec,thu_tu:id});
      if(!r.error)COSO.push({id,...rec,thuTu:id});
    }else{
      r=await SB.from('co_so').update(rec).eq('id',c.id);
      if(!r.error)Object.assign(c,rec);
    }
    btn.disabled=false; btn.textContent=them?'＋ Thêm cơ sở':'💾 Lưu';
    if(r.error){err('Lỗi lưu: '+r.error.message);return;}
    // Cơ sở chính luôn đứng đầu → xếp lại danh sách rồi tính lại vị trí hiển thị
    COSO.sort((a,b)=>(b.chinh?1:0)-(a.chinh?1:0)||(a.thuTu??a.id)-(b.thuTu??b.id));
    tinhCsAbbr(); tinhCsRank(); buildScope(); closeModal(); csDetailId=null; renderCoso(); renderNavCounts();
  };
  const bd=$('#cs_del');
  if(bd)bd.onclick=async()=>{
    if(soLop||soGV||soHS){
      err('Cơ sở còn '+[soLop?soLop+' lớp':'',soGV?soGV+' giáo viên':'',soHS?soHS+' học sinh':''].filter(Boolean).join(', ')
        +'. Hãy chuyển hoặc xóa hết dữ liệu của cơ sở trước khi xóa cơ sở.');
      return;
    }
    if(!await avaConfirm('Xóa cơ sở "'+c.ten+'"?\n\nCơ sở đang trống nên không mất dữ liệu nào.\nThao tác này không thể hoàn tác.',{danger:true,okText:'Xóa'}))return;
    const {error}=await SB.from('co_so').delete().eq('id',c.id);
    if(error){err('Lỗi xóa: '+error.message);return;}
    const i=COSO.findIndex(x=>x.id===c.id); if(i>=0)COSO.splice(i,1);
    tinhCsAbbr(); tinhCsRank(); buildScope(); closeModal(); csDetailId=null; renderCoso(); renderNavCounts();
  };
}

  </div>
  <div class="cssum" style="margin-top:14px">
    <div class="s"><b>${s.lop}</b><span>Lớp học</span></div>
    <div class="s"><b>${s.hs}</b><span>Học sinh</span></div>

    ${money.n===0?'<div class="empty" style="padding:20px">Chưa nhập học phí cho học sinh nào của cơ sở này.</div>':`<div class="csd-money">
      <div class="mbox"><small>Dự thu</small><b>${fmtShort(duthu)}</b></div>
      <div class="mbox done"><small>Đã thu</small><b>${fmtShort(daThu)}</b></div>
      <div class="mbox pend"><small>Chưa thu</small><b>${fmtShort(chuaThu)}</b></div>

    ${money.nNghi?`<p class="muted" style="font-size:.78rem;line-height:1.55;margin:8px 2px 0">Trong đó có <b>${money.nNghi}</b> em <b>đã thôi học</b> — đã thu <b>${fmtVND(money.daNghi)}</b>, tính theo số quyết toán đến ngày nghỉ (không treo nợ phần các em chưa học).</p>`:''}
    ${money.nLe?`<p class="muted" style="font-size:.78rem;line-height:1.55;margin:6px 2px 0">Có <b>${money.nLe}</b> phiếu thu học phí lập thẳng ở Sổ quỹ (chưa gắn học sinh): <b>${fmtVND(money.le)}</b>.</p>`:''}`}

  <div class="panel"><div class="phead"><h3>Danh sách lớp học</h3><span class="sub">${lops.length} lớp</span></div>

/* ============ LỚP HỌC ============ */
function renderLop(){
  const opts=inCOSO().filter(c=>!c.build);
  let list=inLOP();
  if(USER.role==='admin'&&lopCs!=='all') list=list.filter(l=>l.coSoId===Number(lopCs));
  if(lopSearch.trim()){const q=lopSearch.trim().toLowerCase();list=list.filter(l=>((l.lop||'')+' '+(l.gv||'')).toLowerCase().includes(q));}
  list=list.slice().sort((a,b)=>csCmp(a.coSoId,b.coSoId));
  const hs=list.reduce((s,l)=>s+hvOfLop(l.id).filter(hvActive).length,0), thu=list.reduce((s,l)=>s+lopHP(l.id),0);

  let h=`<div class="toolbar">
    <div class="search">${svg(IC.search,2)}<input id="lopq" placeholder="Tìm lớp hoặc giáo viên…" value="${esc(lopSearch)}"/></div>
    ${USER.role==='admin'?`<select class="fsel" id="lopcs"><option value="all">Tất cả cơ sở</option>${opts.map(c=>`<option value="${c.id}" ${String(lopCs)===String(c.id)?'selected':''}>${esc(c.ten)}</option>`).join('')}</select>`:''}
    <button class="btn btn-sm btn-light" id="lopPrint" style="white-space:nowrap">🖶 In danh sách</button>
    ${gvLive?`<button class="btn btn-sm btn-primary" id="lopAdd" style="white-space:nowrap">＋ Thêm lớp</button>`:''}
  </div>`;
  h+=`<div class="panel"><div class="phead"><h3>Danh sách lớp học</h3><span class="sub">${list.length} lớp · ${hs} HS · dự thu ${fmtShort(thu)}${gvLive?' · bấm dòng để sửa':''}</span></div>
    <div class="twrap"><table><thead><tr><th>Lớp</th><th>Giáo viên phụ trách</th>${USER.role==='admin'?'<th>Cơ sở</th>':''}<th class="tright">Sĩ số</th><th class="tright">Dự thu</th></tr></thead><tbody>`;
  if(!list.length){h+=`<tr><td colspan="5"><div class="empty">${svg(IC.lop,1.6)}Chưa có lớp học trong phạm vi này</div></td></tr>`;}
  else list.forEach(l=>{
    h+=`<tr ${gvLive?`data-lid="${l.id}" class="lopRow" style="cursor:pointer"`:''}><td><b>${esc(l.lop||'—')}</b> ${l.mon==='TA'?'<span class="badge bg-ta" style="margin-left:4px">TA</span>':''}</td>
      <td>${esc(l.gv||'—')}</td>
      ${USER.role==='admin'?`<td>${esc(csName(l.coSoId))}</td>`:''}
      <td class="tright num">${l.siso||0}</td>
      <td class="tright num">${lopHP(l.id)?fmtVND(lopHP(l.id)):'—'}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;
  $('#lopq').oninput=e=>{lopSearch=e.target.value;const v=e.target.value;renderLop();$('#lopq').focus();$('#lopq').setSelectionRange(v.length,v.length);};
  const cs=$('#lopcs'); if(cs)cs.onchange=e=>{lopCs=e.target.value;renderLop();};
  const lp=$('#lopPrint'); if(lp)lp.onclick=()=>inDsLop(list);
  const la=$('#lopAdd'); if(la)la.onclick=openLopNew;
  if(gvLive)$$('#view .lopRow').forEach(r=>r.onclick=()=>{const l=LOP.find(x=>x.id===Number(r.dataset.lid));if(l)openLopEdit(l);});
}
/* select danh sách GV của 1 cơ sở để chọn GV phụ trách lớp */
function gvOptions(coSoId,sel){
  return GV.filter(g=>g.coSoId===coSoId).slice().sort((a,b)=>a.ten.localeCompare(b.ten,'vi'))
    .map(g=>`<option value="${esc(g.ten)}" ${g.ten===sel?'selected':''}>${esc(g.ten)}</option>`).join('');
}
/* ＋ Thêm lớp mới */
function openLopNew(){
  const isAdmin=USER.role==='admin';
  const csOpts=inCOSO().filter(c=>!c.build).map(c=>`<option value="${c.id}">${esc(c.ten)}</option>`).join('');
  const firstCs=isAdmin?inCOSO().filter(c=>!c.build)[0]?.id:USER.coSoId;
  $('#mcard').innerHTML=`
    <div class="mhead">
      <div class="mava">＋</div>
      <div style="flex:1"><h3>Thêm lớp học</h3><p>${isAdmin?'Chọn cơ sở':esc(csName(USER.coSoId))}</p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody"><div class="form2">
      ${isAdmin?`<div class="fld full"><label>Cơ sở *</label><select id="lp_cs">${csOpts}</select></div>`:''}
      <div class="fld full"><label>Tên lớp *</label><input id="lp_ten" placeholder="VD: Lớp 3, 8N1, TA A1…"/></div>
      <div class="fld"><label>Môn</label><select id="lp_mon"><option value="VH">Văn hóa</option><option value="TA">Tiếng Anh</option></select></div>
      <div class="fld"><label>Sĩ số dự kiến</label><input id="lp_siso" inputmode="numeric" placeholder="VD: 20"/></div>
      <div class="fld full"><label>Giáo viên phụ trách</label><select id="lp_gv"><option value="">— Chưa phân công —</option>${gvOptions(firstCs,'')}</select></div>
      <div id="lp_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px"><button class="btn btn-light" style="flex:1" onclick="closeModal()">Hủy</button><button class="btn btn-primary" style="flex:2" id="lp_save">＋ Thêm lớp</button></div>
    </div></div>`;
  $('#modal').classList.add('on');
  const err=m=>{const e=$('#lp_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  if(isAdmin){const csSel=$('#lp_cs'); csSel.onchange=()=>{$('#lp_gv').innerHTML='<option value="">— Chưa phân công —</option>'+gvOptions(Number(csSel.value),'');};}
  $('#lp_save').onclick=async()=>{
    const ten=$('#lp_ten').value.trim();
    if(!ten){err('Vui lòng nhập tên lớp.');$('#lp_ten').focus();return;}
    const coSoId=isAdmin?Number($('#lp_cs').value):USER.coSoId;
    const rec={lop:ten,gv:$('#lp_gv').value,siso:Number(String($('#lp_siso').value).replace(/\D/g,''))||0,mon:$('#lp_mon').value,coSoId};
    const btn=$('#lp_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    const {data,error}=await SB.from('lop_hoc').insert(lopToDb(rec)).select().single();
    btn.disabled=false; btn.textContent='＋ Thêm lớp';
    if(error){err('Lỗi thêm: '+error.message);return;}
    LOP.push(lopFromDb(data));
    closeModal(); renderLop();
  };
}

      <div class="fld full"><label>Giáo viên phụ trách</label><select id="lp_gv"><option value="">— Chưa phân công —</option>${gvOptions(l.coSoId,l.gv)}</select></div>
      ${USER.role==='admin'&&COSO.some(c=>!c.build&&c.id!==l.coSoId)?`<div class="fld full" style="padding-top:0"><button class="btn btn-light" style="width:100%" id="lp_move">⇄ Chuyển lớp sang cơ sở khác — giữ nguyên dữ liệu</button></div>`:''}
      <div id="lp_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px;margin-top:2px">
        <button class="btn btn-light" style="color:var(--rose)" id="lp_del">Xóa lớp</button>
        <button class="btn btn-light" style="flex:1" onclick="closeModal()">Đóng</button>
        <button class="btn btn-primary" style="flex:2" id="lp_save">💾 Lưu</button>
      </div>
    </div></div>`;
  $('#modal').classList.add('on');
  const err=m=>{const e=$('#lp_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  const mv=$('#lp_move'); if(mv)mv.onclick=()=>openLopChuyenCoSo(l);
  $('#lp_save').onclick=async()=>{
    const ten=$('#lp_ten').value.trim();
    if(!ten){err('Vui lòng nhập tên lớp.');return;}
    const patch={lop:ten,gv:$('#lp_gv').value,siso:Number(String($('#lp_siso').value).replace(/\D/g,''))||0,mon:$('#lp_mon').value};
    const btn=$('#lp_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    const {error}=await SB.from('lop_hoc').update(patch).eq('id',l.id);
    btn.disabled=false; btn.textContent='💾 Lưu';
    if(error){err('Lỗi lưu: '+error.message);return;}
    Object.assign(l,patch);
    closeModal(); renderLop();
  };
  $('#lp_del').onclick=async()=>{
    if(soHS>0){err('Lớp còn '+soHS+' học sinh. Hãy chuyển các em sang lớp khác (trong mục Học sinh) trước khi xóa.');return;}
    const soBuoi=Object.keys(OPS.ddHV).filter(k=>Number(k.split('|')[0])===l.id).length;
    if(!await avaConfirm('Xóa lớp "'+l.lop+'"?'+(soBuoi?'\n\n'+soBuoi+' buổi điểm danh và chấm công của lớp này cũng bị xóa theo.':'')
      +'\n\nThao tác này không thể hoàn tác.',{danger:true,okText:'Xóa'}))return;
    // Dọn sạch dữ liệu bám theo lớp, nếu không sẽ thành bản ghi mồ côi nằm lại trong CSDL
    await SB.from('diem_danh_hv').delete().eq('lop_id',l.id);
    await SB.from('cham_cong_gv').delete().eq('lop_id',l.id);
    await SB.from('duyet_diem_danh').delete().eq('lop_id',l.id);
    await SB.from('lich_lop').delete().eq('lop_id',l.id);
    const {error}=await SB.from('lop_hoc').delete().eq('id',l.id);
    if(error){err('Lỗi xóa: '+error.message);return;}
    const i=LOP.findIndex(x=>x.id===l.id); if(i>=0)LOP.splice(i,1);
    OPS.lich=OPS.lich.filter(x=>x.lopId!==l.id);
    for(const k in OPS.ddHV) if(Number(k.split('|')[0])===l.id) delete OPS.ddHV[k];
    for(const k in OPS.ccGV) if(Number(k.split('|')[1])===l.id){ delete OPS.ccGV[k]; delete OPS.ccGvId[k]; }
    for(const k in OPS.duyet) if(Number(k.split('|')[0])===l.id) delete OPS.duyet[k];
    closeModal(); renderLop();
  };
}

/* ============ CHUYỂN LỚP SANG CƠ SỞ KHÁC (chỉ Quản trị) ============
   Nguyên tắc: GIỮ NGUYÊN toàn bộ dữ liệu — không xóa gì, chỉ đổi coso_id.
   Đi theo lớp: hồ sơ học sinh (kể cả em đã thôi học), điểm danh, chấm công,
   đối soát, lịch học. Phiếu thu/chi đã gắn học sinh của lớp thì CHO CHỌN:
   chuyển theo (khi lớp bị khai nhầm cơ sở) hay ở lại (khi lớp thật sự dời
   địa điểm — tiền đã nằm trong két cơ sở cũ, sổ quỹ mỗi nơi phải khớp tiền
   thật ở nơi đó). Riêng phiếu thuộc kỳ ĐÃ CHỐT SỔ (dù ở cơ sở cũ hay cơ sở
   đích) luôn ở lại: chứng từ của kỳ đã khóa kế toán không được đụng tới. */
function openLopChuyenCoSo(l){
  if(USER.role!=='admin')return;
  const csKhac=COSO.filter(c=>!c.build&&c.id!==l.coSoId);
  if(!csKhac.length){avaAlert('Chưa có cơ sở nào khác để chuyển tới.');return;}
  const dsHV=hvOfLop(l.id), hvSet=new Set(dsHV.map(h=>h.id));
  const nNghi=dsHV.filter(h=>!hvActive(h)).length;
  const phieu=OPS.gd.filter(g=>g.hvId!=null&&hvSet.has(g.hvId));
  const lich=lichOfLop(l.id);
  $('#mcard').innerHTML=`
    <div class="mhead">
      <div class="mava">⇄</div>
      <div style="flex:1"><h3>Chuyển lớp ${esc(l.lop)}</h3><p>Đang ở ${esc(csName(l.coSoId))} · ${dsHV.length} học sinh</p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody"><div class="form2">
      <div class="fld full"><label>Chuyển tới cơ sở *</label><select id="mv_cs">${csKhac.map(c=>`<option value="${c.id}">${esc(c.ten)}</option>`).join('')}</select></div>
      <div class="fld full" style="font-size:.85rem;line-height:1.6;background:#f4f6fb;border-radius:11px;padding:10px 12px">
        Đi theo lớp, <b>không mất gì</b>: ${dsHV.length} hồ sơ học sinh${nNghi?` (kể cả ${nNghi} em đã thôi học)`:''},
        toàn bộ điểm danh – chấm công – đối soát${lich.length?` và ${lich.length} buổi lịch học/tuần`:''}.
      </div>
      ${phieu.length?`<div class="fld full" style="padding-top:0"><label style="display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:.85rem;cursor:pointer">
        <input type="checkbox" id="mv_phieu" checked style="width:17px;height:17px;flex:none;margin-top:2px;accent-color:var(--brand)"/>
        <span>Chuyển kèm ${phieu.length} phiếu thu/chi đã gắn học sinh của lớp sang sổ quỹ cơ sở mới<br/>
        <span class="muted" style="font-weight:500">Tích khi lớp bị <b>khai nhầm cơ sở</b>. Nếu lớp thật sự dời địa điểm mà tiền vẫn nằm két cơ sở cũ thì BỎ tích — sổ quỹ mỗi nơi phải khớp tiền thật ở nơi đó.</span></span></label></div>`:''}
      <div id="mv_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px"><button class="btn btn-light" style="flex:1" id="mv_back">‹ Quay lại</button><button class="btn btn-primary" style="flex:2" id="mv_save">⇄ Chuyển lớp</button></div>
    </div></div>`;
  $('#modal').classList.add('on');
  const err=m=>{const e=$('#mv_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  $('#mv_back').onclick=()=>openLopEdit(l);
  $('#mv_save').onclick=async()=>{
    const den=Number($('#mv_cs').value);
    const chonPhieu=!!($('#mv_phieu')&&$('#mv_phieu').checked);
    // Phiếu nằm trong kỳ đã chốt sổ (ở cơ sở cũ HOẶC cơ sở đích) không được rời chỗ
    const kyKhoa=ky=>!!(chotCua(l.coSoId,ky)||chotCua(den,ky));
    const phieuDi=chonPhieu?phieu.filter(g=>!kyKhoa(kyCua(g.ngay))):[];
    const soKhoa=chonPhieu?phieu.length-phieuDi.length:0;
    // Ca trong lịch lớp chưa khai ở cơ sở mới → buổi học vẫn còn, chỉ trống giờ cho tới khi khai
    const caThieu=[...new Set(lich.map(x=>x.caMa))].filter(m=>!(OPS.ca[den]||[]).some(c=>c.ma===m)).sort((a,b)=>a-b);
    let luuY='';
    if(l.gv)luuY+='\n• GV phụ trách '+l.gv+' vẫn thuộc '+csName(l.coSoId)+' — nếu đổi người dạy, vào Sửa lớp phân công lại.';
    if(caThieu.length)luuY+='\n• '+csName(den)+' chưa khai Ca '+caThieu.join(', ')+' — vào Lịch dạy để khai giờ.';
    if(soKhoa)luuY+='\n• '+soKhoa+' phiếu thuộc kỳ ĐÃ CHỐT SỔ sẽ ở lại '+csName(l.coSoId)+' (chứng từ kỳ đã khóa).';
    if(!await avaConfirm('Chuyển lớp "'+l.lop+'" từ '+csName(l.coSoId)+' sang '+csName(den)+'?\n\nToàn bộ '+dsHV.length+' học sinh cùng điểm danh, chấm công, đối soát, lịch học đi theo lớp'
      +(chonPhieu?', kèm '+phieuDi.length+' phiếu thu/chi.':(phieu.length?'. '+phieu.length+' phiếu thu/chi Ở LẠI sổ quỹ '+csName(l.coSoId)+'.':'.'))
      +(luuY?'\n\nLưu ý:'+luuY:''),{okText:'Chuyển lớp'}))return;
    const btn=$('#mv_save'); btn.disabled=true; btn.textContent='Đang chuyển…'; err('');
    const loi=async e=>{btn.disabled=false;btn.textContent='⇄ Chuyển lớp';
      err('Lỗi chuyển: '+e.message+' — kiểm tra mạng rồi bấm "Chuyển lớp" lần nữa; phần đã chuyển không sao, chạy lại không tạo dữ liệu trùng.');};
    // Dữ liệu con đi TRƯỚC, lớp đi SAU — lỡ đứt mạng giữa chừng thì bấm lại,
    // mọi lệnh dưới chỉ đặt coso_id nên chạy lại lần nữa đều vô hại.
    for(const bang of ['hoc_vien','diem_danh_hv','cham_cong_gv','duyet_diem_danh','lich_lop']){
      const {error}=await SB.from(bang).update({coso_id:den}).eq('lop_id',l.id);
      if(error)return loi(error);
    }
    for(let i=0;i<phieuDi.length;i+=200){
      const {error}=await SB.from('so_quy').update({coso_id:den}).in('id',phieuDi.slice(i,i+200).map(g=>g.id));
      if(error)return loi(error);
    }
    const {error}=await SB.from('lop_hoc').update({coso_id:den}).eq('id',l.id);
    if(error)return loi(error);
    // Cập nhật bộ nhớ đang mở — không cần tải lại trang
    l.coSoId=den;
    dsHV.forEach(h=>h.coSoId=den);
    OPS.lich.forEach(x=>{if(x.lopId===l.id)x.coSoId=den;});
    phieuDi.forEach(g=>g.coSoId=den);
    closeModal(); renderLop();
    avaAlert('Đã chuyển lớp "'+l.lop+'" sang '+csName(den)+' — '+dsHV.length+' học sinh và toàn bộ điểm danh, chấm công, lịch học được giữ nguyên.'
      +(phieuDi.length?'\n'+phieuDi.length+' phiếu thu/chi đã theo về sổ quỹ '+csName(den)+'.':'')
      +(soKhoa?'\n'+soKhoa+' phiếu thuộc kỳ đã chốt vẫn nằm ở sổ quỹ '+csName(l.coSoId)+'.':''));
  };
}

/* ============ KHOẢN THU ============ */
function renderThu(){
  const ids=scopeIds();
  const inSc=OPS.gd.filter(g=>ids.includes(g.coSoId));
  const months=[...new Set(inSc.map(g=>g.ngay.slice(0,7)))].sort().reverse();
  let list=inSc.slice();
  if(ktThang!=='all') list=list.filter(g=>g.ngay.slice(0,7)===ktThang);
  if(ktLoai!=='all') list=list.filter(g=>g.loai===ktLoai);
  list.sort((a,b)=>b.ngay.localeCompare(a.ngay)||b.id-a.id);
  const tThu=list.filter(g=>g.loai==='thu').reduce((s,g)=>s+g.soTien,0);
  const tChi=list.filter(g=>g.loai==='chi').reduce((s,g)=>s+g.soTien,0);
  // Tồn quỹ = tiền mặt thực có: lũy kế TOÀN BỘ sổ trong phạm vi, KHÔNG theo bộ lọc tháng/loại
  // (nếu tính trên danh sách đã lọc thì chọn "Chỉ Thu" sẽ ra Tồn quỹ = Tổng thu — sai).
  const ton=inSc.reduce((s,g)=>s+(g.loai==='thu'?g.soTien:-g.soTien),0);
  const adm=USER.role==='admin';

  // Kỳ đang xem đã chốt chưa (chỉ xét được khi đã chọn 1 tháng + 1 cơ sở cụ thể)
  const csXem = adm ? (scope==='all'?null:Number(scope)) : USER.coSoId;
  const kyXem = ktThang==='all'?null:ktThang;
  const chotXem = (csXem!=null&&kyXem)?chotCua(csXem,kyXem):null;

  let h=`<div class="kpis">
    <div class="kpi money"><div class="kpi-top"><div class="kpi-ic ic-em">${svg(IC.thu)}</div></div><b>${fmtVND(tThu)}</b><span>Tổng thu</span></div>
    <div class="kpi money"><div class="kpi-top"><div class="kpi-ic ic-am">${svg(IC.thu)}</div></div><b>${fmtVND(tChi)}</b><span>Tổng chi</span></div>
    <div class="kpi money"><div class="kpi-top"><div class="kpi-ic ic-teal">${svg(IC.thu)}</div></div><b class="${ton<0?'neg':''}">${fmtVND(ton)}</b><span>Tồn quỹ (toàn bộ)</span></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-sky">${svg(IC.diemdanh)}</div></div><b>${list.length}</b><span>Số phiếu</span></div>
  </div>
  <div class="toolbar">
    <select class="fsel" id="ktThang"><option value="all">Tất cả kỳ</option>${months.map(m=>{const p=m.split('-');return `<option value="${m}" ${ktThang===m?'selected':''}>Tháng ${+p[1]}/${p[0]}</option>`;}).join('')}</select>
    <select class="fsel" id="ktLoai">${[['all','Thu & Chi'],['thu','Chỉ Thu'],['chi','Chỉ Chi']].map(([k,t])=>`<option value="${k}" ${ktLoai===k?'selected':''}>${t}</option>`).join('')}</select>
    <div class="acts" style="margin-left:auto">
      <button class="btn btn-sm btn-thu" id="addThu" ${chotXem?'disabled':''}>＋ Phiếu thu</button>
      <button class="btn btn-sm btn-chi" id="addChi" ${chotXem?'disabled':''}>－ Phiếu chi</button>
      <button class="btn btn-sm btn-light" id="prnSo">🖶 In sổ quỹ</button>
      <button class="btn btn-sm btn-xls" id="expXls">⬇ Xuất Excel</button>
    </div>
  </div>`;
  // Thanh chốt sổ theo kỳ
  h+=chotBar(csXem,kyXem,chotXem,{tThu,tChi,ton:tThu-tChi});
  h+=`<div class="panel"><div class="phead"><h3>Sổ quỹ thu – chi</h3><span class="sub">${list.length} phiếu${chotXem?' · đã chốt':''}</span></div>
    <div class="twrap"><table><thead><tr><th>Ngày</th><th>Số phiếu</th><th>Loại</th><th>Hạng mục</th><th>Nội dung</th><th>Người nộp/nhận</th>${adm?'<th>Cơ sở</th>':''}<th class="tright">Thu</th><th class="tright">Chi</th><th></th></tr></thead><tbody>`;
  const nCol=adm?10:9;
  if(!list.length){
    h+=`<tr><td colspan="${nCol}"><div class="empty">${svg(IC.thu,1.5)}Chưa có phiếu thu/chi nào.<br/>Bấm <b>＋ Phiếu thu</b> hoặc <b>－ Phiếu chi</b> để ghi sổ.</div></td></tr>`;
  }else{
    list.forEach(g=>{
      const khoa=daChotKy(g.coSoId,g.ngay);
      h+=`<tr>
      <td class="num">${isoVN(g.ngay)}</td>
      <td class="num" style="white-space:nowrap;font-weight:700">${esc(soPhieu(g))}${khoa?' 🔒':''}</td>
      <td><span class="badge ${g.loai==='thu'?'bg-em':'bg-rose'}">${g.loai==='thu'?'Thu':'Chi'}</span></td>
      <td>${esc(g.hangMuc)}</td><td>${esc(g.noiDung||'—')}</td>
      <td>${esc(g.nguoiNop||'—')}${g.hinhThuc==='chuyen_khoan'?' <span class="badge bg-am" style="margin-left:3px">CK</span>':''}</td>
      ${adm?`<td>${esc(csName(g.coSoId))}</td>`:''}
      <td class="tright num ${g.loai==='thu'?'thu':''}">${g.loai==='thu'?fmtVND(g.soTien):'—'}</td>
      <td class="tright num ${g.loai==='chi'?'chi':''}">${g.loai==='chi'?fmtVND(g.soTien):'—'}</td>
      <td class="tright" style="white-space:nowrap"><button class="linkbtn" data-view="${g.id}">Xem</button>${khoa?'':` &nbsp;<button class="linkbtn" data-edit="${g.id}">Sửa</button> &nbsp;<button class="linkbtn" data-del="${g.id}" style="color:var(--rose)">Xóa</button>`}</td></tr>`;});
    h+=`<tr style="background:var(--soft)"><td colspan="${adm?7:6}" class="tright"><b>TỔNG</b></td><td class="tright num thu">${fmtVND(tThu)}</td><td class="tright num chi">${fmtVND(tChi)}</td><td></td></tr>
    <tr style="background:var(--soft)"><td colspan="${adm?7:6}" class="tright"><b>TỒN QUỸ (toàn bộ)</b></td><td colspan="2" class="tright"><b style="color:var(--brand-700);font-size:1.03rem">${fmtVND(ton)}</b></td><td></td></tr>`;
  }
  h+='</tbody></table></div></div>';

  // Dự thu học phí theo cơ sở (số thật — tổng học phí HS đã nhập)
  const cosos=inCOSO().filter(c=>!c.build);
  const rows=cosos.map(c=>({c,...csStat(c.id),du:hpStat([c.id]).du})).sort((a,b)=>b.du-a.du);
  const totDu=rows.reduce((s,r)=>s+r.du,0), maxThu=Math.max(1,...rows.map(r=>r.du));
  h+=`<div class="panel"><div class="phead"><h3>Dự thu học phí theo cơ sở</h3><span class="sub">theo học phí học sinh</span></div>
    <div class="twrap"><table><thead><tr><th>Cơ sở</th><th class="tright">Lớp</th><th class="tright">Học sinh</th><th class="tright">Dự thu</th><th>Tỷ trọng</th></tr></thead><tbody>`;
  rows.forEach(r=>{h+=`<tr><td><div class="gvcell"><div class="gvava avatar-a" style="width:30px;height:30px;font-size:.95rem;background:${avaColor(r.c.ten)}">A</div><b>${esc(r.c.ten)}</b></div></td>
    <td class="tright num">${r.lop}</td><td class="tright num">${r.hs}</td><td class="tright num">${r.du?fmtVND(r.du):'—'}</td>
    <td style="min-width:110px"><div class="cs-bar" style="margin:0"><i style="width:${Math.max(3,r.du/maxThu*100)}%"></i></div></td></tr>`;});
  h+=`</tbody><tfoot><tr style="background:var(--soft)"><td colspan="3" class="tright"><b>TỔNG DỰ THU</b></td><td class="tright"><b>${fmtVND(totDu)}</b></td><td></td></tr></tfoot></table></div></div>`;

  $('#view').innerHTML=h;
  $('#ktThang').onchange=e=>{ktThang=e.target.value;renderThu();};
  $('#ktLoai').onchange=e=>{ktLoai=e.target.value;renderThu();};
  $('#addThu').onclick=()=>addGD('thu');
  $('#addChi').onclick=()=>addGD('chi');
  $('#expXls').onclick=()=>exportSoQuy(list,{tThu,tChi,ton});
  $('#prnSo').onclick=()=>inSoQuy(list,{tThu,tChi});
  const cbtn=$('#chotBtn'); if(cbtn)cbtn.onclick=()=>chotKyAction(csXem,kyXem,!!chotXem,{tThu,tChi});
  $$('#view [data-view]').forEach(b=>b.onclick=()=>{const g=OPS.gd.find(x=>x.id===Number(b.dataset.view));if(g)openVoucher(g);});
  $$('#view [data-edit]').forEach(b=>b.onclick=()=>{const g=OPS.gd.find(x=>x.id===Number(b.dataset.edit));if(g)editGD(g);});
  $$('#view [data-del]').forEach(b=>b.onclick=async()=>{
    const id=Number(b.dataset.del);
    const g=OPS.gd.find(x=>x.id===id);
    if(!g)return;
    if(await chanKyChot(g.coSoId,g.ngay,'xóa phiếu'))return;
    const hv=(g.hvId!=null)?OPS.hv.find(x=>x.id===g.hvId):null;
    // Phiếu thu học phí gắn với 1 học sinh: xóa sẽ trừ lại số tiền đã đóng của em đó.
    const msg=hv
      ? `Xóa phiếu thu học phí ${soPhieu(g)} của "${esc(hv.ten)}" (${fmtVND(g.soTien)})?\nSố tiền đã đóng của em sẽ được tính lại theo các đợt còn lại.\nThao tác không thể hoàn tác.`
      : `Xóa phiếu ${soPhieu(g)} khỏi sổ quỹ? Thao tác không thể hoàn tác.`;
    if(!await avaConfirm(msg,{danger:true,okText:'Xóa'}))return;
    const {error}=await SB.from('so_quy').delete().eq('id',id);
    if(error){ await baoLoiGhiSo(error,g.coSoId,g.ngay,'xóa phiếu'); return; }
    OPS.gd=OPS.gd.filter(x=>x.id!==id);
    if(hv) await capNhatTongDong(hv);          // tính lại tổng đã đóng từ các đợt còn lại
    renderThu();});
}

/* Chốt / mở khóa một kỳ sổ quỹ của một cơ sở */
async function chotKyAction(coSoId,ky,dangChot,t){
  if(USER.role!=='admin')return;
  const kyTxt='tháng '+(+ky.split('-')[1])+'/'+ky.split('-')[0];
  if(dangChot){
    if(!await avaConfirm('Mở khóa sổ quỹ '+csName(coSoId)+' '+kyTxt+'?\nSau khi mở, lễ tân lại thêm/sửa/xóa phiếu trong kỳ này được.'))return;
    const {error}=await SB.from('chot_so_quy').delete().eq('coso_id',coSoId).eq('ky',ky);
    if(error){avaAlert('Lỗi mở khóa: '+error.message+'\n\nNếu báo thiếu bảng, hãy chạy file sql-giai-doan-5-thu-chi.sql trong Supabase.');return;}
    delete OPS.chot[coSoId+'|'+ky];
    renderThu(); return;
  }
  // tồn quỹ cuối kỳ = lũy kế toàn bộ phiếu của cơ sở này tới hết kỳ
  const den=ky+'-31';
  let ton=0; OPS.gd.forEach(g=>{ if(g.coSoId!==coSoId||g.ngay>den)return; ton+=(g.loai==='thu'?g.soTien:-g.soTien); });
  if(!await avaConfirm('CHỐT SỔ QUỸ '+csName(coSoId).toUpperCase()+' — '+kyTxt+'?\n\n'
    +'Tổng thu: '+fmtVND(t.tThu)+'\nTổng chi: '+fmtVND(t.tChi)+'\nTồn quỹ cuối kỳ: '+fmtVND(ton)+'\n\n'
    +'Sau khi chốt, KHÔNG AI thêm/sửa/xóa được phiếu của kỳ này (kể cả Quản trị) cho tới khi mở khóa.',{okText:'Chốt sổ'}))return;
  const {data,error}=await SB.from('chot_so_quy')
    .insert({coso_id:coSoId,ky,tong_thu:t.tThu,tong_chi:t.tChi,ton_cuoi:ton}).select().single();
  if(error){avaAlert('Lỗi chốt sổ: '+error.message+'\n\nNếu báo thiếu bảng, hãy chạy file sql-giai-doan-5-thu-chi.sql trong Supabase.');return;}
  OPS.chot[coSoId+'|'+ky]={id:data.id,ky,coSoId,tongThu:t.tThu,tongChi:t.tChi,tonCuoi:ton,chotAt:data.chot_at,ghiChu:''};
  renderThu();
  avaAlert('Đã chốt sổ quỹ '+csName(coSoId)+' '+kyTxt+'.\nTồn quỹ cuối kỳ: '+fmtVND(ton));
}

/* Khối THU HỌC PHÍ: hạng mục "Học phí" thì hiện ô chọn học sinh.
   Có chọn thì phiếu được gắn vào em đó → trang Học sinh và thẻ "Đã thu học phí"
   trên Bảng điều hành mới biết em nào đã đóng. Không chọn thì tiền vẫn vào sổ quỹ,
   nhưng hệ thống không biết của em nào. */
function hpBoxRender(loai,hangMuc,coSoId){
  const box=$('#gd_hpBox'); if(!box)return;
  if(loai!=='thu'||!/học phí/i.test(hangMuc||'')){ box.style.display='none'; box.innerHTML=''; return; }
  const ds=OPS.hv.filter(h=>h.coSoId===coSoId&&hvActive(h))
    .slice().sort((a,b)=>String(a.ten).localeCompare(String(b.ten),'vi'));
  box.style.display='block';
  box.innerHTML=`<label>Thu của học sinh nào <span style="font-weight:600;color:var(--muted)">· nên chọn để biết em nào đã đóng</span></label>
    <select id="gd_hvSel"><option value="">— Chưa gắn học sinh —</option>${ds.map(h=>{
      const con=Math.max(0,(h.hocPhi||0)-hpDaHT(h));
      return `<option value="${h.id}" data-con="${con}">${esc(h.ten)} · ${esc(lopName(h.lopId))}${con>0?' · còn '+fmtVND(con):' · đã đóng đủ'}</option>`;}).join('')}</select>
    <div id="gd_hvNote" class="muted" style="font-size:.76rem;font-weight:600;margin-top:5px"></div>`;
  const sel=$('#gd_hvSel'), note=$('#gd_hvNote');
  const moi=()=>{ const o=sel.selectedOptions[0], con=o?Number(o.dataset.con||0):0;
    if(!sel.value){ note.innerHTML='⚠️ Chưa gắn học sinh: tiền vẫn vào sổ quỹ nhưng <b>không tính vào phần "đã đóng"</b> của em nào.'; return; }
    note.innerHTML=con>0?`Em này còn phải thu <b>${fmtVND(con)}</b>.`:'Em này đã đóng đủ học phí.';
    const t=$('#gd_tien'); if(t&&!t.value&&con>0){ t.value=con.toLocaleString('vi-VN'); }   // mồi sẵn số còn thiếu
  };
  sel.onchange=moi; moi();
}
/* Khối gợi ý CHI LƯƠNG: chọn giáo viên + kỳ → lấy số buổi đã chấm công → nhập đơn giá → tự tính tiền */
function luongBoxRender(loai,hangMuc,coSoId,onChange){
  const box=$('#gd_luongBox'); if(!box)return null;
  if(loai!=='chi'||!/lương/i.test(hangMuc||'')){ box.style.display='none'; box.innerHTML=''; return null; }
  const gvs=GV.filter(g=>g.coSoId===coSoId).slice().sort((a,b)=>String(a.ten).localeCompare(b.ten,'vi'));
  const d=new Date(); d.setMonth(d.getMonth()-1);                    // mặc định kỳ lương = tháng trước
  const kyMac=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const kys=[]; for(let i=0;i<6;i++){const x=new Date(); x.setMonth(x.getMonth()-i); kys.push(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`);}
  box.style.display='block';
  box.innerHTML=`<label>Tính lương theo công giáo viên <span style="font-weight:600;color:var(--muted)">· tùy chọn</span></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="gd_gvSel" style="flex:2;min-width:150px"><option value="">— Không tính theo công —</option>
        ${gvs.map(g=>`<option value="${g.id}">${esc(g.ten)}</option>`).join('')}</select>
      <select id="gd_kyLuong" style="flex:1;min-width:120px">${kys.map(k=>`<option value="${k}" ${k===kyMac?'selected':''}>Tháng ${+k.split('-')[1]}/${k.split('-')[0]}</option>`).join('')}</select>
    </div>
    <div id="gd_luongInfo" style="margin-top:8px"></div>`;
  const info=$('#gd_luongInfo');
  const tinh=()=>{
    const gvId=Number($('#gd_gvSel').value)||0, ky=$('#gd_kyLuong').value;
    if(!gvId){info.innerHTML='';onChange&&onChange(null);return;}
    const gv=GV.find(x=>x.id===gvId);
    // Đếm theo NGƯỜI THỰC DẠY từng buổi (gv_id), không đếm theo lớp đang phụ trách —
    // nếu đếm theo lớp thì dạy thay hoặc đổi GV giữa kỳ sẽ tính lương sai người.
    let day=0,bu=0,nghi=0,thay=0;
    for(const k in OPS.ccGV){ const p=k.split('|'); if(!p[2].startsWith(ky))continue;
      const lopId=Number(p[1]); if(gvDayBuoi(lopId,p[2])!==gvId)continue;
      const st=OPS.ccGV[k]; if(st==='day')day++; else if(st==='bu')bu++; else if(st==='nghi')nghi++;
      if((st==='day'||st==='bu')&&laDayThay(lopId,p[2]))thay++; }
    const buoi=day+bu;
    info.innerHTML=`<div class="g-note ok" style="margin:0"><span>🧮</span><div>
      <b>${esc(gv?gv.ten:'')}</b> — tháng ${+ky.split('-')[1]}/${ky.split('-')[0]}: <b>${buoi} buổi dạy</b> (lên lớp ${day}${bu?' + dạy bù '+bu:''}${nghi?', nghỉ '+nghi:''}${thay?', trong đó '+thay+' buổi dạy thay':''}).
      <div style="display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap">
        <span style="font-size:.82rem">Đơn giá/buổi:</span>
        <input id="gd_donGia" inputmode="numeric" placeholder="VD: 150.000" style="flex:1;min-width:120px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-weight:700"/>
        <button type="button" class="btn btn-sm btn-light" id="gd_apDung">Tính &amp; điền</button>
      </div>
      ${buoi?'':'<div style="margin-top:6px;font-size:.8rem">Chưa có buổi nào được chấm công trong kỳ này.</div>'}
    </div></div>`;
    attachMoneyFormat($('#gd_donGia'));
    $('#gd_apDung').onclick=()=>{
      const dg=Number(String($('#gd_donGia').value).replace(/\D/g,''))||0;
      if(!dg){$('#gd_donGia').focus();return;}
      const tien=dg*buoi;
      $('#gd_tien').value=tien.toLocaleString('vi-VN');
      $('#gd_nd').value='Lương tháng '+(+ky.split('-')[1])+'/'+ky.split('-')[0]+' — '+(gv?gv.ten:'')+': '+buoi+' buổi × '+fmtVND(dg);
      const nop=$('#gd_nop'); if(nop&&!nop.value.trim()&&gv)nop.value=gv.ten;
    };
    onChange&&onChange({gvId,ky,buoi});
  };
  $('#gd_gvSel').onchange=tinh; $('#gd_kyLuong').onchange=tinh;
  return null;
}

     <div class="fld full" style="display:flex;gap:8px">
       <button class="btn btn-light" style="flex:1" onclick="closeModal()">Hủy</button>
       <button class="btn btn-primary" style="flex:2" id="eg_save">💾 Lưu thay đổi</button>
     </div>
   </div></div>`;
  $('#modal').classList.add('on');
  attachMoneyFormat($('#eg_tien'));
  const err=m=>{const e=$('#eg_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  $('#eg_save').onclick=async()=>{
    const tien=Number(String($('#eg_tien').value).replace(/\D/g,''))||0;
    if(!tien){err('Vui lòng nhập số tiền.');$('#eg_tien').focus();return;}
    const ngay=$('#eg_ngay').value||g.ngay;
    if(await chanKyChot(g.coSoId,g.ngay,'sửa phiếu'))return;
    if(ngay!==g.ngay && await chanKyChot(g.coSoId,ngay,'chuyển phiếu sang kỳ đó'))return;
    const patch={ngay,hang_muc:$('#eg_hm').value,so_tien:tien,noi_dung:$('#eg_nd').value.trim(),nguoi_lap:$('#eg_ng').value.trim()};
    const patch5={nguoi_nop:$('#eg_nop').value.trim(),hinh_thuc:$('#eg_ht').value};
    const btn=$('#eg_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    let r=await SB.from('so_quy').update(sqLive5?{...patch,...patch5}:patch).eq('id',g.id);
    if(r.error && /column .* does not exist|schema cache/i.test(r.error.message||'')){
      sqLive5=false; r=await SB.from('so_quy').update(patch).eq('id',g.id);
    }
    btn.disabled=false; btn.textContent='💾 Lưu thay đổi';
    if(r.error){ await baoLoiGhiSo(r.error,g.coSoId,ngay,'lưu phiếu',err); return; }
    Object.assign(g,{ngay,hangMuc:patch.hang_muc,soTien:tien,noiDung:patch.noi_dung,nguoiLap:patch.nguoi_lap,
      nguoiNop:patch5.nguoi_nop,hinhThuc:patch5.hinh_thuc});
    if(hv) await capNhatTongDong(hv);
    // Phiếu chưa gắn học sinh mà nay lễ tân chọn em → gắn vào rồi tính lại số đã đóng của em đó
    const ehv=$('#eg_hv');
    if(!hv && ehv && ehv.value){
      const hid=Number(ehv.value);
      const r2=await SB.from('so_quy').update({hv_id:hid}).eq('id',g.id);
      if(r2.error){ await baoLoiGhiSo(r2.error,g.coSoId,ngay,'gắn phiếu vào học sinh',err); return; }
      g.hvId=hid;
      const h2=OPS.hv.find(x=>x.id===hid);
      if(h2) await capNhatTongDong(h2);
    }
    closeModal(); renderThu();
  };
}

/* ===== XUẤT EXCEL SỔ QUỸ THU – CHI =====
   Mẫu kế toán: khổ A4 nằm ngang, kẻ ô toàn bảng, số dư đầu kỳ – phát sinh –
   số dư cuối kỳ, tồn quỹ lũy kế sau từng phiếu, khối ký cuối sổ, lặp tiêu đề
   mỗi trang in. Kèm sheet tổng hợp theo hạng mục (và theo cơ sở khi xem cả chuỗi). */
const XL_HEAD='FF2A5490';
function xlSetRow(ws,r,vals,opt){
  opt=opt||{}; const row=ws.getRow(r); row.height=opt.h||17;
  vals.forEach((v,i)=>{ if(v===undefined)return; const c=row.getCell(i+1); c.value=v; });
  return row;
}
async function exportSoQuy(list,t){

  try{await ensureExcelJS();}catch(e){if(btn){btn.disabled=false;btn.textContent=oldTxt;}avaAlert('Không tải được thư viện Excel. Hãy kiểm tra kết nối mạng.');return;}
  const adm=USER.role==='admin', ids=scopeIds();

  const motLoai=ktLoai!=='all';                      // đang lọc riêng Thu hoặc Chi → là BẢNG KÊ, không phải sổ quỹ

  const cols=[{h:'STT',k:'stt',w:6,a:'center'},{h:'Ngày',k:'ngay',w:12,a:'center'},{h:'Số phiếu',k:'sp',w:17,a:'center'},

  ws.mergeCells(6,1,6,nC);

  // ---- Thân sổ ----
  let r=8, ton=duDau;
  const style=(row,bold,fill)=>{ for(let i=1;i<=nC;i++){ const c=row.getCell(i);

  if(!motLoai){

    r++;
  }
  rows.forEach((g,i)=>{
    ton+=(g.loai==='thu'?g.soTien:-g.soTien);
    const vals=[];
    vals[ci('stt')-1]=i+1; vals[ci('ngay')-1]=isoVN(g.ngay); vals[ci('sp')-1]=soPhieu(g);
    vals[ci('loai')-1]=g.loai==='thu'?'Thu':'Chi'; vals[ci('hm')-1]=g.hangMuc||''; vals[ci('nd')-1]=g.noiDung||'';
    vals[ci('nop')-1]=g.nguoiNop||''; vals[ci('ht')-1]=HT_LABEL[g.hinhThuc]||'Tiền mặt';
    if(adm)vals[ci('cs')-1]=csName(g.coSoId);
    vals[ci('thu')-1]=g.loai==='thu'?g.soTien:null; vals[ci('chi')-1]=g.loai==='chi'?g.soTien:null;
    if(!motLoai)vals[ci('ton')-1]=ton;
    vals[ci('ng')-1]=g.nguoiLap||'';
    const row=xlSetRow(ws,r,vals);
    style(row,false, i%2===1?'FFEFF3FA':null);
    cols.forEach((c,k)=>{const cell=row.getCell(k+1);
      cell.alignment={vertical:'middle',horizontal:c.a||(c.num?'right':'left'),wrapText:!!c.wrap};
      if(c.num)cell.numFmt='#,##0';});
    row.getCell(ci('loai')).font={size:10.5,bold:true,color:{argb:g.loai==='thu'?'FF167A4E':'FFC0392B'}};
    r++;
  });
  if(!rows.length){

  if(!motLoai){rTong.getCell(ci('ton')).value=null;}
  r++;
  if(!motLoai){
    ws.mergeCells(r,1,r,ci('thu')-1);
    const rDu=xlSetRow(ws,r,[]); rDu.getCell(1).value='SỐ DƯ CUỐI KỲ';
    rDu.getCell(ci('ton')).value=ton;
    style(rDu,true,'FFDBE4F3'); rDu.getCell(1).alignment={horizontal:'right',vertical:'middle'};

    // đọc số dư cuối kỳ bằng chữ — đúng tinh thần chứng từ kế toán

    + slug(phamvi) + '-' + (ktThang==='all'?'tat-ca-ky':ktThang) + '.xlsx');
  if(btn){btn.disabled=false;btn.textContent=oldTxt;}

/* Dòng nhắc khổ giấy trên thanh nút của mọi khung in (chỉ hiện trên màn hình).
   Bản in ngang chỉ ra đúng chiều khi người dùng chọn hướng Ngang trong hộp thoại in;
   nếu để mặc định giấy dọc, máy in sẽ xoay nội dung 90° và file PDF bị nằm nghiêng. */
const VHINT=huong=>`<span class="vhint">Khi in chọn khổ <b>A4</b> · hướng <b>${huong}</b></span>`;
/* Hai dòng trống vô hình chèn vào đầu bảng (trong thead) và cuối bảng (tfoot).
   Trình duyệt lặp thead ở đầu mỗi trang và tfoot ở cuối mỗi trang, nên hai dòng
   này chính là lề trên/lề dưới của những trang thứ 2 trở đi. Trên màn hình chúng
   bị ẩn (CSS .pgpad), chỉ hiện khi in. */
const PGPAD=n=>`<tr class="pgpad"><td colspan="${n}"></td></tr>`;
const PGFOOT=n=>`<tfoot class="pgpad"><tr><td colspan="${n}"></td></tr></tfoot>`;

/* ===== IN SỔ QUỸ TRỰC TIẾP TỪ WEB (khổ A4 nằm ngang) =====
   Dùng chung khung in với phiếu thu/chi: đổ bảng sổ quỹ vào #voucher rồi window.print(). */
function inSoQuy(list,t){
  const adm=USER.role==='admin', ids=scopeIds();
  const phamvi=adm?(scope==='all'?'Toàn hệ thống':csName(Number(scope))):csName(USER.coSoId);
  const kyTxt=ktThang==='all'?'Tất cả các kỳ':('Tháng '+(+ktThang.split('-')[1])+'/'+ktThang.split('-')[0]);
  const motLoai=ktLoai!=='all';
  const tenBang=motLoai?(ktLoai==='thu'?'BẢNG KÊ PHIẾU THU':'BẢNG KÊ PHIẾU CHI'):'SỔ QUỸ THU – CHI';
  let duDau=0;
  if(!motLoai && ktThang!=='all'){
    const dauKy=ktThang+'-01';
    OPS.gd.forEach(g=>{ if(!ids.includes(g.coSoId)||g.ngay>=dauKy)return; duDau+=(g.loai==='thu'?g.soTien:-g.soTien); });
  }
  const rows=list.slice().sort((a,b)=>a.ngay.localeCompare(b.ngay)||a.id-b.id);
  let ton=duDau;
  const now=new Date();
  const body=rows.map((g,i)=>{
    ton+=(g.loai==='thu'?g.soTien:-g.soTien);
    return `<tr>
      <td class="c">${i+1}</td><td class="c">${isoVN(g.ngay)}</td><td class="c">${esc(soPhieu(g))}</td>
      <td>${esc(g.hangMuc||'')}</td><td>${esc(g.noiDung||'')}</td><td>${esc(g.nguoiNop||'')}</td>
      ${adm?`<td>${esc(csName(g.coSoId))}</td>`:''}
      <td class="r">${g.loai==='thu'?Math.round(g.soTien).toLocaleString('vi-VN'):''}</td>
      <td class="r">${g.loai==='chi'?Math.round(g.soTien).toLocaleString('vi-VN'):''}</td>
      ${motLoai?'':`<td class="r">${Math.round(ton).toLocaleString('vi-VN')}</td>`}
      <td>${esc(g.nguoiLap||'')}</td></tr>`;}).join('');
  // Cột sổ quỹ + tỉ lệ bề rộng (tự chuẩn hóa về 100%). Khai MỘT chỗ rồi sinh ra cả
  // <colgroup> lẫn <thead> và các con số gộp ô — trước đây đếm tay nên bị lệch 1 cột.

/* đọc số tiền bằng chữ (VND) */
function docSoVN(number){
  number=Math.round(number); if(number===0)return 'Không đồng';
  const ch=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const dv=['','nghìn','triệu','tỷ'];
  function doc3(baso,daydu){
    let tram=Math.floor(baso/100),chuc=Math.floor((baso%100)/10),donvi=baso%10,s='';
    if(daydu||tram>0){ s+=ch[tram]+' trăm'; if(chuc===0&&donvi>0)s+=' lẻ'; }
    if(chuc>1){ s+=' '+ch[chuc]+' mươi'; if(donvi===1)s+=' mốt'; else if(donvi===4)s+=' tư'; else if(donvi===5)s+=' lăm'; else if(donvi>0)s+=' '+ch[donvi]; }
    else if(chuc===1){ s+=' mười'; if(donvi===5)s+=' lăm'; else if(donvi>0)s+=' '+ch[donvi]; }
    else if(chuc===0&&donvi>0){ s+=' '+ch[donvi]; }
    return s.trim();
  }
  const nhom=[]; let so=number; while(so>0){nhom.push(so%1000);so=Math.floor(so/1000);}
  let kq='';
  for(let g=nhom.length-1;g>=0;g--){ if(nhom[g]===0)continue; kq+=(kq?' ':'')+doc3(nhom[g], g<nhom.length-1&&kq!=='')+(dv[g]?' '+dv[g]:''); }
  kq=kq.trim(); return kq.charAt(0).toUpperCase()+kq.slice(1)+' đồng';
}
function taiWord(html,filename){
  const pre="<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>body{font-family:'Times New Roman',serif}table{width:100%;border-collapse:collapse}td{padding:4px 0;vertical-align:top}</style></head><body>";
  const blob=new Blob(['﻿'+pre+html+"</body></html>"],{type:'application/msword'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'); a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  if(hvStt==='active') list=list.filter(hvActive);

  // ⚠ Phải có điều kiện CÙNG LỚP: một em học 2 lớp là chuyện bình thường (2 dòng, 2 lượt ghi danh),

/* Xóa hàng loạt học sinh: xóa luôn điểm danh và phiếu thu học phí gắn với các em đó */
async function xoaHvBulk(ids){
  ids=[...new Set(ids)].filter(id=>OPS.hv.some(h=>h.id===id));
  if(!ids.length){avaAlert('Chưa chọn học sinh nào.');return;}
  const ems=ids.map(id=>OPS.hv.find(h=>h.id===id));
  const coTien=ems.filter(h=>(Number(h.soTienDong)||0)>0);
  const ten=ems.slice(0,8).map(h=>h.ten+' — '+lopName(h.lopId)).join('\n');
  let msg='Xóa vĩnh viễn '+ems.length+' học sinh:\n'+ten+(ems.length>8?'\n… và '+(ems.length-8)+' em nữa':'')
        +'\n\nXóa luôn điểm danh và phiếu thu học phí của các em này.';
  if(coTien.length) msg+='\n\n⚠ CẢNH BÁO: '+coTien.length+' em ĐÃ ĐÓNG TIỀN ('+coTien.slice(0,5).map(h=>h.ten).join(', ')+(coTien.length>5?'…':'')
        +'). Xóa là mất luôn phiếu thu — tổng thu của sổ quỹ sẽ giảm theo. Anh kiểm tra kỹ trước khi xóa.';
  msg+='\n\nThao tác KHÔNG THỂ hoàn tác.';
  if(!await avaConfirm(msg,{danger:true,okText:'Xóa '+ems.length+' em'}))return;
  const done=new Set(); let fail=0, emsg='', soQuyConLai=0;
  for(let i=0;i<ids.length;i+=100){
    const chunk=ids.slice(i,i+100);
    await SB.from('so_quy').delete().in('hv_id',chunk);         // phiếu thu học phí tự sinh của các em
    await SB.from('diem_danh_hv').delete().in('hv_id',chunk);   // điểm danh của các em
    // phiếu thu của KỲ ĐÃ CHỐT sẽ không xóa được (khóa kế toán) → đếm lại để báo anh
    const {count}=await SB.from('so_quy').select('id',{count:'exact',head:true}).in('hv_id',chunk);
    soQuyConLai+=(count||0);
    const {error}=await SB.from('hoc_vien').delete().in('id',chunk);
    if(error){fail+=chunk.length;emsg=error.message;} else chunk.forEach(id=>done.add(id));
  }
  hvSel.clear(); if(done.size) await loadCloud();
  hvSelMode=false; renderHocVien(); renderNavCounts();
  let out=fail?('Đã xóa '+done.size+' em. Còn '+fail+' em không xóa được'+(emsg?': '+emsg:'')+'.')
              :('Đã xóa xong '+done.size+' học sinh.');
  if(soQuyConLai) out+='\n\n⚠ Còn '+soQuyConLai+' phiếu thu học phí chưa xóa được vì thuộc kỳ ĐÃ CHỐT SỔ. Muốn xóa hẳn, anh vào Sổ quỹ → Mở khóa kỳ đó rồi xóa phiếu bằng tay.';
  avaAlert(out,{title:'Xóa học sinh'});
}

/* Dọn học sinh mẫu cũ (mau=true) hàng loạt — xóa theo lô, RLS tự chặn ngoài quyền */
async function cleanMauHV(mauList){
  if(!mauList||!mauList.length)return;
  const n=mauList.length;
  if(!await avaConfirm(`Xóa vĩnh viễn ${n} học sinh mẫu (dữ liệu cũ, chưa có học phí) trong phạm vi đang xem? Thao tác này không thể hoàn tác.`,{danger:true,okText:'Xóa '+n+' em'}))return;
  const ids=mauList.map(h=>h.id);
  const done=new Set(); let fail=0, msg='';
  for(let i=0;i<ids.length;i+=100){
    const chunk=ids.slice(i,i+100);
    await SB.from('diem_danh_hv').delete().in('hv_id',chunk);   // xóa điểm danh kèm theo, tránh bỏ lại bản ghi mồ côi
    const {error}=await SB.from('hoc_vien').delete().in('id',chunk);
    if(error){fail+=chunk.length;msg=error.message;} else chunk.forEach(id=>done.add(id));
  }
  if(done.size){ OPS.hv=OPS.hv.filter(x=>!done.has(x.id)); await loadCloud(); }
  renderHocVien();
  if(fail) avaAlert(`Đã dọn ${done.size} em. Còn ${fail} em không xóa được${msg?': '+msg:''}.`);
  else avaAlert(`Đã dọn xong ${done.size} học sinh mẫu.`);
}
