/* Danh sách lớp trong 1 cơ sở dạng LƯỚI kẻ cột — tích = giáo viên phụ trách lớp đó */
function lopCheckHTML(coSoId,gvName){
  const ls=LOP.filter(l=>l.coSoId===coSoId).slice().sort((a,b)=>String(a.lop).localeCompare(String(b.lop),'vi'));
  if(!ls.length) return `<div class="muted" style="font-size:.82rem;padding:12px">Cơ sở này chưa có lớp học.</div>`;
  const nm=(gvName||'').trim();
  const rows=ls.map(l=>{const cur=(l.gv||'').trim(); const mine=nm&&cur===nm;
    const gvTxt=cur?(mine?`<span style="color:var(--emerald);font-weight:700">${esc(cur)}</span>`:esc(cur)):'—';
    return `<label class="lopgrid-r"><input type="checkbox" value="${l.id}" ${mine?'checked':''}/><span class="lg-lop">${esc(l.lop)}</span><span class="lg-ss">${l.siso||0}</span><span class="lg-gv">${gvTxt}</span></label>`;
  }).join('');
  return `<div class="lopgrid"><div class="lopgrid-h"><span></span><span>Lớp</span><span>Sĩ số</span><span>GV phụ trách</span></div>${rows}</div>`;
}
function showGV(id){
  const g=GV.find(x=>x.id===id); if(!g)return;
  const lops=LOP.filter(l=>l.coSoId===g.coSoId && (l.gv||'').trim()===g.ten.trim());
  const hs=lops.reduce((s,l)=>s+(l.siso||0),0);
  $('#mcard').innerHTML=`
    <div class="mhead">
      <div class="mava">${initials(g.ten)}</div>
      <div style="flex:1"><h3>${esc(g.ten)}</h3><p>Hồ sơ giáo viên · ${esc(csName(g.coSoId))} · <span style="opacity:.85">bấm để sửa</span></p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody"><div class="form2">
      <div class="fld full"><label>Họ và tên</label><input id="ev_ten" value="${esc(g.ten)}"/></div>
      <div class="fld"><label>Ngày sinh</label><input id="ev_ns" value="${esc(g.ns||'')}" placeholder="dd/mm/yyyy"/></div>
      <div class="fld"><label>Môn</label><select id="ev_mon"><option value="VH" ${g.mon!=='TA'?'selected':''}>Văn hóa</option><option value="TA" ${g.mon==='TA'?'selected':''}>Tiếng Anh</option></select></div>
      <div class="fld"><label>Trình độ chuyên môn</label><input id="ev_td" value="${esc(g.td||'')}"/></div>
      <div class="fld"><label>Số điện thoại</label><input id="ev_sdt" value="${esc(g.sdt||'')}" inputmode="tel"/></div>
      <div class="fld full"><label>Địa chỉ</label><input id="ev_dc" value="${esc(g.dc||'')}"/></div>
      <div class="fld"><label>Cơ sở công tác</label><input value="${esc(csName(g.coSoId))}" disabled style="opacity:.7"/></div>
      <div class="fld"><label>Ngày hợp đồng làm việc</label><input id="ev_hd" value="${g.ngayHd?isoVN(g.ngayHd):''}" placeholder="dd/mm/yyyy"/></div>
      ${gvLive
        ? `<div class="fld full"><label>Phụ trách lớp <span style="font-weight:600;color:var(--muted)">· tích chọn lớp</span></label><div class="gv-lopcheck" id="ev_lops">${lopCheckHTML(g.coSoId,g.ten)}</div></div>`
        : (lops.length?`<div class="fld full"><label>Phụ trách lớp</label><input value="${lops.length} lớp · ${hs} HS — ${esc(lops.map(l=>l.lop).join(', '))}" disabled style="opacity:.7"/></div>`:'')}
      <div id="ev_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px;margin-top:2px">
        ${gvLive?`<button class="btn btn-light" style="color:var(--rose)" id="ev_del">Xóa</button>`:''}
        <button class="btn btn-light" style="flex:1" onclick="closeModal()">Đóng</button>
        <button class="btn btn-primary" style="flex:2" id="ev_save">💾 Lưu thay đổi</button>
      </div>
      <div class="fld full" style="padding:0"><small class="muted">Thay đổi được lưu online, đồng bộ mọi máy.</small></div>
    </div></div>`;
  $('#modal').classList.add('on');
  attachDateFormat($('#ev_ns')); attachDateFormat($('#ev_hd'));
  const err=$('#ev_err'); const showErr=m=>{err.textContent=m||'';err.style.display=m?'block':'none';};
  $('#ev_save').onclick=async()=>{
    const rec={ten:$('#ev_ten').value.trim(),ns:$('#ev_ns').value.trim(),td:$('#ev_td').value.trim(),sdt:$('#ev_sdt').value.trim(),dc:$('#ev_dc').value.trim(),mon:$('#ev_mon').value};
    if(!rec.ten){showErr('Vui lòng nhập họ tên.');$('#ev_ten').focus();return;}
    if(!isValidDob(rec.ns)){showErr('Ngày sinh chưa đúng dạng ngày/tháng/năm (VD: 12/10/1990).');$('#ev_ns').focus();return;}
    const hdv=($('#ev_hd')&&$('#ev_hd').value.trim())||'';
    if(hdv && !isValidDob(hdv)){showErr('Ngày hợp đồng chưa đúng dạng ngày/tháng/năm.');$('#ev_hd').focus();return;}
    const hdIso = hdv ? vnToIso(hdv) : null;
    const oldName=g.ten.trim();
    const btn=$('#ev_save'); btn.disabled=true; btn.textContent='Đang lưu…'; showErr('');
    const {error}= gvLive
      ? await SB.from('giao_vien').update({ten:rec.ten,ns:rec.ns,td:rec.td,dc:rec.dc,sdt:rec.sdt,mon:rec.mon}).eq('id',g.id)
      : await SB.from('gv_edits').upsert({gv_id:g.id,coso_id:g.coSoId,...rec},{onConflict:'gv_id'});
    if(error){btn.disabled=false;btn.textContent='💾 Lưu thay đổi';showErr('Lỗi lưu: '+error.message);return;}
    ['ten','ns','td','sdt','dc','mon'].forEach(k=>{g[k]=rec[k];});
    // Ngày hợp đồng (best-effort; bỏ qua êm nếu chưa chạy SQL)
    if(gvLive) await SB.from('giao_vien').update({ngay_hd:hdIso}).eq('id',g.id);
    else await SB.from('gv_edits').update({ngay_hd:hdIso}).eq('gv_id',g.id);
    g.ngayHd=hdIso;
    // Phân công lớp: tích = phụ trách; bỏ tích lớp đang của mình = gỡ (chỉ khi có bảng lop_hoc sống)
    if(gvLive){
      const box=$('#ev_lops');
      const checked=new Set(box?[...box.querySelectorAll('input:checked')].map(x=>Number(x.value)):[]);
      const newName=rec.ten.trim();
      for(const l of LOP.filter(x=>x.coSoId===g.coSoId)){
        const was=(l.gv||'').trim()===oldName || l.gvId===g.id;
        if(checked.has(l.id)){ if((l.gv||'')!==newName||l.gvId!==g.id){await SB.from('lop_hoc').update({gv:newName,gv_id:g.id}).eq('id',l.id); l.gv=newName; l.gvId=g.id;} }
        else if(was){ await SB.from('lop_hoc').update({gv:'',gv_id:null}).eq('id',l.id); l.gv=''; l.gvId=null; }
      }
    }
    btn.disabled=false; btn.textContent='💾 Lưu thay đổi';
    closeModal();
    if(VIEW==='gv')renderGV();
  };
  const del=$('#ev_del'); if(del)del.onclick=async()=>{
    // Lớp đang do GV này phụ trách (theo mã, hoặc theo tên với dữ liệu cũ chưa gắn mã)
    const myLops=LOP.filter(l=>l.coSoId===g.coSoId && (l.gvId===g.id || (l.gv||'').trim()===g.ten.trim()));
    const msg='Xóa giáo viên "'+g.ten+'"?'
      + (myLops.length?('\n\n'+myLops.length+' lớp đang phụ trách ('+myLops.map(l=>l.lop).join(', ')+') sẽ được GỠ PHÂN CÔNG, chờ giao cho giáo viên khác.'):'')
      + '\n\nNếu giáo viên này đã có tài khoản đăng nhập, hãy vào mục Tài khoản để khóa hoặc xóa tài khoản đó.'
      + '\n\nThao tác này không thể hoàn tác.';
    if(!await avaConfirm(msg,{danger:true,okText:'Xóa'}))return;
    // Gỡ phân công TRƯỚC khi xóa — tránh lớp "mồ côi" còn giữ tên và mã của GV đã xóa
    for(const l of myLops){
      const {error}=await SB.from('lop_hoc').update({gv:'',gv_id:null}).eq('id',l.id);
      if(error){showErr('Lỗi gỡ phân công lớp '+l.lop+': '+error.message);return;}
      l.gv=''; l.gvId=null;
    }
    const {error}=await SB.from('giao_vien').delete().eq('id',g.id);
    if(error){showErr('Lỗi xóa: '+error.message);return;}
    const i=GV.findIndex(x=>x.id===g.id); if(i>=0)GV.splice(i,1);
    closeModal(); if(VIEW==='gv')renderGV(); else if(VIEW==='lop')renderLop();
  };
}

    const coSoId=USER.role==='admin'?Number($('#nv_cs').value):USER.coSoId;
    const lopIds=[...document.querySelectorAll('#nv_lops input:checked')].map(x=>Number(x.value));
    const rec={ten,ns:$('#nv_ns').value.trim(),td:$('#nv_td').value.trim(),sdt:$('#nv_sdt').value.trim(),dc:$('#nv_dc').value.trim(),mon:$('#nv_mon').value,coSoId};
    const btn=$('#nv_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    const {data,error}=await SB.from('giao_vien').insert(gvToDb(rec)).select().single();
    if(error){btn.disabled=false;btn.textContent='＋ Thêm giáo viên';err('Lỗi thêm: '+error.message);return;}
    await SB.from('giao_vien').update({ngay_hd:hdIso}).eq('id',data.id);   // ngày hợp đồng; bỏ qua êm nếu chưa chạy SQL
    // phân công lớp cho GV mới
    for(const id of lopIds){ await SB.from('lop_hoc').update({gv:ten,gv_id:data.id}).eq('id',id); const l=LOP.find(x=>x.id===id); if(l){l.gv=ten;l.gvId=data.id;} }
    const obj=gvFromDb(data); obj.ngayHd=obj.ngayHd||hdIso;
    GV.push(obj);
    btn.disabled=false; btn.textContent='＋ Thêm giáo viên';
    closeModal(); renderGV();
  };
}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

/* ============ CƠ SỞ ============ */
function renderCoso(){
  if(csDetailId!=null){renderCosoDetail(csDetailId);return;}
  const list=inCOSO();
  const active=list.filter(c=>!c.build);
  const tot=active.reduce((a,c)=>{const s=csStat(c.id);a.gv+=s.gv;a.hs+=s.hs;a.lop+=s.lop;return a;},{gv:0,hs:0,lop:0});
  const totDu=hpStat(scopeIds()).du;
  const rows=list.map(c=>({c,...csStat(c.id),du:hpStat([c.id]).du}));
  rows.sort((a,b)=>{
    if(a.c.build!==b.c.build) return a.c.build?1:-1;   // đang XD xuống cuối
    if(csSort==='ten') return a.c.ten.localeCompare(b.c.ten,'vi');
    const key=csSort==='thu'?'du':csSort;
    return b[key]-a[key];
  });

  let h=`<div class="cssum">
    <div class="s"><b>${active.length}</b><span>Cơ sở hoạt động</span></div>
    <div class="s"><b>${tot.gv}</b><span>Giáo viên</span></div>
    <div class="s"><b>${tot.hs.toLocaleString('vi-VN')}</b><span>Học sinh</span></div>
    <div class="s"><b>${tot.lop}</b><span>Lớp học</span></div>
    <div class="s"><b>${fmtShort(totDu)}</b><span>Dự thu học phí</span></div>
  </div>
  <div class="toolbar"><div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <small class="muted" style="font-weight:700">Sắp xếp:</small>
    <select class="fsel" id="cssort">${[['thu','Dự thu cao nhất'],['hs','Học sinh nhiều nhất'],['gv','Giáo viên nhiều nhất'],['ten','Tên A→Z']].map(([k,t])=>`<option value="${k}" ${csSort===k?'selected':''}>${t}</option>`).join('')}</select>
  </div></div>
  <div class="cscards">`;

  rows.forEach(({c,gv,lop,hs,thu})=>{
    if(c.build){
      h+=`<div class="cscard build">
        <div class="cs-top"><div class="cs-logo">AVATAR</div>
          <div><h4>${esc(c.ten)}</h4><div class="cs-sub">Đang xây dựng</div></div></div>
        <div class="empty" style="padding:18px 0">Cơ sở mới · chưa nhập dữ liệu</div></div>`;
      return;
    }
    let warn='';
    if(lop===0&&gv>0) warn=`<span class="cs-warn">⚠ Chưa nhập lớp</span>`;
    else if(lop>0&&hs/lop<6) warn=`<span class="cs-warn">⚠ Sĩ số bất thường</span>`;
    h+=`<div class="cscard" data-cs="${c.id}" style="background:${csPastel(c.id)};border-left:4px solid ${avaColor(c.ten)}">
      <span class="cs-deco" style="background:${avaColor(c.ten)}"></span>
      <div class="cs-top"><div class="cs-logo">AVATAR</div>
        <div class="cs-head"><h4>${esc(c.ten)}${warn}</h4><div class="cs-sub">${lop} lớp · ${hs} học sinh</div></div></div>
      <div class="cs-stats">
        <div class="cs-stat"><b>${gv}</b><span>Giáo viên</span></div>
        <div class="cs-stat"><b>${hs}</b><span>Học sinh</span></div>
      </div>
    </div>`;
  });
  h+='</div>';
  $('#view').innerHTML=h;
  $('#cssort').onchange=e=>{csSort=e.target.value;renderCoso();};
  $$('#view .cscard[data-cs]').forEach(el=>el.onclick=()=>{
    csDetailId=Number(el.dataset.cs); renderCoso();
  });
}

/* ===== Chi tiết 1 trung tâm — tổng quan lớp, học sinh, kinh phí ===== */
function renderCosoDetail(id){
  const c=COSO.find(x=>x.id===id);
  if(!c){csDetailId=null;return renderCoso();}
  const s=csStat(id);
  const lops=LOP.filter(l=>l.coSoId===id).slice().sort((a,b)=>(a.lop||'').localeCompare(b.lop||'','vi'));
  const money=hpStat([id]);
  const duthu=money.du, daThu=money.da, chuaThu=money.chua;
  const pct=duthu?Math.round(money.rate*100):0;
  const siTb=s.lop?Math.round(s.hs/s.lop):0;
  const ccR=ccStat([id]);
  const ccTxt=ccR==null?'—':Math.round(ccR*100)+'%';

  let h=`<button class="btn btn-sm btn-ghost cs-back" id="csBack">← Tất cả cơ sở</button>
  <div class="csd-hero" style="background:${csPastel(id)};border-left:5px solid ${avaColor(c.ten)}">
    <span class="cs-deco" style="background:${avaColor(c.ten)}"></span>
    <div class="cs-logo" style="padding:13px 24px;font-size:1.05rem">AVATAR</div>
    <div style="position:relative;z-index:1"><h2>${esc(c.ten)}</h2><div class="cs-sub" style="font-size:.9rem">${s.lop} lớp · ${s.hs} học sinh · ${s.gv} giáo viên</div></div>
  </div>
  <div class="cssum" style="margin-top:14px">
    <div class="s"><b>${s.lop}</b><span>Lớp học</span></div>
    <div class="s"><b>${s.hs}</b><span>Học sinh</span></div>
    <div class="s"><b>${s.gv}</b><span>Giáo viên</span></div>
    <div class="s"><b>${siTb}</b><span>Sĩ số TB/lớp</span></div>
    <div class="s"><b>${ccTxt}</b><span>Chuyên cần</span></div>
  </div>
  <div class="panel">
    <div class="phead"><h3>Tổng kinh phí học phí</h3><span class="sub">${money.nDa}/${money.n} HS đã đóng</span></div>
    ${money.n===0?'<div class="empty" style="padding:20px">Chưa nhập học phí cho học sinh nào của cơ sở này.</div>':`<div class="csd-money">
      <div class="mbox"><small>Dự thu</small><b>${fmtShort(duthu)}</b></div>
      <div class="mbox done"><small>Đã thu</small><b>${fmtShort(daThu)}</b></div>
      <div class="mbox pend"><small>Chưa thu</small><b>${fmtShort(chuaThu)}</b></div>
    </div>
    <div class="csd-prog"><div class="csd-prog-bar"><i style="width:${pct}%"></i></div><span>Đã thu <b>${pct}%</b> dự thu</span></div>`}
  </div>
  <div class="panel"><div class="phead"><h3>Danh sách lớp học</h3><span class="sub">${lops.length} lớp</span></div>
    <div class="twrap"><table><thead><tr><th>Lớp</th><th>Giáo viên phụ trách</th><th class="tright">Sĩ số</th><th class="tright">Dự thu</th></tr></thead><tbody>`;
  if(!lops.length){h+=`<tr><td colspan="4"><div class="empty">${svg(IC.lop,1.6)}Trung tâm chưa có lớp học</div></td></tr>`;}
  else lops.forEach(l=>{
    const lopDu=OPS.hv.filter(h=>h.lopId===l.id&&hvActive(h)).reduce((sm,h)=>sm+(h.hocPhi||0),0);
    h+=`<tr><td><b>${esc(l.lop||'—')}</b> ${l.mon==='TA'?'<span class="badge bg-ta" style="margin-left:4px">TA</span>':''}</td>
      <td>${esc(l.gv||'—')}</td>
      <td class="tright num">${l.siso||0}</td>
      <td class="tright num">${lopDu?fmtVND(lopDu):'—'}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;
  $('#csBack').onclick=()=>{csDetailId=null;renderCoso();};
}

/* ============ LỚP HỌC ============ */
function renderLop(){
  const opts=inCOSO().filter(c=>!c.build);
  let list=inLOP();
  if(USER.role==='admin'&&lopCs!=='all') list=list.filter(l=>l.coSoId===Number(lopCs));
  if(lopSearch.trim()){const q=lopSearch.trim().toLowerCase();list=list.filter(l=>((l.lop||'')+' '+(l.gv||'')).toLowerCase().includes(q));}
  list=list.slice().sort((a,b)=>a.coSoId-b.coSoId);
  const hs=list.reduce((s,l)=>s+hvOfLop(l.id).filter(hvActive).length,0), thu=list.reduce((s,l)=>s+lopHP(l.id),0);

  let h=`<div class="toolbar">
    <div class="search">${svg(IC.search,2)}<input id="lopq" placeholder="Tìm lớp hoặc giáo viên…" value="${esc(lopSearch)}"/></div>
    ${USER.role==='admin'?`<select class="fsel" id="lopcs"><option value="all">Tất cả cơ sở</option>${opts.map(c=>`<option value="${c.id}" ${String(lopCs)===String(c.id)?'selected':''}>${esc(c.ten)}</option>`).join('')}</select>`:''}
    ${gvLive?`<button class="btn btn-sm btn-primary" id="lopAdd" style="white-space:nowrap">＋ Thêm lớp</button>`:''}
  </div>`;
  h+=`<div class="panel"><div class="phead"><h3>Danh sách lớp học</h3><span class="sub">${list.length} lớp · ${hs} HS · dự thu ${fmtShort(thu)}${gvLive?' · bấm dòng để sửa':''}</span></div>
    <div class="twrap"><table><thead><tr><th>Lớp</th><th>Giáo viên phụ trách</th>${USER.role==='admin'?'<th>Cơ sở</th>':''}<th class="tright">Sĩ số</th><th class="tright">Dự thu</th></tr></thead><tbody>`;
  if(!list.length){h+=`<tr><td colspan="5"><div class="empty">${svg(IC.lop,1.6)}Chưa có lớp học trong phạm vi này</div></td></tr>`;}
  else list.forEach(l=>{
    h+=`<tr ${gvLive?`data-lid="${l.id}" class="lopRow" style="cursor:pointer"`:''}><td><b>${esc(l.lop||'—')}</b> ${l.mon==='TA'?'<span class="badge bg-ta" style="margin-left:4px">TA</span>':''}</td>
      <td>${esc(l.gv||'—')}</td>
      ${USER.role==='admin'?`<td>${esc(csName(l.coSoId))}</td>`:''}
      <td class="tright num">${l.siso||0}</td>
      <td class="tright num">${lopHP(l.id)?fmtVND(lopHP(l.id)):'—'}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;
  $('#lopq').oninput=e=>{lopSearch=e.target.value;const v=e.target.value;renderLop();$('#lopq').focus();$('#lopq').setSelectionRange(v.length,v.length);};
  const cs=$('#lopcs'); if(cs)cs.onchange=e=>{lopCs=e.target.value;renderLop();};
  const la=$('#lopAdd'); if(la)la.onclick=openLopNew;
  if(gvLive)$$('#view .lopRow').forEach(r=>r.onclick=()=>{const l=LOP.find(x=>x.id===Number(r.dataset.lid));if(l)openLopEdit(l);});
}
/* select danh sách GV của 1 cơ sở để chọn GV phụ trách lớp */
function gvOptions(coSoId,sel){
  return GV.filter(g=>g.coSoId===coSoId).slice().sort((a,b)=>a.ten.localeCompare(b.ten,'vi'))
    .map(g=>`<option value="${esc(g.ten)}" ${g.ten===sel?'selected':''}>${esc(g.ten)}</option>`).join('');
}
/* ＋ Thêm lớp mới */
function openLopNew(){
  const isAdmin=USER.role==='admin';
  const csOpts=inCOSO().filter(c=>!c.build).map(c=>`<option value="${c.id}">${esc(c.ten)}</option>`).join('');
  const firstCs=isAdmin?inCOSO().filter(c=>!c.build)[0]?.id:USER.coSoId;
  $('#mcard').innerHTML=`
    <div class="mhead">
      <div class="mava">＋</div>
      <div style="flex:1"><h3>Thêm lớp học</h3><p>${isAdmin?'Chọn cơ sở':esc(csName(USER.coSoId))}</p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody"><div class="form2">

      <div class="fld full"><label>Giáo viên phụ trách</label><select id="lp_gv"><option value="">— Chưa phân công —</option>${gvOptions(firstCs,'')}</select></div>
      <div id="lp_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px"><button class="btn btn-light" style="flex:1" onclick="closeModal()">Hủy</button><button class="btn btn-primary" style="flex:2" id="lp_save">＋ Thêm lớp</button></div>
    </div></div>`;
  $('#modal').classList.add('on');
  const err=m=>{const e=$('#lp_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  if(isAdmin){const csSel=$('#lp_cs'); csSel.onchange=()=>{$('#lp_gv').innerHTML='<option value="">— Chưa phân công —</option>'+gvOptions(Number(csSel.value),'');};}
  $('#lp_save').onclick=async()=>{
    const ten=$('#lp_ten').value.trim();
    if(!ten){err('Vui lòng nhập tên lớp.');$('#lp_ten').focus();return;}
    const coSoId=isAdmin?Number($('#lp_cs').value):USER.coSoId;
    const rec={lop:ten,gv:$('#lp_gv').value,siso:Number(String($('#lp_siso').value).replace(/\D/g,''))||0,mon:$('#lp_mon').value,coSoId};
    const btn=$('#lp_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    const {data,error}=await SB.from('lop_hoc').insert(lopToDb(rec)).select().single();
    btn.disabled=false; btn.textContent='＋ Thêm lớp';
    if(error){err('Lỗi thêm: '+error.message);return;}
    LOP.push(lopFromDb(data));
    closeModal(); renderLop();
  };
}
/* Sửa / xóa 1 lớp */
function openLopEdit(l){
  const soHS=hvOfLop(l.id).length;
  $('#mcard').innerHTML=`
    <div class="mhead">
      <div class="mava">${svg(IC.lop)}</div>
      <div style="flex:1"><h3>${esc(l.lop)}</h3><p>${esc(csName(l.coSoId))} · ${soHS} học sinh</p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody"><div class="form2">
      <div class="fld full"><label>Tên lớp *</label><input id="lp_ten" value="${esc(l.lop)}"/></div>
      <div class="fld"><label>Môn</label><select id="lp_mon"><option value="VH" ${l.mon!=='TA'?'selected':''}>Văn hóa</option><option value="TA" ${l.mon==='TA'?'selected':''}>Tiếng Anh</option></select></div>
      <div class="fld"><label>Sĩ số dự kiến</label><input id="lp_siso" inputmode="numeric" value="${l.siso||''}"/></div>
      <div class="fld full"><label>Giáo viên phụ trách</label><select id="lp_gv"><option value="">— Chưa phân công —</option>${gvOptions(l.coSoId,l.gv)}</select></div>
      <div id="lp_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px;margin-top:2px">
        <button class="btn btn-light" style="color:var(--rose)" id="lp_del">Xóa lớp</button>
        <button class="btn btn-light" style="flex:1" onclick="closeModal()">Đóng</button>
        <button class="btn btn-primary" style="flex:2" id="lp_save">💾 Lưu</button>
      </div>
    </div></div>`;
  $('#modal').classList.add('on');
  const err=m=>{const e=$('#lp_err');e.textContent=m||'';e.style.display=m?'block':'none';};
  $('#lp_save').onclick=async()=>{
    const ten=$('#lp_ten').value.trim();
    if(!ten){err('Vui lòng nhập tên lớp.');return;}
    const patch={lop:ten,gv:$('#lp_gv').value,siso:Number(String($('#lp_siso').value).replace(/\D/g,''))||0,mon:$('#lp_mon').value};
    const btn=$('#lp_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    const {error}=await SB.from('lop_hoc').update(patch).eq('id',l.id);
    btn.disabled=false; btn.textContent='💾 Lưu';
    if(error){err('Lỗi lưu: '+error.message);return;}
    Object.assign(l,patch);
    closeModal(); renderLop();
  };
  $('#lp_del').onclick=async()=>{
    if(soHS>0){err('Lớp còn '+soHS+' học sinh. Hãy chuyển các em sang lớp khác (trong mục Học sinh) trước khi xóa.');return;}
    if(!await avaConfirm('Xóa lớp "'+l.lop+'"? Thao tác này không thể hoàn tác.',{danger:true,okText:'Xóa'}))return;
    const {error}=await SB.from('lop_hoc').delete().eq('id',l.id);
    if(error){err('Lỗi xóa: '+error.message);return;}
    const i=LOP.findIndex(x=>x.id===l.id); if(i>=0)LOP.splice(i,1);
    closeModal(); renderLop();
  };
}

/* ============ KHOẢN THU ============ */
function renderThu(){
  const ids=scopeIds();
  const inSc=OPS.gd.filter(g=>ids.includes(g.coSoId));
  const months=[...new Set(inSc.map(g=>g.ngay.slice(0,7)))].sort().reverse();
  let list=inSc.slice();
  if(ktThang!=='all') list=list.filter(g=>g.ngay.slice(0,7)===ktThang);
  if(ktLoai!=='all') list=list.filter(g=>g.loai===ktLoai);
  list.sort((a,b)=>b.ngay.localeCompare(a.ngay)||b.id-a.id);
  const tThu=list.filter(g=>g.loai==='thu').reduce((s,g)=>s+g.soTien,0);
  const tChi=list.filter(g=>g.loai==='chi').reduce((s,g)=>s+g.soTien,0);
  // Tồn quỹ = tiền mặt thực có: lũy kế TOÀN BỘ sổ trong phạm vi, KHÔNG theo bộ lọc tháng/loại
  // (nếu tính trên danh sách đã lọc thì chọn "Chỉ Thu" sẽ ra Tồn quỹ = Tổng thu — sai).
  const ton=inSc.reduce((s,g)=>s+(g.loai==='thu'?g.soTien:-g.soTien),0);
  const adm=USER.role==='admin';

  let h=`<div class="kpis">
    <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-em">${svg(IC.thu)}</div></div><b>${fmtShort(tThu)}</b><span>Tổng thu</span></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-am">${svg(IC.thu)}</div></div><b>${fmtShort(tChi)}</b><span>Tổng chi</span></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-teal">${svg(IC.thu)}</div></div><b>${fmtShort(ton)}</b><span>Tồn quỹ (toàn bộ)</span></div>
    <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-sky">${svg(IC.diemdanh)}</div></div><b>${list.length}</b><span>Số phiếu</span></div>
  </div>
  <div class="toolbar">
    <select class="fsel" id="ktThang"><option value="all">Tất cả kỳ</option>${months.map(m=>{const p=m.split('-');return `<option value="${m}" ${ktThang===m?'selected':''}>Tháng ${+p[1]}/${p[0]}</option>`;}).join('')}</select>
    <select class="fsel" id="ktLoai">${[['all','Thu & Chi'],['thu','Chỉ Thu'],['chi','Chỉ Chi']].map(([k,t])=>`<option value="${k}" ${ktLoai===k?'selected':''}>${t}</option>`).join('')}</select>
    <div class="acts" style="margin-left:auto">
      <button class="btn btn-sm btn-thu" id="addThu">＋ Phiếu thu</button>
      <button class="btn btn-sm btn-chi" id="addChi">－ Phiếu chi</button>
      <button class="btn btn-sm btn-xls" id="expXls">⬇ Xuất Excel</button>
    </div>
  </div>
  <div class="panel"><div class="phead"><h3>Sổ quỹ thu – chi</h3><span class="sub">${list.length} phiếu</span></div>

/* đọc số tiền bằng chữ (VND) */
function docSoVN(number){
  number=Math.round(number); if(number===0)return 'Không đồng';
  const ch=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const dv=['','nghìn','triệu','tỷ'];
  function doc3(baso,daydu){
    let tram=Math.floor(baso/100),chuc=Math.floor((baso%100)/10),donvi=baso%10,s='';
    if(daydu||tram>0){ s+=ch[tram]+' trăm'; if(chuc===0&&donvi>0)s+=' lẻ'; }
    if(chuc>1){ s+=' '+ch[chuc]+' mươi'; if(donvi===1)s+=' mốt'; else if(donvi===4)s+=' tư'; else if(donvi===5)s+=' lăm'; else if(donvi>0)s+=' '+ch[donvi]; }
    else if(chuc===1){ s+=' mười'; if(donvi===5)s+=' lăm'; else if(donvi>0)s+=' '+ch[donvi]; }
    else if(chuc===0&&donvi>0){ s+=' '+ch[donvi]; }
    return s.trim();
  }
  const nhom=[]; let so=number; while(so>0){nhom.push(so%1000);so=Math.floor(so/1000);}
  let kq='';
  for(let g=nhom.length-1;g>=0;g--){ if(nhom[g]===0)continue; kq+=(kq?' ':'')+doc3(nhom[g], g<nhom.length-1&&kq!=='')+(dv[g]?' '+dv[g]:''); }
  kq=kq.trim(); return kq.charAt(0).toUpperCase()+kq.slice(1)+' đồng';
}
function taiWord(html,filename){
  const pre="<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>body{font-family:'Times New Roman',serif}table{width:100%;border-collapse:collapse}td{padding:4px 0;vertical-align:top}</style></head><body>";
  const blob=new Blob(['﻿'+pre+html+"</body></html>"],{type:'application/msword'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'); a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  const tg=$('#toGhi2'); if(tg)tg.onclick=()=>go('ghidanh');

/* Dọn học sinh mẫu cũ (mau=true) hàng loạt — xóa theo lô, RLS tự chặn ngoài quyền */
async function cleanMauHV(mauList){
  if(!mauList||!mauList.length)return;
  const n=mauList.length;
  if(!await avaConfirm(`Xóa vĩnh viễn ${n} học sinh mẫu (dữ liệu cũ, chưa có học phí) trong phạm vi đang xem? Thao tác này không thể hoàn tác.`,{danger:true,okText:'Xóa '+n+' em'}))return;
  const ids=mauList.map(h=>h.id);
  const done=new Set(); let fail=0, msg='';
  for(let i=0;i<ids.length;i+=100){
    const chunk=ids.slice(i,i+100);
    const {error}=await SB.from('hoc_vien').delete().in('id',chunk);
    if(error){fail+=chunk.length;msg=error.message;} else chunk.forEach(id=>done.add(id));
  }
  if(done.size) OPS.hv=OPS.hv.filter(x=>!done.has(x.id));
  renderHocVien();
  if(fail) avaAlert(`Đã dọn ${done.size} em. Còn ${fail} em không xóa được${msg?': '+msg:''}.`);
  else avaAlert(`Đã dọn xong ${done.size} học sinh mẫu.`);
}

    Object.assign(h,patch,{mau:false});
    await syncHocPhiVoucher(h);              // đồng bộ phiếu thu trong Sổ quỹ (theo số tiền đã đóng)
    closeModal(); renderHocVien();
  };
  $('#hv_del').onclick=async()=>{
    if(!await avaConfirm('Xóa hồ sơ học sinh "'+h.ten+'"? Thao tác này không thể hoàn tác.',{danger:true,okText:'Xóa'}))return;

    OPS.hv=OPS.hv.filter(x=>x.id!==h.id);
    await syncHocPhiVoucher(h,0);           // xóa luôn phiếu thu tự sinh của em này
    closeModal(); renderHocVien();
  };
}

      }

/* ============ BÁO CÁO ĐIỂM DANH (Giai đoạn A — mức ngày, dùng dữ liệu hiện có) ============ */
const fmtDT=iso=>{ if(!iso)return''; const d=new Date(iso); if(isNaN(d))return''; const p=n=>('0'+n).slice(-2); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
let bcFrom=todayISO().slice(0,7)+'-01', bcTo=todayISO(), bcLop='all';
const DD_LABEL={co:'Có mặt',muon:'Muộn',phep:'Phép',vang:'Vắng'};
/* Gom số liệu theo khoảng ngày + phạm vi (cơ sở đang chọn) + lớp (tùy chọn) */
function bcCollect(){
  const ids=scopeIds();
  const onlyLop = bcLop!=='all' ? Number(bcLop) : null;
  const inR=ngay=>ngay>=bcFrom&&ngay<=bcTo;
  const okLop=lop=> lop && ids.includes(lop.coSoId) && (onlyLop==null||lop.id===onlyLop);
  const hsMap={}, lopMap={}, gvMap={}, duky=[], buoiRows=[], roster=[], gvDayMap={};
  // Điểm danh học sinh -> chuyên cần HS + tổng hợp lớp + chi tiết buổi + điểm danh chi tiết
  for(const k in OPS.ddHV){ const [lidS,ngay]=k.split('|'); if(!inR(ngay))continue;
    const lop=LOP.find(l=>l.id===Number(lidS)); if(!okLop(lop))continue;
    const lm=lopMap[lop.id]=lopMap[lop.id]||{lop,buoi:new Set(),co:0,tot:0}; lm.buoi.add(ngay);
    const obj=OPS.ddHV[k];
    const b={ngay,lop,co:0,muon:0,phep:0,vang:0,tot:0};
    for(const hid in obj){ const st=obj[hid];
      const hm=hsMap[hid]=hsMap[hid]||{hvId:Number(hid),co:0,muon:0,phep:0,vang:0};
      if(hm[st]!=null)hm[st]++;
      if(b[st]!=null)b[st]++; b.tot++;
      lm.tot++; if(st==='co'||st==='muon')lm.co++;
      const hv=OPS.hv.find(x=>x.id===Number(hid));
      roster.push({ngay,lop,hsName:hv?hv.ten:('HS #'+hid),status:st});
    }
    b.pct=b.tot?Math.round((b.co+b.muon)/b.tot*100):0;
    const ca=OPS.duyet[k]; b.st=ca?ca.st:null;
    buoiRows.push(b);
  }
  // Chấm công GV -> công theo buổi + GV dạy mấy ca/ngày (chỉ ca thực dạy: lên lớp + dạy bù)
  for(const k in OPS.ccGV){ const p=k.split('|'); const ngay=p[2]; if(!inR(ngay))continue;
    const lop=LOP.find(l=>l.id===Number(p[1])); if(!okLop(lop))continue;
    const nm=lop.gv||'(chưa phân công)'; const gm=gvMap[nm]=gvMap[nm]||{name:nm,day:0,bu:0,nghi:0};
    const st=OPS.ccGV[k]; if(gm[st]!=null)gm[st]++;
    if(st==='day'||st==='bu'){ const gk=nm+'|'+ngay; const gd=gvDayMap[gk]=gvDayMap[gk]||{gv:nm,ngay,n:0,lops:new Set()}; gd.n++; gd.lops.add(lop.lop); }
  }
  // Nhật ký đối soát/chốt
  for(const k in OPS.duyet){ const [lidS,ngay]=k.split('|'); if(!inR(ngay))continue;
    const lop=LOP.find(l=>l.id===Number(lidS)); if(!okLop(lop))continue;
    const c=OPS.duyet[k]; duky.push({lop,ngay,st:c.st,gvAt:c.gvAt,letanAt:c.letanAt,adminAt:c.adminAt});
  }
  const hsRows=Object.values(hsMap).map(m=>{const hv=OPS.hv.find(x=>x.id===m.hvId); const tot=m.co+m.muon+m.phep+m.vang;
      return {ten:hv?hv.ten:('HS #'+m.hvId), coSoId:hv?hv.coSoId:null, lop:hv?lopName(hv.lopId):'—', co:m.co,muon:m.muon,phep:m.phep,vang:m.vang, tot, pct:tot?Math.round((m.co+m.muon)/tot*100):0};})
    .sort((a,b)=>a.pct-b.pct||String(a.ten).localeCompare(b.ten,'vi'));
  const gvRows=Object.values(gvMap).sort((a,b)=>(b.day+b.bu)-(a.day+a.bu)||String(a.name).localeCompare(b.name,'vi'));
  const lopRows=Object.values(lopMap).map(l=>({lop:l.lop.lop,coSoId:l.lop.coSoId,buoi:l.buoi.size,co:l.co,tot:l.tot,pct:l.tot?Math.round(l.co/l.tot*100):0}))
    .sort((a,b)=>a.coSoId-b.coSoId||String(a.lop).localeCompare(b.lop,'vi'));
  const bySort=(a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1: String(a.lop.lop).localeCompare(b.lop.lop,'vi');
  buoiRows.sort(bySort);
  roster.sort((a,b)=> bySort(a,b)||String(a.hsName).localeCompare(b.hsName,'vi'));
  duky.sort((a,b)=> a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0);
  // GV ca/ngày: chi tiết (gv,ngày) + tổng hợp mỗi GV
  const gvDayRows=Object.values(gvDayMap).map(g=>({gv:g.gv,ngay:g.ngay,n:g.n,lops:[...g.lops].sort((a,b)=>String(a).localeCompare(b,'vi')).join(', ')}))
    .sort((a,b)=> String(a.gv).localeCompare(b.gv,'vi') || (a.ngay<b.ngay?1:a.ngay>b.ngay?-1:0));
  const gvSumMap={};
  Object.values(gvDayMap).forEach(g=>{const s=gvSumMap[g.gv]=gvSumMap[g.gv]||{gv:g.gv,ngayDay:0,tongCa:0,max:0}; s.ngayDay++; s.tongCa+=g.n; if(g.n>s.max)s.max=g.n;});
  const gvDaySummary=Object.values(gvSumMap).map(s=>({...s,bq:s.ngayDay?Math.round(s.tongCa/s.ngayDay*10)/10:0}))
    .sort((a,b)=>b.tongCa-a.tongCa||String(a.gv).localeCompare(b.gv,'vi'));
  const totBuoi=lopRows.reduce((s,l)=>s+l.buoi,0), luotCo=lopRows.reduce((s,l)=>s+l.co,0), luotTot=lopRows.reduce((s,l)=>s+l.tot,0);
  const chot=duky.filter(d=>d.st==='da_chot').length;
  return {hsRows,gvRows,lopRows,duky,buoiRows,roster,gvDayRows,gvDaySummary,totBuoi,luotCo,luotTot,chot};
}

  </div>`;
  if(!anyData){
    h+=`<div class="panel"><div class="pbody"><div class="empty">${svg(IC.baocao,1.5)}Chưa có dữ liệu điểm danh trong khoảng <b>${isoVN(bcFrom)} – ${isoVN(bcTo)}</b>.<br/>Hãy chọn lại khoảng thời gian hoặc lớp.</div></div></div>`;
    $('#view').innerHTML=h; bcBind(); return;
  }
  // 1) Chuyên cần học sinh
  const pctCol=p=>`<b style="color:${p>=80?'var(--emerald)':p>=50?'var(--amber)':'var(--rose)'}">${p}%</b>`;
  h+=`<div class="panel"><div class="phead"><h3>Chuyên cần học sinh</h3><span class="sub">${D.hsRows.length} HS · % thấp xếp trước</span></div>
    <div class="twrap"><table><thead><tr><th>Học sinh</th>${isAdm?'<th>Cơ sở</th>':''}<th>Lớp</th><th class="tright">Buổi</th><th class="tright">Có mặt</th><th class="tright">Muộn</th><th class="tright">Phép</th><th class="tright">Vắng</th><th class="tright">Chuyên cần</th></tr></thead><tbody>`;
  D.hsRows.slice(0,150).forEach(r=>{h+=`<tr><td><b>${esc(r.ten)}</b></td>${isAdm?`<td>${esc(r.coSoId!=null?csName(r.coSoId):'—')}</td>`:''}<td>${esc(r.lop)}</td><td class="tright num">${r.tot}</td><td class="tright num">${r.co}</td><td class="tright num">${r.muon}</td><td class="tright num">${r.phep}</td><td class="tright num">${r.vang}</td><td class="tright num">${pctCol(r.pct)}</td></tr>`;});
  h+=`</tbody></table></div>${D.hsRows.length>150?`<div class="muted" style="padding:8px 14px;font-size:.8rem">… và ${D.hsRows.length-150} HS nữa — bấm <b>Xuất Excel</b> để xem đầy đủ.</div>`:''}</div>`;
  // 2) Công giáo viên
  h+=`<div class="panel"><div class="phead"><h3>Công giáo viên</h3><span class="sub">${D.gvRows.length} GV · theo buổi đã chấm công</span></div>
    <div class="twrap"><table><thead><tr><th>Giáo viên</th><th class="tright">Lên lớp</th><th class="tright">Dạy bù</th><th class="tright">Nghỉ</th><th class="tright">Tổng buổi dạy</th></tr></thead><tbody>`;
  if(!D.gvRows.length)h+=`<tr><td colspan="5"><div class="empty">Chưa có chấm công trong khoảng này.</div></td></tr>`;
  else D.gvRows.forEach(g=>h+=`<tr><td><b>${esc(g.name)}</b></td><td class="tright num">${g.day}</td><td class="tright num">${g.bu}</td><td class="tright num">${g.nghi}</td><td class="tright num"><b>${g.day+g.bu}</b></td></tr>`);
  h+=`</tbody></table></div></div>`;
  // 3) Tổng hợp theo lớp
  h+=`<div class="panel"><div class="phead"><h3>Tổng hợp theo lớp</h3><span class="sub">${D.lopRows.length} lớp</span></div>
    <div class="twrap"><table><thead><tr><th>Lớp</th>${isAdm?'<th>Cơ sở</th>':''}<th class="tright">Số buổi</th><th class="tright">Lượt có mặt</th><th class="tright">Tổng lượt</th><th class="tright">Chuyên cần</th></tr></thead><tbody>`;
  D.lopRows.forEach(l=>h+=`<tr><td><b>${esc(l.lop)}</b></td>${isAdm?`<td>${esc(csName(l.coSoId))}</td>`:''}<td class="tright num">${l.buoi}</td><td class="tright num">${l.co}</td><td class="tright num">${l.tot}</td><td class="tright num">${pctCol(l.pct)}</td></tr>`);
  h+=`</tbody></table></div></div>`;
  // 4) Nhật ký đối soát & chốt
  h+=`<div class="panel"><div class="phead"><h3>Nhật ký đối soát & chốt</h3><span class="sub">${D.duky.length} ca · lưu vết</span></div>
    <div class="twrap"><table><thead><tr><th>Lớp</th>${isAdm?'<th>Cơ sở</th>':''}<th>Ngày</th><th>Trạng thái</th><th>GV gửi</th><th>Lễ tân đối soát</th><th>Quản trị chốt</th></tr></thead><tbody>`;
  if(!D.duky.length)h+=`<tr><td colspan="${isAdm?7:6}"><div class="empty">Chưa có ca nào gửi đối soát trong khoảng này.</div></td></tr>`;
  else D.duky.slice(0,150).forEach(d=>h+=`<tr><td><b>${esc(d.lop.lop)}</b></td>${isAdm?`<td>${esc(csName(d.lop.coSoId))}</td>`:''}<td class="num">${isoVN(d.ngay)}</td><td><span class="castat ${CA_CLS[d.st]}">${CA_LABEL[d.st]}</span></td><td class="num" style="font-size:.8rem">${fmtDT(d.gvAt)||'—'}</td><td class="num" style="font-size:.8rem">${fmtDT(d.letanAt)||'—'}</td><td class="num" style="font-size:.8rem">${fmtDT(d.adminAt)||'—'}</td></tr>`);
  h+=`</tbody></table></div>${D.duky.length>150?`<div class="muted" style="padding:8px 14px;font-size:.8rem">… và ${D.duky.length-150} ca nữa — bấm <b>Xuất Excel</b>.</div>`:''}</div>`;
  // 5) Chi tiết điểm danh theo buổi / lớp
  h+=`<div class="panel"><div class="phead"><h3>Chi tiết điểm danh theo buổi</h3><span class="sub">${D.buoiRows.length} buổi · mới nhất trước</span></div>
    <div class="twrap"><table><thead><tr><th>Ngày</th><th>Lớp</th>${isAdm?'<th>Cơ sở</th>':''}<th>Giáo viên</th><th class="tright">Có mặt</th><th class="tright">Muộn</th><th class="tright">Vắng</th><th class="tright">Đã điểm</th><th class="tright">Chuyên cần</th><th>Trạng thái</th></tr></thead><tbody>`;
  D.buoiRows.slice(0,200).forEach(b=>{const chip=b.st?`<span class="castat ${CA_CLS[b.st]}">${CA_LABEL[b.st]}</span>`:`<span class="castat ca-none">Chưa gửi</span>`;
    h+=`<tr><td class="num">${isoVN(b.ngay)}</td><td><b>${esc(b.lop.lop)}</b></td>${isAdm?`<td>${esc(csName(b.lop.coSoId))}</td>`:''}<td>${esc(b.lop.gv||'—')}</td><td class="tright num">${b.co}</td><td class="tright num">${b.muon}</td><td class="tright num">${b.phep+b.vang}</td><td class="tright num">${b.tot}</td><td class="tright num">${pctCol(b.pct)}</td><td>${chip}</td></tr>`;});
  h+=`</tbody></table></div>${D.buoiRows.length>200?`<div class="muted" style="padding:8px 14px;font-size:.8rem">… và ${D.buoiRows.length-200} buổi nữa — bấm <b>Xuất Excel</b>.</div>`:''}</div>`;
  // 6) Giáo viên dạy mấy ca/ngày
  h+=`<div class="panel"><div class="phead"><h3>Giáo viên dạy mấy ca/ngày</h3><span class="sub">${D.gvDaySummary.length} GV · ca thực dạy (lên lớp + dạy bù)</span></div>
    <div class="twrap"><table><thead><tr><th>Giáo viên</th><th class="tright">Số ngày dạy</th><th class="tright">Tổng ca</th><th class="tright">BQ ca/ngày</th><th class="tright">Nhiều nhất/ngày</th></tr></thead><tbody>`;
  if(!D.gvDaySummary.length)h+=`<tr><td colspan="5"><div class="empty">Chưa có chấm công dạy trong khoảng này.</div></td></tr>`;
  else D.gvDaySummary.forEach(s=>h+=`<tr><td><b>${esc(s.gv)}</b></td><td class="tright num">${s.ngayDay}</td><td class="tright num">${s.tongCa}</td><td class="tright num">${s.bq}</td><td class="tright num">${s.max}</td></tr>`);
  h+=`</tbody></table></div><div class="muted" style="padding:8px 14px;font-size:.8rem">Chi tiết từng ngày (mỗi GV dạy mấy ca mỗi ngày) có trong file Excel — sheet <b>"GV theo ngày"</b>.</div></div>`;
  $('#view').innerHTML=h; bcBind();
}
function bcBind(){
  const f=$('#bcFrom'); if(f)f.onchange=e=>{bcFrom=e.target.value;renderBaoCao();};
  const t=$('#bcTo'); if(t)t.onchange=e=>{bcTo=e.target.value;renderBaoCao();};
  const l=$('#bcLop'); if(l)l.onchange=e=>{bcLop=e.target.value;renderBaoCao();};
  const x=$('#bcXls'); if(x)x.onclick=()=>bcExport();
}
/* Một sheet báo cáo ĐẸP + mi trang A4: tiêu đề nền navy, phụ đề, header tô màu,
   kẻ viền, zebra, cố định + lặp tiêu đề mỗi trang in, autofilter, footer số trang.
   cols: [{h,k,w,a('left'|'center'|'right'),num,pct,wrap}] */
async function bcSheetPro(wb,name,title,sub,cols,rows,orient){
  const ws=wb.addWorksheet(name,{
    views:[{state:'frozen',ySplit:3}],
    pageSetup:{paperSize:9,orientation:orient||'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,
      horizontalCentered:true,margins:{left:0.4,right:0.4,top:0.55,bottom:0.55,header:0.25,footer:0.25}}
  });
  const nC=cols.length;
  ws.columns=cols.map(c=>({width:c.w||14}));
  ws.mergeCells(1,1,1,nC);
  const tc=ws.getCell(1,1); tc.value=title; tc.font={bold:true,size:14,color:{argb:'FFFFFFFF'}};
  tc.alignment={vertical:'middle',horizontal:'center'}; tc.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL_NAVY}}; ws.getRow(1).height=26;
  ws.mergeCells(2,1,2,nC);
  const sc=ws.getCell(2,1); sc.value=sub; sc.font={italic:true,size:10,color:{argb:'FF44506B'}};
  sc.alignment={horizontal:'center',vertical:'middle'}; ws.getRow(2).height=16;
  const hr=ws.getRow(3); hr.height=24;
  cols.forEach((c,i)=>{const cell=hr.getCell(i+1); cell.value=c.h;
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2A5490'}};
    cell.font={bold:true,color:{argb:'FFFFFFFF'},size:11};
    cell.alignment={vertical:'middle',horizontal:'center',wrapText:true}; cell.border=xlBorder('FF2A5490');});
  rows.forEach((r,ri)=>{const row=ws.getRow(4+ri); row.height=17;
    cols.forEach((c,ci)=>{const cell=row.getCell(ci+1); const v=r[c.k];
      cell.value=(v==null||v==='')?null:v;
      cell.alignment={vertical:'middle',horizontal:c.a||((c.num||c.pct)?'right':'left'),wrapText:!!c.wrap};
      cell.font={size:10.5};
      if(ri%2===1)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEFF3FA'}};
      cell.border=xlBorder('FFD6DEEA');
      if(c.num)cell.numFmt='#,##0'; else if(c.pct)cell.numFmt='0"%"';});
  });
  ws.autoFilter={from:{row:3,column:1},to:{row:3,column:nC}};
  ws.pageSetup.printTitlesRow='1:3';
  ws.headerFooter={oddFooter:'&C&"Calibri"&8Trang &P/&N — AVATAR English'};
  return ws;
}
/* Xuất Excel 7 sheet (ExcelJS): định dạng chuyên nghiệp, mi trang A4 */
async function bcExport(){
  const btn=$('#bcXls'), old=btn?btn.textContent:''; if(btn){btn.disabled=true;btn.textContent='Đang tạo…';}
  try{await ensureExcelJS();}catch(e){if(btn){btn.disabled=false;btn.textContent=old;}avaAlert('Không tải được thư viện Excel. Hãy kiểm tra kết nối mạng.');return;}
  const D=bcCollect();
  const isAdm=USER.role==='admin';
  const phamvi=isAdm?(scope==='all'?'Toàn hệ thống':csName(Number(scope))):csName(USER.coSoId);
  const sub=`TRUNG TÂM ANH NGỮ AVATAR   ·   ${phamvi}   ·   Từ ${isoVN(bcFrom)} đến ${isoVN(bcTo)}`;
  const wb=new ExcelJS.Workbook(); wb.creator='AVATAR'; wb.created=new Date();
  const cs=r=> r.coSoId!=null?csName(r.coSoId):'';
  // 1) Chuyên cần học sinh
  await bcSheetPro(wb,'Chuyen can HS','BÁO CÁO CHUYÊN CẦN HỌC SINH',sub,
    [{h:'STT',k:'stt',w:5,a:'center'},{h:'Học sinh',k:'ten',w:26},{h:'Cơ sở',k:'cs',w:16},{h:'Lớp',k:'lop',w:16},{h:'Số buổi',k:'tot',w:9,num:1},{h:'Có mặt',k:'co',w:9,num:1},{h:'Muộn',k:'muon',w:8,num:1},{h:'Phép',k:'phep',w:8,num:1},{h:'Vắng',k:'vang',w:8,num:1},{h:'Chuyên cần',k:'pct',w:12,pct:1}],
    D.hsRows.map((r,i)=>({stt:i+1,ten:r.ten,cs:cs(r),lop:r.lop,tot:r.tot,co:r.co,muon:r.muon,phep:r.phep,vang:r.vang,pct:r.pct})));
  // 2) Công giáo viên
  await bcSheetPro(wb,'Cong GV','BÁO CÁO CÔNG GIÁO VIÊN',sub,
    [{h:'STT',k:'stt',w:5,a:'center'},{h:'Giáo viên',k:'gv',w:28},{h:'Lên lớp',k:'day',w:11,num:1},{h:'Dạy bù',k:'bu',w:11,num:1},{h:'Nghỉ',k:'nghi',w:9,num:1},{h:'Tổng buổi dạy',k:'tong',w:15,num:1}],
    D.gvRows.map((g,i)=>({stt:i+1,gv:g.name,day:g.day,bu:g.bu,nghi:g.nghi,tong:g.day+g.bu})),'portrait');
  // 3) Tổng hợp theo lớp
  await bcSheetPro(wb,'Tong hop lop','TỔNG HỢP ĐIỂM DANH THEO LỚP',sub,
    [{h:'STT',k:'stt',w:5,a:'center'},{h:'Lớp',k:'lop',w:20},{h:'Cơ sở',k:'cs',w:16},{h:'Số buổi',k:'buoi',w:10,num:1},{h:'Lượt có mặt',k:'co',w:13,num:1},{h:'Tổng lượt',k:'tot',w:12,num:1},{h:'Chuyên cần',k:'pct',w:12,pct:1}],
    D.lopRows.map((l,i)=>({stt:i+1,lop:l.lop,cs:csName(l.coSoId),buoi:l.buoi,co:l.co,tot:l.tot,pct:l.pct})));
  // 4) Chi tiết điểm danh theo buổi
  await bcSheetPro(wb,'Chi tiet buoi','CHI TIẾT ĐIỂM DANH THEO BUỔI / LỚP',sub,
    [{h:'STT',k:'stt',w:5,a:'center'},{h:'Ngày',k:'ngay',w:12,a:'center'},{h:'Lớp',k:'lop',w:18},{h:'Cơ sở',k:'cs',w:16},{h:'Giáo viên',k:'gv',w:22},{h:'Có mặt',k:'co',w:9,num:1},{h:'Muộn',k:'muon',w:8,num:1},{h:'Vắng',k:'vang',w:8,num:1},{h:'Đã điểm',k:'tot',w:9,num:1},{h:'Chuyên cần',k:'pct',w:12,pct:1},{h:'Trạng thái',k:'tt',w:14}],
    D.buoiRows.map((b,i)=>({stt:i+1,ngay:isoVN(b.ngay),lop:b.lop.lop,cs:csName(b.lop.coSoId),gv:b.lop.gv||'',co:b.co,muon:b.muon,vang:b.phep+b.vang,tot:b.tot,pct:b.pct,tt:b.st?CA_LABEL[b.st]:'Chưa gửi'})));
  // 5) Điểm danh chi tiết (từng học sinh / buổi)
  await bcSheetPro(wb,'Diem danh chi tiet','ĐIỂM DANH CHI TIẾT (TỪNG HỌC SINH / BUỔI)',sub,
    [{h:'STT',k:'stt',w:5,a:'center'},{h:'Ngày',k:'ngay',w:12,a:'center'},{h:'Lớp',k:'lop',w:18},{h:'Cơ sở',k:'cs',w:16},{h:'Học sinh',k:'hs',w:26},{h:'Trạng thái',k:'tt',w:12,a:'center'}],
    D.roster.map((r,i)=>({stt:i+1,ngay:isoVN(r.ngay),lop:r.lop.lop,cs:csName(r.lop.coSoId),hs:r.hsName,tt:DD_LABEL[r.status]||r.status})));
  // 6) Giáo viên dạy mấy ca mỗi ngày
  await bcSheetPro(wb,'GV theo ngay','GIÁO VIÊN DẠY MẤY CA MỖI NGÀY',sub,
    [{h:'STT',k:'stt',w:5,a:'center'},{h:'Giáo viên',k:'gv',w:26},{h:'Ngày',k:'ngay',w:12,a:'center'},{h:'Số ca dạy',k:'n',w:11,num:1},{h:'Lớp đã dạy',k:'lops',w:44,wrap:1}],
    D.gvDayRows.map((g,i)=>({stt:i+1,gv:g.gv,ngay:isoVN(g.ngay),n:g.n,lops:g.lops})),'portrait');
  // 7) Nhật ký đối soát & chốt
  await bcSheetPro(wb,'Nhat ky doi soat','NHẬT KÝ ĐỐI SOÁT & CHỐT',sub,
    [{h:'STT',k:'stt',w:5,a:'center'},{h:'Lớp',k:'lop',w:18},{h:'Cơ sở',k:'cs',w:16},{h:'Ngày',k:'ngay',w:12,a:'center'},{h:'Trạng thái',k:'tt',w:14},{h:'GV gửi lúc',k:'gv',w:18,a:'center'},{h:'Lễ tân đối soát lúc',k:'lt',w:20,a:'center'},{h:'Quản trị chốt lúc',k:'ad',w:18,a:'center'}],
    D.duky.map((d,i)=>({stt:i+1,lop:d.lop.lop,cs:csName(d.lop.coSoId),ngay:isoVN(d.ngay),tt:CA_LABEL[d.st]||d.st,gv:fmtDT(d.gvAt),lt:fmtDT(d.letanAt),ad:fmtDT(d.adminAt)})));
  dlBlob(await wb.xlsx.writeBuffer(),`Bao-cao-diem-danh-${bcFrom}_den_${bcTo}.xlsx`);
  if(btn){btn.disabled=false;btn.textContent=old;}
}

/* Giữ đăng nhập: khôi phục phiên khi mở lại app; làm mới token để tránh hết hạn (>1 giờ) */
(async()=>{
  try{
    let {data:{session}}=await SB.auth.getSession();
    if(session){
      const rf=await SB.auth.refreshSession();          // dùng refresh-token đổi lấy token mới
      if(rf.data&&rf.data.session) session=rf.data.session;
    }
    if(session&&session.user) await afterAuth(session.user);
  }catch(e){}
})();
/* Làm mới token định kỳ khi app đang mở (Supabase tự chạy, nhưng gọi lại khi quay lại tab cho chắc) */
document.addEventListener('visibilitychange',()=>{ const app=$('#app'); if(!document.hidden && app && app.style.display!=='none') SB.auth.getSession().catch(()=>{}); });
</script>
