<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0b1d3d"/>
<link rel="icon" type="image/png" href="logo-mark.png"/>
<link rel="apple-touch-icon" href="logo-mark.png"/>
<title>AVATAR English Center · Hệ thống quản trị chuỗi</title>
<style>
:root{
  --bg:#eef1f7;--card:#ffffff;--ink:#132244;--muted:#5f6a86;--faint:#8b95ae;
  --line:#e2e7f1;--soft:#f2f5fb;
  --brand:#1f4276;--brand-600:#17335f;--brand-700:#10264c;--brand-soft:#dbe4f3;
  --navy-900:#0b1d3d;--navy-800:#10264c;
  --emerald:#2f6fd0;--emerald-soft:#dde8fa;
  --amber:#c98410;--amber-soft:#fbeecd;--rose:#e04b52;--rose-soft:#fbe6e7;
  --sky:#0e7fb0;--sky-soft:#d7edf6;--violet:#7c5cd6;--violet-soft:#e9e2fb;
  --radius:18px;--radius-sm:12px;
  --shadow:0 20px 45px -30px rgba(11,29,61,.55);--shadow-sm:0 8px 22px -16px rgba(11,29,61,.5);
  --dots:radial-gradient(rgba(255,255,255,.16) 1.5px, transparent 1.6px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Be Vietnam Pro","Segoe UI",Roboto,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{text-decoration:none;color:inherit}
svg{display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#c4d3d0;border-radius:8px}

/* ===== LOGIN ===== */
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;
  background:var(--dots),
             radial-gradient(1100px 560px at 12% -8%,#1e3d76,transparent 58%),
             radial-gradient(900px 620px at 112% 118%,#12305e,transparent 55%),var(--navy-900);
  background-size:20px 20px,auto,auto,auto}
.lcard{width:min(420px,100%);background:var(--card);border-radius:26px;box-shadow:0 44px 90px -46px #000;overflow:hidden}
.lhead{position:relative;overflow:hidden;color:#fff;padding:38px 30px 30px;text-align:center;background:radial-gradient(135% 90% at 50% -8%,rgba(74,120,200,.5) 0%,rgba(74,120,200,0) 55%),linear-gradient(162deg,#103166 0%,#0a1e46 56%,#071531 100%);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#8a6a1e,#f4c430,#8a6a1e) 1}
.lhead::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(212,175,55,.55) 1.2px,transparent 1.4px);background-size:12px 12px;-webkit-mask-image:radial-gradient(72% 62% at 6% 94%,#000 0%,transparent 60%),radial-gradient(62% 55% at 96% 6%,#000 0%,transparent 62%);mask-image:radial-gradient(72% 62% at 6% 94%,#000 0%,transparent 60%),radial-gradient(62% 55% at 96% 6%,#000 0%,transparent 62%);opacity:.85}
.lhead::after{content:"";position:absolute;left:-25%;right:-25%;top:-10%;bottom:-30%;pointer-events:none;transform:rotate(-7deg);background:radial-gradient(58% 38% at 22% 34%,transparent 38%,rgba(244,196,48,.5) 40%,rgba(244,196,48,0) 44%),radial-gradient(66% 42% at 82% 66%,transparent 43%,rgba(244,196,48,.38) 45%,rgba(244,196,48,0) 49%)}
.llogo{width:96px;height:96px;border-radius:24px;background:transparent;overflow:visible;margin:0 auto 12px;position:relative;z-index:1;filter:drop-shadow(0 12px 26px rgba(240,195,55,.4))}
.llogo img,.brand .lg img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.lhead h1{margin:0;font-size:1.7rem;letter-spacing:.12em;font-weight:900;position:relative;z-index:1;background:linear-gradient(180deg,#fff4c9 0%,#f4c430 48%,#d38f16 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
.lhead p{margin:9px 0 0;color:#dbe6f7;font-size:.86rem;position:relative;z-index:1}
.lbody{padding:26px 28px 30px}
.lbody label{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px 3px}
.field{margin-bottom:15px}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--soft);border-radius:13px;padding:13px 14px;outline:0;transition:.15s}
.field input:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.14)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.role{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;text-align:center;transition:.15s;display:grid;gap:8px;justify-items:center}
.role svg{width:23px;height:23px;stroke:var(--muted)}
.role b{font-size:.82rem;font-weight:800}
.role.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(31,66,118,.14)}
.role.on svg{stroke:var(--brand-600)}
.role.on b{color:var(--brand-700)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--faint)}
.eye:hover{color:var(--brand-600);background:var(--soft)}
.eye svg{width:20px;height:20px;stroke:currentColor}
.lnote{font-size:.75rem;color:var(--faint);text-align:center;margin:17px 0 0;line-height:1.5}

.btn{border-radius:13px;padding:13px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.18s;font-size:.92rem}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,#2a5490,#1f4276);color:#fff;box-shadow:0 14px 30px -14px rgba(16,38,76,.9)}
.btn-primary:hover{background:linear-gradient(135deg,#25497f,#17335f)}
.btn-block{width:100%}
.btn-light{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-light:hover{background:var(--soft)}
.btn-sm{padding:8px 13px;font-size:.8rem;border-radius:10px}
.btn-ghost{background:var(--soft);color:var(--brand-700)}

/* ===== SHELL ===== */
#app{display:none}
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--dots),linear-gradient(188deg,#1c3c6e 0%,#0b1d3d 74%);background-size:22px 22px,auto;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:18px 13px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 17px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .lg{width:50px;height:50px;border-radius:15px;background:#fff;overflow:hidden;flex:none;box-shadow:0 10px 22px -10px rgba(0,0,0,.5)}
.brand b{display:block;font-size:1.14rem;letter-spacing:.07em;font-weight:800}
.brand small{display:block;color:#8fc0ba;font-size:.68rem;letter-spacing:.02em}
.navlab{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#5f8f88;margin:16px 12px 8px;font-weight:800}
.nav{display:grid;gap:8px;overflow-y:auto;flex:1;padding:2px 1px}
.nav button{display:flex;align-items:center;gap:13px;width:100%;text-align:left;color:#cfe4e0;border-radius:13px;padding:13px 14px;font-weight:600;font-size:1rem;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);transition:background .16s,border-color .16s,color .16s,transform .11s ease}
.nav button svg{width:21px;height:21px;stroke:currentColor;flex:none;opacity:.85}
.nav button .cnt{margin-left:auto;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:99px;color:#a9d3cd}
.nav button:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.13);color:#fff}
.nav button:hover svg{opacity:1}
.nav button:active{transform:translateY(-2px)}
.nav button.on{background:linear-gradient(135deg,#2a5490,var(--brand));border-color:transparent;color:#fff;font-weight:700;box-shadow:0 14px 26px -14px rgba(16,38,76,.95)}
.nav button.on svg{opacity:1}
.nav button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.suser{margin-top:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:15px;padding:11px 12px;display:flex;flex-direction:column;gap:11px}
.suser-top{display:flex;align-items:center;gap:10px}
.suser .ava{width:38px;height:38px;border-radius:12px;background:var(--emerald);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.suser b{display:block;font-size:.84rem;line-height:1.25}
.suser small{display:block;color:#8fc0ba;font-size:.7rem}
.btn-logout{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:11px;font-size:.83rem;font-weight:800;color:#d6e7e3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);transition:.15s}
.btn-logout svg{width:17px;height:17px;stroke:currentColor;flex:none}
.btn-logout:hover{background:var(--rose);border-color:var(--rose);color:#fff}
.btn-key:hover{background:var(--emerald)!important;border-color:var(--emerald)!important;color:#fff!important}

.main{min-width:0;padding:20px 26px 90px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.burger{display:none;width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow-sm)}
.burger svg{width:21px;height:21px;stroke:var(--ink)}
.ttl{min-width:0}
.ttl h1{margin:0;font-size:1.5rem;letter-spacing:-.02em;line-height:1.12}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:.83rem}
.topact{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.scope{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 10px 8px 13px;box-shadow:var(--shadow-sm)}
.scope svg{width:16px;height:16px;stroke:var(--brand-600);flex:none}
.scope small{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.scope select{border:0;outline:0;background:none;font-weight:800;color:var(--brand-700);max-width:190px;padding:2px 4px}
.scope.lock{background:var(--soft)}.scope.lock select{color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-sm)}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.kpi-ic svg{width:21px;height:21px}
.ic-teal{background:var(--brand-soft)}.ic-teal svg{stroke:var(--brand-600)}
.ic-em{background:var(--emerald-soft)}.ic-em svg{stroke:var(--emerald)}
.ic-sky{background:var(--sky-soft)}.ic-sky svg{stroke:var(--sky)}
.ic-am{background:var(--amber-soft)}.ic-am svg{stroke:var(--amber)}
.ic-vi{background:var(--violet-soft)}.ic-vi svg{stroke:var(--violet)}
.kpi b{display:block;font-size:1.6rem;letter-spacing:-.02em;margin-top:13px;line-height:1}
.kpi span{font-size:.78rem;color:var(--muted)}

/* KPI hero (dashboard) — thẻ gradient nổi bật */
.kcards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kcard{position:relative;overflow:hidden;border-radius:var(--radius);padding:18px 19px;color:#fff;box-shadow:0 18px 36px -22px rgba(11,29,61,.75)}
.kcard .kdeco{position:absolute;top:-32px;right:-32px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.14)}
.kcard .kdeco::after{content:"";position:absolute;top:36px;right:36px;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.12)}
.kcard .kic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.22);position:relative;z-index:1}
.kcard .kic svg{width:22px;height:22px;stroke:#fff}
.kcard b{display:block;font-size:1.75rem;letter-spacing:-.02em;margin-top:14px;line-height:1;position:relative;z-index:1}
.kcard .kl{font-size:.8rem;color:rgba(255,255,255,.88);position:relative;z-index:1}
.kc1{background:linear-gradient(135deg,#eaa845,#c9760f)}
.kc2{background:linear-gradient(135deg,#37b083,#1c7a54)}
.kc3{background:linear-gradient(135deg,#4785db,#1e4f9e)}
.kc4{background:linear-gradient(135deg,#8f70e6,#5d3fb2)}
@media(max-width:900px){.kcards{grid-template-columns:repeat(2,1fr);gap:11px}.kcard b{font-size:1.5rem}}

.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px}
.phead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead h3{margin:0;font-size:1rem}
.phead .sub{font-size:.72rem;color:var(--muted)}
.pbody{padding:16px 18px}

/* toolbar (search/filter) */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 14px;box-shadow:var(--shadow-sm)}
.search svg{width:18px;height:18px;stroke:var(--faint);flex:none}
.search input{border:0;outline:0;background:none;width:100%}
.fsel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm);outline:0;max-width:210px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-size:.83rem;font-weight:700;color:var(--muted);transition:.15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* table */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
thead th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;padding:11px 14px;border-bottom:2px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;background:var(--soft)}
thead th:last-child{border-right:0}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
tbody td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--soft)}
.tright{text-align:right}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.gvcell{display:flex;align-items:center;gap:11px;min-width:170px}
.gvava{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.82rem;color:#fff;flex:none}
.gvcell b{display:block;line-height:1.2}
.gvcell small{color:var(--muted);font-size:.74rem}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.bg-vh{background:var(--sky-soft);color:var(--sky)}
.bg-ta{background:var(--violet-soft);color:var(--violet)}
.bg-em{background:var(--emerald-soft);color:var(--emerald)}
.bg-am{background:var(--amber-soft);color:var(--amber)}
.bg-gray{background:var(--soft);color:var(--muted)}
.linkbtn{color:var(--brand-600);font-weight:800;font-size:.82rem}

/* cơ sở cards */
.cscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.cscard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px 17px;transition:.15s;cursor:pointer;position:relative;overflow:hidden}
.cscard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.cscard.build{opacity:.72;border-style:dashed}
.cscard .cs-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:15px}
.cs-badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.18rem;flex:none}
.avatar-a{font-weight:900;font-style:italic;letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.cscard h4{margin:0;font-size:1.22rem;line-height:1.2;text-align:center}
.cscard .cs-sub{font-size:.82rem;color:var(--muted);text-align:center}
.cs-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cs-stat{background:rgba(255,255,255,.68);border-radius:13px;padding:13px 10px;text-align:center}
.cs-stat b{display:block;font-size:1.7rem;line-height:1.05;color:var(--brand);font-weight:900}
.cs-stat span{font-size:.74rem;color:var(--muted)}
.cs-rev{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.cs-rev small{font-size:.72rem;color:var(--muted)}
.cs-rev b{font-size:1.02rem;color:var(--brand-700)}
.cs-warn{display:inline-flex;align-items:center;gap:3px;font-size:.6rem;font-weight:800;color:#8a5a05;background:var(--amber-soft);border:1px solid #f2dca6;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.cs-mini{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:.74rem;color:var(--muted)}
.cs-mini .mk{color:var(--amber);font-weight:900}
.cs-mini .mbar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.65);overflow:hidden}
.cs-mini .mbar i{display:block;height:100%;background:var(--sky)}
.cs-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.6);margin-top:11px;overflow:hidden}
.cs-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--emerald))}
.cssum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cssum .s{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;box-shadow:var(--shadow-sm)}
.cssum .s b{display:block;font-size:1.28rem;line-height:1;color:var(--brand);font-weight:900}
.cssum .s span{font-size:.71rem;color:var(--muted)}
.cs-back{margin-bottom:14px}
.csd-hero{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.csd-hero h2{margin:0;font-size:1.5rem;line-height:1.2}
.csd-money{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.csd-money .mbox{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
.csd-money .mbox small{display:block;font-size:.74rem;color:var(--muted);margin-bottom:6px}
.csd-money .mbox b{font-size:1.22rem;line-height:1}
.csd-money .mbox.done{background:#eafaf1;border-color:#bfead2}
.csd-money .mbox.done b{color:var(--emerald)}
.csd-money .mbox.pend{background:#fdf1ec;border-color:#f6d4c6}
.csd-money .mbox.pend b{color:#d9663b}
.csd-prog{display:flex;align-items:center;gap:12px;padding:0 16px 16px}
.csd-prog-bar{flex:1;height:9px;border-radius:99px;background:#eef1f6;overflow:hidden}
.csd-prog-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--emerald))}
.csd-prog span{font-size:.8rem;color:var(--muted);white-space:nowrap}

/* ===== GHI DANH / ĐIỂM DANH ===== */
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form2 .fld{display:grid;gap:6px}
.form2 .fld.full{grid-column:1/-1}
.form2 label{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.form2 input,.form2 select{border:1.5px solid var(--line);background:var(--soft);border-radius:11px;padding:11px 12px;outline:0;width:100%}
.form2 input:focus,.form2 select:focus{border-color:var(--brand);background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{padding:7px 10px;font-size:.77rem;font-weight:800;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on-co,.seg button.on-day{background:var(--emerald-soft);color:var(--emerald)}
.seg button.on-muon,.seg button.on-bu{background:var(--amber-soft);color:var(--amber)}
.seg button.on-phep{background:var(--sky-soft);color:var(--sky)}

<script>
/* ============ UTIL ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ===== SUPABASE (kho dữ liệu online) ===== */
const SB_URL='https://hdvtlbeozyumvnhgejxp.supabase.co';
const SB_KEY='sb_publishable_eGYgGZpxRRdIgLeO6_S_JQ_N7rHsINZ';
const SB=window.supabase.createClient(SB_URL,SB_KEY);
/* ánh xạ giữa cột CSDL (chữ_gạch) và tên dùng trong app (chữHoa) */
const hvFromDb=r=>({id:r.id,ten:r.ten,ns:r.ns||'',ph:r.ph||'',sdt:r.sdt||'',hocPhi:Number(r.hoc_phi)||0,lopId:r.lop_id,coSoId:r.coso_id,mau:!!r.mau});
const hvToDb=o=>({ten:o.ten,ns:o.ns||'',ph:o.ph||'',sdt:o.sdt||'',hoc_phi:o.hocPhi||0,lop_id:o.lopId,coso_id:o.coSoId,mau:!!o.mau});
const gdFromDb=r=>({id:r.id,ngay:r.ngay,loai:r.loai,hangMuc:r.hang_muc,coSoId:r.coso_id,soTien:Number(r.so_tien)||0,noiDung:r.noi_dung||'',nguoiLap:r.nguoi_lap||''});
const gdToDb=o=>({ngay:o.ngay,loai:o.loai,hang_muc:o.hangMuc,coso_id:o.coSoId,so_tien:o.soTien,noi_dung:o.noiDung||'',nguoi_lap:o.nguoiLap||''});
async function loadCloud(){
  const [hv,gd,dd,cc,ge]=await Promise.all([
    SB.from('hoc_vien').select('*'),
    SB.from('so_quy').select('*'),
    SB.from('diem_danh_hv').select('*'),
    SB.from('cham_cong_gv').select('*'),
    SB.from('gv_edits').select('*')
  ]);
  if(hv.error||gd.error||dd.error||cc.error) throw (hv.error||gd.error||dd.error||cc.error);
  OPS.hv=(hv.data||[]).map(hvFromDb);
  OPS.gd=(gd.data||[]).map(gdFromDb);
  OPS.ddHV={}; (dd.data||[]).forEach(r=>{const k=r.lop_id+'|'+r.ngay;(OPS.ddHV[k]=OPS.ddHV[k]||{})[r.hv_id]=r.trang_thai;});
  OPS.ccGV={}; (cc.data||[]).forEach(r=>{OPS.ccGV['cc|'+r.lop_id+'|'+r.ngay]=r.trang_thai;});
  if(!ge.error) applyGvEdits(ge.data||[]);
}
/* gộp các chỉnh sửa giáo viên (lưu ở Supabase) đè lên dữ liệu tĩnh data.js */
function applyGvEdits(rows){
  rows.forEach(e=>{const g=GV.find(x=>x.id===e.gv_id); if(!g)return;
    ['ten','ns','td','dc','sdt','mon'].forEach(k=>{ if(e[k]!=null && String(e[k]).length) g[k]=e[k]; });});
}
const fmtVND=n=>Math.round(n).toLocaleString('vi-VN')+'₫';
const fmtShort=n=>n>=1e9?(n/1e9).toFixed(n>=1e10?0:1).replace('.0','')+' tỷ':n>=1e6?Math.round(n/1e6)+' tr':n>=1e3?Math.round(n/1e3)+'k':String(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=s=>{const p=String(s).trim().split(/\s+/);return ((p[p.length-2]?.[0]||'')+(p[p.length-1]?.[0]||'')).toUpperCase()||'?';};
const AVCOL=['#1f4276','#2a5490','#0e7fb0','#3a5db0','#5b6fb8','#7c5cd6','#2f6fd0','#17335f'];

function seed(str){let h=2166136261;str=String(str);for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967296;}

/* tạo danh sách tên mẫu cho 1 lớp (đủ sĩ số) — trả về mảng bản ghi CSDL */
function genSampleRows(lop){
  const have=hvOfLop(lop.id).length, need=Math.max(0,(lop.siso||12)-have);
  const rows=[];
  for(let i=0;i<need;i++){const r=seed(lop.lop+lop.id+(have+i));
    const nm=HO2[Math.floor(seed('a'+r+i)*HO2.length)]+' '+DEM2[Math.floor(seed('b'+r+i)*DEM2.length)]+' '+TEN2[Math.floor(seed('c'+r+i)*TEN2.length)];
    rows.push(hvToDb({ten:nm,ns:'',ph:'',sdt:'',hocPhi:0,lopId:lop.id,coSoId:lop.coSoId,mau:true}));}
  return rows;
}
async function insertHvChunks(rows){
  for(let i=0;i<rows.length;i+=500){
    const {data,error}=await SB.from('hoc_vien').insert(rows.slice(i,i+500)).select();
    if(error){alert('Lỗi tạo danh sách: '+error.message);return false;}
    (data||[]).forEach(r=>OPS.hv.push(hvFromDb(r)));
  }
  return true;
}
async function seedHV(lop){
  const rows=genSampleRows(lop); if(!rows.length)return;
  await insertHvChunks(rows);
}

async function seedAllHV(){

  return await insertHvChunks(rows);
}

  USER = prof.role==='admin' ? {role:'admin',coSoId:null,email:user.email} : {role:'owner',coSoId:prof.coso_id,email:user.email};

  let thucThu=0;
  cosos.forEach(c=>{ if(ids.includes(c.id)) thucThu+=csStat(c.id).thu*thuRate(c.ten); });
  const rate=duThu?thucThu/duThu*100:0, conNo=Math.max(0,duThu-thucThu);

  // ---- lớp học hôm nay + chuyên cần (mô phỏng) ----
  const today=ls.filter(l=>l.siso>0 && seed(l.lop+l.gv+l.coSoId)>0.45)
    .map(l=>({...l,gio:SLOTS[Math.floor(seed('g'+l.lop+l.coSoId)*SLOTS.length)],cc:chuyenCan(l.lop+l.gv),done:seed('d'+l.gv+l.lop)>0.3}))
    .sort((a,b)=>a.gio.localeCompare(b.gio));
  const ccAvg=today.length?today.reduce((s,l)=>s+l.cc,0)/today.length*100:0;
  const doneCnt=today.filter(l=>l.done).length;
  const coMat=today.reduce((s,l)=>s+Math.round(l.siso*l.cc),0);
  const siToday=today.reduce((s,l)=>s+l.siso,0);

  const now=new Date(), gio=now.getHours();
  const chao=gio<11?'Chào buổi sáng':gio<13?'Chào buổi trưa':gio<18?'Chào buổi chiều':'Chào buổi tối';
  const who=USER.role==='admin'?'Ban Giám đốc':('Lễ tân '+csName(USER.coSoId));
  const scopeTxt=USER.role==='admin'?(scope==='all'?'toàn hệ thống '+cosos.length+' cơ sở':csName(Number(scope))):csName(USER.coSoId);

  let h=`<div class="hello">
    <div class="hi"><small class="hmiss">✦ SỨ MỆNH AVATAR</small><h2>Chắp cánh ước mơ · Vươn tầm tiếng Anh</h2><p>Tình hình ${esc(scopeTxt)} · cập nhật lúc ${String(gio).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</p></div>
    <div class="date"><b>${now.getDate()}/${now.getMonth()+1}</b><span>${DOW[now.getDay()]}</span></div>
  </div>`;

  // KPI hero
  const kpis=[
    {i:IC.thu,v:fmtShort(duThu),l:'Dự thu tháng'},
    {i:IC.thu,v:fmtShort(thucThu),l:'Thực thu (dự kiến)'},
    {i:IC.users,v:hs.toLocaleString('vi-VN'),l:'Học sinh'},
    {i:IC.lop,v:ls.length,l:'Lớp học'},
  ];
  h+=`<div class="kcards">${kpis.map((k,i)=>`<div class="kcard kc${i+1}"><span class="kdeco"></span><div class="kic">${svg(k.i)}</div><b>${k.v}</b><span class="kl">${k.l}</span></div>`).join('')}</div>`;

  // Tài chính + Chuyên cần
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Tài chính học phí</h3><span class="simtag">◐ minh họa</span></div>
      <div class="pbody"><div class="finrow">
        ${ring(rate,'đã thu')}
        <div class="finnums">
          <div class="finstat"><small>Dự thu kế hoạch</small><b>${fmtVND(duThu)}</b></div>
          <div class="finstat"><small>Đã thu (dự kiến)</small><b class="pos">${fmtVND(thucThu)}</b></div>
          <div class="finstat"><small>Còn phải thu</small><b class="neg">${fmtVND(conNo)}</b></div>
        </div>
      </div></div>
    </div>
    <div class="panel"><div class="phead"><h3>Chuyên cần hôm nay</h3><span class="simtag">◐ minh họa</span></div>
      <div class="pbody"><div class="finrow">
        ${ring(ccAvg,'có mặt')}
        <div class="finnums">
          <div class="finstat"><small>Lớp học hôm nay</small><b>${today.length} lớp</b></div>
          <div class="finstat"><small>GV đã điểm danh</small><b class="pos">${doneCnt}/${today.length}</b></div>
          <div class="finstat"><small>Học sinh có mặt</small><b>${coMat}/${siToday}</b></div>
        </div>
      </div></div>
    </div>
  </div>`;

  // Lớp hôm nay + Cảnh báo
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h3>Lớp đang học hôm nay</h3><span class="simtag">◐ minh họa</span></div>
      <div class="pbody">${today.length?today.slice(0,7).map(l=>`
        <div class="tday">
          <div class="tm">${l.gio}</div>
          <div class="ti"><b>${esc(l.lop)}${USER.role==='admin'?' · '+esc(csName(l.coSoId)):''}</b><small>${esc(l.gv||'—')} · ${l.siso} HS</small></div>
          <span class="badge ${l.done?'bg-em':'bg-am'}">${l.done?'Đã điểm danh':'Chưa ĐD'}</span>
        </div>`).join(''):'<div class="empty">Hôm nay chưa có lớp trong phạm vi này</div>'}
      </div>
    </div>
    <div class="panel"><div class="phead"><h3>Cảnh báo điều hành</h3></div>
      <div class="pbody"><div class="warns">${dashWarns(ids)}</div></div>
    </div>
  </div>`;

  // Xếp hạng cơ sở (chỉ khi xem toàn hệ thống)
  if(USER.role==='admin' && scope==='all'){
    const ranks=cosos.map(c=>({c,...csStat(c.id)})).sort((a,b)=>b.thu-a.thu);
    const maxThu=Math.max(1,...ranks.map(r=>r.thu));
    h+=`<div class="panel"><div class="phead"><h3>Xếp hạng cơ sở theo dự thu</h3><span class="sub">${ranks.length} cơ sở</span></div>
      <div class="pbody">${ranks.map((r,i)=>`
        <div class="rank">
          <div class="no ${i<3?'top':''}">${i+1}</div>
          <div class="rn"><b>${esc(r.c.ten)}</b><div class="bar"><i style="width:${Math.max(4,r.thu/maxThu*100)}%"></i></div></div>
          <div class="rv">${fmtShort(r.thu)}</div>
        </div>`).join('')}
      </div></div>`;
  }
  $('#view').innerHTML=h;
}
function ring(pct,sub){pct=Math.max(0,Math.min(100,pct));return `<div class="ringbox" style="--p:${pct.toFixed(1)}"><div class="rc"></div><div class="rin"><b>${Math.round(pct)}%</b><span>${sub||''}</span></div></div>`;}
function dashWarns(ids){
  const rows=[];
  inCOSO().forEach(c=>{
    if(!ids.includes(c.id))return;
    if(c.build){rows.push({t:`<b>${esc(c.ten)}</b>: cơ sở đang xây dựng, chưa nhập dữ liệu`});return;}
    const st=csStat(c.id);
    if(st.gv>0&&st.lop===0) rows.push({t:`<b>${esc(c.ten)}</b>: có ${st.gv} GV nhưng chưa nhập lớp học`});
  });
  // cơ sở thực thu thấp (mô phỏng)
  const low=inCOSO().filter(c=>!c.build&&ids.includes(c.id)).map(c=>({c,r:thuRate(c.ten)})).filter(x=>x.r<0.72).sort((a,b)=>a.r-b.r).slice(0,2);
  low.forEach(x=>rows.push({t:`<b>${esc(x.c.ten)}</b>: tỷ lệ thu học phí thấp (~${Math.round(x.r*100)}%), cần đôn đốc`}));
  const ic=svg('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>');
  if(!rows.length) return `<div class="warnrow ok">${svg('<path d="M20 6 9 17l-5-5"/>')}<div>Mọi cơ sở đều ổn định, không có cảnh báo.</div></div>`;
  return rows.map(r=>`<div class="warnrow">${ic}<div>${r.t}</div></div>`).join('');
}

/* ============ GIÁO VIÊN ============ */
function renderGV(){
  const opts=inCOSO().filter(c=>!c.build);
  let h=`<div class="toolbar">
    <div class="search">${svg(IC.search,2)}<input id="gvq" placeholder="Tìm theo tên, SĐT, địa chỉ…" value="${esc(gvSearch)}"/></div>
    ${USER.role==='admin'?`<select class="fsel" id="gvcs"><option value="all">Tất cả cơ sở</option>${opts.map(c=>`<option value="${c.id}" ${String(gvCs)===String(c.id)?'selected':''}>${esc(c.ten)}</option>`).join('')}</select>`:''}
  </div>
  <div class="chips" style="margin-bottom:14px">
    ${[['all','Tất cả môn'],['VH','Văn hóa'],['TA','Tiếng Anh']].map(([k,t])=>`<button class="chip ${gvMon===k?'on':''}" data-mon="${k}">${t}</button>`).join('')}
  </div>`;

  let list=inGV();
  if(USER.role==='admin'&&gvCs!=='all') list=list.filter(g=>g.coSoId===Number(gvCs));
  if(gvMon!=='all') list=list.filter(g=>g.mon===gvMon);
  if(gvSearch.trim()){const q=gvSearch.trim().toLowerCase();list=list.filter(g=>(g.ten+' '+g.sdt+' '+g.dc).toLowerCase().includes(q));}
  list=list.slice().sort((a,b)=>a.coSoId-b.coSoId||a.ten.localeCompare(b.ten,'vi'));

  h+=`<div class="panel"><div class="phead"><h3>Danh sách giáo viên</h3><span class="sub">${list.length} người</span></div>
    <div class="twrap"><table><thead><tr>
      <th>Giáo viên</th><th>Môn</th>${USER.role==='admin'?'<th>Cơ sở</th>':''}<th>Ngày sinh</th><th>Trình độ</th><th>Điện thoại</th><th></th>
    </tr></thead><tbody>`;
  if(!list.length){
    h+=`<tr><td colspan="7"><div class="empty">${svg(IC.gv,1.6)}Không tìm thấy giáo viên phù hợp</div></td></tr>`;
  }else{
    list.forEach(g=>{
      h+=`<tr data-gid="${g.id}" class="gvRow" style="cursor:pointer">
        <td><div class="gvcell"><div class="gvava" style="background:${avaColor(g.ten)}">${initials(g.ten)}</div><div><b>${esc(g.ten)}</b><small>${esc((g.dc||'').split(',')[0]||'—')}</small></div></div></td>
        <td><span class="badge ${g.mon==='TA'?'bg-ta':'bg-vh'}">${g.mon==='TA'?'Tiếng Anh':'Văn hóa'}</span></td>
        ${USER.role==='admin'?`<td>${esc(csName(g.coSoId))}</td>`:''}
        <td class="num">${esc(g.ns||'—')}</td>
        <td>${esc(g.td||'—')}</td>
        <td class="num">${esc(g.sdt||'—')}</td>
        <td class="tright"><span class="linkbtn">Chi tiết →</span></td>
      </tr>`;
    });
  }
  h+='</tbody></table></div></div>';
  $('#view').innerHTML=h;

  $('#gvq').oninput=e=>{gvSearch=e.target.value;refreshGVTable();};
  const cs=$('#gvcs'); if(cs)cs.onchange=e=>{gvCs=e.target.value;renderGV();};
  $$('#view .chip').forEach(b=>b.onclick=()=>{gvMon=b.dataset.mon;renderGV();});
  bindGVRows();
}
function refreshGVTable(){renderGV();$('#gvq').focus();const v=$('#gvq').value;$('#gvq').setSelectionRange(v.length,v.length);}
function bindGVRows(){$$('#view .gvRow').forEach(r=>r.onclick=()=>showGV(Number(r.dataset.gid)));}

function showGV(id){
  const g=GV.find(x=>x.id===id); if(!g)return;
  const lops=LOP.filter(l=>l.coSoId===g.coSoId && (l.gv||'').trim()===g.ten.trim());
  const hs=lops.reduce((s,l)=>s+(l.siso||0),0);
  $('#mcard').innerHTML=`
    <div class="mhead">
      <div class="mava">${initials(g.ten)}</div>
      <div style="flex:1"><h3>${esc(g.ten)}</h3><p>Hồ sơ giáo viên · ${esc(csName(g.coSoId))} · <span style="opacity:.85">bấm để sửa</span></p></div>
      <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
    </div>
    <div class="mbody"><div class="form2">
      <div class="fld full"><label>Họ và tên</label><input id="ev_ten" value="${esc(g.ten)}"/></div>
      <div class="fld"><label>Ngày sinh</label><input id="ev_ns" value="${esc(g.ns||'')}" placeholder="dd/mm/yyyy"/></div>
      <div class="fld"><label>Môn</label><select id="ev_mon"><option value="VH" ${g.mon!=='TA'?'selected':''}>Văn hóa</option><option value="TA" ${g.mon==='TA'?'selected':''}>Tiếng Anh</option></select></div>
      <div class="fld"><label>Trình độ chuyên môn</label><input id="ev_td" value="${esc(g.td||'')}"/></div>
      <div class="fld"><label>Số điện thoại</label><input id="ev_sdt" value="${esc(g.sdt||'')}" inputmode="tel"/></div>
      <div class="fld full"><label>Địa chỉ</label><input id="ev_dc" value="${esc(g.dc||'')}"/></div>
      <div class="fld full"><label>Cơ sở công tác</label><input value="${esc(csName(g.coSoId))}" disabled style="opacity:.7"/></div>
      ${lops.length?`<div class="fld full"><label>Phụ trách lớp</label><input value="${lops.length} lớp · ${hs} HS — ${esc(lops.map(l=>l.lop).join(', '))}" disabled style="opacity:.7"/></div>`:''}
      <div id="ev_err" class="fld full" style="display:none;color:#c0392b;font-size:.84rem;font-weight:600;padding:0"></div>
      <div class="fld full" style="display:flex;gap:8px;margin-top:2px">
        <button class="btn btn-light" style="flex:1" onclick="closeModal()">Đóng</button>
        <button class="btn btn-primary" style="flex:2" id="ev_save">💾 Lưu thay đổi</button>
      </div>
      <div class="fld full" style="padding:0"><small class="muted">Thay đổi được lưu online, đồng bộ mọi máy.</small></div>
    </div></div>`;
  $('#modal').classList.add('on');
  $('#ev_save').onclick=async()=>{
    const rec={gv_id:g.id,coso_id:g.coSoId,ten:$('#ev_ten').value.trim(),ns:$('#ev_ns').value.trim(),td:$('#ev_td').value.trim(),sdt:$('#ev_sdt').value.trim(),dc:$('#ev_dc').value.trim(),mon:$('#ev_mon').value};
    const err=$('#ev_err'); const showErr=m=>{err.textContent=m||'';err.style.display=m?'block':'none';};
    if(!rec.ten){showErr('Vui lòng nhập họ tên.');$('#ev_ten').focus();return;}
    const btn=$('#ev_save'); btn.disabled=true; btn.textContent='Đang lưu…'; showErr('');
    const {error}=await SB.from('gv_edits').upsert(rec,{onConflict:'gv_id'});
    btn.disabled=false; btn.textContent='💾 Lưu thay đổi';
    if(error){showErr('Lỗi lưu: '+error.message);return;}
    ['ten','ns','td','sdt','dc','mon'].forEach(k=>{g[k]=rec[k];});
    closeModal();
    if(VIEW==='gv')renderGV();
  };
}
function mrow(ic,label,val){return `<div class="mrow"><div class="mi">${svg(ic)}</div><div style="flex:1"><small>${label}</small><b>${val}</b></div></div>`;}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

/* ============ CƠ SỞ ============ */
function renderCoso(){
  if(csDetailId!=null){renderCosoDetail(csDetailId);return;}
  const list=inCOSO();
  const active=list.filter(c=>!c.build);
  const tot=active.reduce((a,c)=>{const s=csStat(c.id);a.gv+=s.gv;a.hs+=s.hs;a.lop+=s.lop;a.thu+=s.thu;return a;},{gv:0,hs:0,lop:0,thu:0});
  const maxThu=Math.max(1,...active.map(c=>csStat(c.id).thu));
  const rows=list.map(c=>({c,...csStat(c.id)}));
  rows.sort((a,b)=>{
    if(a.c.build!==b.c.build) return a.c.build?1:-1;   // đang XD xuống cuối
    if(csSort==='ten') return a.c.ten.localeCompare(b.c.ten,'vi');
    return b[csSort]-a[csSort];
  });

  let h=`<div class="cssum">
    <div class="s"><b>${active.length}</b><span>Cơ sở hoạt động</span></div>
    <div class="s"><b>${tot.gv}</b><span>Giáo viên</span></div>
    <div class="s"><b>${tot.hs.toLocaleString('vi-VN')}</b><span>Học sinh</span></div>
    <div class="s"><b>${tot.lop}</b><span>Lớp học</span></div>
    <div class="s"><b>${fmtShort(tot.thu)}</b><span>Dự thu học phí</span></div>
  </div>
  <div class="toolbar"><div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <small class="muted" style="font-weight:700">Sắp xếp:</small>
    <select class="fsel" id="cssort">${[['thu','Dự thu cao nhất'],['hs','Học sinh nhiều nhất'],['gv','Giáo viên nhiều nhất'],['ten','Tên A→Z']].map(([k,t])=>`<option value="${k}" ${csSort===k?'selected':''}>${t}</option>`).join('')}</select>
  </div></div>
  <div class="cscards">`;

  rows.forEach(({c,gv,lop,hs,thu})=>{
    if(c.build){
      h+=`<div class="cscard build">
        <div class="cs-top"><div class="cs-badge avatar-a" style="background:#8a97b3">A</div>
          <div><h4>${esc(c.ten)}</h4><div class="cs-sub">Đang xây dựng</div></div></div>
        <div class="empty" style="padding:18px 0">Cơ sở mới · chưa nhập dữ liệu</div></div>`;
      return;
    }
    let warn='';
    if(lop===0&&gv>0) warn=`<span class="cs-warn">⚠ Chưa nhập lớp</span>`;
    else if(lop>0&&hs/lop<6) warn=`<span class="cs-warn">⚠ Sĩ số bất thường</span>`;
    h+=`<div class="cscard" data-cs="${c.id}" style="background:${csPastel(c.id)};border-left:4px solid ${avaColor(c.ten)}">
      <div class="cs-top"><div class="cs-badge avatar-a" style="background:${avaColor(c.ten)}">A</div>
        <div class="cs-head"><h4>${esc(c.ten)}${warn}</h4><div class="cs-sub">${lop} lớp · ${hs} học sinh</div></div></div>
      <div class="cs-stats">
        <div class="cs-stat"><b>${gv}</b><span>Giáo viên</span></div>
        <div class="cs-stat"><b>${hs}</b><span>Học sinh</span></div>
      </div>
    </div>`;
  });
  h+='</div>';
  $('#view').innerHTML=h;
  $('#cssort').onchange=e=>{csSort=e.target.value;renderCoso();};
  $$('#view .cscard[data-cs]').forEach(el=>el.onclick=()=>{
    csDetailId=Number(el.dataset.cs); renderCoso();
  });
}

/* ===== Chi tiết 1 trung tâm — tổng quan lớp, học sinh, kinh phí ===== */
function renderCosoDetail(id){
  const c=COSO.find(x=>x.id===id);
  if(!c){csDetailId=null;return renderCoso();}
  const s=csStat(id);
  const lops=LOP.filter(l=>l.coSoId===id).slice().sort((a,b)=>(a.lop||'').localeCompare(b.lop||'','vi'));
  const duthu=s.thu;
  const daThu=Math.round(duthu*thuRate(c.ten));
  const chuaThu=Math.max(0,duthu-daThu);
  const pct=duthu?Math.round(daThu/duthu*100):0;
  const siTb=s.lop?Math.round(s.hs/s.lop):0;
  const cc=Math.round(chuyenCan(c.ten+'cc')*100);

  let h=`<button class="btn btn-sm btn-ghost cs-back" id="csBack">← Tất cả cơ sở</button>
  <div class="csd-hero" style="background:${csPastel(id)};border-left:5px solid ${avaColor(c.ten)}">
    <div class="cs-badge avatar-a" style="background:${avaColor(c.ten)};width:62px;height:62px;font-size:1.7rem">A</div>
    <div><h2>${esc(c.ten)}</h2><div class="cs-sub" style="font-size:.9rem">${s.lop} lớp · ${s.hs} học sinh · ${s.gv} giáo viên</div></div>
  </div>
  <div class="cssum" style="margin-top:14px">
    <div class="s"><b>${s.lop}</b><span>Lớp học</span></div>
    <div class="s"><b>${s.hs}</b><span>Học sinh</span></div>
    <div class="s"><b>${s.gv}</b><span>Giáo viên</span></div>
    <div class="s"><b>${siTb}</b><span>Sĩ số TB/lớp</span></div>
    <div class="s"><b>${cc}%</b><span>Chuyên cần</span></div>
  </div>
  <div class="panel">
    <div class="phead"><h3>Tổng kinh phí học phí</h3><span class="sub"><span style="color:var(--amber);font-weight:900">◐</span> số liệu minh họa</span></div>
    <div class="csd-money">
      <div class="mbox"><small>Dự thu</small><b>${fmtShort(duthu)}</b></div>
      <div class="mbox done"><small>Đã thu</small><b>${fmtShort(daThu)}</b></div>
      <div class="mbox pend"><small>Chưa thu</small><b>${fmtShort(chuaThu)}</b></div>
    </div>
    <div class="csd-prog"><div class="csd-prog-bar"><i style="width:${pct}%"></i></div><span>Đã thu <b>${pct}%</b> dự thu</span></div>
  </div>
  <div class="panel"><div class="phead"><h3>Danh sách lớp học</h3><span class="sub">${lops.length} lớp</span></div>
    <div class="twrap"><table><thead><tr><th>Lớp</th><th>Giáo viên phụ trách</th><th class="tright">Sĩ số</th><th class="tright">Dự thu</th></tr></thead><tbody>`;
  if(!lops.length){h+=`<tr><td colspan="4"><div class="empty">${svg(IC.lop,1.6)}Trung tâm chưa có lớp học</div></td></tr>`;}

/* đọc số tiền bằng chữ (VND) */
function docSoVN(number){
  number=Math.round(number); if(number===0)return 'Không đồng';
  const ch=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const dv=['','nghìn','triệu','tỷ'];
  function doc3(baso,daydu){
    let tram=Math.floor(baso/100),chuc=Math.floor((baso%100)/10),donvi=baso%10,s='';
    if(daydu||tram>0){ s+=ch[tram]+' trăm'; if(chuc===0&&donvi>0)s+=' lẻ'; }
    if(chuc>1){ s+=' '+ch[chuc]+' mươi'; if(donvi===1)s+=' mốt'; else if(donvi===4)s+=' tư'; else if(donvi===5)s+=' lăm'; else if(donvi>0)s+=' '+ch[donvi]; }
    else if(chuc===1){ s+=' mười'; if(donvi===5)s+=' lăm'; else if(donvi>0)s+=' '+ch[donvi]; }
    else if(chuc===0&&donvi>0){ s+=' '+ch[donvi]; }
    return s.trim();
  }
  const nhom=[]; let so=number; while(so>0){nhom.push(so%1000);so=Math.floor(so/1000);}
  let kq='';
  for(let g=nhom.length-1;g>=0;g--){ if(nhom[g]===0)continue; kq+=(kq?' ':'')+doc3(nhom[g], g<nhom.length-1&&kq!=='')+(dv[g]?' '+dv[g]:''); }
  kq=kq.trim(); return kq.charAt(0).toUpperCase()+kq.slice(1)+' đồng';
}
function taiWord(html,filename){
  const pre="<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>body{font-family:'Times New Roman',serif}table{width:100%;border-collapse:collapse}td{padding:4px 0;vertical-align:top}</style></head><body>";
  const blob=new Blob(['﻿'+pre+html+"</body></html>"],{type:'application/msword'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'); a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

    .slice().sort((a,b)=>a.coSoId-b.coSoId);
  const lopSel=`<select class="fsel" id="hvLopSel"><option value="all">Tất cả lớp</option>${lopPool.map(l=>`<option value="${l.id}" ${hvLop===String(l.id)?'selected':''}>${isAdmin?csAbbr(l.coSoId)+' · ':''}${esc(l.lop)}</option>`).join('')}</select>`;

  let h=`<div class="toolbar">
    <div class="search" style="flex:1;min-width:200px">${svg(IC.search,1.9)}<input id="hvq" placeholder="Tìm tên học sinh, phụ huynh, SĐT…" value="${esc(hvSearch)}" style="border:0;outline:0;background:none;flex:1;font-weight:600;font-size:.9rem"/></div>
    ${csSel}${lopSel}
  </div>
  <div class="panel"><div class="phead"><h3>Hồ sơ học sinh</h3><span class="sub">${list.length} học sinh</span></div>
    <div class="pbody">
      <div class="ddsum">
        <div class="p done"><b>${list.length}</b><span>học sinh</span></div>
        <div class="p co"><b>${soThat}</b><span>hồ sơ thật</span></div>
        <div class="p muon"><b>${list.length-soThat}</b><span>tạo mẫu</span></div>
        <div class="p"><b>${fmtShort(tongHP)}</b><span>học phí/tháng</span></div>
      </div>`;
  if(!list.length){
    h+=`<div class="empty">${svg(IC.hocvien,1.5)}Chưa có học sinh nào trong phạm vi này.<br/><button class="btn btn-sm btn-ghost" id="toGhi2" style="margin-top:12px">→ Sang trang Ghi danh</button></div>`;
  }else{
    h+=`<div class="ddgrid">`;
    list.forEach((v,i)=>{
      const info=[lopName(v.lopId),isAdmin?csName(v.coSoId):'',v.sdt,v.hocPhi?fmtVND(v.hocPhi):''].filter(Boolean).join(' · ');
      h+=`<div class="ddrow"><div class="idx">${i+1}</div>
        <div class="nm"><b>${esc(v.ten)}${v.mau?' <span class="tagmau">mẫu</span>':''}</b><small>${esc(info)||'—'}</small></div>
        <button class="btn btn-sm btn-light" data-edit="${v.id}" style="flex:none">Hồ sơ</button>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</div></div>`;
  $('#view').innerHTML=h;
  $('#hvq').oninput=e=>{hvSearch=e.target.value;const v=e.target.value;renderHocVien();const n=$('#hvq');n.focus();n.setSelectionRange(v.length,v.length);};
  const cs=$('#hvCsSel'); if(cs)cs.onchange=e=>{hvCs=e.target.value;hvLop='all';renderHocVien();};
  const ls=$('#hvLopSel'); if(ls)ls.onchange=e=>{hvLop=e.target.value;renderHocVien();};
  const tg=$('#toGhi2'); if(tg)tg.onclick=()=>go('ghidanh');
  $$('#view [data-edit]').forEach(b=>b.onclick=()=>{const hv=OPS.hv.find(x=>x.id===Number(b.dataset.edit));if(hv)openHvEdit(hv);});
}

/* Modal xem & sửa hồ sơ 1 học sinh (đồng bộ Supabase) */
function openHvEdit(h){
  const lopsCs=LOP.filter(l=>l.coSoId===h.coSoId).slice().sort((a,b)=>String(a.lop).localeCompare(String(b.lop),'vi'));
  $('#mcard').innerHTML=`
   <div class="mhead" style="background:var(--dots),linear-gradient(150deg,#10264c,#2f6fd0);background-size:18px 18px,auto">
     <div class="mava" style="background:${avaColor(h.ten)}">${initials(h.ten)}</div>
     <div style="flex:1"><h3>Hồ sơ học sinh</h3><p>${esc(lopName(h.lopId))} · ${esc(csName(h.coSoId))}</p></div>
     <button class="mclose" onclick="closeModal()">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
   </div>
   <div class="mbody"><div class="form2">
     <div class="fld full"><label>Họ và tên</label><input id="hv_ten" value="${esc(h.ten)}"/></div>
     <div class="fld"><label>Ngày sinh</label><input id="hv_ns" value="${esc(h.ns)}" placeholder="dd/mm/yyyy"/></div>
     <div class="fld"><label>Học phí (đ/tháng)</label><input id="hv_hp" inputmode="numeric" value="${h.hocPhi||''}" placeholder="VD: 600000"/></div>
     <div class="fld"><label>Phụ huynh</label><input id="hv_ph" value="${esc(h.ph)}" placeholder="Tên phụ huynh"/></div>
     <div class="fld"><label>Điện thoại</label><input id="hv_sdt" value="${esc(h.sdt)}" inputmode="tel" placeholder="SĐT liên hệ"/></div>
     <div class="fld full"><label>Lớp đang học</label><select id="hv_lop">${lopsCs.map(l=>`<option value="${l.id}" ${l.id===h.lopId?'selected':''}>${esc(l.lop)} — ${esc(l.gv||'?')}</option>`).join('')}</select></div>
     <div id="hvErr" style="display:none;color:#c0392b;font-size:.85rem;font-weight:600"></div>
     <div class="fld full" style="display:flex;gap:9px"><button class="btn btn-primary" id="hv_save" style="flex:1">✓ Lưu hồ sơ</button><button class="btn btn-light" id="hv_del" style="color:var(--rose)">Xóa</button></div>
   </div></div>`;
  $('#modal').classList.add('on');
  const err=m=>{const e=$('#hvErr');e.textContent=m||'';e.style.display=m?'block':'none';};
  $('#hv_save').onclick=async()=>{
    const ten=$('#hv_ten').value.trim();
    if(!ten){err('Vui lòng nhập họ tên.');return;}
    const hp=Number(String($('#hv_hp').value).replace(/[^\d]/g,''))||0;
    const lopId=Number($('#hv_lop').value);
    const patch={ten,ns:$('#hv_ns').value.trim(),ph:$('#hv_ph').value.trim(),sdt:$('#hv_sdt').value.trim(),hocPhi:hp,lopId};
    const btn=$('#hv_save'); btn.disabled=true; btn.textContent='Đang lưu…'; err('');
    const {error}=await SB.from('hoc_vien').update({ten:patch.ten,ns:patch.ns,ph:patch.ph,sdt:patch.sdt,hoc_phi:hp,lop_id:lopId,mau:false}).eq('id',h.id);
    btn.disabled=false; btn.textContent='✓ Lưu hồ sơ';
    if(error){err('Lỗi lưu: '+error.message);return;}
    Object.assign(h,patch,{mau:false});
    closeModal(); renderHocVien();
  };
  $('#hv_del').onclick=async()=>{
    if(!confirm('Xóa hồ sơ học sinh "'+h.ten+'"? Thao tác này không thể hoàn tác.'))return;
    const {error}=await SB.from('hoc_vien').delete().eq('id',h.id);
    if(error){err('Lỗi xóa: '+error.message);return;}
    OPS.hv=OPS.hv.filter(x=>x.id!==h.id);
    closeModal(); renderHocVien();
  };
}

/* ============ GHI DANH ============ */
function renderGhiDanh(){
  const lops=inLOP().filter(l=>l.siso>0||hvOfLop(l.id).length);
  if(!lops.length){$('#view').innerHTML=`<div class="panel"><div class="pbody"><div class="empty">Chưa có lớp học trong phạm vi này</div></div></div>`;return;}
  if(!lops.find(l=>l.id===ghiLopId)) ghiLopId=lops[0].id;
  const lop=LOP.find(l=>l.id===ghiLopId), ds=hvOfLop(ghiLopId);
  const conThieu=Math.max(0,(lop.siso||0)-ds.length);
  let h=`<div class="toolbar"><select class="fsel" id="ghiLop" style="flex:1;min-width:180px;max-width:100%">${lopPickHTML(ghiLopId)}</select><button class="btn btn-sm btn-ghost" id="seedAll" style="white-space:nowrap">⚡ Tạo mẫu tất cả lớp</button></div>
  <div class="grid2">
    <div class="panel"><div class="phead"><h3>Ghi danh học sinh mới</h3></div>
      <div class="pbody"><div class="form2">
        <div class="fld full"><label>Họ và tên</label><input id="gd_ten" placeholder="VD: Nguyễn Văn An"/></div>
        <div class="fld"><label>Ngày sinh</label><input id="gd_ns" placeholder="dd/mm/yyyy"/></div>
        <div class="fld"><label>Học phí (đ/tháng)</label><input id="gd_hp" inputmode="numeric" placeholder="VD: 600000"/></div>
        <div class="fld"><label>Phụ huynh</label><input id="gd_ph" placeholder="Tên phụ huynh"/></div>
        <div class="fld"><label>Điện thoại</label><input id="gd_sdt" inputmode="tel" placeholder="SĐT liên hệ"/></div>
        <div class="fld full"><button class="btn btn-primary btn-block" id="gd_add">＋ Ghi danh vào lớp</button></div>
      </div></div>
    </div>
    <div class="panel"><div class="phead"><h3>Lớp đang chọn</h3></div>
      <div class="pbody">
        <div class="ddrow" style="border:0;padding:2px 0 4px">
          <div class="gvava" style="width:46px;height:46px;background:${avaColor(lop.gv||'?')}">${initials(lop.gv||'?')}</div>
          <div class="nm"><b>${esc(lop.lop)}</b><small>${esc(lop.gv||'—')} · ${esc(csName(lop.coSoId))}</small></div>
        </div>
        <div class="ddsum" style="margin-top:12px">
          <div class="p"><b>${lop.siso}</b><span>sĩ số Excel</span></div>
          <div class="p"><b>${ds.length}</b><span>đã ghi danh</span></div>
          <div class="p"><b>${conThieu}</b><span>còn thiếu</span></div>
        </div>
        <button class="btn btn-light btn-block" id="gd_seed" style="margin-top:13px">Tạo nhanh danh sách mẫu (đủ sĩ số ${lop.siso})</button>
        <p class="muted" style="font-size:.78rem;line-height:1.5;margin:11px 2px 0">💡 Nhập từng em ở form bên trái, hoặc bấm nút trên để tạo nhanh danh sách mẫu đủ sĩ số rồi chỉnh sửa sau.</p>
      </div>
    </div>
  </div>
  <div class="panel"><div class="phead"><h3>Danh sách đã ghi danh</h3><span class="sub">${ds.length} học sinh</span></div>
    <div class="pbody">${ds.length?`<div class="ddgrid">${ds.map((v,i)=>`
      <div class="ddrow"><div class="idx">${i+1}</div>
        <div class="nm"><b>${esc(v.ten)}</b><small>${[v.mau?'học sinh mẫu':'',v.ns,v.sdt,v.hocPhi?fmtVND(v.hocPhi):''].filter(Boolean).join(' · ')||'—'}</small></div>
        <button class="btn btn-sm btn-light" data-del="${v.id}">Xóa</button>
      </div>`).join('')}</div>`:'<div class="empty">Chưa có học sinh. Ghi danh từng em ở form trên, hoặc bấm "Tạo nhanh danh sách mẫu".</div>'}
    </div>
  </div>`;
  $('#view').innerHTML=h;
  $('#ghiLop').onchange=e=>{ghiLopId=Number(e.target.value);renderGhiDanh();};
  $('#gd_add').onclick=async()=>{
    const ten=$('#gd_ten').value.trim(); if(!ten){$('#gd_ten').focus();return;}
    const rec={ten,ns:$('#gd_ns').value.trim(),ph:$('#gd_ph').value.trim(),sdt:$('#gd_sdt').value.trim(),hocPhi:Number($('#gd_hp').value.replace(/\D/g,''))||0,lopId:ghiLopId,coSoId:lop.coSoId,mau:false};
    const {data,error}=await SB.from('hoc_vien').insert(hvToDb(rec)).select().single();
    if(error){alert('Lỗi ghi danh: '+error.message);return;}
    OPS.hv.push(hvFromDb(data));renderGhiDanh();
  };
  $('#gd_seed').onclick=async()=>{await seedHV(lop);renderGhiDanh();};
  $('#seedAll').onclick=async()=>{const b=$('#seedAll');b.disabled=true;const t=b.textContent;b.textContent='Đang tạo…';const ok=await seedAllHV();b.disabled=false;b.textContent=t;if(ok)renderGhiDanh();};
  $$('#view [data-del]').forEach(b=>b.onclick=async()=>{const id=Number(b.dataset.del);const {error}=await SB.from('hoc_vien').delete().eq('id',id);if(error){alert('Lỗi xóa: '+error.message);return;}OPS.hv=OPS.hv.filter(x=>x.id!==id);renderGhiDanh();});
  renderNavCounts();
}

/* ============ ĐIỂM DANH ============ */
function renderDiemDanh(){
  const lops=inLOP().filter(l=>l.siso>0||hvOfLop(l.id).length);
  if(!lops.length){$('#view').innerHTML=`<div class="panel"><div class="pbody"><div class="empty">Chưa có lớp học trong phạm vi này</div></div></div>`;return;}
  if(!lops.find(l=>l.id===ddLopId)) ddLopId=lops[0].id;
  const lop=LOP.find(l=>l.id===ddLopId), ds=hvOfLop(ddLopId);
  const ddKey=ddLopId+'|'+ddDate, state=OPS.ddHV[ddKey]||{};
  const ccKey='cc|'+ddLopId+'|'+ddDate, cc=OPS.ccGV[ccKey]||'';
  const cnt={co:0,muon:0,phep:0,vang:0}; ds.forEach(v=>{if(state[v.id])cnt[state[v.id]]++;});
  const marked=cnt.co+cnt.muon+cnt.phep+cnt.vang;

  let h=`<div class="toolbar">
    <div style="display:grid;gap:6px"><label style="font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.04em">NGÀY ĐIỂM DANH</label>
      <input type="date" class="fsel" id="ddDate" value="${ddDate}"/></div>
    <div style="display:grid;gap:6px;flex:1;min-width:180px"><label style="font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.04em">LỚP</label>
      <select class="fsel" id="ddLop" style="max-width:100%">${lopPickHTML(ddLopId)}</select></div>
  </div>
  <div class="panel"><div class="phead"><h3>Chấm công giáo viên</h3>${cc?'<span class="savednote">✓ '+CC_LABEL[cc]+'</span>':'<span class="sub">chưa chấm công</span>'}</div>
    <div class="pbody"><div class="ddrow" style="border:0;padding:0">
      <div class="gvava" style="width:40px;height:40px;background:${avaColor(lop.gv||'?')}">${initials(lop.gv||'?')}</div>
      <div class="nm"><b>${esc(lop.gv||'—')}</b><small>Lớp ${esc(lop.lop)}${USER.role==='admin'?' · '+esc(csName(lop.coSoId)):''}</small></div>
      <div class="seg" id="ccSeg">${['day','nghi','bu'].map(v=>`<button data-v="${v}" class="${cc===v?'on-'+v:''}">${CC_LABEL[v]}</button>`).join('')}</div>
    </div></div>
  </div>
  <div class="panel"><div class="phead"><h3>Điểm danh học sinh</h3><span class="savednote">✓ tự động lưu</span></div>
    <div class="pbody">`;
  if(!ds.length){
    h+=`<div class="empty">${svg(IC.diemdanh,1.5)}Lớp này chưa có danh sách học sinh để điểm danh.<br/><button class="btn btn-sm btn-ghost" id="toGhi" style="margin-top:12px">→ Sang trang Ghi danh</button></div>`;
  }else{
    h+=`<div class="ddsum">
      <div class="p co"><b>${cnt.co}</b><span>có mặt</span></div>
      <div class="p muon"><b>${cnt.muon}</b><span>muộn</span></div>
      <div class="p vang"><b>${cnt.phep+cnt.vang}</b><span>vắng</span></div>
      <div class="p done"><b>${marked}/${ds.length}</b><span>đã điểm</span></div>
    </div>
    <div class="ddgrid">
      <div class="ddrow ddh"><div class="idx">TT</div><div class="nm">HỌC VIÊN</div><span class="hh">ĐIỂM DANH</span></div>
      <div class="ddrow ddh"><div class="idx">TT</div><div class="nm">HỌC VIÊN</div><span class="hh">ĐIỂM DANH</span></div>`;
    ds.forEach((v,i)=>{
      h+=`<div class="ddrow"><div class="idx">${i+1}</div>
        <div class="nm"><b>${esc(v.ten)}</b>${v.mau?'<small>học sinh mẫu</small>':(v.ns?`<small>${esc(v.ns)}</small>`:'')}</div>
        <div class="attseg ddSeg" data-hv="${v.id}">${[['co','Có'],['muon','Muộn'],['vang','Vắng']].map(([k,t])=>`<button data-v="${k}" class="${state[v.id]===k?'on':''}">${t}</button>`).join('')}</div>
      </div>`;
    });
    h+=`</div>`;
  }
  h+='</div></div>';
  $('#view').innerHTML=h;
  $('#ddDate').onchange=e=>{ddDate=e.target.value;renderDiemDanh();};
  $('#ddLop').onchange=e=>{ddLopId=Number(e.target.value);renderDiemDanh();};
  const tg=$('#toGhi'); if(tg)tg.onclick=()=>{ghiLopId=ddLopId;go('ghidanh');};
  $$('#ccSeg button').forEach(b=>b.onclick=async()=>{
    if(cc===b.dataset.v){
      const {error}=await SB.from('cham_cong_gv').delete().eq('lop_id',ddLopId).eq('ngay',ddDate);
      if(error){alert('Lỗi lưu chấm công: '+error.message);return;}
      delete OPS.ccGV[ccKey];
    }else{
      const {error}=await SB.from('cham_cong_gv').upsert({lop_id:ddLopId,ngay:ddDate,coso_id:lop.coSoId,trang_thai:b.dataset.v},{onConflict:'lop_id,ngay'});
      if(error){alert('Lỗi lưu chấm công: '+error.message);return;}
      OPS.ccGV[ccKey]=b.dataset.v;
    }
    renderDiemDanh();
  });
  $$('#view .ddSeg').forEach(seg=>{const id=Number(seg.dataset.hv);
    seg.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
      OPS.ddHV[ddKey]=OPS.ddHV[ddKey]||{};
      if(OPS.ddHV[ddKey][id]===b.dataset.v){
        const {error}=await SB.from('diem_danh_hv').delete().eq('lop_id',ddLopId).eq('ngay',ddDate).eq('hv_id',id);
        if(error){alert('Lỗi lưu điểm danh: '+error.message);return;}
        delete OPS.ddHV[ddKey][id];
      }else{
        const {error}=await SB.from('diem_danh_hv').upsert({lop_id:ddLopId,ngay:ddDate,hv_id:id,coso_id:lop.coSoId,trang_thai:b.dataset.v},{onConflict:'lop_id,ngay,hv_id'});
        if(error){alert('Lỗi lưu điểm danh: '+error.message);return;}
        OPS.ddHV[ddKey][id]=b.dataset.v;
      }
      renderDiemDanh();});
  });
}

/* ẩn/hiện mật khẩu */
const EYE_ON='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4"/><path d="M6.2 6.3A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
$('#eyeBtn').innerHTML=EYE_ON;
$('#eyeBtn').onclick=()=>{const i=$('#upass');const show=i.type==='password';i.type=show?'text':'password';$('#eyeBtn').innerHTML=show?EYE_OFF:EYE_ON;$('#eyeBtn').setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');i.focus();};

/* Giữ đăng nhập: nếu còn phiên hợp lệ thì vào thẳng app */
(async()=>{ try{ const {data:{session}}=await SB.auth.getSession(); if(session) await afterAuth(); }catch(e){} })();
</script>
